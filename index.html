async function vendedoresVisiveis(profile) {
  if (!profile) return [];
  if (profile.papel === 'vendedor') return [profile.id];

  if (profile.papel === 'supervisor') {
    const {data}=await sb.from('usuarios').select('id').eq('papel','vendedor').eq('supervisor_id',profile.id).eq('ativo',true);
    return (data||[]).map(x=>x.id);
  }

  if (profile.papel === 'coordenador') {
    const {data:sups}=await sb.from('usuarios').select('id').eq('papel','supervisor').eq('coordenador_id',profile.id).eq('ativo',true);
    const ids=(sups||[]).map(x=>x.id);
    if(!ids.length)return [];
    const {data}=await sb.from('usuarios').select('id').eq('papel','vendedor').in('supervisor_id',ids).eq('ativo',true);
    return (data||[]).map(x=>x.id);
  }

  if (profile.papel === 'adm_vendas') {
    const {data:carteira}=await sb.from('adm_vendas_supervisores').select('supervisor_id').eq('adm_vendas_id',profile.id);
    const supIds=(carteira||[]).map(x=>x.supervisor_id);
    if(!supIds.length)return [];
    const {data}=await sb.from('usuarios').select('id').eq('papel','vendedor').in('supervisor_id',supIds).eq('ativo',true);
    return (data||[]).map(x=>x.id);
  }

  // Gestão Adm. Vendas, Diretoria, Financeiro e Admin mantêm visão ampla
  // quando a RLS correspondente permitir.
  return null;
}

function PaginaClientes({ profile }) {
  const toast = useToast();
  const [clientes, setClientes] = useState(null);
  const [busca, setBusca] = useState('');
  const [editandoTotvs, setEditandoTotvs] = useState({});
  const podeEditar = ['admin','financeiro'].includes(profile.papel);

  useEffect(() => { carregar(); }, []);

  async function carregar() {
    let q = sb.from('clientes')
      .select('*, usuarios:vendedor_id(nome, codigo_vendedor), fichas_clientes!clientes_ficha_id_fkey(faturamento_previsto, created_at, ficha_aprovacoes(etapa, status, ordem, decidido_em))')
      .order('created_at', { ascending: false })
      .limit(10000);

    // Escopo comercial centralizado, incluindo carteira do Adm. de Vendas.
    const idsVisiveis = await vendedoresVisiveis(profile);
    if (Array.isArray(idsVisiveis)) {
      if (!idsVisiveis.length) { setClientes([]); setEditandoTotvs({}); return; }
      q = q.in('vendedor_id', idsVisiveis);
    }

    const { data, error } = await q;

    if (error) {
      console.warn('Query clientes com embed falhou, tentando sem ficha:', error.message);
      let q2 = sb.from('clientes')
        .select('*, usuarios:vendedor_id(nome, codigo_vendedor)')
        .order('created_at', { ascending: false })
        .limit(10000);
      const idsFallback = await vendedoresVisiveis(profile);
      if (Array.isArray(idsFallback)) {
        if (!idsFallback.length) { setClientes([]); setEditandoTotvs({}); return; }
        q2 = q2.in('vendedor_id', idsFallback);
      }
      const { data: d2, error: e2 } = await q2;

      if (e2) {
        console.error('Erro ao carregar clientes:', e2.message);
        toast('Erro ao carregar clientes: ' + e2.message, 'error');
        setClientes([]);
      } else {
        setClientes(d2 || []);
      }
    } else {
      setClientes(data || []);
    }
    setEditandoTotvs({});
  }

  async function salvarTotvs(c) {
    const valor = editandoTotvs[c.id];
    const { error } = await sb.from('clientes')
      .update({ codigo_totvs: (valor || '').trim() || null })
      .eq('id', c.id);
    if (error) return toast(error.message, 'error');
    toast('Código TOTVS salvo.', 'success');
    carregar();
  }

  function statusCliente(c) {
    if (c.origem === 'totvs' && !c.fichas_clientes) return { txt: 'importado', cls: 'badge-blue' };
    if (!c.fichas_clientes) return { txt: '—', cls: 'badge-gray' };
    const aps = c.fichas_clientes.ficha_aprovacoes || [];
    if (!aps.length) return { txt: '—', cls: 'badge-gray' };
    if (aps.some(a => a.status === 'reprovado')) return { txt: 'com reprovação', cls: 'badge-red' };
    if (aps.every(a => CONCLUIDAS.includes(a.status))) return { txt: 'aprovado', cls: 'badge-green' };
    return { txt: 'em aprovação', cls: 'badge-yellow' };
  }

  const filtrados = useMemo(() => {
    if (!clientes) return [];
    const t = busca.trim().toLowerCase();
    if (!t) return clientes;
    return clientes.filter(c =>
      (c.razao_social || '').toLowerCase().includes(t) ||
      (c.cnpj_cpf || '').includes(t) ||
      (c.codigo_totvs || '').toLowerCase().includes(t) ||
      (c.cidade || '').toLowerCase().includes(t) ||
      ((c.usuarios && c.usuarios.nome) || '').toLowerCase().includes(t) ||
      ((c.usuarios && c.usuarios.codigo_vendedor) || '').toLowerCase().includes(t)
    );
  }, [clientes, busca]);

  if (clientes === null) return h('div', { className: 'empty-state' }, 'Carregando...');

  const semCodigo = filtrados.filter(c => !c.codigo_totvs).length;

  return h('div', null,
    h('div', { className: 'page-head' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Clientes'),
        h('div', { className: 'page-sub' },
          `${filtrados.length} cliente(s)` + (semCodigo ? ` · ${semCodigo} sem código TOTVS` : ''))),
      h('input', {
        className: 'form-input',
        style: { maxWidth: 300 },
        placeholder: 'Buscar cliente, CNPJ, código ou vendedor...',
        value: busca,
        onChange: e => setBusca(e.target.value)
      })),

    filtrados.length === 0
      ? h('div', { className: 'card' }, h(Empty, { icon: '\u263A', texto: 'Nenhum cliente encontrado.' }))
      : h('div', { className: 'card', style: { padding: 0 } },
          h('div', { className: 'table-wrap' },
            h('table', null,
              h('thead', null, h('tr', null,
                ['Cód. TOTVS','Cliente','CNPJ','Cidade','Cód. Vend.','Vendedor','Fat. Previsto','Origem','Status ficha', podeEditar ? '' : null]
                  .filter(c => c !== null).map((c, i) => h('th', { key: i }, c)))),
              h('tbody', null,
                filtrados.map(c => {
                  const st = statusCliente(c);
                  const emEdicao = c.id in editandoTotvs;
                  return h('tr', { key: c.id },
                    h('td', null,
                      podeEditar
                        ? h('input', {
                            className: 'form-input sm',
                            style: { minWidth: 110, fontFamily: "'JetBrains Mono', monospace" },
                            placeholder: '—',
                            value: emEdicao ? editandoTotvs[c.id] : (c.codigo_totvs || ''),
                            onChange: e => setEditandoTotvs(prev => ({ ...prev, [c.id]: e.target.value }))
                          })
                        : h('span', { className: 'mono' }, c.codigo_totvs || '—')),
                    h('td', { className: 'strong' }, identificacaoCliente(c)),
                    h('td', { className: 'mono' }, c.cnpj_cpf || '—'),
                    h('td', null, (c.cidade || '—') + (c.estado ? '/' + c.estado : '')),
                    h('td', { className: 'mono' }, (c.usuarios && c.usuarios.codigo_vendedor) || '—'),
                    h('td', null, (c.usuarios && c.usuarios.nome) || '—'),
                    h('td', { className: 'mono' }, fmtMoeda(c.fichas_clientes && c.fichas_clientes.faturamento_previsto)),
                    h('td', null, h('span', { className: `badge ${c.origem === 'totvs' ? 'badge-blue' : 'badge-gray'}` }, c.origem || '—')),
                    h('td', null, h('span', { className: `badge ${st.cls}` }, st.txt)),
                    podeEditar && h('td', null,
                      h('button', {
                        className: 'btn btn-primary btn-sm',
                        disabled: !emEdicao,
                        onClick: () => salvarTotvs(c)
                      }, 'Salvar')));
                }))))));
}

function listarEquipamentos(f) {
  if (!f || !f.precisa_equipamento) return [];
  const itens = [];
  if (f.forno_tipo) itens.push(`Forno ${f.forno_tipo}${f.forno_esteiras ? ' - ' + f.forno_esteiras + ' esteiras' : ''}${f.forno_quantidade ? ' (x' + f.forno_quantidade + ')' : ''}`);
  (f.freezer_tipos || []).forEach(t => itens.push('Freezer ' + t));
  if (f.armario_tipo) itens.push('Armário ' + f.armario_tipo);
  if (f.camara_climatica) itens.push('Câmara Climática ' + f.camara_climatica);
  if (f.esteiras_quantidade) itens.push(`Esteiras (x${f.esteiras_quantidade})`);
  if (f.assadeiras_quantidade) itens.push(`Assadeiras (x${f.assadeiras_quantidade})`);
  return itens;
}

function rotaSolicitacao(tipo, justificativa, categoria) {
  if (categoria === 'bonificacao' || categoria === 'amostra') return ['supervisor','coordenador','gestao_adm_vendas'];
  if (tipo === 'manutencao') return ['manutencao'];
  if (justificativa === 'Relacionamento') return ['supervisor','coordenador','financeiro','diretoria'];
  return ['supervisor','coordenador','manutencao','diretoria'];
}

function StepperGenerico({ aprovacoes }) {
  const ordenadas = [...(aprovacoes || [])].sort((a, b) => a.ordem - b.ordem);
  if (!ordenadas.length) return null;
  const icones = { aprovado: '✓', reprovado: '✗', pendente: '●', aguardando: '○', nao_aplica: '–' };
  return h('div', { className: 'stepper' },
    ordenadas.map((ap, i) => h(React.Fragment, { key: ap.id || ap.etapa },
      i > 0 && h('span', { className: 'step-arrow' }, '›'),
      h('span', { className: `badge ${STATUS_CLASSE[ap.status]}` },
        (icones[ap.status] || '○') + ' ' + (ROLE_LABELS[ap.etapa] || ap.etapa)))));
}

const JUSTIFICATIVAS = ['Relacionamento', 'Equipamento Antigo', 'Equipamento Danificado'];
const EQUIPAMENTOS_PADRAO = [
  'Forno a Gás - 5 Esteiras',
  'Forno a Gás - 8 Esteiras',
  'Forno Elétrico - 5 Esteiras',
  'Forno Elétrico - 8 Esteiras',
  'Freezer Horizontal',
  'Freezer Vertical',
  'Freezer Expositor',
  'Mini Câmara',
  'Armário Completo',
  'Armário Vazio',
  'Armário Esqueleto',
  'Câmara Climática - 20 Esteiras',
  'Câmara Climática - 40 Esteiras',
  'Esteiras',
  'Assadeiras'
];

function ModalNovaSolicitacao({ profile, visao, modulo, onClose, onCriada }) {
  const toast = useToast();
  const [clientes, setClientes] = useState(null);
  const [produtos, setProdutos] = useState([]);
  const [clienteId, setClienteId] = useState('');
  const [categoria, setCategoria] = useState('');
  const [tipo, setTipo] = useState('');
  const [equipamento, setEquipamento] = useState('');
  const [equipamentoManual, setEquipamentoManual] = useState('');
  const [patrimonio, setPatrimonio] = useState('');
  const [justificativa, setJustificativa] = useState('');
  const [descricao, setDescricao] = useState('');
  const [produtoId, setProdutoId] = useState('');
  const [quantidade, setQuantidade] = useState('');
  const [modalidadeBonificacao, setModalidadeBonificacao] = useState('');
  const [tipoAmostra, setTipoAmostra] = useState('');
  const [salvando, setSalvando] = useState(false);

  useEffect(() => {
    (async () => {
      let qc = sb.from('clientes').select('id, razao_social, cnpj_cpf, codigo_totvs, vendedor_id, fichas_clientes(*)').order('razao_social').limit(10000);
      const idsVisiveis = await vendedoresVisiveis(profile);
      if (Array.isArray(idsVisiveis)) {
        if (!idsVisiveis.length) { setClientes([]); }
        else qc = qc.in('vendedor_id', idsVisiveis);
      }
      const [rc, rp] = await Promise.all([
        qc,
        sb.from('produtos').select('id, codigo, descricao, ativo').eq('ativo', true).order('codigo')
      ]);
      setClientes(rc.data || []); setProdutos(rp.data || []);
    })();
  }, []);

  const categoriasPermitidas = [];
  if (modulo === 'administracao_vendas') {
    // Administração de Vendas abre somente solicitação de troca de equipamento.
    if (['adm_vendas','gestao_adm_vendas','admin'].includes(visao)) categoriasPermitidas.push(['equipamento','Troca de Equipamento']);
  } else {
    if (['vendedor','supervisor','coordenador','admin'].includes(visao)) categoriasPermitidas.push(['equipamento','Equipamento']);
    if (['supervisor','admin'].includes(visao)) categoriasPermitidas.push(['bonificacao','Bonificação']);
    if (['tecnico','admin'].includes(visao)) categoriasPermitidas.push(['amostra','Envio de Amostra']);
  }

  const clienteSel = (clientes || []).find(c => c.id === clienteId);
  const equipamentos = clienteSel ? listarEquipamentos(clienteSel.fichas_clientes) : [];
  const rota = categoria ? rotaSolicitacao(tipo, justificativa, categoria) : [];

  useEffect(() => { setEquipamento(''); setEquipamentoManual(''); setPatrimonio(''); }, [clienteId]);
  useEffect(() => {
    setTipo(modulo === 'administracao_vendas' && categoria === 'equipamento' ? 'troca' : '');
    setEquipamento(''); setEquipamentoManual(''); setPatrimonio('');
    setJustificativa(''); setProdutoId(''); setQuantidade(''); setModalidadeBonificacao(''); setTipoAmostra('');
  }, [categoria]);

  async function criarAprovacaoManual(solicitacaoId, etapa) {
    const { data: existentes } = await sb.from('solicitacao_aprovacoes').select('id').eq('solicitacao_id', solicitacaoId).limit(1);
    if (existentes && existentes.length) return;
    await sb.from('solicitacao_aprovacoes').insert({
      solicitacao_id: solicitacaoId, etapa, ordem: 1, status: 'pendente'
    });
  }

  async function salvar() {
    if (!categoria) return toast('Selecione a categoria.', 'error');
    if (!clienteId) return toast('Selecione o cliente.', 'error');

    let payload = {
      cliente_id: clienteId, solicitante_id: profile.id, categoria,
      descricao: descricao.trim() || null,
      // Compatibilidade com o schema legado: equipamento ainda é NOT NULL.
      // Para categorias não relacionadas a equipamento usamos um marcador técnico.
      equipamento: categoria === 'bonificacao' ? 'BONIFICAÇÃO' :
                   categoria === 'amostra' ? 'AMOSTRA' : ''
    };

    if (categoria === 'equipamento') {
      if (!tipo) return toast('Selecione o tipo de solicitação.', 'error');
      const eqFinal = equipamento;
      if (!eqFinal) return toast('Selecione o equipamento.', 'error');
      if (tipo === 'troca' && !justificativa) return toast('Informe a justificativa da troca.', 'error');
      payload = { ...payload, tipo, equipamento: eqFinal, patrimonio: patrimonio.trim() || null,
        justificativa: tipo === 'troca' ? justificativa : null };
    } else if (categoria === 'bonificacao') {
      if (!produtoId || Number(quantidade) <= 0) return toast('Informe produto e quantidade da bonificação.', 'error');
      if (!modalidadeBonificacao) return toast('Informe se será acréscimo ou desconto do pedido.', 'error');
      payload = { ...payload, tipo: 'bonificacao', produto_id: produtoId, quantidade: Number(quantidade),
        modalidade_bonificacao: modalidadeBonificacao, status_fluxo: 'aberta' };
    } else {
      if (!tipoAmostra) return toast('Informe KIT ou Produto.', 'error');
      if (tipoAmostra === 'produto' && (!produtoId || Number(quantidade) <= 0)) return toast('Informe produto e quantidade.', 'error');
      payload = { ...payload, tipo: 'amostra', tipo_amostra: tipoAmostra,
        produto_id: tipoAmostra === 'produto' ? produtoId : null,
        quantidade: tipoAmostra === 'produto' ? Number(quantidade) : 1, status_fluxo: 'aberta' };
    }

    setSalvando(true);
    const { data: nova, error } = await sb.from('solicitacoes').insert(payload).select().single();
    if (!error && (categoria === 'bonificacao' || categoria === 'amostra')) {
      const { data: jaCriadas } = await sb.from('solicitacao_aprovacoes')
        .select('id').eq('solicitacao_id', nova.id).limit(1);
      if (!jaCriadas || !jaCriadas.length) {
        const etapas = ['supervisor','coordenador','gestao_adm_vendas'];
        await sb.from('solicitacao_aprovacoes').insert(etapas.map((etapa, i) => ({
          solicitacao_id: nova.id, etapa, ordem: i + 1,
          status: i === 0 ? 'pendente' : 'aguardando'
        })));
      }
    }
    setSalvando(false);
    if (error) return toast(error.message, 'error');
    toast('Solicitação enviada!', 'success');
    onCriada(categoria);
  }

  return h(Modal, {
    titulo: 'Nova solicitação',
    sub: 'Registre equipamentos, bonificações ou envio de amostras',
    largo: true, onClose,
    acoes: [
      h('button', { key: 'c', className: 'btn btn-secondary', onClick: onClose }, 'Cancelar'),
      h('button', { key: 'ok', className: 'btn btn-primary', onClick: salvar, disabled: salvando }, salvando ? 'Enviando...' : 'Enviar solicitação')
    ]
  },
    clientes === null ? h('div', { style: { color: 'var(--text-muted)' } }, 'Carregando...')
    : h('div', { className: 'form-grid' },
      h(Campo, { label: 'Categoria', obrigatorio: true },
        h('select', { className: 'form-select', value: categoria, onChange: e => setCategoria(e.target.value) },
          h('option', { value: '' }, 'Selecione...'),
          categoriasPermitidas.map(([v,l]) => h('option', { key: v, value: v }, l)))),
      h(Campo, { label: 'Cliente', obrigatorio: true },
        h(SearchSelect, {
          value: clienteId, placeholder: 'Buscar cliente...', onChange: v => setClienteId(v),
          items: (clientes || []).map(c => ({ value: c.id, label: (c.codigo_totvs ? c.codigo_totvs + ' — ' : '') + c.razao_social,
            search: (c.codigo_totvs || '') + ' ' + (c.razao_social || '') + ' ' + (c.cnpj_cpf || ''), code: c.codigo_totvs || '' }))
        })),

      categoria === 'equipamento' && h(React.Fragment, null,
        h(Campo, { label: 'Tipo', obrigatorio: true },
          modulo === 'administracao_vendas'
            ? h(Input, { value: 'Troca de equipamento', disabled: true })
            : h('select', { className: 'form-select', value: tipo, onChange: e => setTipo(e.target.value) },
                h('option', { value: '' }, 'Selecione...'),
                h('option', { value: 'aumento' }, 'Aumento de equipamento'),
                h('option', { value: 'troca' }, 'Troca de equipamento'),
                h('option', { value: 'manutencao' }, 'Manutenção de equipamento'))),
        h(Campo, { label: 'Equipamento', obrigatorio: true },
          h('select', { className: 'form-select', value: equipamento, onChange: e => setEquipamento(e.target.value) },
            h('option', { value: '' }, 'Selecione...'),
            equipamentos.length > 0 && h('optgroup', { label: 'Equipamentos já registrados no cliente' },
              equipamentos.map(eq => h('option', { key: 'cad_' + eq, value: eq }, eq))),
            h('optgroup', { label: 'Lista padrão de equipamentos' },
              EQUIPAMENTOS_PADRAO.map(eq => h('option', { key: 'pad_' + eq, value: eq }, eq))))),
        h(Campo, { label: 'Patrimônio' },
          h(Input, { value: patrimonio, placeholder: 'Número do patrimônio, se houver', onChange: e => setPatrimonio(e.target.value) })),
        h(Campo, { label: 'Justificativa', obrigatorio: tipo === 'troca' },
          h('select', { className: 'form-select', value: justificativa, disabled: tipo !== 'troca', onChange: e => setJustificativa(e.target.value) },
            h('option', { value: '' }, tipo === 'troca' ? 'Selecione...' : 'Somente para troca'),
            JUSTIFICATIVAS.map(j => h('option', { key: j, value: j }, j))))),

      categoria === 'bonificacao' && h(React.Fragment, null,
        h(Campo, { label: 'Produto', obrigatorio: true },
          h(SearchSelect, { value: produtoId, placeholder: 'Buscar produto...', onChange: setProdutoId,
            items: produtos.map(p => ({ value: p.id, label: p.codigo + ' — ' + p.descricao, search: p.codigo + ' ' + p.descricao, code: p.codigo })) })),
        h(Campo, { label: 'Quantidade', obrigatorio: true },
          h(Input, { type: 'number', min: 1, value: quantidade, onChange: e => setQuantidade(e.target.value) })),
        h(Campo, { label: 'Aplicação no pedido', obrigatorio: true },
          h('select', { className: 'form-select', value: modalidadeBonificacao, onChange: e => setModalidadeBonificacao(e.target.value) },
            h('option', { value: '' }, 'Selecione...'),
            h('option', { value: 'acrescimo' }, 'Acréscimo no pedido'),
            h('option', { value: 'desconto' }, 'Desconto do pedido')))),

      categoria === 'amostra' && h(React.Fragment, null,
        h(Campo, { label: 'Tipo de amostra', obrigatorio: true },
          h('select', { className: 'form-select', value: tipoAmostra, onChange: e => setTipoAmostra(e.target.value) },
            h('option', { value: '' }, 'Selecione...'),
            h('option', { value: 'kit' }, 'KIT'),
            h('option', { value: 'produto' }, 'Produto'))),
        tipoAmostra === 'produto' && h(Campo, { label: 'Produto', obrigatorio: true },
          h(SearchSelect, { value: produtoId, placeholder: 'Buscar produto...', onChange: setProdutoId,
            items: produtos.map(p => ({ value: p.id, label: p.codigo + ' — ' + p.descricao, search: p.codigo + ' ' + p.descricao, code: p.codigo })) })),
        tipoAmostra === 'produto' && h(Campo, { label: 'Quantidade', obrigatorio: true },
          h(Input, { type: 'number', min: 1, value: quantidade, onChange: e => setQuantidade(e.target.value) }))),

      h('div', { style: { gridColumn: '1 / -1' } },
        h(Campo, { label: 'Descrição / detalhes' },
          h('textarea', { className: 'form-textarea', rows: 3, value: descricao, onChange: e => setDescricao(e.target.value) }))),
      rota.length > 0 && h('div', { style: { gridColumn: '1 / -1', padding: '10px 14px', background: 'var(--accent-subtle)', borderRadius: 'var(--radius-sm)' } },
        h('div', { style: { fontSize: 11, color: 'var(--accent)', fontWeight: 700, marginBottom: 6 } }, 'FLUXO'),
        h('div', { className: 'stepper' }, rota.map((et,i) => h(React.Fragment, { key: et },
          i > 0 && h('span', { className: 'step-arrow' }, '›'),
          h('span', { className: 'badge badge-gray' }, ROLE_LABELS[et] || et)))))
    ));
}

function CardSolicitacao({ s }) {
  const cli = s.clientes || {};
  const cat = s.categoria || 'equipamento';
  const tituloTipo = cat === 'bonificacao' ? 'Bonificação' : cat === 'amostra' ? 'Amostra' :
    s.tipo === 'troca' ? 'Troca' : s.tipo === 'aumento' ? 'Aumento' : 'Manutenção';
  let resumo = s.equipamento || '';
  if (cat === 'bonificacao') resumo = ((s.produtos && (s.produtos.codigo + ' — ' + s.produtos.descricao)) || 'Produto') + ' · ' + fmtNum(s.quantidade || 0) + ' un. · ' + (s.modalidade_bonificacao === 'desconto' ? 'Desconto do pedido' : 'Acréscimo no pedido');
  if (cat === 'amostra') resumo = s.tipo_amostra === 'kit' ? 'KIT' : ((s.produtos && (s.produtos.codigo + ' — ' + s.produtos.descricao)) || 'Produto') + ' · ' + fmtNum(s.quantidade || 0) + ' un.';
  return h('div', { className: 'card', key: s.id },
    h('div', { style: { display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', gap: 10, marginBottom: 10 } },
      h('div', null,
        h('div', { style: { fontSize: 15, fontWeight: 600 } }, identificacaoCliente(cli)),
        h('div', { style: { fontSize: 12, color: 'var(--text-muted)' } }, resumo + ' · aberta em ' + fmtData(s.created_at)),
        s.patrimonio && h('div', { style: { fontSize: 12, color: 'var(--text-muted)' } }, 'Patrimônio: ' + s.patrimonio)),
      h('div', { style: { display: 'flex', gap: 6, alignItems: 'flex-start', flexWrap: 'wrap' } },
        h('span', { className: 'badge badge-blue' }, tituloTipo),
        s.status_fluxo && h('span', { className: `badge ${s.status_fluxo === 'vinculada' || s.status_fluxo === 'concluida' ? 'badge-green' : 'badge-yellow'}` }, s.status_fluxo))),
    h('div', { style: { display:'flex', justifyContent:'flex-end', marginBottom:8 } },
      h('button', { className:'btn btn-secondary btn-sm', onClick: e => { e.stopPropagation(); baixarSolicitacaoPDF(s); } }, '↓ Baixar PDF')),
    h('div', { style:{marginBottom:8} },
          h('span', { className:'badge badge-red', style:{fontFamily:"'JetBrains Mono', monospace", fontWeight:700} }, codigoAuditoria(s, prefixoSolicitacao(s)))),
        h(StepperGenerico, { aprovacoes: s.solicitacao_aprovacoes }),
    s.descricao && h('div', { style: { fontSize: 13, color: 'var(--text-secondary)', marginTop: 10 } }, s.descricao));
}

function PaginaConfiguracaoModulos({onUsuarios}){
  const toast=useToast();
  const [usuarios,setUsuarios]=useState(null);
  const [mods,setMods]=useState({});
  const [carts,setCarts]=useState({});
  useEffect(()=>{carregar();},[]);

  async function carregar(){
    const resultados=await Promise.all([
      sb.from('usuarios').select('id,nome,email,papel,ativo').order('nome'),
      sb.from('usuario_modulos').select('usuario_id,modulo,ativo'),
      sb.from('adm_vendas_supervisores').select('adm_vendas_id,supervisor_id')
    ]);
    const u=resultados[0].data||[], m=resultados[1].data||[], c=resultados[2].data||[];
    setUsuarios(u);
    const mm={}; m.forEach(x=>{if(x.ativo){if(!mm[x.usuario_id])mm[x.usuario_id]=[];mm[x.usuario_id].push(x.modulo);}}); setMods(mm);
    const cc={}; c.forEach(x=>{if(!cc[x.adm_vendas_id])cc[x.adm_vendas_id]=[];cc[x.adm_vendas_id].push(x.supervisor_id);}); setCarts(cc);
  }
  async function altMod(u,k,a){
    const {error}=await sb.from('usuario_modulos').upsert({usuario_id:u.id,modulo:k,ativo:a},{onConflict:'usuario_id,modulo'});
    if(error)return toast(error.message,'error');
    setMods(prev=>{const z=new Set(prev[u.id]||[]);a?z.add(k):z.delete(k);return {...prev,[u.id]:Array.from(z)};});
  }
  async function altCart(adm,sp,a){
    let r;
    if(a) r=await sb.from('adm_vendas_supervisores').upsert({adm_vendas_id:adm,supervisor_id:sp},{onConflict:'adm_vendas_id,supervisor_id'});
    else r=await sb.from('adm_vendas_supervisores').delete().eq('adm_vendas_id',adm).eq('supervisor_id',sp);
    if(r.error)return toast(r.error.message,'error');
    setCarts(prev=>{const z=new Set(prev[adm]||[]);a?z.add(sp):z.delete(sp);return {...prev,[adm]:Array.from(z)};});
  }
  if(!usuarios)return h('div',{className:'empty-state'},'Carregando...');
  const sups=usuarios.filter(u=>u.papel==='supervisor');
  const adms=usuarios.filter(u=>['adm_vendas','gestao_adm_vendas'].includes(u.papel));

  const linhasUsuarios=usuarios.map(u=>{
    const checks=Object.keys(MODULOS).map(k=>
      h('td',{key:k,style:{textAlign:'center'}},
        h('input',{type:'checkbox',checked:(mods[u.id]||[]).includes(k),onChange:e=>altMod(u,k,e.target.checked)})));
    return h('tr',{key:u.id},
      h('td',null,h('b',null,u.nome),h('div',{style:{fontSize:11,color:'var(--text-muted)'}},ROLE_LABELS[u.papel]||u.papel)),
      ...checks);
  });

  const blocosCarteira=adms.map(adm=>{
    const checks=sups.map(sp=>h('label',{key:sp.id,style:{display:'flex',gap:6,alignItems:'center',fontSize:13}},
      h('input',{type:'checkbox',checked:(carts[adm.id]||[]).includes(sp.id),onChange:e=>altCart(adm.id,sp.id,e.target.checked)}),
      sp.nome));
    return h('div',{key:adm.id,style:{padding:'12px 0',borderBottom:'1px solid var(--border)'}},
      h('b',null,adm.nome),
      h('div',{style:{display:'flex',gap:14,flexWrap:'wrap',marginTop:8}},...checks));
  });

  return h('div',null,
    h('div',{className:'page-head'},
      h('div',null,h('div',{className:'page-title'},'Módulos e Carteiras'),h('div',{className:'page-sub'},'Permissões por usuário e carteira da Administração de Vendas')),
      h('button',{className:'btn btn-primary',onClick:onUsuarios},'Usuários e Hierarquia')),
    h('div',{className:'card'},
      h('div',{className:'section-title'},'Acesso aos módulos'),
      h('div',{style:{overflowX:'auto'}},
        h('table',{className:'data-table'},
          h('thead',null,h('tr',null,h('th',null,'Usuário'),...Object.keys(MODULOS).map(k=>h('th',{key:k,style:{textAlign:'center'}},MODULOS[k].label)))),
          h('tbody',null,...linhasUsuarios)))),
    h('div',{className:'card',style:{marginTop:18}},
      h('div',{className:'section-title'},'Carteira — Administração de Vendas'),
      h('div',{className:'page-sub',style:{marginBottom:12}},'Cada Adm. de Vendas pode responder por um ou mais Supervisores.'),
      ...(blocosCarteira.length?blocosCarteira:[h('div',{key:'vazio',className:'empty-state'},'Nenhum Adm. de Vendas cadastrado.')]))
  );
}

function DashboardComercialV38({profile,visao,modulo}) {
  const [loading,setLoading]=useState(true);
  const [vendedores,setVendedores]=useState([]);
  const [supervisores,setSupervisores]=useState([]);
  const [filtroSup,setFiltroSup]=useState('');
  const [filtroVend,setFiltroVend]=useState('');
  const [clientes,setClientes]=useState([]);
  const [fichas,setFichas]=useState([]);
  const [sols,setSols]=useState([]);
  const [titulos,setTitulos]=useState([]); // reservado para integração Protheus / financeiro

  useEffect(()=>{carregarEstrutura();},[profile.id,visao,modulo]);
  useEffect(()=>{if(vendedores.length||visao==='vendedor')carregarDados();},[filtroSup,filtroVend,vendedores.length]);

  async function carregarEstrutura(){
    setLoading(true);
    let supIds=null, vendIds=null;

    if(visao==='vendedor'){
      vendIds=[profile.id];
    } else if(visao==='supervisor'){
      supIds=[profile.id];
    } else if(visao==='coordenador'){
      const {data:ss}=await sb.from('usuarios').select('id,nome').eq('papel','supervisor').eq('coordenador_id',profile.id).eq('ativo',true);
      setSupervisores(ss||[]); supIds=(ss||[]).map(x=>x.id);
    } else if(visao==='adm_vendas'){
      const {data:cart}=await sb.from('adm_vendas_supervisores').select('supervisor_id').eq('adm_vendas_id',profile.id);
      supIds=(cart||[]).map(x=>x.supervisor_id);
      if(supIds.length){
        const {data:ss}=await sb.from('usuarios').select('id,nome').in('id',supIds).order('nome');
        setSupervisores(ss||[]);
      } else setSupervisores([]);
    } else if(['gestao_adm_vendas','diretoria','admin'].includes(visao)){
      const {data:ss}=await sb.from('usuarios').select('id,nome').eq('papel','supervisor').eq('ativo',true).order('nome');
      setSupervisores(ss||[]); supIds=(ss||[]).map(x=>x.id);
    }

    if(!vendIds){
      if(supIds && !supIds.length){setVendedores([]);setLoading(false);return;}
      let q=sb.from('usuarios').select('id,nome,supervisor_id').eq('papel','vendedor').eq('ativo',true).order('nome');
      if(supIds)q=q.in('supervisor_id',supIds);
      const {data:vv}=await q; setVendedores(vv||[]);
    } else {
      const {data:vv}=await sb.from('usuarios').select('id,nome,supervisor_id').in('id',vendIds);
      setVendedores(vv||[]);
    }
    setLoading(false);
  }

  function idsSelecionados(){
    let vs=vendedores;
    if(filtroSup)vs=vs.filter(v=>v.supervisor_id===filtroSup);
    if(filtroVend)vs=vs.filter(v=>v.id===filtroVend);
    return vs.map(v=>v.id);
  }

  async function carregarDados(){
    const ids=idsSelecionados();
    if(!ids.length){setClientes([]);setFichas([]);setSols([]);return;}
    const [rc,rf]=await Promise.all([
      sb.from('clientes').select('id,codigo_totvs,razao_social,vendedor_id').in('vendedor_id',ids),
      sb.from('fichas_clientes').select('id,vendedor_id,faturamento_previsto,created_at,ficha_aprovacoes(status)').in('vendedor_id',ids)
    ]);
    const cls=rc.data||[]; setClientes(cls); setFichas(rf.data||[]);
    const cliIds=cls.map(c=>c.id);
    if(cliIds.length){
      const {data:ss}=await sb.from('solicitacoes')
        .select('id,cliente_id,categoria,tipo,status_fluxo,created_at')
        .in('cliente_id',cliIds);
      setSols(ss||[]);
    } else setSols([]);
    // "Títulos / NF" fica propositalmente vazio até integração:
    // estrutura visual já está pronta e não inventa dados financeiros.
    setTitulos([]);
  }

  function fichaStatus(f){
    const a=f.ficha_aprovacoes||[];
    if(a.some(x=>x.status==='reprovado'))return'reprovada';
    if(a.length&&a.every(x=>CONCLUIDAS.includes(x.status)))return'aprovada';
    return'aguardando';
  }
  function solStatus(x){
    const st=String(x.status_fluxo||'aberta').toLowerCase();
    if(st.includes('reprov'))return'reprovada';
    if(['concluida','concluído','concluido'].includes(st))return'concluida';
    return'aguardando';
  }
  function contSol(cat,st){return sols.filter(x=>x.categoria===cat&&solStatus(x)===st).length;}
  const fa=fichas.filter(x=>fichaStatus(x)==='aprovada').length;
  const fr=fichas.filter(x=>fichaStatus(x)==='reprovada').length;
  const fw=fichas.length-fa-fr;
  const media=fichas.length?fichas.reduce((a,x)=>a+Number(x.faturamento_previsto||0),0)/fichas.length:0;

  const porVendedor=vendedores.filter(v=>idsSelecionados().includes(v.id)).map(v=>{
    const fc=fichas.filter(f=>f.vendedor_id===v.id), cc=clientes.filter(c=>c.vendedor_id===v.id);
    return {id:v.id,nome:v.nome,clientes:cc.length,fichas:fc.length,aprov:fc.filter(x=>fichaStatus(x)==='aprovada').length,
      reprov:fc.filter(x=>fichaStatus(x)==='reprovada').length,media:fc.length?fc.reduce((a,x)=>a+Number(x.faturamento_previsto||0),0)/fc.length:0};
  });
  const porSupervisor=supervisores.filter(sp=>!filtroSup||sp.id===filtroSup).map(sp=>{
    const vv=vendedores.filter(v=>v.supervisor_id===sp.id), vids=vv.map(v=>v.id);
    const fc=fichas.filter(f=>vids.includes(f.vendedor_id)), cc=clientes.filter(c=>vids.includes(c.vendedor_id));
    return {id:sp.id,nome:sp.nome,vendedores:vv.length,clientes:cc.length,fichas:fc.length,aprov:fc.filter(x=>fichaStatus(x)==='aprovada').length};
  });

  if(loading)return h('div',{className:'empty-state'},'Carregando dashboard...');

  return h('div',null,
    h('div',{className:'page-head'},
      h('div',null,
        h('div',{className:'page-title'},modulo==='administracao_vendas'?'Dashboard — Administração de Vendas':'Dashboard de Vendas'),
        h('div',{className:'page-sub'},
          visao==='vendedor'?'Sua carteira e seus indicadores':
          visao==='adm_vendas'?'Carteira vinculada aos seus Supervisores':
          visao==='gestao_adm_vendas'?'Visão consolidada de todas as carteiras':
          'Desempenho da estrutura comercial'))),
    visao!=='vendedor' && h('div',{className:'card',style:{marginBottom:18,padding:16}},
      h('div',{style:{display:'flex',gap:12,flexWrap:'wrap',alignItems:'end'}},
        supervisores.length>0 && h(Campo,{label:'Supervisor'},h('select',{className:'form-select',value:filtroSup,onChange:e=>{setFiltroSup(e.target.value);setFiltroVend('');}},
          h('option',{value:''},'Todos os supervisores'),...supervisores.map(x=>h('option',{key:x.id,value:x.id},x.nome)))),
        h(Campo,{label:'Vendedor'},h('select',{className:'form-select',value:filtroVend,onChange:e=>setFiltroVend(e.target.value)},
          h('option',{value:''},'Todos os vendedores'),...vendedores.filter(v=>!filtroSup||v.supervisor_id===filtroSup).map(x=>h('option',{key:x.id,value:x.id},x.nome)))))),
    h('div',{className:'kpi-grid'},
      h(Kpi,{icon:'☺',cor:'accent',valor:clientes.length,label:'Clientes na carteira'}),
      h(Kpi,{icon:'≡',cor:'info',valor:fichas.length,label:'Fichas cadastradas'}),
      h(Kpi,{icon:'✓',cor:'success',valor:fa,label:'Fichas aprovadas'}),
      h(Kpi,{icon:'✗',cor:'danger',valor:fr,label:'Fichas reprovadas'}),
      h(Kpi,{icon:'R$',cor:'warning',valor:fmtMoeda(media),label:'Faturamento médio esperado'})),
    h('div',{className:'card',style:{marginTop:18}},
      h('div',{className:'section-title'},'Solicitações da Carteira'),
      h('div',{style:{overflowX:'auto'}},h('table',{className:'data-table'},
        h('thead',null,h('tr',null,h('th',null,'Solicitação'),h('th',null,'Aguardando'),h('th',null,'Concluída'),h('th',null,'Reprovada'))),
        h('tbody',null,
          ...[['bonificacao','Bonificação'],['amostra','Amostra'],['equipamento','Equipamento / Manutenção']].map(([k,n])=>
            h('tr',{key:k},h('td',null,h('b',null,n)),h('td',null,contSol(k,'aguardando')),h('td',null,contSol(k,'concluida')),h('td',null,contSol(k,'reprovada')))))))),
    porSupervisor.length>0 && ['coordenador','adm_vendas','gestao_adm_vendas','admin','diretoria'].includes(visao) &&
      h('div',{className:'card',style:{marginTop:18}},h('div',{className:'section-title'},'Resumo por Supervisor'),
        h('div',{style:{overflowX:'auto'}},h('table',{className:'data-table'},
          h('thead',null,h('tr',null,h('th',null,'Supervisor'),h('th',null,'Vendedores'),h('th',null,'Clientes'),h('th',null,'Fichas'),h('th',null,'Aprovadas'))),
          h('tbody',null,...porSupervisor.map(x=>h('tr',{key:x.id},h('td',null,h('b',null,x.nome)),h('td',null,x.vendedores),h('td',null,x.clientes),h('td',null,x.fichas),h('td',null,x.aprov))))))),
    porVendedor.length>0 && visao!=='vendedor' &&
      h('div',{className:'card',style:{marginTop:18}},h('div',{className:'section-title'},'Resumo por Vendedor'),
        h('div',{style:{overflowX:'auto'}},h('table',{className:'data-table'},
          h('thead',null,h('tr',null,h('th',null,'Vendedor'),h('th',null,'Clientes'),h('th',null,'Fichas'),h('th',null,'Aprovadas'),h('th',null,'Reprovadas'),h('th',null,'Fat. médio esperado'))),
          h('tbody',null,...porVendedor.map(x=>h('tr',{key:x.id},h('td',null,h('b',null,x.nome)),h('td',null,x.clientes),h('td',null,x.fichas),h('td',null,x.aprov),h('td',null,x.reprov),h('td',null,fmtMoeda(x.media)))))))),
    h('div',{className:'card',style:{marginTop:18}},
      h('div',{className:'section-title'},'Gestão de Carteira — Títulos a Vencer e Vencidos'),

function PaginaDashboard({ profile, visao, ehPreview, modulo }) {
  const [dados,setDados]=useState(null);
  const [equipe,setEquipe]=useState([]);
  const [supervisoresDash,setSupervisoresDash]=useState([]);

  useEffect(()=>{carregar();},[visao,profile.id]);

  function statusFicha(f){
    const aps=f.ficha_aprovacoes||[];
    const reprovada=aps.some(a=>a.status==='reprovado');
    const aprovada=aps.length>0 && aps.every(a=>CONCLUIDAS.includes(a.status)) && aps.some(a=>a.status==='aprovado') && !reprovada;
    const andamento=!aprovada&&!reprovada;
    return {aprovada,reprovada,andamento};
  }
  function resumo(lista){
    const total=lista.length;
    const aprovadas=lista.filter(f=>statusFicha(f).aprovada).length;
    const reprovadas=lista.filter(f=>statusFicha(f).reprovada).length;
    const andamento=lista.filter(f=>statusFicha(f).andamento).length;
    const fat=lista.reduce((a,f)=>a+Number(f.faturamento_previsto||0),0);
    return {total,aprovadas,reprovadas,andamento,faturamento:fat,media:total?fat/total:0,taxa:total?(aprovadas/total*100):0};
  }

  async function carregar(){
    setDados(null);setEquipe([]);setSupervisoresDash([]);
    if(['vendedor','supervisor','coordenador','diretoria','admin','adm_vendas','gestao_adm_vendas'].includes(visao)){
      let ids=null;
      if(!ehPreview) ids=await vendedoresVisiveis(profile);
      let q=sb.from('fichas_clientes')
        .select('id,vendedor_id,faturamento_previsto,created_at,usuarios:vendedor_id(nome),ficha_aprovacoes(status)');
      if(Array.isArray(ids)){
        if(!ids.length){setDados(resumo([]));return;}
        q=q.in('vendedor_id',ids);
      } else if(visao==='vendedor') q=q.eq('vendedor_id',profile.id);
      const {data}=await q;
      const lista=data||[];
      setDados(resumo(lista));

      if(visao!=='vendedor'){
        const map={};
        lista.forEach(f=>{
          const id=f.vendedor_id||'sem';
          if(!map[id])map[id]={id,nome:(f.usuarios&&f.usuarios.nome)||'Sem vendedor',fichas:[]};
          map[id].fichas.push(f);
        });
        setEquipe(Object.values(map).map(x=>({...x,...resumo(x.fichas)})).sort((a,b)=>b.total-a.total));
      }

      if(modulo==='administracao_vendas'){
        let qs=sb.from('usuarios').select('id,nome').eq('papel','supervisor').eq('ativo',true);
        if(visao==='adm_vendas'){
          const {data:cart}=await sb.from('adm_vendas_supervisores').select('supervisor_id').eq('adm_vendas_id',profile.id);
          const sid=(cart||[]).map(x=>x.supervisor_id);
          if(!sid.length){setSupervisoresDash([]);return;}
          qs=qs.in('id',sid);
        }
        const {data:sups}=await qs;
        const supRows=[];
        for(const sp of (sups||[])){
          const {data:vends}=await sb.from('usuarios').select('id').eq('papel','vendedor').eq('supervisor_id',sp.id).eq('ativo',true);
          const vids=(vends||[]).map(v=>v.id);
          const fichas=vids.length?lista.filter(f=>vids.includes(f.vendedor_id)):[];
          supRows.push({id:sp.id,nome:sp.nome,vendedores:vids.length,...resumo(fichas)});
        }
        setSupervisoresDash(supRows.sort((a,b)=>b.total-a.total));
      }
      return;
    }

    // Demais papéis mantêm a visão de fila operacional.
    let q=sb.from('ficha_aprovacoes').select('id,status,fichas_clientes(faturamento_previsto)').eq('etapa',visao);
    if(!ehPreview && ['supervisor','coordenador'].includes(visao))q=q.eq('responsavel_id',profile.id);
    const qs=sb.from('solicitacao_aprovacoes').select('id,status').eq('etapa',visao);
    const [rf,rs]=await Promise.all([visao==='manutencao'?Promise.resolve({data:[]}):q,qs]);
    const lf=rf.data||[],ls=rs.data||[];
    setDados({operacional:true,total:lf.length,aprovadas:lf.filter(x=>x.status==='aprovado').length,
      reprovadas:lf.filter(x=>x.status==='reprovado').length,andamento:lf.filter(x=>['pendente','aguardando'].includes(x.status)).length,
      solicitacoes:ls.filter(x=>x.status==='pendente').length,media:0,taxa:0});
  }

  if(!dados)return h('div',{className:'empty-state'},'Carregando...');
  const kpis=dados.operacional?[

// Confirmação administrativa com campo de senha mascarado.
// A senha existe somente em memória durante a confirmação.
function solicitarSenhaAdministrador(nomeUsuario) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';

    const box = document.createElement('div');
    box.style.cssText = 'width:min(430px,100%);background:#fff;border-radius:14px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.28);color:#172033';

    const titulo = document.createElement('div');
    titulo.textContent = 'Confirmar exclusão de usuário';
    titulo.style.cssText = 'font-size:18px;font-weight:800;margin-bottom:7px';

    const texto = document.createElement('div');
    texto.textContent = 'Digite sua senha de Administrador para excluir ' + nomeUsuario + '.';
    texto.style.cssText = 'font-size:13px;color:#667085;margin-bottom:16px;line-height:1.45';

    const input = document.createElement('input');
    input.type = 'password';
    input.autocomplete = 'current-password';
    input.placeholder = 'Senha do Administrador';
    input.style.cssText = 'width:100%;box-sizing:border-box;border:1px solid #cfd6e4;border-radius:8px;padding:11px 12px;font-size:14px;outline:none';

    const erro = document.createElement('div');
    erro.style.cssText = 'min-height:18px;color:#b42318;font-size:12px;margin-top:6px';

    const acoes = document.createElement('div');
    acoes.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-top:15px';

    const cancelar = document.createElement('button');
    cancelar.textContent = 'Cancelar';
    cancelar.style.cssText = 'border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer';

    const confirmar = document.createElement('button');
    confirmar.textContent = 'Confirmar exclusão';
    confirmar.style.cssText = 'border:0;background:#e6321f;color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer';

    function fechar(valor) {
      document.removeEventListener('keydown', tecla);
      overlay.remove();
      resolve(valor);
    }
    function tecla(e) {
      if (e.key === 'Escape') fechar(null);
      if (e.key === 'Enter' && document.activeElement === input) {
        if (!input.value) { erro.textContent = 'Informe sua senha.'; return; }
        fechar(input.value);
      }
    }
    cancelar.onclick = () => fechar(null);
    confirmar.onclick = () => {
      if (!input.value) { erro.textContent = 'Informe sua senha.'; input.focus(); return; }
      fechar(input.value);
    };
    overlay.onclick = e => { if (e.target === overlay) fechar(null); };
    document.addEventListener('keydown', tecla);

    acoes.append(cancelar, confirmar);
    box.append(titulo, texto, input, erro, acoes);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    setTimeout(() => input.focus(), 30);
  });
}

const NOVO_VAZIO = { nome: '', email: '', senha: '', telefone: '', codigo_vendedor: '', papel: 'vendedor', supervisor_id: '', coordenador_id: '' };

function PaginaAdmin({ profile }) {
  const toast = useToast();
  const [usuarios, setUsuarios] = useState(null);
  const [novo, setNovo] = useState(NOVO_VAZIO);
  const [criando, setCriando] = useState(false);
  const [modalNovo, setModalNovo] = useState(false);
  const [edicoes, setEdicoes] = useState({});

  useEffect(() => { carregar(); }, []);
  async function carregar() {
    const { data } = await sb.from('usuarios').select('*').order('papel').order('nome');
    setUsuarios(data || []);
    setEdicoes({});
  }

  const supervisores = (usuarios || []).filter(u => u.papel === 'supervisor');
  const coordenadores = (usuarios || []).filter(u => u.papel === 'coordenador');

  function editar(id, campo, valor) {
    setEdicoes(prev => ({ ...prev, [id]: { ...(prev[id] || {}), [campo]: valor } }));
  }
  function valorDe(u, campo) {
    const e = edicoes[u.id];
    return e && campo in e ? e[campo] : (u[campo] === null ? '' : u[campo]);
  }

  async function salvarUsuario(u) {
    const e = edicoes[u.id];
    if (!e) return;
    const { error } = await sb.from('usuarios').update({
      papel: valorDe(u, 'papel'),
      telefone: valorDe(u, 'telefone') || null,
      codigo_vendedor: valorDe(u, 'codigo_vendedor') || null,
      supervisor_id: valorDe(u, 'supervisor_id') || null,
      coordenador_id: valorDe(u, 'coordenador_id') || null,
      exigir_troca_senha: !!valorDe(u, 'exigir_troca_senha'),
      ativo: valorDe(u, 'ativo'),
    }).eq('id', u.id);
    if (error) return toast(error.message, 'error');
    toast('Usuário atualizado.', 'success');
    carregar();
  }

  async function excluirUsuario(u) {
    if (!profile || profile.papel !== 'admin') return toast('Somente Administradores podem excluir usuários.', 'error');
    if (u.id === profile.id) return toast('Você não pode excluir o próprio usuário que está logado.', 'error');

    const nome = u.nome || u.email || 'Usuário';
    if (!window.confirm(
      'EXCLUSÃO DEFINITIVA DE USUÁRIO\n\n' + nome + '\n' + (u.email || '') +
      '\n\nO usuário perderá o acesso ao sistema. Esta ação não poderá ser desfeita.\n\nDeseja continuar?'
    )) return;

    const senhaAdmin = await solicitarSenhaAdministrador(nome);
    if (!senhaAdmin) return toast('Exclusão cancelada.', 'info');

    // Reautentica o Administrador atual. A senha não é salva nem enviada
    // para a função de exclusão; é usada somente pelo Supabase Auth.
    const emailAdmin = profile.email || '';
    const { error: authError } = await sb.auth.signInWithPassword({
      email: emailAdmin,
      password: senhaAdmin
    });

    if (authError) return toast('Senha de Administrador incorreta. Usuário não excluído.', 'error');

    const { error } = await sb.rpc('excluir_usuario_definitivamente', { p_usuario_id: u.id });
    if (error) return toast('Não foi possível excluir o usuário: ' + error.message, 'error');

    toast('Usuário excluído definitivamente.', 'success');
    carregar();
  }

  async function criarUsuario() {
    if (!novo.nome.trim() || !novo.email.trim() || !novo.senha) return toast('Nome, e-mail e senha são obrigatórios.', 'error');
    if (novo.senha.length < 6) return toast('A senha precisa ter ao menos 6 caracteres.', 'error');
    setCriando(true);
    const { data: auth, error: errAuth } = await sbSignup.auth.signUp({ email: novo.email.trim(), password: novo.senha });
    if (errAuth || !auth.user) { setCriando(false); return toast(errAuth ? errAuth.message : 'Falha ao criar login.', 'error'); }

    const { error } = await sb.from('usuarios').insert({
      id: auth.user.id, nome: novo.nome.trim(), email: novo.email.trim(),
      telefone: novo.telefone || null, codigo_vendedor: novo.codigo_vendedor || null, papel: novo.papel,
      supervisor_id: novo.supervisor_id || null, coordenador_id: novo.coordenador_id || null,
    });
    setCriando(false);
    if (error) return toast('Login criado, mas o perfil falhou: ' + error.message, 'error');
    toast('Usuário criado! Informe a senha temporária por fora do sistema.', 'success');
    setNovo(NOVO_VAZIO); setModalNovo(false); carregar();
  }

  if (usuarios === null) return h('div', { className: 'empty-state' }, 'Carregando...');

  return h('div', null,
    modalNovo && h(Modal, {
      titulo: 'Novo usuário',
      sub: 'O login é criado automaticamente — informe a senha temporária à pessoa por fora do sistema.',
      onClose: () => setModalNovo(false),
      acoes: [
        h('button', { key: 'c', className: 'btn btn-secondary', onClick: () => setModalNovo(false) }, 'Cancelar'),
        h('button', { key: 'ok', className: 'btn btn-primary', onClick: criarUsuario, disabled: criando }, criando ? 'Criando...' : 'Criar usuário')
      ]
    },
      h('div', { className: 'form-grid' },
        h(Campo, { label: 'Nome', obrigatorio: true }, h(Input, { value: novo.nome, onChange: e => setNovo({ ...novo, nome: e.target.value }) })),
        h(Campo, { label: 'E-mail', obrigatorio: true }, h(Input, { type: 'email', value: novo.email, onChange: e => setNovo({ ...novo, email: e.target.value }) })),
        h(Campo, { label: 'Senha temporária', obrigatorio: true }, h(Input, { value: novo.senha, placeholder: 'mín. 6 caracteres', onChange: e => setNovo({ ...novo, senha: e.target.value }) })),
        h(Campo, { label: 'Telefone (WhatsApp)' }, h(Input, { value: novo.telefone, inputMode: 'numeric', placeholder: '+55 (14) 99999-9999', onChange: e => setNovo({ ...novo, telefone: mascaraTelefoneIntl(e.target.value) }) })),
        h(Campo, { label: 'Código do vendedor' }, h(Input, { value: novo.codigo_vendedor, placeholder: 'Ex.: 0012', onChange: e => setNovo({ ...novo, codigo_vendedor: e.target.value }) })),
        h(Campo, { label: 'Papel', obrigatorio: true },
          h('select', { className: 'form-select', value: novo.papel, onChange: e => setNovo({ ...novo, papel: e.target.value }) },
            PAPEIS.map(p => h('option', { key: p, value: p }, ROLE_LABELS[p])))),
        novo.papel === 'vendedor' && h(Campo, { label: 'Supervisor responsável' },
          h('select', { className: 'form-select', value: novo.supervisor_id, onChange: e => setNovo({ ...novo, supervisor_id: e.target.value }) },
            h('option', { value: '' }, 'Selecione...'),
            supervisores.map(s => h('option', { key: s.id, value: s.id }, s.nome)))),
        novo.papel === 'supervisor' && h(Campo, { label: 'Coordenador responsável' },
          h('select', { className: 'form-select', value: novo.coordenador_id, onChange: e => setNovo({ ...novo, coordenador_id: e.target.value }) },
            h('option', { value: '' }, 'Selecione...'),
            coordenadores.map(c => h('option', { key: c.id, value: c.id }, c.nome)))))),

    h('div', { className: 'page-head' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Gestão de Usuários'),
        h('div', { className: 'page-sub' }, usuarios.length + ' usuário(s) cadastrado(s) · papéis e hierarquia comercial')),
      h('div',{style:{display:'flex',gap:8}},
        h('button', { className:'btn btn-secondary', onClick:()=>window.dispatchEvent(new CustomEvent('abrir-config-modulos')) }, 'Módulos e Carteiras'),
        h('button', { className: 'btn btn-primary', onClick: () => setModalNovo(true) }, '+ Novo usuário'))),

    h('div', { className: 'card', style: { padding: 0 } },
      h('div', { className: 'table-wrap' },
        h('table', null,
          h('thead', null, h('tr', null,
            ['Nome','Papel','Cód. Vendedor','Telefone','Supervisor','Coordenador','Exigir troca senha','Ativo',''].map(c => h('th', { key: c }, c)))),
          h('tbody', null,
            usuarios.map(u => {
              const alterado = !!edicoes[u.id];
              return h('tr', { key: u.id },
                h('td', null,
                  h('div', { className: 'strong' }, u.nome),
                  h('div', { style: { fontSize: 11, color: 'var(--text-muted)' } }, u.email)),
                h('td', null,
                  h('select', { className: 'form-select sm', style: { minWidth: 120 }, value: valorDe(u, 'papel'), onChange: e => editar(u.id, 'papel', e.target.value) },
                    PAPEIS.map(p => h('option', { key: p, value: p }, ROLE_LABELS[p])))),
                h('td', null,
                  h('input', { className: 'form-input sm', style: { minWidth: 100 }, value: valorDe(u, 'codigo_vendedor'), placeholder: '—',
                    onChange: e => editar(u.id, 'codigo_vendedor', e.target.value) })),
                h('td', null,
                  h('input', { className: 'form-input sm', style: { minWidth: 150 }, value: valorDe(u, 'telefone'), placeholder: '+55 (14) ...', inputMode: 'numeric',
                    onChange: e => editar(u.id, 'telefone', mascaraTelefoneIntl(e.target.value)) })),
                h('td', null,
                  h('select', { className: 'form-select sm', style: { minWidth: 120 }, value: valorDe(u, 'supervisor_id'), onChange: e => editar(u.id, 'supervisor_id', e.target.value) },
                    h('option', { value: '' }, '—'),
                    supervisores.map(s => h('option', { key: s.id, value: s.id }, s.nome)))),
                h('td', null,
                  h('select', { className: 'form-select sm', style: { minWidth: 120 }, value: valorDe(u, 'coordenador_id'), onChange: e => editar(u.id, 'coordenador_id', e.target.value) },
                    h('option', { value: '' }, '—'),
                    coordenadores.map(c => h('option', { key: c.id, value: c.id }, c.nome)))),
                h('td', { style: { textAlign: 'center' } },
                  h('input', { type: 'checkbox', style: { width: 16, height: 16, accentColor: 'var(--accent)' },
                    checked: !!valorDe(u, 'exigir_troca_senha'), onChange: e => editar(u.id, 'exigir_troca_senha', e.target.checked) })),

function ModalAnaliseCredito({ fichaId, razaoSocial, onClose, onSaved }) {
  const toast = useToast();
  const [credito, setCredito] = useState('');
  const [condicao, setCondicao] = useState('');
  const [risco,setRisco]=useState('');
  const [obs, setObs] = useState('');
  const [salvando, setSalvando] = useState(false);

  async function salvar() {
    const valor = moedaParaNumero(credito);
    if (!valor || valor <= 0) return toast('Informe o crédito liberado.', 'error');
    if (!condicao.trim()) return toast('Informe a condição de pagamento.', 'error');
    if(!risco) return toast('Informe o risco de crédito.', 'error');

    setSalvando(true);
    // salva os campos na ficha
    const { error: errFicha } = await sb.from('fichas_clientes').update({
      credito_liberado: valor,
      condicao_pagamento_credito: condicao.trim(),
      risco_credito:risco,
      observacoes_credito: obs.trim() || null,
      analise_credito_em: new Date().toISOString(),
    }).eq('id', fichaId);

    if (errFicha) { setSalvando(false); return toast(errFicha.message, 'error'); }

    // marca a etapa analise_credito como aprovada (avanca a fila)
    const { data: apEtapa } = await sb.from('ficha_aprovacoes')
      .select('id').eq('ficha_id', fichaId).eq('etapa', 'analise_credito').eq('status', 'pendente')
      .maybeSingle();

    if (apEtapa) {
      const winRef = window.open('', '_blank');
      const { error: errAp } = await sb.from('ficha_aprovacoes').update({
        status: 'aprovado', observacao: 'Crédito: ' + fmtMoeda(valor) + ' | Risco ' + risco + ' | ' + condicao.trim(),
        decidido_em: new Date().toISOString(),
      }).eq('id', apEtapa.id);

      if (errAp) { setSalvando(false); if (winRef && !winRef.closed) winRef.close(); return toast(errAp.message, 'error'); }

      // avisa o proximo (financeiro)
      const fichaObj = { razao_social: razaoSocial, cnpj_cpf: '' };
      await avisarProximo(fichaId, 3, fichaObj, winRef);
    }

    setSalvando(false);
    toast('Análise de crédito concluída!', 'success');
    onSaved();
  }

  return h(Modal, {
    titulo: 'Análise de Crédito',
    sub: razaoSocial,
    onClose,
    acoes: [
      h('button', { key: 'c', className: 'btn btn-secondary', onClick: onClose }, 'Cancelar'),
      h('button', { key: 'ok', className: 'btn btn-primary', onClick: salvar, disabled: salvando },
        salvando ? 'Salvando...' : 'Concluir análise e liberar para Financeiro')
    ]
  },
    h('div', { className: 'form-grid' },
      h(Campo, { label: 'Crédito Liberado (R$)', obrigatorio: true },
        h(Input, { value: credito, inputMode: 'numeric', placeholder: '0,00',
          onChange: e => setCredito(mascaraMoeda(e.target.value)) })),
      h(Campo, { label: 'Condição de Pagamento', obrigatorio: true },
        h(Input, { value: condicao, placeholder: 'ex: 28 dias boleto',
          onChange: e => setCondicao(e.target.value) })),
      h(Campo,{label:'Risco de Crédito',obrigatorio:true},h(Select,{opcoes:['A','B','C','D'],value:risco,onChange:e=>setRisco(e.target.value)})),
      h('div', { style: { gridColumn: '1 / -1' } },
        h(Campo, { label: 'Observações' },
          h('textarea', { className: 'form-textarea', rows: 3, value: obs,
            onChange: e => setObs(e.target.value) })))));
}

function PaginaEntregasEquipamentos({profile}) {
  const toast=useToast();
  const [entregas,setEntregas]=useState(null);
  const [rotas,setRotas]=useState([]);
  const [itensRota,setItensRota]=useState([]);
  const [sel,setSel]=useState([]);
  const [data,setData]=useState('');
  const [aberta,setAberta]=useState(null);
  const [erro,setErro]=useState('');
  const mapRef=useRef(null);

  useEffect(()=>{carregar();},[]);
  useEffect(()=>{
    if(!aberta)return;
    const t=setTimeout(()=>desenha(aberta),150);
    return()=>clearTimeout(t);
  },[aberta,itensRota]);

  async function carregar(){
    setErro('');
    try{
      const [re,rr,ri]=await Promise.all([
        sb.from('entregas_equipamentos')
          .select('id,ficha_id,status,data_prevista,endereco_rua,endereco_numero,endereco_bairro,endereco_cidade,endereco_estado,endereco_cep,latitude,longitude,equipamento_resumo,equipamento_condicao,created_at,fichas_clientes(razao_social)')
          .order('created_at',{ascending:false}),
        sb.from('rotas_equipamentos')
          .select('id,nome,data_rota,status,created_at')
          .order('data_rota',{ascending:false}),
        sb.from('rota_equipamento_itens')
          .select('id,rota_id,entrega_id,ordem')
          .order('ordem')
      ]);
      if(re.error)throw re.error;
      if(rr.error)throw rr.error;
      if(ri.error)throw ri.error;
      setEntregas(re.data||[]);
      setRotas(rr.data||[]);
      setItensRota(ri.data||[]);
    }catch(e){
      console.error('Entregas e Rotas:',e);
      setEntregas([]);
      setRotas([]);
      setItensRota([]);
      setErro(e && e.message ? e.message : 'Não foi possível carregar Entregas e Rotas.');
    }
  }

  function entregaPorId(id){return (entregas||[]).find(x=>x.id===id);}
  function itensDaRota(id){
    return itensRota.filter(x=>x.rota_id===id).slice().sort((a,b)=>a.ordem-b.ordem)
      .map(i=>({...i,entrega:entregaPorId(i.entrega_id)}));
  }
  async function geo(e){
    if(!e)return e;
    if(e.latitude!=null&&e.longitude!=null)return e;
    try{
      const q=[e.endereco_rua,e.endereco_numero,e.endereco_bairro,e.endereco_cidade,e.endereco_estado,e.endereco_cep,'Brasil'].filter(Boolean).join(', ');
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q),{
        headers:{'Accept-Language':'pt-BR'}
      });
      if(!r.ok)throw new Error('Falha ao localizar endereço');
      const j=await r.json();
      if(j&&j[0]){
        const latitude=Number(j[0].lat),longitude=Number(j[0].lon);
        const up=await sb.from('entregas_equipamentos').update({latitude,longitude}).eq('id',e.id);
        if(up.error)console.warn(up.error);
        return {...e,latitude,longitude};
      }
    }catch(ex){console.warn('Geocodificação:',ex);}
    return e;
  }
  function km(a,b){
    const R=6371,r=x=>x*Math.PI/180,d1=r(b.latitude-a.latitude),d2=r(b.longitude-a.longitude);
    const z=Math.sin(d1/2)**2+Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(d2/2)**2;
    return 2*R*Math.asin(Math.sqrt(z));
  }
  function otimiza(xs){
    const pontos=xs.filter(x=>x&&x.latitude!=null&&x.longitude!=null);
    const sem=xs.filter(x=>!x||x.latitude==null||x.longitude==null);
    if(pontos.length<2)return pontos.concat(sem);
    const restantes=pontos.slice(1),ord=[pontos[0]];
    while(restantes.length){
      let bi=0,bd=Infinity;
      restantes.forEach((x,i)=>{const d=km(ord[ord.length-1],x);if(d<bd){bd=d;bi=i;}});
      ord.push(restantes.splice(bi,1)[0]);
    }
    return ord.concat(sem);
  }

  async function criar(){
    if(!data)return toast('Informe a data prevista.','error');
    if(!sel.length)return toast('Selecione pelo menos uma entrega.','error');
    const escolhidas=(entregas||[]).filter(x=>sel.includes(x.id));
    let xs=await Promise.all(escolhidas.map(geo));
    xs=otimiza(xs);
    const {data:r,error}=await sb.from('rotas_equipamentos').insert({
      nome:'Entrega Equipamentos '+new Date(data+'T12:00:00').toLocaleDateString('pt-BR'),
      data_rota:data,status:'planejada',criado_por:profile.id
    }).select().single();
    if(error)return toast(error.message,'error');
    const {error:ei}=await sb.from('rota_equipamento_itens')
      .insert(xs.map((x,i)=>({rota_id:r.id,entrega_id:x.id,ordem:i+1})));
    if(ei)return toast(ei.message,'error');
    const {error:eu}=await sb.from('entregas_equipamentos')
      .update({status:'agendada',data_prevista:data}).in('id',sel);
    if(eu)return toast(eu.message,'error');
    setSel([]);setData('');
    toast('Rota criada com sucesso.','success');
    await carregar();
  }

  async function melhorar(r){
    let its=itensDaRota(r.id);
    let xs=await Promise.all(its.map(async i=>({...await geo(i.entrega),_item:i.id})));
    xs=otimiza(xs);
    for(let i=0;i<xs.length;i++){
      const {error}=await sb.from('rota_equipamento_itens').update({ordem:i+1}).eq('id',xs[i]._item);
      if(error)return toast(error.message,'error');
    }
    await carregar();
    setAberta(r);
    toast('Sequência da rota otimizada.','success');
  }

  function desenha(r){
    const el=document.getElementById('mapa-equip');
    if(!el)return;
    if(!window.L){
      el.innerHTML='<div style="padding:20px">Não foi possível carregar o mapa. Verifique a conexão com o serviço de mapas.</div>';
      return;
    }
    if(mapRef.current){try{mapRef.current.remove();}catch(_){} mapRef.current=null;}
    const m=L.map(el).setView([-22.2,-49.9],6);mapRef.current=m;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,attribution:'© OpenStreetMap'
    }).addTo(m);
    const pts=[];
    itensDaRota(r.id).forEach((it,n)=>{
      const e=it.entrega;
      if(e&&e.latitude!=null&&e.longitude!=null){
        const p=[Number(e.latitude),Number(e.longitude)];pts.push(p);
        const nome=(e.fichas_clientes&&e.fichas_clientes.razao_social)||'Cliente';
        L.marker(p).addTo(m).bindPopup('<b>'+(n+1)+'. '+nome+'</b><br>'+(e.equipamento_resumo||''));
      }
    });
    if(pts.length){
      L.polyline(pts,{weight:4,opacity:.75}).addTo(m);
      m.fitBounds(pts,{padding:[30,30]});
    }
    setTimeout(()=>m.invalidateSize(),100);
  }

  if(entregas===null)return h('div',{className:'empty-state'},'Carregando Entregas e Rotas...');
  const pend=entregas.filter(x=>['pendente_agendamento','agendada'].includes(x.status));

  return h('div',null,
    aberta&&h(Modal,{titulo:aberta.nome,sub:'Data: '+fmtData(aberta.data_rota),largo:true,onClose:()=>setAberta(null),
      acoes:[
        h('button',{key:'m',className:'btn btn-primary',onClick:()=>melhorar(aberta)},'Melhorar rota'),
        h('button',{key:'f',className:'btn btn-secondary',onClick:()=>setAberta(null)},'Fechar')
      ]},
      h('div',{id:'mapa-equip',style:{height:430,border:'1px solid var(--border)',borderRadius:10,overflow:'hidden',marginBottom:14}}),
      h('div',{className:'table-wrap'},h('table',null,
        h('thead',null,h('tr',null,h('th',null,'Ordem'),h('th',null,'Cliente'),h('th',null,'Equipamento'))),
        h('tbody',null,...itensDaRota(aberta.id).map(it=>{
          const e=it.entrega||{},f=e.fichas_clientes||{};
          return h('tr',{key:it.id},h('td',null,it.ordem),h('td',null,f.razao_social||'—'),h('td',null,e.equipamento_resumo||'—'));
        }))))),

    h('div',{className:'page-head'},h('div',null,
      h('div',{className:'page-title'},'Entregas e Rotas'),
      h('div',{className:'page-sub'},'Planejamento das entregas de equipamentos liberadas pela Diretoria'))),

    erro&&h('div',{className:'card',style:{borderColor:'#ef4444',background:'#fff7f7',marginBottom:16}},
      h('b',{style:{color:'#b91c1c'}},'Não foi possível carregar a rotina.'),
      h('div',{style:{marginTop:6,fontSize:13}},erro),
      h('button',{className:'btn btn-secondary btn-sm',style:{marginTop:10},onClick:carregar},'Tentar novamente')),

    h('div',{className:'card'},
      h('div',{className:'section-title'},'Criar rota de entrega'),
      h('div',{className:'form-grid'},
        h(Campo,{label:'Data prevista',obrigatorio:true},
          h(Input,{type:'date',value:data,onChange:e=>setData(e.target.value)}))),
      pend.length===0
        ? h(Empty,{icon:'⌖',texto:'Nenhuma entrega aguardando agendamento.'})
        : h('div',{className:'table-wrap'},h('table',null,
            h('thead',null,h('tr',null,h('th',null,''),h('th',null,'Cliente'),h('th',null,'Endereço de Entrega'),h('th',null,'Equipamento'),h('th',null,'Status'))),
            h('tbody',null,...pend.map(e=>{
              const f=e.fichas_clientes||{};
              return h('tr',{key:e.id},
                h('td',null,h('input',{type:'checkbox',checked:sel.includes(e.id),onChange:()=>setSel(x=>x.includes(e.id)?x.filter(y=>y!==e.id):[...x,e.id])})),
                h('td',null,h('b',null,f.razao_social||'—')),
                h('td',null,[e.endereco_rua,e.endereco_numero,e.endereco_bairro,e.endereco_cidade,e.endereco_estado,e.endereco_cep].filter(Boolean).join(', ')),
                h('td',null,e.equipamento_resumo||'—'),
                h('td',null,e.status==='pendente_agendamento'?'Aguardando agendamento':'Agendada'));
            })))),
      h('button',{className:'btn btn-primary',style:{marginTop:14},disabled:!sel.length||!data,onClick:criar},
        'Criar rota e otimizar sequência')),

    h('div',{className:'card',style:{marginTop:18}},
      h('div',{className:'section-title'},'Rotas criadas'),
      rotas.length===0
        ? h(Empty,{icon:'⌖',texto:'Nenhuma rota de equipamentos criada.'})
        : h('div',{className:'table-wrap'},h('table',null,
            h('thead',null,h('tr',null,h('th',null,'Rota'),h('th',null,'Data'),h('th',null,'Entregas'),h('th',null,''))),
            h('tbody',null,...rotas.map(r=>h('tr',{key:r.id},
              h('td',null,h('b',null,r.nome)),
              h('td',null,fmtData(r.data_rota)),
              h('td',null,itensDaRota(r.id).length),
              h('td',null,h('button',{className:'btn btn-secondary btn-sm',onClick:()=>setAberta(r)},'Mapa / Rota'))))))))
  );
}

const DIAS = ['', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];

function PaginaRotas() {
  const toast = useToast();
  const [rotas, setRotas] = useState(null);
  const [clientes, setClientes] = useState([]);
  const [modalNova, setModalNova] = useState(false);
  const [novaRota, setNovaRota] = useState({ nome: '', dia_semana: '' });
  const [modalClientes, setModalClientes] = useState(null); // rota selecionada
  const [vinculados, setVinculados] = useState([]);
  const [clienteAdd, setClienteAdd] = useState('');

  useEffect(() => { carregar(); }, []);
  async function carregar() {
    const [rr, rc] = await Promise.all([
      sb.from('rotas').select('*, cliente_rotas(id, cliente_id, clientes(razao_social, cnpj_cpf, codigo_totvs))').order('dia_semana').order('nome'),
      sb.from('clientes').select('id, razao_social, cnpj_cpf, codigo_totvs').eq('ativo', true).order('razao_social').limit(10000)
    ]);
    setRotas(rr.data || []);
    setClientes(rc.data || []);
  }

  async function criarRota() {
    if (!novaRota.nome.trim() || !novaRota.dia_semana) return toast('Preencha nome e dia.', 'error');
    const { error } = await sb.from('rotas').insert({ nome: novaRota.nome.trim(), dia_semana: Number(novaRota.dia_semana) });
    if (error) return toast(error.message, 'error');
    toast('Rota criada!', 'success');
    setModalNova(false); setNovaRota({ nome: '', dia_semana: '' }); carregar();
  }

  async function abrirClientes(rota) {
    const { data } = await sb.from('cliente_rotas')
      .select('id, cliente_id, ordem_entrega, clientes(razao_social, cnpj_cpf, codigo_totvs)')
      .eq('rota_id', rota.id).order('ordem_entrega');
    setVinculados(data || []);
    setModalClientes(rota);
    setClienteAdd('');
  }

  async function addCliente() {
    if (!clienteAdd || !modalClientes) return;
    const { error } = await sb.from('cliente_rotas').insert({
      cliente_id: clienteAdd, rota_id: modalClientes.id, ordem_entrega: vinculados.length + 1
    });
    if (error) return toast(error.message, 'error');
    abrirClientes(modalClientes); carregar();
  }

  async function removeCliente(crId) {
    await sb.from('cliente_rotas').delete().eq('id', crId);
    abrirClientes(modalClientes); carregar();
  }

  if (rotas === null) return h('div', { className: 'empty-state' }, 'Carregando...');

  return h('div', null,
    modalNova && h(Modal, {
      titulo: 'Nova Rota', onClose: () => setModalNova(false),
      acoes: [
        h('button', { key: 'c', className: 'btn btn-secondary', onClick: () => setModalNova(false) }, 'Cancelar'),
        h('button', { key: 'ok', className: 'btn btn-primary', onClick: criarRota }, 'Criar rota')
      ]
    },
      h('div', { className: 'form-grid' },
        h(Campo, { label: 'Nome da rota', obrigatorio: true },
          h(Input, { value: novaRota.nome, placeholder: 'ex: Rio Preto', onChange: e => setNovaRota({ ...novaRota, nome: e.target.value }) })),
        h(Campo, { label: 'Dia da semana', obrigatorio: true },
          h('select', { className: 'form-select', value: novaRota.dia_semana, onChange: e => setNovaRota({ ...novaRota, dia_semana: e.target.value }) },
            h('option', { value: '' }, 'Selecione...'),
            [1,2,3,4,5,6,7].map(d => h('option', { key: d, value: d }, DIAS[d])))))),

    modalClientes && h(Modal, {
      titulo: modalClientes.nome + ' — ' + DIAS[modalClientes.dia_semana],
      sub: vinculados.length + ' cliente(s) na rota',
      largo: true,
      onClose: () => setModalClientes(null),
      acoes: h('button', { className: 'btn btn-secondary', onClick: () => setModalClientes(null) }, 'Fechar')
    },
      h('div', { style: { display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' } },
        h('div', { style: { flex: 1, minWidth: 200 } },
          h(SearchSelect, {
            value: clienteAdd, placeholder: 'Buscar cliente por código ou nome...',
            onChange: v => setClienteAdd(v),
            items: clientes.filter(c => !vinculados.some(v => v.cliente_id === c.id))
              .map(c => {
                const cod = c.codigo_totvs || '';
                const codSemZeros = cod.replace(/^0+/, '');
                return { value: c.id, label: (cod ? cod + ' — ' : '') + c.razao_social, search: cod + ' ' + codSemZeros + ' ' + c.razao_social + ' ' + (c.cnpj_cpf || ''), code: cod };
              })
          })),
        h('button', { className: 'btn btn-primary btn-sm', disabled: !clienteAdd, onClick: addCliente }, '+ Adicionar')),
      vinculados.length === 0
        ? h(Empty, { icon: '\u263A', texto: 'Nenhum cliente nesta rota.' })
        : h('table', null,
            h('thead', null, h('tr', null, h('th', null, '#'), h('th', null, 'Código'), h('th', null, 'Cliente'), h('th', null, 'CNPJ'), h('th', null, ''))),
            h('tbody', null,
              vinculados.map((v, i) => h('tr', { key: v.id },
                h('td', { className: 'mono' }, i + 1),
                h('td', { className: 'mono' }, v.clientes && v.clientes.codigo_totvs),
                h('td', { className: 'strong' }, identificacaoCliente(v.clientes)),
                h('td', { className: 'mono' }, v.clientes && v.clientes.cnpj_cpf),
                h('td', null, h('button', { className: 'btn btn-danger btn-sm', onClick: () => removeCliente(v.id) }, 'Remover'))))))),

    h('div', { className: 'page-head' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Rotas de Entrega'),
        h('div', { className: 'page-sub' }, rotas.length + ' rota(s) cadastrada(s)')),
      h('button', { className: 'btn btn-primary', onClick: () => setModalNova(true) }, '+ Nova rota')),

    h('div', { className: 'card', style: { padding: 0 } },
      h('div', { className: 'table-wrap' },
        h('table', null,
          h('thead', null, h('tr', null, h('th', null, 'Rota'), h('th', null, 'Dia'), h('th', null, 'Clientes'), h('th', null, ''))),
          h('tbody', null,
            rotas.map(r => h('tr', { key: r.id },
              h('td', { className: 'strong' }, r.nome),
              h('td', null, DIAS[r.dia_semana]),
              h('td', null, h('span', { className: 'badge badge-blue' }, (r.cliente_rotas || []).length)),
              h('td', null, h('button', { className: 'btn btn-secondary btn-sm', onClick: () => abrirClientes(r) }, 'Gerenciar clientes')))))))));
}
