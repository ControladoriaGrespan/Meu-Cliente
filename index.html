const COLUNAS_FATURAMENTO=['data_emissao','codigo_totvs','loja_totvs','codigo_produto','unidade','quantidade','valor_total','tipo_movimento','peso_total_kg'];
const formatoConsumo=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3});
function numeroFaturamento(valor){
  let texto=String(valor??'').trim().replace(/^R\$\s*/,'').replace(/\s/g,'');
  if(texto.includes(',')&&texto.includes('.')){
    texto=texto.lastIndexOf(',')>texto.lastIndexOf('.')?texto.replace(/\./g,''):texto.replace(/,/g,'');
  }
  texto=texto.replace(',','.');
  return /^\d+(\.\d+)?$/.test(texto)?Number(texto):NaN;
}
const codigoFaturamento=v=>String(v??'').trim().toUpperCase().replace(/^0+(?=\d)/,'');
function mesFaturamento(valor){
  const texto=String(valor??'').trim();
  const iso=/^(\d{4})-(\d{2})-(\d{2})$/.exec(texto)||/^(\d{4})(\d{2})(\d{2})$/.exec(texto);
  const br=/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/.exec(texto);
  const [,ano,mes,dia]=iso||(br?[null,br[3].length===2?'20'+br[3]:br[3],br[2],br[1]]:[]);
  const data=new Date(Date.UTC(Number(ano),Number(mes)-1,Number(dia)));
  if(Number(ano)!==2026||!(Number(mes)>=1&&Number(mes)<=10)||data.getUTCDate()!==Number(dia))return null;
  return '2026-'+String(mes).padStart(2,'0')+'-01';
}
const COLUNAS_NF_TOTVS=['documento','serie','cliente','loja','data','tipo','produto','quantidade','total','cfop','tes','tipo_operacao','tipo_operacao_descricao','finalidade_tes','peso_bruto'];
function tipoFaturamentoTotvs(linha){
  const operacao=codigoFaturamento(linha.tipo_operacao);
  const descricao=normalizarCabecalhoImportacao(linha.tipo_operacao_descricao);
  const finalidade=normalizarCabecalhoImportacao(linha.finalidade_tes).replace(/doacao_ou_brinde/g,'');
  const cfop=String(linha.cfop??'').trim().replace(/\D/g,'');
  if(String(linha.tipo??'').trim().toUpperCase()!=='N')return 'fora';
  if(/(?:^|_)(doacao|brinde|sucata|imobilizado)(?:_|$)/.test(finalidade))return 'fora';
  if(operacao==='1'&&descricao==='venda')return 'venda';
  if((operacao==='4'&&descricao==='bonificacao')||
      (!operacao&&['5910','6910'].includes(cfop)&&/(?:^|_)bonificacao(?:_|$)/.test(finalidade)))
    return 'bonificacao';
  if(['2','3','5','13','17'].includes(operacao)||['5911','6911'].includes(cfop)||/amostra|comodato|demonstracao/.test(finalidade))return 'fora';
  return 'indefinido';
}
function lerFaturamentoArquivo(bruto,nome){
  const planilha=/\.xlsx?$/i.test(nome)
    ? XLSX.read(bruto,{type:'array',sheets:0,dense:true,dateNF:'yyyy-mm-dd'})
    : XLSX.read(bruto,{type:'string',sheets:0,dense:true,raw:true});
  const aba=planilha.SheetNames[0],ws=planilha.Sheets[aba];
  if(!ws)throw Error('Nenhuma aba legível.');
  const matrizBruta=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,range:0,blankrows:true});
  const iCabecalho=matrizBruta.slice(0,25).findIndex(l=>{
    const colunas=new Set(l.map(normalizarCabecalhoImportacao));
    return COLUNAS_NF_TOTVS.every(k=>colunas.has(k));
  });
  if(iCabecalho>=0){
    const colunas=new Map(matrizBruta[iCabecalho].map((nome,i)=>[normalizarCabecalhoImportacao(nome),i]));
    const linhas=[],meses=new Set(),erros=[];
    let fora=0,repeticoesCabecalho=0;
    for(let i=iCabecalho+1;i<matrizBruta.length;i++){
      const r=matrizBruta[i],v=k=>r[colunas.get(k)]??'';
      if(!v('documento')&&!v('produto')&&!v('cliente'))continue;
      if(normalizarCabecalhoImportacao(v('documento'))==='documento'&&normalizarCabecalhoImportacao(v('produto'))==='produto'){
        repeticoesCabecalho++;continue;
      }
      const info={tipo:v('tipo'),tipo_operacao:v('tipo_operacao'),tipo_operacao_descricao:v('tipo_operacao_descricao'),finalidade_tes:v('finalidade_tes'),cfop:v('cfop'),data:v('data'),tes:v('tes')};
      const tipo=tipoFaturamentoTotvs(info);
      const data=typeof info.data==='number'&&info.data<100000
        ? (XLSX.SSF.parse_date_code(info.data,{date1904:!!planilha.Workbook?.WBProps?.date1904})||{})
        : null;
      const emissao=data&&data.y?`${data.y}-${String(data.m).padStart(2,'0')}-${String(data.d).padStart(2,'0')}`:info.data;
      const mes=mesFaturamento(emissao);
      if(!mes){erros.push([i+1,'Data de emissão fora do período ou inválida',false]);continue;}
      meses.add(mes);
      if(tipo==='fora'){fora++;continue;}
      if(tipo==='indefinido'){erros.push([i+1,'Operação sem classificação (TES '+info.tes+' / CFOP '+info.cfop+')',false]);continue;}
      linhas.push({linha:i+1,origem_totvs:true,data_emissao:emissao,codigo_totvs:v('cliente'),loja_totvs:v('loja'),
        codigo_produto:v('produto'),quantidade:v('quantidade'),valor_total:v('total'),tipo_movimento:tipo,
        peso_total_kg:numeroFaturamento(v('peso_bruto'))===0?'':v('peso_bruto')});
    }
    if(!linhas.length)throw Error('A aba '+aba+' não possui vendas ou bonificações reconhecidas.');
    return {linhas,aba,meses,fora,repeticoesCabecalho,erros};
  }
  const matriz=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false,dateNF:'yyyy-mm-dd',blankrows:false});
  const parsed=montarPreviewImportacao(matriz);
  if(!parsed?.rows.length)throw Error('Nenhum item na primeira aba do arquivo.');
  const faltantes=COLUNAS_FATURAMENTO.filter(col=>!['loja_totvs','peso_total_kg'].includes(col)&&!parsed.headers.includes(col));
  if(faltantes.length)throw Error('Layout não reconhecido. Colunas do modelo ausentes: '+faltantes.join(', '));
  return {linhas:parsed.rows,aba,meses:new Set(parsed.rows.map(r=>mesFaturamento(r.data_emissao)).filter(Boolean)),fora:0,repeticoesCabecalho:0,erros:[]};
}

function prepararFaturamento(rows,clientes,produtos){
  const agrupar=(lista,chave)=>{
    const mapa=new Map();
    for(const item of lista){
      const codigo=chave(item);
      if(!codigo)continue;
      if(!mapa.has(codigo))mapa.set(codigo,[]);
      mapa.get(codigo).push(item);
    }
    return mapa;
  };
  const porCliente=agrupar(clientes,c=>codigoFaturamento(c.codigo_totvs));
  const porProduto=agrupar(produtos,p=>codigoFaturamento(p.codigo));
  const grupos=new Map(),meses=new Set(),erros=[];
  const resumo={venda:{linhas:0,valor:0},bonificacao:{linhas:0,valor:0},semPeso:0};
  const tipoPorNome={venda:'venda',faturamento:'venda',bonificacao:'bonificacao'};
  const unidade=v=>{
    const u=String(v??'').trim().toUpperCase();
    return u==='PCT'?'PT':u;
  };
  rows.forEach((r,i)=>{
    const mes=mesFaturamento(r.data_emissao),loja=codigoFaturamento(r.loja_totvs);
    const candidatos=porCliente.get(codigoFaturamento(r.codigo_totvs))||[];
    const exatos=loja?candidatos.filter(c=>codigoFaturamento(c.loja_totvs)===loja):candidatos;
    const clientesDaLoja=!exatos.length&&candidatos.length===1&&!codigoFaturamento(candidatos[0].loja_totvs)?candidatos:exatos;
    const itens=porProduto.get(codigoFaturamento(r.codigo_produto))||[];
    const movimento=normalizarCabecalhoImportacao(r.tipo_movimento);
    const tipo=Object.hasOwn(tipoPorNome,movimento)?tipoPorNome[movimento]:null;
    const quantidade=numeroFaturamento(r.quantidade),valor=numeroFaturamento(r.valor_total);
    const pesoInformado=String(r.peso_total_kg||'').trim();
    const peso=numeroFaturamento(pesoInformado);
    const p=itens[0],u=unidade(r.origem_totvs?p?.unidade:r.unidade);
    let erro,cadastral=false;
    if(!mes)erro='Data de emissão inválida ou fora de jan–out/2026';
    else if(clientesDaLoja.length!==1){cadastral=true;erro='Cliente/loja '+r.codigo_totvs+'/'+(r.loja_totvs||'—')+' não cadastrado ou ambíguo';}
    else if(itens.length!==1){cadastral=true;erro='SKU '+r.codigo_produto+' não cadastrado ou ambíguo';}
    else if(!tipo)erro='Classifique o item como Venda ou Bonificação';
    else if(!u||u!==unidade(p.unidade)){cadastral=r.origem_totvs===true;erro='Unidade do SKU '+r.codigo_produto+' diverge do cadastro ('+(p.unidade||'sem unidade')+')';}
    else if(!Number.isFinite(quantidade)||quantidade<=0||!Number.isFinite(valor)||valor<0)erro='Quantidade ou valor inválido';
    else if(pesoInformado&&(!Number.isFinite(peso)||peso<=0))erro='Peso total inválido';
    if(erro){erros.push([r.linha||i+2,erro,cadastral]);return;}
    const cliente_id=clientesDaLoja[0].id,produto_id=p.id;
    const pesoUnitario=u==='KG'?1:Number(p.peso_kg);
    const kg=pesoInformado?peso:(pesoUnitario>0?quantidade*pesoUnitario:null);
    const chave=[mes,cliente_id,produto_id,tipo].join('|');
    const anterior=grupos.get(chave)||{mes,cliente_id,produto_id,tipo,unidade:u,quantidade:0,kg:0,valor_documento:0};
    anterior.quantidade+=quantidade;
    anterior.kg=anterior.kg===null||kg===null?null:anterior.kg+kg;
    anterior.valor_documento+=valor;
    grupos.set(chave,anterior);meses.add(mes);
    resumo[tipo].linhas++;resumo[tipo].valor+=valor;
    if(tipo==='venda'&&kg===null)resumo.semPeso++;
  });
  return {grupos:[...grupos.values()].map(g=>({...g,quantidade:Number(g.quantidade.toFixed(8)),
    kg:g.kg===null?null:Number(g.kg.toFixed(8)),valor_documento:Number(g.valor_documento.toFixed(2))})),meses:[...meses].sort(),erros,resumo};
}

function ImportadorFaturamentoVisita(){
  const [previa,setPrevia]=useState(null);
  const [aceitaPendencias,setAceitaPendencias]=useState(false);
  const [ocupado,setOcupado]=useState(false);
  const [status,setStatus]=useState('');
  const [erro,setErro]=useState('');
  const moeda=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
  async function cadastro(tabela,colunas){
    const registros=[];
    for(let i=0;;i+=1000){
      const {data,error}=await sb.from(tabela).select(colunas).order('id').range(i,i+999);
      if(error)throw error;
      registros.push(...data);
      if(data.length<1000)return registros;
    }
  }
  async function conferir(arquivos){
    if(!arquivos.length)return;
    setOcupado(true);setPrevia(null);setAceitaPendencias(false);setErro('');setStatus('Carregando cadastros…');
    try{
      const [clientes,produtos]=await Promise.all([
        cadastro('clientes','id,codigo_totvs,loja_totvs'),cadastro('produtos','id,codigo,unidade,peso_kg')
      ]);
      const grupos=[],meses=new Map(),erros=[],resumos=[];
      for(const file of arquivos){
        setStatus('Conferindo '+file.name+'…');
        const origem=lerFaturamentoArquivo(await lerArquivo(file),file.name);
        const p=prepararFaturamento(origem.linhas,clientes,produtos);
        for(const mes of origem.meses){
          if(meses.has(mes))throw Error('Os arquivos '+meses.get(mes)+' e '+file.name+' cobrem o mesmo mês ('+mes.slice(0,7)+'). Selecione a exportação completa de cada mês.');
          if(!p.meses.includes(mes))throw Error(file.name+' não possui itens conciliados no mês '+mes.slice(0,7)+'.');
          meses.set(mes,file.name);
        }
        grupos.push(...p.grupos);
        const pendencias=[...origem.erros,...p.erros];
        erros.push(...pendencias.map(([linha,motivo,cadastral])=>({arquivo:file.name,aba:origem.aba,linha,motivo,cadastral})));
        resumos.push({arquivo:file.name,aba:origem.aba,meses:p.meses,fora:origem.fora,...p.resumo});
      }
      setPrevia({grupos,meses:[...meses.keys()].sort(),erros,resumos,
        temBloqueios:erros.some(e=>!e.cadastral)});setStatus('');
    }catch(e){setErro(e.message||String(e));setStatus('');}
    finally{setOcupado(false);}
  }
  async function confirmar(){
    if(ocupado||!previa?.grupos.length||previa.temBloqueios||(previa.erros.length&&!aceitaPendencias))return;
    setOcupado(true);setErro('');setStatus('Preparando carga…');
    try{
      const {data:carga,error}=await sb.rpc('vt_carga_faturamento_iniciar',{p_arquivo:(previa.resumos.length===1?previa.resumos[0].arquivo:previa.resumos.length+' arquivos TOTVS · '+previa.meses.map(m=>m.slice(5,7)).join(',')+'/2026'),p_total:previa.grupos.length});
      if(error)throw error;
      for(let i=0;i<previa.grupos.length;i+=400){
        const lote=previa.grupos.slice(i,i+400);
        const r=await sb.rpc('vt_carga_faturamento_lote',{p_carga:carga,p_lote:lote});
        if(r.error)throw r.error;
        setStatus((i+lote.length)+' de '+previa.grupos.length+' grupos enviados…');
      }
      const r=await sb.rpc('vt_carga_faturamento_publicar',{p_carga:carga,p_meses:previa.meses});
      if(r.error)throw r.error;
      setStatus('Importação concluída. '+previa.meses.length+' mês(es) atualizado(s).');setPrevia(null);
    }catch(e){setErro(e.message||String(e));setStatus('');}
    finally{setOcupado(false);}
  }
  const modelo=()=>downloadXlsx('modelo_faturamento_jan_out_2026',COLUNAS_FATURAMENTO,[
    ['2026-01-15','000123','01','10001','PT','12','420,00','Venda','48'],
    ['2026-01-15','000123','01','10001','PT','2','70,00','Bonificação','8']
  ]);
  return h('div',{className:'card',style:{marginBottom:16}},
    h('h3',null,'Faturamento e bonificações · jan–out/2026'),
    h('p',null,'Selecione os relatórios originais de notas fiscais do TOTVS. A primeira aba contém a base de itens. O sistema classifica vendas e bonificações, usa o peso bruto da NF e substitui a carga dos meses selecionados ao confirmar.'),
    h('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}},
      h('input',{'aria-label':'Arquivos de faturamento',type:'file',multiple:true,accept:'.xlsx,.xls,.csv,.tsv',disabled:ocupado,
        onChange:e=>{const arquivos=Array.from(e.target.files);e.target.value='';conferir(arquivos);}}),
      h('button',{className:'btn btn-secondary btn-sm',onClick:modelo},'Baixar modelo alternativo')),
    status&&h('p',{role:'status'},status),
    erro&&h('p',{role:'alert'},erro),
    previa&&h('div',{style:{marginTop:12}},
      h('div',{className:'table-wrap'},h('table',null,
        h('thead',null,h('tr',null,['Arquivo e aba','Meses','Venda conciliada','Bonificação conciliada','Outras operações'].map(t=>h('th',{key:t},t)))),
        h('tbody',null,previa.resumos.map(r=>h('tr',{key:r.arquivo},
          h('td',null,r.arquivo+' · '+r.aba),h('td',null,r.meses.map(m=>m.slice(5,7)+'/2026').join(', ')),
          h('td',null,r.venda.linhas+' itens · '+moeda.format(r.venda.valor)),
          h('td',null,r.bonificacao.linhas+' itens · '+moeda.format(r.bonificacao.valor)),h('td',null,r.fora)))))),
      previa.resumos.some(r=>r.semPeso)&&h('p',null,'Há vendas sem peso. Esses clientes ficam sem classificação se o cadastro também estiver sem peso.'),
      previa.erros.length>0&&h('div',{role:'alert'},
        h('p',null,previa.erros.length+' linha(s) com pendências. '+(previa.temBloqueios?'Verifique os dados de origem.':'Revise os clientes, lojas e SKUs que não foram conciliados.')),
        h('button',{className:'btn btn-secondary btn-sm',onClick:()=>downloadXlsx('pendencias_faturamento',['Arquivo','Aba','Linha','Motivo'],
          previa.erros.map(e=>[e.arquivo,e.aba,e.linha,e.motivo]))},'Baixar pendências'),
        !previa.temBloqueios&&h('label',{style:{display:'block',margin:'8px 0'}},
          h('input',{type:'checkbox',checked:aceitaPendencias,disabled:ocupado,onChange:e=>setAceitaPendencias(e.target.checked)}),
          ' Importar somente os itens conciliados. As linhas pendentes ficarão fora das médias.')),
      h('button',{className:'btn btn-primary',disabled:ocupado||previa.temBloqueios||(previa.erros.length>0&&!aceitaPendencias),onClick:confirmar},'Confirmar importação')));
}

function PaginaImportacao({ profile }) {
  const toast = useToast();
  const [aba, setAba] = useState('produtos');
  const [arquivoEnderecos,setArquivoEnderecos]=useState(null);
  const [previaEnderecos,setPreviaEnderecos]=useState([]);
  const [statusEnderecos,setStatusEnderecos]=useState('');
  const [importandoEnderecos,setImportandoEnderecos]=useState(false);
  const colunasEndereco=['codigo_totvs','cnpj_cpf','endereco_cep','endereco_logradouro','endereco_numero','endereco_complemento','endereco_bairro','cidade','estado'];
  const colunasCoordenadas=['endereco_latitude','endereco_longitude'];
  function baixarModeloEnderecos(){
    downloadXlsx('modelo_importacao_enderecos',[...colunasEndereco,...colunasCoordenadas],[['000123','12.345.678/0001-90','17500-000','Rua Exemplo','150','','Centro','Marília','SP']]);
  }
  async function prepararEnderecos(file){
    setArquivoEnderecos(file);setPreviaEnderecos([]);setStatusEnderecos('');
    if(!file)return;
    try{
      const parsed=parseArquivo(await lerArquivo(file),file.name);
      if(!parsed)throw Error('Arquivo vazio ou formato não reconhecido.');
      const soCoordenadas=colunasCoordenadas.every(k=>parsed.headers.includes(k))&&!parsed.headers.includes('endereco_logradouro');
      const obrigatorias=soCoordenadas?['codigo_totvs',...colunasCoordenadas]:colunasEndereco;
      const faltantes=obrigatorias.filter(k=>!parsed.headers.includes(k));
      if(faltantes.length)throw new Error('Colunas ausentes: '+faltantes.join(', '));
      const rows=parsed.rows.filter(x=>String(x.codigo_totvs||'').trim());
      if(!rows.length)throw new Error('Nenhum cliente na planilha.');
      if(rows.length>5000)throw new Error('Importe no máximo 5.000 clientes por arquivo.');
      setPreviaEnderecos(rows);setStatusEnderecos(rows.length+' linha(s) carregadas. Confira antes de confirmar.');
    }catch(e){setStatusEnderecos('Erro: '+e.message);}
  }
  async function confirmarEnderecos(){
    if(!previaEnderecos.length)return;
    setImportandoEnderecos(true);
    let salvos=0,ignorados=0;const erros=[];
    try{
      const normal=v=>String(v==null?'':v).trim().replace(/\.0$/,'').replace(/^0+/,'')||'0';
      const docs=v=>String(v||'').replace(/\D/g,'');
      const porCodigo=new Map();
      for(let i=0;;i+=1000){
        const {data,error}=await sb.from('clientes')
          .select('id,codigo_totvs,cnpj_cpf,endereco_logradouro,endereco_latitude,endereco_longitude')
          .order('id').range(i,i+999);
        if(error)throw error;
        data.forEach(c=>{const k=normal(c.codigo_totvs);if(!porCodigo.has(k))porCodigo.set(k,[]);porCodigo.get(k).push(c);});
        if(data.length<1000)break;
      }
      const vistos=new Set();
      for(let i=0;i<previaEnderecos.length;i++){
        const x=previaEnderecos[i],codigo=normal(x.codigo_totvs),matches=porCodigo.get(codigo)||[];
        if(vistos.has(codigo)){ignorados++;erros.push('Linha '+(i+2)+': código repetido na planilha');continue;}vistos.add(codigo);
        if(matches.length!==1){ignorados++;erros.push('Linha '+(i+2)+': código não encontrado ou ambíguo');continue;}
        const c=matches[0];
        if(x.cnpj_cpf&&docs(x.cnpj_cpf)!==docs(c.cnpj_cpf)){ignorados++;erros.push('Linha '+(i+2)+': CNPJ/CPF divergente');continue;}
        const preenchido=k=>String(x[k]??'').trim()!=='';
        const payload={};
        const temCoordenadas=colunasCoordenadas.some(preenchido);
        const [lat,lon]=colunasCoordenadas.map(k=>preenchido(k)?Number(x[k].trim().replace(',','.')):NaN);
        const ponto=pontoCliente({endereco_latitude:lat,endereco_longitude:lon});
        if(temCoordenadas&&!ponto){ignorados++;erros.push('Linha '+(i+2)+': latitude e longitude válidas são obrigatórias');continue;}
        const componentes=['endereco_cep','endereco_logradouro','endereco_numero','endereco_bairro','cidade','estado'];
        if(!c.endereco_logradouro&&componentes.every(preenchido)){
          [...componentes,'endereco_complemento'].forEach(k=>payload[k]=String(x[k]||'').trim()||null);
        }
        if(temCoordenadas&&!pontoCliente(c)){
          payload.endereco_latitude=lat;payload.endereco_longitude=lon;
        }
        if(!Object.keys(payload).length){
          ignorados++;erros.push('Linha '+(i+2)+': sem endereço completo ou coordenadas novas');continue;
        }
        let update=sb.from('clientes').update(payload).eq('id',c.id);
        if(payload.endereco_logradouro)update=update.is('endereco_logradouro',null);
        if(payload.endereco_latitude!=null){
          for(const k of colunasCoordenadas)update=c[k]==null?update.is(k,null):update.eq(k,c[k]);
        }
        const {data:gravados,error:eu}=await update.select('id');
        if(eu||!gravados.length){ignorados++;erros.push('Linha '+(i+2)+': '+(eu?.message||'Cadastro alterado durante a importação'));}else salvos++;
      }
      setStatusEnderecos('Atualizados: '+salvos+' | Ignorados/erros: '+ignorados+'\n'+erros.slice(0,30).join('\n'));
      setPreviaEnderecos([]);setArquivoEnderecos(null);
    }catch(e){setStatusEnderecos('Erro na importação: '+e.message);}
    setImportandoEnderecos(false);
  }

  const [modalRota, setModalRota] = useState(false);
  const [rotaNome, setRotaNome] = useState('');
  const [rotaDia, setRotaDia] = useState('');
  const [rotaArquivo, setRotaArquivo] = useState(null);
  const [preview, setPreview] = useState(null);
  const [importando, setImportando] = useState(false);
  const [resultado, setResultado] = useState('');
  const [nomeArquivo, setNomeArquivo] = useState('');
  const [progresso,setProgresso]=useState({ativo:false,percentual:0,processados:0,total:0,etapa:''});
  const iniciarProgresso=(total,etapa='Preparando importação...')=>setProgresso({ativo:true,percentual:0,processados:0,total:total||0,etapa});
  const atualizarProgresso=(processados,total,etapa='Importando...')=>{ const pct=total?Math.min(100,Math.round((processados/total)*100)):100; setProgresso({ativo:true,percentual:pct,processados,total,etapa}); };
  const finalizarProgresso=(total,etapa='Importação concluída')=>setProgresso({ativo:false,percentual:100,processados:total||0,total:total||0,etapa});

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setNomeArquivo(file.name);
    setPreview(null); setResultado(''); setProgresso({ativo:false,percentual:0,processados:0,total:0,etapa:''});
    try {
      const conteudo = await lerArquivo(file);
      const parsed = parseArquivo(conteudo, file.name);
      if (!parsed || !parsed.rows.length) {
        toast('Arquivo vazio ou formato não reconhecido.', 'error');
        return;
      }
      const hs=new Set(parsed.headers||[]);
      let tipoDetectado=null;
      if(hs.has('razao_social')) tipoDetectado='clientes';
      else if(hs.has('codigo') && hs.has('descricao')) tipoDetectado='produtos';
      else if((hs.has('pedido') || hs.has('numero_pedido') || hs.has('pedido_numero')) &&
              (hs.has('produto') || hs.has('codigo_produto') || hs.has('produto_codigo'))) tipoDetectado='pedidos';

      if(tipoDetectado && tipoDetectado!==aba){
        setAba(tipoDetectado);
        toast('Arquivo reconhecido automaticamente como '+({clientes:'Clientes',produtos:'Produtos',pedidos:'Pedidos'}[tipoDetectado])+'.','info');
      }
      setPreview({...parsed,tipoDetectado:tipoDetectado||aba});
      toast(parsed.rows.length + ' linha(s) carregada(s) de ' + file.name, 'info');
    } catch (err) {
      toast('Erro ao ler arquivo: ' + err.message, 'error');
    }
    e.target.value = ''; // limpa input para permitir reupload do mesmo arquivo
  }

  async function importarRotaArquivo() {
    if (!rotaNome.trim() || !rotaDia || !rotaArquivo) return toast('Informe nome, dia e arquivo XLSX.', 'error');
    setImportando(true);
    try {
      const parsed = parseArquivo(await lerArquivo(rotaArquivo), rotaArquivo.name);
      if (!parsed || !parsed.headers || !parsed.headers.includes('codigo_totvs')) throw new Error('A planilha deve conter a coluna Código Cliente, com os códigos nas linhas abaixo.');
      const linhas = parsed.rows.filter(r => String(r.codigo_totvs || '').trim());
      if (!linhas.length) throw new Error('Nenhum código de cliente encontrado.');
      const { data: existentes, error: ec } = await sb.from('clientes').select('id,codigo_totvs').limit(100000);
      if (ec) throw ec;
      const normal = v => String(v == null ? '' : v).trim().replace(/\\.0$/, '').replace(/^0+/, '') || '0';
      const mapa = new Map();
      (existentes || []).forEach(c => { if (c.codigo_totvs) mapa.set(normal(c.codigo_totvs), c.id); });
      const encontrados = [], faltantes = [], vistos = new Set();
      linhas.forEach((r,i) => {
        const codigo = String(r.codigo_totvs).trim();
        const chave = normal(codigo);
        if (vistos.has(chave)) return;
        vistos.add(chave);
        const id = mapa.get(chave);
        if (id) encontrados.push({id,codigo});
        else faltantes.push({codigo,linha:i+2});
      });
      if (encontrados.length) {
        const {data: rota,error: er} = await sb.from('rotas').insert({nome:rotaNome.trim(),dia_semana:Number(rotaDia),ativo:true}).select('id').single();
        if (er) throw er;
        let salvos=0;
        for(let i=0;i<encontrados.length;i+=200) {
          const lote=encontrados.slice(i,i+200).map((c,j)=>({rota_id:rota.id,cliente_id:c.id,ordem_entrega:i+j+1}));
          const {error: ev} = await sb.from('cliente_rotas').insert(lote);
          if(ev) throw new Error('Rota criada, mas houve falha nos vínculos após '+salvos+' cliente(s): '+ev.message);
          salvos+=lote.length;
        }
      }
      if (faltantes.length) {
        const ws=XLSX.utils.aoa_to_sheet([['Código Cliente','Linha','Motivo'],...faltantes.map(x=>[x.codigo,x.linha,'Cliente não cadastrado'])]);
        ws['!cols']=[{wch:24},{wch:12},{wch:30}];
        const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Não encontrados');
        XLSX.writeFile(wb,'clientes_nao_encontrados_rota.xlsx');
      }
      setResultado('Rota: '+rotaNome+' | Clientes vinculados: '+encontrados.length+' | Não encontrados: '+faltantes.length+(faltantes.length?' (relatório XLSX gerado)':''));
      toast(encontrados.length+' cliente(s) vinculado(s). '+faltantes.length+' não encontrado(s).','success');
      setModalRota(false);setRotaArquivo(null);setRotaNome('');setRotaDia('');
    } catch(err) { toast('Erro na importação de rota: '+err.message,'error'); }
    finally {setImportando(false);}
  }

  // ---------- PRODUTOS ----------
  async function importarProdutos(rows) {
    const obrig = rows.every(r => r.codigo && r.descricao);
    if (!obrig) return toast('As colunas "codigo" e "descricao" são obrigatórias.', 'error');
    setImportando(true);
    iniciarProgresso(rows.length,'Importando produtos...');
    let ok = 0, erros = 0, msgs = [], processados=0;
    for (const r of rows) {
      const { error } = await sb.from('produtos').upsert({
        codigo: r.codigo,
        descricao: r.descricao,
        unidade: r.unidade || 'PCT',
        peso_kg: r.peso_kg ? Number(String(r.peso_kg).replace(',', '.')) : 0,
        ...(r.grupo_tributario_tes?{grupo_tributario_tes:String(r.grupo_tributario_tes).trim().toUpperCase()}:{}),
        ativo: true,
      }, { onConflict: 'codigo' });
      if (error) { erros++; msgs.push(r.codigo + ': ' + error.message); } else ok++;
      processados++; atualizarProgresso(processados,rows.length,'Importando produtos...');
    }
    setImportando(false); finalizarProgresso(rows.length);
    setResultado('✓ ' + ok + ' produto(s) importado(s)' + (erros ? ' · ✗ ' + erros + ' erro(s)\n' + msgs.slice(0, 5).join('\n') : ''));
    if (ok > 0) toast(ok + ' produto(s) importado(s)!', 'success');
  }

  // ---------- PEDIDOS ----------
  async function importarPedidos(rows) {
    setImportando(true);
    iniciarProgresso(rows.length,'Preparando pedidos...');
    const { data: clientes } = await sb.from('clientes').select('id, cnpj_cpf, codigo_totvs').limit(10000);
    const { data: produtos } = await sb.from('produtos').select('id, codigo').limit(10000);
    // normaliza codigo para match flexivel:
    // indexa de 3 formas: exato, sem zeros a esquerda, e com pad ate 6 digitos
    const norm = v => String(v || '').trim();
    const semZeros = v => norm(v).replace(/^0+/, '') || '0';
    const pad6 = v => semZeros(v).padStart(6, '0');
    function indexar(mapa, chave, id) {
      const k = norm(chave).toLowerCase();
      if (k) mapa[k] = id;                            // exato
      const sz = semZeros(chave).toLowerCase();
      if (sz) mapa[sz] = id;                           // sem zeros (2989)
      const p6 = pad6(chave).toLowerCase();
      if (p6) mapa[p6] = id;                           // padded (002989)
    }
    function buscar(mapa, chave) {
      const k = norm(chave).toLowerCase();
      return mapa[k] || mapa[semZeros(chave).toLowerCase()] || mapa[pad6(chave).toLowerCase()];
    }

    const cliMap = {};
    (clientes || []).forEach(c => {
      if (c.cnpj_cpf) cliMap[c.cnpj_cpf.replace(/\D/g, '')] = c.id;
      if (c.codigo_totvs) indexar(cliMap, c.codigo_totvs, c.id);
    });
    const prodMap = {};
    (produtos || []).forEach(p => { indexar(prodMap, p.codigo, p.id); });
    const { data: rotas } = await sb.from('rotas').select('id, nome');
    const rotaMap = {};
    (rotas || []).forEach(r => { rotaMap[r.nome.toLowerCase().trim()] = r.id; });

    // diagnostico: quantos registros foram carregados pra match
    const nCli = Object.keys(cliMap).length;
    const nProd = Object.keys(prodMap).length;
    if (nCli === 0) {
      setImportando(false); setProgresso({ativo:false,percentual:0,processados:0,total:0,etapa:''});
      return toast('Nenhum cliente encontrado no banco. Importe os clientes antes dos pedidos.', 'error');
    }
    if (nProd === 0) {
      setImportando(false); setProgresso({ativo:false,percentual:0,processados:0,total:0,etapa:''});
      return toast('Nenhum produto encontrado no banco. Importe os produtos antes dos pedidos.', 'error');
    }
    toast('Match: ' + (clientes || []).length + ' clientes (' + nCli + ' chaves) e ' + (produtos || []).length + ' produtos (' + nProd + ' chaves) carregados do banco.', 'info');

    const grupos = {};
    let linhaErros = [];
    rows.forEach((r, i) => {
      const cnpjLimpo = (r.cnpj_cpf || '').replace(/\D/g, '');
      const codTotvs = norm(r.codigo_totvs);
      const cliId = (cnpjLimpo && cliMap[cnpjLimpo]) || (codTotvs && buscar(cliMap, codTotvs));
      if (!cliId) { linhaErros.push('Linha ' + (i + 2) + ': cliente não encontrado (' + (r.cnpj_cpf || r.codigo_totvs || '?') + ')'); return; }
      const codProd = norm(r.codigo_produto);
      const prodId = codProd ? buscar(prodMap, codProd) : null;
      if (!prodId) { linhaErros.push('Linha ' + (i + 2) + ': produto não encontrado (' + (r.codigo_produto || '?') + ')'); return; }
      let data = String(r.data_pedido || '').trim();
      // Excel serial number (ex: 46278 = dias desde 1900-01-01)
      if (/^\d{4,5}$/.test(data)) {
        const dt = new Date(Date.UTC(1899, 11, 30 + Number(data)));
        data = dt.toISOString().slice(0, 10);
      }
      // DD/MM/AAAA ou DD/MM/AA
      else if (data.includes('/')) {
        const p = data.split('/');
        let ano = p[2] || '2026';
        if (ano.length === 2) ano = (Number(ano) > 50 ? '19' : '20') + ano;
        data = ano + '-' + (p[1] || '01').padStart(2, '0') + '-' + (p[0] || '01').padStart(2, '0');
      }
      const chave = cliId + '_' + data;
      if (!grupos[chave]) grupos[chave] = { cliId, data, rota: r.rota, obs: r.observacao, itens: [] };
      grupos[chave].itens.push({
        produto_id: prodId,
        quantidade: Number(String(r.quantidade || '0').replace(',', '.')),
        valor_unitario: Number(String(r.valor_unitario || '0').replace(',', '.')),
        tipo_item: String(r.tipo_item || 'venda').trim().toLowerCase() === 'bonificacao' ? 'bonificacao' : 'venda',
      });
    });

    const gruposLista=Object.values(grupos);
    let okPed = 0, errPed = 0, processadosPed=0;
    atualizarProgresso(0,gruposLista.length,'Importando pedidos...');
    for (const g of gruposLista) {
      const rotaId = g.rota ? rotaMap[g.rota.toLowerCase().trim()] : null;
      const { data: pedido, error } = await sb.from('pedidos').insert({
        cliente_id: g.cliId, rota_id: rotaId, criado_por: profile.id,
        data_pedido: g.data, observacoes: g.obs || null, origem: 'totvs',
      }).select().single();
      if (error) { errPed++; processadosPed++; atualizarProgresso(processadosPed,gruposLista.length,'Importando pedidos...'); continue; }
      const itensOk = g.itens.filter(it => it.quantidade > 0 && (it.tipo_item === 'bonificacao' || it.valor_unitario > 0));
      if (itensOk.length) await sb.from('pedido_itens').insert(itensOk.map(it => ({ pedido_id: pedido.id, ...it, valor_unitario: it.tipo_item === 'bonificacao' ? 0 : it.valor_unitario })));
      okPed++;
      processadosPed++; atualizarProgresso(processadosPed,gruposLista.length,'Importando pedidos...');
    }
    setImportando(false); finalizarProgresso(gruposLista.length);
    let msg = '✓ ' + okPed + ' pedido(s) criado(s)';
    if (errPed) msg += ' · ✗ ' + errPed + ' erro(s)';
    if (linhaErros.length) msg += '\n\nLinhas ignoradas:\n' + linhaErros.slice(0, 10).join('\n');
    setResultado(msg);
    if (okPed > 0) toast(okPed + ' pedido(s) importado(s)!', 'success');
  }

  // ---------- CLIENTES ----------
  async function importarClientes(rows) {
    const temColuna = preview && (preview.headers||[]).includes('razao_social');
    if (!temColuna) return toast('Não encontrei a coluna razao_social. Cabeçalhos lidos: '+((preview&&preview.headers)||[]).join(', '), 'error');

    const linhasSemRazao=[], linhasSemFantasia=[];
    const rowsValidas=rows.filter((r,i)=>{
      const nome=String(r.razao_social||'').replace(/\u00A0/g,' ').trim();
      const fantasia=String(r.nome_fantasia||'').replace(/\u00A0/g,' ').trim();
      if(!nome){ linhasSemRazao.push(i+2); return false; }
      if(!fantasia){ linhasSemFantasia.push(i+2); return false; }
      r.razao_social=nome; r.nome_fantasia=fantasia;
      return true;
    });
    if(!rowsValidas.length) return toast('Nenhuma linha válida para importar.','error');

    setImportando(true);
    iniciarProgresso(rowsValidas.length,'Carregando base para conciliação...');

    const [rv, rc] = await Promise.all([
      sb.from('usuarios')
        .select('id,nome,codigo_vendedor,papel')
        .eq('ativo',true)
        .not('codigo_vendedor','is',null)
        .limit(10000),
      sb.from('clientes')
        .select('id,codigo_totvs,cnpj_cpf,razao_social,nome_fantasia')
        .limit(10000)
    ]);

    if(rv.error || rc.error){
      setImportando(false);
      setProgresso({ativo:false,percentual:0,processados:0,total:0,etapa:''});
      return toast('Não foi possível carregar a base para conciliação: '+((rv.error||rc.error).message),'error');
    }

    // Normalizações usadas SOMENTE para localizar o registro existente.
    // Ex.: 000007 = 7; CNPJ com/sem pontuação = mesmo documento.
    const normCod = v => {
      const x=String(v==null?'':v).trim();
      if(!x) return '';
      const soNum=x.replace(/\D/g,'');
      if(soNum && soNum.length===x.replace(/\s/g,'').length) return soNum.replace(/^0+/,'') || '0';
      return x.toUpperCase();
    };
    const normDoc = v => String(v==null?'':v).replace(/\D/g,'');
    const normNome = v => String(v==null?'':v)
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/\s+/g,' ').trim().toUpperCase();

    const vendedorMap={}, codigosDuplicados=new Set();
    (rv.data||[]).forEach(v=>{
      const cod=normCod(v.codigo_vendedor);
      if(!cod) return;
      if(vendedorMap[cod] && vendedorMap[cod].id!==v.id) codigosDuplicados.add(cod);
      else vendedorMap[cod]=v;
    });

    // Índices locais: evita uma consulta por linha e, principalmente,
    // evita criar cliente novo por diferença de máscara/zeros à esquerda.
    const porCodigo={}, porDocumento={}, porNome={}, nomesDuplicados=new Set();
    (rc.data||[]).forEach(c=>{
      const cod=normCod(c.codigo_totvs);
      const doc=normDoc(c.cnpj_cpf);
      const nome=normNome(c.razao_social);
      if(cod && !porCodigo[cod]) porCodigo[cod]=c;
      if(doc && !porDocumento[doc]) porDocumento[doc]=c;
      if(nome){
        if(porNome[nome] && porNome[nome].id!==c.id) nomesDuplicados.add(nome);
        else porNome[nome]=c;
      }
    });

    let novos=0, atualizados=0, erros=linhasSemRazao.length+linhasSemFantasia.length;
    let msgs=[], processados=0;
    if(linhasSemRazao.length) msgs.push('Sem razão social: linha(s) '+linhasSemRazao.slice(0,20).join(', ')+(linhasSemRazao.length>20?'...':''));
    if(linhasSemFantasia.length) msgs.push('Sem nome fantasia: linha(s) '+linhasSemFantasia.slice(0,20).join(', ')+(linhasSemFantasia.length>20?'...':''));

    for(const r of rowsValidas){
      let vendedorId=null;
      if(r.codigo_vendedor){
        const cv=normCod(r.codigo_vendedor);
        if(codigosDuplicados.has(cv)){
          erros++; msgs.push((r.codigo_totvs||r.razao_social)+': código vendedor '+r.codigo_vendedor+' está em mais de um usuário ativo');
          processados++; atualizarProgresso(processados,rowsValidas.length,'Conciliando clientes...'); continue;
        }
        const vend=vendedorMap[cv];
        if(!vend){
          erros++; msgs.push((r.codigo_totvs||r.razao_social)+': vendedor código '+r.codigo_vendedor+' não encontrado em usuário ativo');
          processados++; atualizarProgresso(processados,rowsValidas.length,'Conciliando clientes...'); continue;
        }
        vendedorId=vend.id;
      }

      const cod=normCod(r.codigo_totvs);
      const doc=normDoc(r.cnpj_cpf);
      const nome=normNome(r.razao_social);

      // Ordem de match:
      // 1) Código TOTVS normalizado
      // 2) CNPJ/CPF normalizado
      // 3) Razão Social exata normalizada, somente quando é única na base
      let existente=(cod&&porCodigo[cod]) || (doc&&porDocumento[doc]) || null;
      if(!existente && nome && !nomesDuplicados.has(nome)) existente=porNome[nome]||null;

      // IMPORTANTE: em UPDATE, campos vazios na planilha NÃO podem apagar dados já existentes.
      // Ex.: uma planilha apenas com Código + Razão Social + Nome Fantasia deve atualizar somente
      // esses campos e preservar CNPJ/CPF, Cidade, Estado, vendedor, telefone etc.
      const valorPreenchido = v => v !== undefined && v !== null && String(v).trim() !== '';
      const payloadInsert={
        razao_social:r.razao_social,
        nome_fantasia:valorPreenchido(r.nome_fantasia)?String(r.nome_fantasia).trim():null,
        codigo_totvs:valorPreenchido(r.codigo_totvs)?String(r.codigo_totvs).trim():null,
        cnpj_cpf:valorPreenchido(r.cnpj_cpf)?String(r.cnpj_cpf).trim():null,
        cidade:valorPreenchido(r.cidade)?String(r.cidade).trim():null,
        estado:valorPreenchido(r.estado)?String(r.estado).trim():null,
        telefone:valorPreenchido(r.telefone)?String(r.telefone).trim():null,
        email:valorPreenchido(r.email)?String(r.email).trim():null,
        condicao_pagamento:valorPreenchido(r.condicao_pagamento)?r.condicao_pagamento:null,
        acordo_comercial:valorPreenchido(r.acordo_comercial)?String(r.acordo_comercial).trim():null,
        vendedor_id:vendedorId,
        origem:'totvs'
      };

      const payloadUpdate={origem:'totvs'};
      if(valorPreenchido(r.razao_social)) payloadUpdate.razao_social=String(r.razao_social).trim();
      if(valorPreenchido(r.nome_fantasia)) payloadUpdate.nome_fantasia=String(r.nome_fantasia).trim();
      if(valorPreenchido(r.codigo_totvs)) payloadUpdate.codigo_totvs=String(r.codigo_totvs).trim();
      if(valorPreenchido(r.cnpj_cpf)) payloadUpdate.cnpj_cpf=String(r.cnpj_cpf).trim();
      if(valorPreenchido(r.cidade)) payloadUpdate.cidade=String(r.cidade).trim();
      if(valorPreenchido(r.estado)) payloadUpdate.estado=String(r.estado).trim();
      if(valorPreenchido(r.telefone)) payloadUpdate.telefone=String(r.telefone).trim();
      if(valorPreenchido(r.email)) payloadUpdate.email=String(r.email).trim();
      if(valorPreenchido(r.condicao_pagamento)) payloadUpdate.condicao_pagamento=r.condicao_pagamento;
      if(valorPreenchido(r.acordo_comercial)) payloadUpdate.acordo_comercial=String(r.acordo_comercial).trim();
      if(vendedorId) payloadUpdate.vendedor_id=vendedorId;

      let gravacao;
      if(existente){
        gravacao=await sb.from('clientes').update(payloadUpdate).eq('id',existente.id);
      }else{
        gravacao=await sb.from('clientes').insert(payloadInsert).select('id,codigo_totvs,cnpj_cpf,razao_social').single();
      }

      if(gravacao.error){
        erros++; msgs.push((r.codigo_totvs||r.razao_social)+': '+gravacao.error.message);
      }else if(existente){
        atualizados++;
        // Mantém os índices atualizados durante a própria importação.
        const atualizado={...existente,...payloadUpdate};
        if(cod) porCodigo[cod]=atualizado;
        if(doc) porDocumento[doc]=atualizado;
        if(nome && !nomesDuplicados.has(nome)) porNome[nome]=atualizado;
      }else{
        novos++;
        const criado=gravacao.data||payloadInsert;
        if(cod) porCodigo[cod]=criado;
        if(doc) porDocumento[doc]=criado;
        if(nome && !nomesDuplicados.has(nome)) porNome[nome]=criado;
      }

      processados++;
      atualizarProgresso(processados,rowsValidas.length,'Conciliando clientes...');
    }

    setImportando(false);
    finalizarProgresso(rowsValidas.length);
    setResultado(
      '↻ '+atualizados+' cliente(s) atualizado(s) · + '+novos+' cliente(s) novo(s)'+
      (erros?' · ⚠ '+erros+' linha(s) ignorada(s)/com erro\n'+msgs.slice(0,15).join('\n'):'')
    );
    if(atualizados+novos>0) toast((atualizados+novos)+' cliente(s) conciliado(s)!','success');
  }

  // ---------- CADASTRO DE TABELAS (DA0) ----------
  async function importarCadastroTabelas(rows) {
    const validas=rows.filter(r=>String(r.cod_tabela||'').trim()&&String(r.descricao||'').trim());
    if(validas.length!==rows.length)return toast('DA0: código e descrição obrigatórios em todas as linhas.','error');
    const chaves=validas.map(r=>String(r.cod_tabela).trim());
    if(new Set(chaves).size!==chaves.length)return toast('DA0: há códigos de tabela duplicados; revise o arquivo.','error');
    setImportando(true);iniciarProgresso(rows.length,'Importando cadastro DA0...');
    try{
      let salvos=0;
      for(let i=0;i<validas.length;i+=100){
        const lote=validas.slice(i,i+100).map(r=>({
          codigo:String(r.cod_tabela).trim(),
          descricao:String(r.descricao).trim(),
          ativo:!['false','0','nao','não','n'].includes(String(r.ativo??'true').trim().toLowerCase())
        }));
        const {error}=await sb.from('tabelas_preco').upsert(lote,{onConflict:'codigo'});
        if(error)throw new Error('Lote '+(Math.floor(i/100)+1)+': '+error.message);
        salvos+=lote.length;atualizarProgresso(salvos,validas.length,'Importando cadastro DA0...');
      }
      finalizarProgresso(validas.length);
      setResultado('✓ '+salvos+' cadastro(s) de tabelas conciliados pela DA0. Descrição e status atualizados, vínculos e preços preservados.');
      toast(salvos+' tabelas DA0 importadas!','success');
    }catch(e){setResultado('DA0: '+e.message);toast('Erro ao importar DA0: '+e.message,'error');}
    finally{setImportando(false);}
  }

  // ---------- ITENS DAS TABELAS (DA1) ----------
  async function importarTabelaPreco(rows) {
    if(rows.some(r=>!String(r.cod_tabela||'').trim()||!String(r.codigo_produto||'').trim()||String(r.preco_unitario??'').trim()===''))
      return toast('DA1: cod_tabela, codigo_produto e preco_unitario são obrigatórios.','error');
    const norm=v=>String(v??'').trim().replace(/^0+(?=\d)/,'');
    const vistos=new Set(),duplicados=[];
    rows.forEach((r,i)=>{const chave=norm(r.cod_tabela)+'|'+norm(r.codigo_produto);if(vistos.has(chave))duplicados.push(i+2);vistos.add(chave);});
    if(duplicados.length)return toast('DA1: par tabela/produto duplicado nas linhas '+duplicados.slice(0,8).join(', ')+'. Revise os preços.','error');
    setImportando(true);iniciarProgresso(rows.length,'Conciliando DA1 com produtos...');
    try{
      const [rp,rt]=await Promise.all([
        sb.from('produtos').select('id,codigo').limit(10000),
        sb.from('tabelas_preco').select('id,codigo').limit(10000)
      ]);
      if(rp.error||rt.error)throw new Error((rp.error||rt.error).message);
      const prods=new Map(),tabs=new Map(),prodDuplicados=new Set();
      (rp.data||[]).forEach(p=>{const k=norm(p.codigo);if(prods.has(k))prodDuplicados.add(k);else prods.set(k,p.id);});
      (rt.data||[]).forEach(t=>tabs.set(norm(t.codigo),t.id));
      const payload=[],ignorados=[],faltandoTabela=new Set();
      for(let i=0;i<rows.length;i++){
        const r=rows[i],codTab=norm(r.cod_tabela),codProd=norm(r.codigo_produto);
        const tabId=tabs.get(codTab),prodId=prods.get(codProd);
        if(!tabId){faltandoTabela.add(codTab);continue;}
        if(!prodId||prodDuplicados.has(codProd)){ignorados.push(codTab+'/'+codProd);continue;}
        const preco=Number(String(r.preco_unitario).trim().replace(/\s/g,'').replace(',','.'));
        if(!Number.isFinite(preco)||preco<0){ignorados.push(codTab+'/'+codProd+' (preço inválido)');continue;}
        payload.push({tabela_id:tabId,produto_id:prodId,preco_unitario:preco});
      }
      if(faltandoTabela.size)throw new Error('Tabelas não cadastradas: '+[...faltandoTabela].slice(0,12).join(', ')+'. Importe a DA0 primeiro. Nenhum item foi gravado.');
      let salvos=0;
      for(let i=0;i<payload.length;i+=100){
        const lote=payload.slice(i,i+100);
        const {error}=await sb.from('tabela_preco_itens').upsert(lote,{onConflict:'tabela_id,produto_id'});
        if(error)throw new Error('Lote '+(Math.floor(i/100)+1)+': '+error.message+'; '+salvos+' itens processados antes da falha.');
        salvos+=lote.length;atualizarProgresso(salvos,rows.length,'Importando preços DA1 em lotes...');
      }
      finalizarProgresso(rows.length);
      setResultado('✓ '+salvos+' preço(s) DA1 conciliados · '+ignorados.length+' linha(s) ignorada(s) por produto não cadastrado/ambíguo ou preço inválido.'+
        (ignorados.length?'\nExemplos: '+ignorados.slice(0,15).join(', '):'')+
        '\nNenhum produto novo foi criado; descrições DA0 preservadas.');
      toast(salvos+' preço(s) de tabelas importados!','success');
    }catch(e){setResultado('DA1: '+e.message);toast('Erro ao importar DA1: '+e.message,'error');}
    finally{setImportando(false);}
  }

  // ---------- CLIENTE x TABELA (SA1) ----------
  async function importarClienteTabela(rows) {
    const normal=v=>String(v==null?'':v).replace(/\u00a0/g,' ').trim().replace(/^0+(?=\d)/,'');
    const validas=rows.filter(r=>String(r.codigo_totvs||'').trim()&&String(r.cod_tabela||'').trim());
    if(validas.length!==rows.length)return toast('Cliente x Tabela: código de cliente e tabela obrigatórios.','error');
    const rep=new Set(),vistos=new Set();
    validas.forEach(r=>{const k=normal(r.codigo_totvs);if(vistos.has(k))rep.add(k);vistos.add(k);});
    if(rep.size)return toast('Cliente x Tabela: clientes repetidos no CSV: '+[...rep].slice(0,10).join(', ')+'. Revise antes de importar.','error');
    setImportando(true);iniciarProgresso(rows.length,'Vinculando clientes às tabelas...');
    try{
      const {data:tabs,error:et}=await sb.from('tabelas_preco').select('id,codigo').limit(10000);
      if(et)throw et;
      const tabMap=new Map((tabs||[]).map(t=>[normal(t.codigo),t.id]));
      const cliMap=new Map();
      for(let offset=0;;offset+=1000){
        const {data,error}=await sb.from('clientes').select('id,codigo_totvs').order('id').range(offset,offset+999);
        if(error)throw error;
        (data||[]).forEach(c=>{const k=normal(c.codigo_totvs);if(!k)return;if(!cliMap.has(k))cliMap.set(k,[]);cliMap.get(k).push(c.id);});
        if(!data||data.length<1000)break;
      }
      const grupos=new Map(),ignorados=[];
      for(const r of validas){
        const cli=normal(r.codigo_totvs),tab=normal(r.cod_tabela);
        const ids=cliMap.get(cli)||[],tabId=tabMap.get(tab);
        if(ids.length!==1){ignorados.push(cli+' (cliente não encontrado ou ambíguo)');continue;}
        if(!tabId){ignorados.push(cli+' (tabela '+tab+' não cadastrada)');continue;}
        if(!grupos.has(tabId))grupos.set(tabId,[]);
        grupos.get(tabId).push(ids[0]);
      }
      let salvos=0;
      for(const [tabelaId,ids] of grupos){
        for(let i=0;i<ids.length;i+=80){
          const lote=ids.slice(i,i+80);
          const {data,error}=await sb.from('clientes').update({tabela_preco_id:tabelaId}).in('id',lote).select('id');
          if(error)throw new Error('Vínculos após '+salvos+' confirmados: '+error.message);
          salvos+=(data||[]).length;
          if((data||[]).length!==lote.length)ignorados.push((lote.length-(data||[]).length)+' cliente(s) sem permissão de atualização na tabela');
          atualizarProgresso(salvos,rows.length,'Vinculando clientes às tabelas...');
        }
      }
      finalizarProgresso(rows.length);
      setResultado('✓ '+salvos+' cliente(s) vinculados à tabela de preços · '+ignorados.length+' pendência(s)'+
        (ignorados.length?'\n'+ignorados.slice(0,25).join('\n'):''));
      toast(salvos+' cliente(s) vinculados!','success');
    }catch(e){setResultado('Vínculo Cliente x Tabela: '+e.message);toast('Erro ao vincular tabelas: '+e.message,'error');}
    finally{setImportando(false);}
  }

  function executar() {
    if (!preview) return;
    const tipo=preview.tipoDetectado || aba;
    if (tipo === 'produtos') importarProdutos(preview.rows);
    else if (tipo === 'pedidos') importarPedidos(preview.rows);
    else if (tipo === 'clientes') importarClientes(preview.rows);
    else if (tipo === 'tabela_preco') importarTabelaPreco(preview.rows);
    else if (tipo === 'tabela_cadastro') importarCadastroTabelas(preview.rows);
    else if (tipo === 'cliente_tabela') importarClienteTabela(preview.rows);
  }

  if (!MODELOS['tabela_cadastro']) MODELOS['tabela_cadastro'] = {
    headers: ['cod_tabela', 'descricao', 'ativo'],
    exemplos: [['186','FRANCES 7,95 KG - REAJUSTE 15%','true'],['187','FRANCES 7,80 KG - REAJUSTE 15%','true']],
    dica: 'Importe primeiro a DA0: cadastro das tabelas (código, descrição e status). Atualiza pelo código sem apagar preços ou vínculos com clientes.'
  };
  if (!MODELOS['tabela_preco']) MODELOS['tabela_preco'] = {
    headers: ['cod_tabela', 'codigo_produto', 'preco_unitario'],
    exemplos: [['TAB_7.00', '10000122', '56.00'], ['TAB_7.00', '10000220', '55.00'], ['TAB_8.00', '10000122', '64.00']],
    dica: 'Importe depois da DA0. Apenas produtos já cadastrados recebem preços; importação em lotes. Não cria novos produtos e não sobrescreve a descrição das tabelas.'
  };
  if (!MODELOS['cliente_tabela']) MODELOS['cliente_tabela'] = {
    headers: ['codigo_totvs', 'cod_tabela'],
    exemplos: [['002989', 'TAB_7.00'], ['001387', 'TAB_8.00']],
    dica: 'Vincula cada cliente a uma tabela de pre\u00E7o. O codigo_totvs identifica o cliente e cod_tabela deve existir na aba Tabelas de Pre\u00E7o. Importe as tabelas antes.'
  };
  if (!MODELOS.rotas) MODELOS.rotas = {headers:['Código Cliente'],exemplos:[['002989'],['001387']],dica:'Importe os códigos TOTVS dos clientes. Informe nome e dia da rota no formulário de importação.'};
  const modelo = MODELOS[aba];
  const abas_ = [
    { id: 'produtos', label: 'Produtos' },
    { id: 'pedidos', label: 'Pedidos' },
    { id: 'clientes', label: 'Clientes' },
    { id: 'tabela_cadastro', label: 'Cadastro de Tabelas (DA0)' },
    { id: 'tabela_preco', label: 'Preços por Produto (DA1)' },
    { id: 'cliente_tabela', label: 'Cliente x Tabela' },
    { id: 'rotas', label: 'Rotas' },
  ];

  return h('div', null,
    profile.papel==='admin'&&h(ImportadorFaturamentoVisita),
    h('div',{className:'card',style:{marginBottom:16}},
      h('h3',null,'Importação de endereços dos clientes'),
      h('p',null,'Atualiza clientes existentes pelo código TOTVS. Latitude e longitude podem ser importadas para completar o cadastro e exibir o cliente no mapa.'),
      h('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}},
        h('button',{className:'btn btn-secondary btn-sm',onClick:baixarModeloEnderecos},'Baixar modelo Excel'),
        h('input',{type:'file',accept:'.xlsx,.xls,.csv',onChange:e=>prepararEnderecos(e.target.files[0]||null)}),
        h('button',{className:'btn btn-primary btn-sm',disabled:!previaEnderecos.length||importandoEnderecos,onClick:confirmarEnderecos},importandoEnderecos?'Importando...':'Confirmar '+previaEnderecos.length+' cadastro(s)')),
      previaEnderecos.length>0&&h('div',{style:{marginTop:8,fontSize:12}},'Prévia: '+previaEnderecos.slice(0,5).map(x=>x.codigo_totvs+' — '+(x.endereco_logradouro?[x.endereco_logradouro,x.endereco_numero].filter(Boolean).join(', '):[x.endereco_latitude,x.endereco_longitude].filter(Boolean).join(', '))).join(' | ')),
      statusEnderecos&&h('pre',{style:{whiteSpace:'pre-wrap',fontSize:12,marginTop:8}},statusEnderecos)),
    modalRota && h(Modal,{titulo:'Importar rota',onClose:()=>setModalRota(false),acoes:[h('button',{className:'btn btn-secondary',onClick:()=>setModalRota(false)},'Cancelar'),h('button',{className:'btn btn-primary',disabled:importando,onClick:importarRotaArquivo},importando?'Importando...':'Importar rota')]},
      h(Campo,{label:'Nome da rota'},h(Input,{value:rotaNome,onChange:e=>setRotaNome(e.target.value),placeholder:'Nome da rota'})),
      h(Campo,{label:'Dia da rota'},h('select',{className:'form-select',value:rotaDia,onChange:e=>setRotaDia(e.target.value)},h('option',{value:''},'Selecione o dia'),[1,2,3,4,5,6,7].map(d=>h('option',{value:d,key:d},DIAS[d])))),
      h(Campo,{label:'Planilha XLSX (Código Cliente)'},h('input',{type:'file',accept:'.xlsx,.xls',onChange:e=>setRotaArquivo(e.target.files[0]||null)}))),
    h('div', { className: 'page-head' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Importação TOTVS'),
        h('div', { className: 'page-sub' }, 'Baixe o modelo, preencha e faça upload do arquivo'))),

    h('div', { style: { display: 'flex', gap: 2, borderBottom: '1px solid var(--border)', marginBottom: 18 } },
      abas_.map(a => h('button', {
        key: a.id, onClick: () => { setAba(a.id); setPreview(null); setResultado(''); setNomeArquivo(''); setProgresso({ativo:false,percentual:0,processados:0,total:0,etapa:''}); },
        style: {
          padding: '10px 18px', fontSize: 13, fontWeight: 500, cursor: 'pointer',
          background: 'none', border: 'none', fontFamily: 'inherit',
          borderBottom: '2px solid ' + (aba === a.id ? 'var(--accent)' : 'transparent'),
          color: aba === a.id ? 'var(--accent)' : 'var(--text-muted)'
        }
      }, a.label))),

    // card de instrucoes e download de modelo
    h('div', { className: 'card' },
      h('div', { className: 'section-title' }, '1. Baixar modelo'),
      h('div', { style: { fontSize: 13, color: 'var(--text-secondary)', marginBottom: 12, lineHeight: 1.6 } }, modelo.dica),
      h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
        h('button', { className: 'btn btn-primary btn-sm', onClick: () => downloadXlsx('modelo_' + aba, modelo.headers, modelo.exemplos) }, '⬇ Baixar modelo .xlsx'),
        h('button', { className: 'btn btn-secondary btn-sm', onClick: () => downloadCsv('modelo_' + aba, modelo.headers, modelo.exemplos) }, '⬇ Baixar modelo .csv'))),

    aba==='rotas' && h('div',{className:'card'},h('button',{className:'btn btn-primary',onClick:()=>setModalRota(true)},'Importar rota')),
    // card de upload
    aba!=='rotas' && h('div', { className: 'card' },
      h('div', { className: 'section-title' }, '2. Enviar arquivo preenchido'),
      h('div', { style: { display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' } },
        h('label', {
          style: {
            display: 'inline-flex', alignItems: 'center', gap: 6, padding: '10px 20px',
            background: 'var(--bg-card-hover)', border: '2px dashed var(--border)', borderRadius: 'var(--radius)',
            cursor: 'pointer', fontSize: 14, color: 'var(--text-primary)', transition: 'border-color 0.15s',
          }
        },
          h('span', null, '📁 Escolher arquivo (.csv ou .xlsx)'),
          h('input', { type: 'file', accept: '.csv,.xlsx,.xls,.tsv', style: { display: 'none' }, onChange: handleFile })),
        nomeArquivo && h('span', { style: { fontSize: 13, color: 'var(--text-muted)' } }, '📄 ' + nomeArquivo)),
      preview && h('div', { style: { marginTop: 14, display: 'flex', gap: 8, alignItems: 'center' } },
        h('span', { className: 'badge badge-green' }, preview.rows.length + ' linha(s) carregada(s)'),
        preview.tipoDetectado && h('span',{className:'badge badge-blue'},
          'Arquivo: '+({clientes:'Clientes',produtos:'Produtos',pedidos:'Pedidos'}[preview.tipoDetectado]||preview.tipoDetectado)),
        h('button', { className: 'btn btn-primary', onClick: executar, disabled: importando },
          importando ? 'Importando... ' + progresso.percentual + '%' : 'Importar ' + preview.rows.length + ' registro(s)')),
      (importando || progresso.percentual===100) && h('div',{style:{marginTop:14}},
        h('div',{style:{display:'flex',justifyContent:'space-between',gap:12,fontSize:12,marginBottom:6}},
          h('span',{style:{color:'var(--text-secondary)',fontWeight:600}},progresso.etapa||'Importando...'),
          h('span',{style:{color:'var(--accent)',fontWeight:700}},progresso.percentual+'%')),
        h('div',{style:{height:10,background:'#e5e7eb',borderRadius:999,overflow:'hidden',border:'1px solid var(--border)'}},
          h('div',{style:{height:'100%',width:progresso.percentual+'%',background:'var(--accent)',transition:'width .18s ease',borderRadius:999}})),
        h('div',{style:{fontSize:11,color:'var(--text-muted)',marginTop:5}},
          progresso.total ? progresso.processados+' de '+progresso.total+' processado(s)' : 'Preparando dados...'))),

    // preview
    preview && h('div', { className: 'card', style: { padding: 0 } },
      h('div', { className: 'section-title', style: { padding: '12px 14px', margin: 0, borderBottom: '1px solid var(--border)', borderRadius: 0 } },
        '3. Pré-visualização'),
      h('div', { style: { padding: '8px 14px', fontSize: 12, color: 'var(--text-muted)', borderBottom: '1px solid var(--border)' } },
        'Colunas detectadas: ' + preview.headers.join(', '),
        aba==='clientes' && h('span',{
          className:'badge '+(preview.headers.includes('razao_social')?'badge-green':'badge-red'),
          style:{marginLeft:10}
        },preview.headers.includes('razao_social')?'✓ razão social reconhecida':'✗ razão social não reconhecida')),
      h('div', { className: 'table-wrap', style: { maxHeight: 360 } },
        h('table', null,
          h('thead', null, h('tr', null,
            h('th', { style: { width: 40 } }, '#'),
            preview.headers.map(hd => h('th', { key: hd }, hd)))),
          h('tbody', null,
            preview.rows.slice(0, 30).map((r, i) => h('tr', { key: i },
              h('td', { className: 'mono', style: { color: 'var(--text-muted)' } }, i + 1),
              preview.headers.map(hd => h('td', { key: hd, className: 'mono' }, r[hd] || '')))),
            preview.rows.length > 30 && h('tr', null,
              h('td', { colSpan: preview.headers.length + 1, style: { textAlign: 'center', color: 'var(--text-muted)', padding: 12 } },
                '... e mais ' + (preview.rows.length - 30) + ' linha(s)')))))),

    // resultado
    resultado && h('div', { className: 'card', style: { whiteSpace: 'pre-wrap', fontFamily: "'JetBrains Mono', monospace", fontSize: 12, lineHeight: 1.6 } }, resultado));
}


// =====================================================================
// APP
// =====================================================================
function App() {
  const [sessionReady, setSessionReady] = useState(false);
  const [profile, setProfile] = useState(null);
  const [semPerfil, setSemPerfil] = useState(null);
  const [visao, setVisao] = useState(null);
  const [pagina, setPagina] = useState(profile && profile.exigir_troca_senha ? 'perfil' : 'dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [collapsed, setCollapsed] = useState(false);
  const tema = 'light';
  const [contador, setContador] = useState(0);
  const [modulo,setModulo]=useState(null);
  const [modulosUsuario,setModulosUsuario]=useState([]);

  useEffect(() => {
    const fn=()=>{setModulo('administracao');setVisao('admin');setPagina('config_modulos');};
    window.addEventListener('abrir-config-modulos',fn);
    return ()=>window.removeEventListener('abrir-config-modulos',fn);
  },[]);

  useEffect(() => {
    document.documentElement.className = 'light';
    try{ localStorage.removeItem('tema'); }catch(e){}
  }, []);

  useEffect(() => { carregarSessao(); }, []);

  // Link de aprovação de rota: este hook precisa ficar ANTES de qualquer
  // return condicional do App. Caso contrário o login altera a quantidade
  // de hooks entre renders e o React derruba a aplicação.
  useEffect(()=>{
    if(!profile)return;
    const params=new URLSearchParams(window.location.search);
    const rotaAprov=params.get('rota_aprovacao');
    if(rotaAprov && ['supervisor','admin'].includes(profile.papel)){
      setModulo('vendas');
      setVisao(profile.papel);
      setPagina('pendencias');
    }
  },[profile ? profile.id : null]);

  async function carregarSessao() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { setProfile(null); setSessionReady(true); return; }
    const { data: perfil } = await sb.from('usuarios').select('*').eq('id', session.user.id).single();
    if (!perfil) { setSemPerfil(session.user.id); setSessionReady(true); return; }
    const {data:acessos}=await sb.from('usuario_modulos').select('modulo,ativo').eq('usuario_id',perfil.id).eq('ativo',true);
    const ms=(acessos||[]).map(x=>x.modulo);
    // Perfis autorizados ao módulo técnico mantêm acesso mesmo com liberações legadas já gravadas.
    const obrigatorios=['admin','coordenador_tec_panificacao','gestao_adm_vendas','supervisor_tec_panificacao','lider_tec_panificacao','tec_panificacao'].includes(perfil.papel)?['visita_tecnica']:[];
    const base=perfil.papel==='admin'?Object.keys(MODULOS):(ms.length?ms:modulosPadrao(perfil.papel));
    const modulosLiberados=perfil.papel==='motorista_manutencao'?['motorista_manutencao']:
      [...new Set([...base,...obrigatorios])].filter(m=>m!=='motorista_manutencao'||perfil.papel==='admin')
        // A hierarquia técnica é separada da comercial: o Coordenador Comercial não acessa a Visita Técnica.
        .filter(m=>m!=='visita_tecnica'||perfil.papel!=='coordenador');
    setModulosUsuario(modulosLiberados);
    setProfile(perfil);setVisao(perfil.papel);setModulo(null);
    setPagina(perfil.exigir_troca_senha?'perfil':'modulos');
    // Se a página foi recarregada no meio do preenchimento de uma ficha (comum no celular ao
    // anexar um arquivo), volta direto para a Emissão, onde o rascunho é recuperado.
    try{
      const tela=JSON.parse(sessionStorage.getItem('mc_retomar_emissao')||'null');
      if(tela&&tela.usuario===perfil.id&&!perfil.exigir_troca_senha&&lerRascunhoFicha(perfil.id)
         &&modulosLiberados.includes(tela.modulo)&&menuForModulo(tela.modulo,perfil.papel,perfil.papel).some(m=>m.id==='emissao')){
        setModulo(tela.modulo);setPagina('emissao');
      }
    }catch(e){}
    setSessionReady(true);
  }

  // Marca que o usuário está na Emissão de Fichas, para retomar a tela após um recarregamento.
  useEffect(()=>{
    if(!profile?.id)return;
    try{
      if(pagina==='emissao'&&modulo)sessionStorage.setItem('mc_retomar_emissao',JSON.stringify({usuario:profile.id,modulo}));
      else sessionStorage.removeItem('mc_retomar_emissao');
    }catch(e){}
  },[profile?.id,modulo,pagina]);

  useEffect(()=>{
    if(!profile?.id)return;
    let sid;
    try{
      if(sessionStorage.getItem('grespan_auditoria_usuario')!==String(profile.id)){
        sessionStorage.removeItem('grespan_auditoria_sessao');
        sessionStorage.setItem('grespan_auditoria_usuario',String(profile.id));
      }
      sid=sessionStorage.getItem('grespan_auditoria_sessao');
      if(!sid){sid=window.crypto.randomUUID();sessionStorage.setItem('grespan_auditoria_sessao',sid);}
    }catch(e){return;}
    const tipo=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)?'Mobile':'Desktop';
    const registrar=()=>{
      if(document.visibilityState==='hidden')return;
      sb.rpc('auditoria_registrar_atividade',{p_sessao_id:sid,p_modulo:modulo||'inicio',p_pagina:pagina||'modulos',p_dispositivo:tipo})
        .then(({error})=>{if(error&&!/Could not find the function|does not exist|schema cache/i.test(error.message||''))console.warn('Auditoria:',error.message);})
        .catch(e=>console.warn('Auditoria:',e.message));
    };
    registrar();
    const intervalo=setInterval(registrar,300000);
    document.addEventListener('visibilitychange',registrar);
    return ()=>{clearInterval(intervalo);document.removeEventListener('visibilitychange',registrar);};
  },[profile?.id,modulo,pagina]);

  useEffect(() => { if (profile && visao) atualizarContador(); }, [profile, visao, pagina]);

  async function atualizarContador() {
    const etapa = visao === 'admin' ? 'supervisor' : visao;
    if (['vendedor','motorista_manutencao'].includes(visao)) { setContador(0); return; }

    let q = sb.from('ficha_aprovacoes').select('id', { count: 'exact', head: true }).eq('status','pendente');
    q=etapa==='financeiro'?q.in('etapa',['analise_credito','financeiro']):q.eq('etapa',etapa);
    let qs = sb.from('solicitacao_aprovacoes').select('id', { count: 'exact', head: true })
      .eq('etapa', etapa).eq('status', 'pendente');
    if (visao !== 'admin' && (etapa === 'supervisor' || etapa === 'coordenador')) {
      q = q.eq('responsavel_id', profile.id);
      qs = qs.eq('responsavel_id', profile.id);
    }
    const [rf, rs] = await Promise.all([
      etapa === 'manutencao' ? Promise.resolve({ count: 0 }) : q,
      qs
    ]);
    setContador((rf.count || 0) + (rs.count || 0));
  }

  async function logout() {
    try{sessionStorage.removeItem('grespan_auditoria_sessao');sessionStorage.removeItem('grespan_auditoria_usuario');}catch(e){}
    await sb.auth.signOut();
    setProfile(null); setVisao(null); setSemPerfil(null); setModulo(null); setModulosUsuario([]);
  }

  if (!sessionReady) return h('div', { className: 'login-container' }, h('div', { style: { color: 'var(--text-muted)' } }, 'Carregando...'));

  if (semPerfil) return h('div', { className: 'login-container' },
    h('div', { className: 'login-card', style: { textAlign: 'center' } },
      h('div', { className: 'login-logo', style: { display:'flex', flexDirection:'column', alignItems:'center', gap:8 } },
        h('img', { src: GRESPAN_LOGO_DOC, alt: 'Grespan Pães Congelados', style: { width:230, maxWidth:'100%', height:'auto', display:'block' } }),
        h('div', null, 'Meu Cliente Grespan')
      ),
      h('div', { style: { fontSize: 14, margin: '16px 0 8px' } }, 'Login realizado, mas seu perfil ainda não foi cadastrado.'),
      h('div', { style: { fontSize: 12, color: 'var(--text-muted)', marginBottom: 20, fontFamily: "'JetBrains Mono', monospace", wordBreak: 'break-all' } }, 'ID: ' + semPerfil),
      h('button', { className: 'btn btn-secondary', onClick: logout }, 'Sair')));

  if (!profile) return h(Login, { onLogged: carregarSessao });

  const ehPreview = profile.papel === 'admin' && visao !== 'admin';

  if(!profile.exigir_troca_senha && (!modulo || pagina==='modulos')){
    return h(PaginaModulos,{profile,modulos:modulosUsuario,
      onAbrir:m=>{setModulo(m);setVisao(profile.papel);const x=menuForModulo(m,profile.papel)[0];setPagina(x?x.id:'dashboard')},
      onPerfil:()=>setPagina('perfil'),onConfig:()=>setPagina('config_modulos'),onLogout:logout});
  }
  const menuIds=menuForModulo(modulo,visao,profile.papel).map(m=>m.id);
  const paginaAtual=profile.exigir_troca_senha?'perfil':(pagina==='perfil' || pagina==='administracao'?pagina:(menuIds.includes(pagina)?pagina:menuIds[0]));
  let conteudo;
  if (paginaAtual === 'perfil') conteudo = h(PaginaMeuPerfil, {
    profile,
    onProfileUpdated: p => setProfile(p)
  });
  else if (paginaAtual === 'dashboard') conteudo = (modulo==='vendas'||modulo==='administracao_vendas')
    ? h(DashboardComercialV38,{profile,visao,modulo})
    : h(PaginaDashboard,{profile,visao,ehPreview,modulo});
  else if (paginaAtual === 'dashboard_admin') conteudo = h(PaginaDashboardAdmin,{profile});
  else if (paginaAtual === 'gamificacao') conteudo = profile.papel==='admin'?h(PaginaGamificacaoComercial,{profile}):h('div',{className:'empty-state'},'Acesso restrito ao administrador.');
  else if (paginaAtual === 'emissao') conteudo = h(PaginaEmissao, { profile, onSaved: () => setPagina('solicitacoes') });
  else if (paginaAtual === 'fichas') conteudo = h(PaginaFichas, { profile, ehPreview, onChanged:atualizarContador });
  else if (paginaAtual === 'clientes') conteudo = h(PaginaClientes, { profile, modulo });
  else if (paginaAtual === 'solicitacoes') conteudo = h(PaginaSolicitacoes, { profile, visao, modulo, ehPreview, onChanged:atualizarContador });
  else if (paginaAtual === 'pendencias') conteudo = h(PaginaPendencias, { profile, visao, ehPreview, onChanged: atualizarContador });
  else if (paginaAtual === 'analise_viabilidade') conteudo = h(PaginaViabilidadeFinanceira,{profile});
  else if (paginaAtual === 'logistica_fichas') conteudo=h(PaginaLogisticaFichas,{profile});
  else if (paginaAtual === 'pedidos') conteudo = h(PaginaPedidos, { profile });
  else if (paginaAtual === 'entregas_equipamentos') conteudo=h(PaginaEntregasEquipamentos,{profile});
  else if (paginaAtual === 'cadastro_caminhoes') conteudo=h(PaginaCadastroCaminhoes);
  else if (paginaAtual === 'motorista_rotas') conteudo=h(PaginaRotasMotorista);
  else if (paginaAtual === 'logistica_equipamentos') conteudo=h(PaginaExecucaoEquipamentos,{setor:'logistica'});
  else if (paginaAtual === 'rotas') conteudo = h(PaginaRotas, { profile, visao });
  else if (paginaAtual === 'visitas_tecnicas') conteudo = h(PaginaVisitasTecnicas, { profile, visao });
  else if (paginaAtual === 'visitas_tecnicas_vendas') conteudo = h(PaginaVisitasTecnicasVendas,{profile,visao});
  else if (paginaAtual === 'clientes_visita_tecnica') conteudo = h(ClientesVisitaTecnica,{profile,visao});
  else if (paginaAtual === 'relatorios_visitas') conteudo = h(PaginaRelatoriosVisitas,{profile,visao});
  else if (paginaAtual === 'relatorios_admin') conteudo = h(PaginaRelatoriosAdmin,{profile});
  else if (paginaAtual === 'importacao') conteudo = h(PaginaImportacao, { profile });
  else if (paginaAtual === 'config_modulos') conteudo = h(PaginaConfiguracaoModulos,{onUsuarios:()=>setPagina('administracao')});
  else if (paginaAtual === 'administracao') conteudo = h(PaginaAdmin, { profile });
    else if (paginaAtual === 'auditoria_acessos') conteudo = h(PaginaAuditoriaAcessos,{profile});
    else if (paginaAtual === 'gestao_carteiras') conteudo = h(PaginaGestaoCarteiras,{profile});

  return h('div', { className: 'app-layout' },
    h('div', { className: 'mobile-toggle', onClick: () => setSidebarOpen(o => !o) }, '\u2261'),
    h('div', { className: `backdrop ${sidebarOpen ? 'show' : ''}`, onClick: () => setSidebarOpen(false) }),
    h(Sidebar, {
      profile, visao, modulo, pagina: paginaAtual, onNavigate: setPagina, onVoltarModulos:()=>{setModulo(null);setPagina('modulos')},
      open: sidebarOpen, collapsed, onToggleCollapse: () => setCollapsed(c => !c),
      onClose: () => setSidebarOpen(false), contadorPendencias: contador,
      onLogout: logout, tema, onToggleTema: () => {}
    }),
    h('div', { className: `main-content ${collapsed ? 'wide' : ''}` },
      profile.papel === 'admin' && h('div', {
        style: { display: 'flex', alignItems: 'center', gap: 10, marginBottom: 18, padding: '10px 14px',
                 background: 'var(--accent-subtle)', border: '1px solid rgba(37,99,235,0.2)', borderRadius: 'var(--radius-sm)', flexWrap: 'wrap' }
      },
        h('span', { style: { fontSize: 12, color: 'var(--accent)', fontWeight: 600 } }, 'MODO ADMIN · Ver como:'),
        h('select', {
          className: 'form-select sm', style: { maxWidth: 180 }, value: visao,
          onChange: e => { setVisao(e.target.value); setPagina(modulo==='visita_tecnica'?'visitas_tecnicas':'dashboard'); }
        }, PAPEIS.map(p => h('option', { key: p, value: p }, ROLE_LABELS[p]))),
        ehPreview && h('span', { style: { fontSize: 11, color: 'var(--text-muted)' } }, 'visualizando sem trocar de usuário')),
      conteudo));
}

ReactDOM.createRoot(document.getElementById('root')).render(
  h(ToastProvider,null,h(React.Fragment,null,h(App,null),h(AvisosWhatsApp,null)))
);
</script>
</body>
</html>
