  function baixarRomaneio(r){
    if(!window.jspdf)return toast('Biblioteca de PDF não carregada.','error');
    const {jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),its=itensDaRota(r.id);
    const margem=15,largura=180;
    let y=18;
    function cabecalho(pagina){
      d.setFont('helvetica','bold');logoGrespanPDF(d,15,11,9);
      d.setTextColor(30);d.setFontSize(14);d.text('ROMANEIO DE EQUIPAMENTOS',105,18,{align:'center'});
      d.setFontSize(9);d.setFont('helvetica','normal');
      d.text('Rota: '+String(r.nome||'—'),15,28);
      d.text('Data: '+fmtData(r.data_rota),150,28);
      if(pagina>1)d.text('Continuação · Página '+pagina,15,34);
      y=pagina>1?39:36;
    }
    let pagina=1;cabecalho(pagina);
    function novaPagina(){
      d.addPage();pagina++;cabecalho(pagina);
    }
    function garantir(altura){if(y+altura>282)novaPagina();}
    function listaEquipamentos(valor){
      return String(valor||'')
        .replace(/^\s*(?:ENTREGAR|COLETAR)\s*:\s*/i,'')
        .split(/\s*(?:,|;|\n|[•·])\s*/)
        .map(v=>v.trim()).filter(v=>v&&!/^(novo|usado|nova|usada)$/i.test(v));
    }
    function equipamentoEQuantidade(texto){
      let nome=String(texto||'').trim(),quantidade=1;
      // "Forno a Gás x2 (5 esteiras)" / "Freezer Vertical x3"
      const meio=nome.match(/\s+x(\d+)(?=\s*(?:\(|$))/i);
      if(meio){
        quantidade=Number(meio[1]);
        nome=nome.slice(0,meio.index)+nome.slice(meio.index+meio[0].length);
      }else{
        // "20 esteiras" / "15 assadeiras".
        const inicio=nome.match(/^(\d+)\s+(.+)$/);
        if(inicio){quantidade=Number(inicio[1]);nome=inicio[2];}
      }
      return {equipamento:nome.trim(),quantidade:Math.max(1,quantidade)};
    }
    function escreverTabela(linhas){
      const inicio=[margem,margem+30,margem+45,margem+142,margem+largura];
      const col=[30,15,97,38];
      const cab=8;
      function cabTabela(){
        garantir(cab+8);
        d.setFillColor(244,244,244);d.setDrawColor(190);d.rect(margem,y,largura,cab,'FD');
        d.setFont('helvetica','bold');d.setTextColor(35);d.setFontSize(8);
        d.text('MOVIMENTO',inicio[0]+3,y+5.2);
        d.text('QTD',inicio[1]+3,y+5.2);
        d.text('EQUIPAMENTO',inicio[2]+3,y+5.2);
        d.text('DETALHES',inicio[3]+3,y+5.2);
        for(let k=1;k<inicio.length-1;k++)d.line(inicio[k],y,inicio[k],y+cab);
        y+=cab;
      }
      cabTabela();
      linhas.forEach((linha,index)=>{
        d.setFont('helvetica','normal');d.setFontSize(8);d.setTextColor(35);
        const textos=[
          d.splitTextToSize(linha.movimento,col[0]-6),
          d.splitTextToSize(String(linha.quantidade||1),col[1]-6),
          d.splitTextToSize(linha.equipamento,col[2]-6),
          d.splitTextToSize(linha.detalhe||'—',col[3]-6)
        ];
        const altura=Math.max(9,...textos.map(t=>t.length*4+4));
        if(y+altura>282){novaPagina();cabTabela();}
        d.setDrawColor(200);d.rect(margem,y,largura,altura);
        for(let k=1;k<inicio.length-1;k++)d.line(inicio[k],y,inicio[k],y+altura);
        textos.forEach((texto,k)=>d.text(texto,inicio[k]+3,y+5));
        y+=altura;
      });
    }
    its.forEach((it,i)=>{
      const e=it.entrega||{};
      const linhas=[];
      function adicionar(movimento,valor,detalhe){
        const condicao=/^\s*(?:novo|nova|usado|usada)\s*[·,;]/i.exec(String(valor||''))?.[0].replace(/[·,;\s]/g,'').trim();
        listaEquipamentos(valor).forEach(texto=>{
          const item=equipamentoEQuantidade(texto);
          linhas.push({movimento,...item,detalhe:detalhe||(condicao?'Condição: '+condicao:'')});
        });
      }
      if(e.tipo_demanda==='troca'){
        adicionar('COLETAR',e.equipamento_coleta,e.patrimonio_coleta?'Patrimônio: '+e.patrimonio_coleta:'');
        adicionar('ENTREGAR',e.equipamento_entrega,e.patrimonio_entrega?'Patrimônio: '+e.patrimonio_entrega:'');
      }else if(e.tipo_demanda==='retirada'){
        adicionar('COLETAR',e.equipamento_coleta||e.equipamento_resumo,e.patrimonio_coleta?'Patrimônio: '+e.patrimonio_coleta:'');
      }else{
        adicionar('ENTREGAR',e.equipamento_entrega||e.equipamento_resumo,e.equipamento_condicao?'Condição: '+e.equipamento_condicao:'');
      }
      if(!linhas.length)linhas.push({movimento:'—',quantidade:1,equipamento:'Não informado',detalhe:''});
      garantir(32);
      d.setFont('helvetica','bold');d.setTextColor(30);d.setFontSize(9);
      const cliente=`${i+1}. ${(codCliente(e)?codCliente(e)+' — ':'')+nomeCliente(e)}`;
      const titulo=d.splitTextToSize(cliente,173);
      const ender=d.splitTextToSize('Endereço: '+(endereco(e)||'—'),173);
      const alturaTopo=5+titulo.length*4+ender.length*3.7;
      garantir(alturaTopo+17);
      d.text(titulo,margem+3,y+4);y+=titulo.length*4+3;
      d.setFont('helvetica','normal');d.setFontSize(8);
      d.text(ender,margem+3,y+3);y+=ender.length*3.7+5;
      escreverTabela(linhas);
      garantir(17);
      d.setFont('helvetica','normal');d.setFontSize(8);
      d.text('Recebido por: ______________________________   Assinatura: ______________________________',margem+3,y+7);
      y+=17;
    });
    d.save('Romaneio - '+String(r.nome||'Rota').replace(/[\\/:*?"<>|]/g,'-')+'.pdf');
  }

const DIAS = ['', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];


const horarioVisitaSP=new Intl.DateTimeFormat('pt-BR',{
  timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit',
  hour:'2-digit',minute:'2-digit',hourCycle:'h23'
});
const minutosVisita=hora=>{
  const [h,m]=String(hora||'00:00').split(':').map(Number);
  return h*60+m;
};
const textoHoraVisita=minutos=>String(Math.floor(minutos/60)).padStart(2,'0')+':'+String(minutos%60).padStart(2,'0');

function intervaloAgendaVisita(visita){
  const inicio=minutosVisita(visita.hora_inicio);
  const previsto=inicio+Number(visita.duracao_min||120);
  const checkout=visita.checkout_em?new Date(visita.checkout_em):null;
  if(!checkout||!Number.isFinite(checkout.getTime())){
    return {inicio,fim:Math.min(1440,previsto),rotulo:textoHoraVisita(inicio)+'–'+textoHoraVisita(previsto)};
  }
  const partes=Object.fromEntries(horarioVisitaSP.formatToParts(checkout).map(p=>[p.type,p.value]));
  const data=partes.year+'-'+partes.month+'-'+partes.day;
  const hora=partes.hour+':'+partes.minute;
  const minuto=Number(partes.hour)*60+Number(partes.minute);
  const fim=data>visita.data_visita?1440:Math.max(inicio+1,data===visita.data_visita?minuto:inicio);
  const diaDoCheckout=data!==visita.data_visita?' ('+partes.day+'/'+partes.month+')':'';
  return {inicio,fim,rotulo:textoHoraVisita(inicio)+'–'+hora+diaDoCheckout};
}

function posicionarAtendimentos(blocos){
  let grupo=[],fins=[];
  const fecharGrupo=()=>grupo.forEach(bloco=>{bloco.colunas=fins.length;});
  for(const bloco of blocos){
    if(!bloco.visita)continue;
    if(fins.every(fim=>fim<=bloco.inicio)){
      fecharGrupo();grupo=[];fins=[];
    }
    const livre=fins.findIndex(fim=>fim<=bloco.inicio);
    bloco.coluna=livre<0?fins.length:livre;
    fins[bloco.coluna]=bloco.fim;
    grupo.push(bloco);
  }
  fecharGrupo();
}

async function localizacaoAtual(){
  if(!navigator.geolocation)throw Error('GPS indisponível.');
  return new Promise((ok,fail)=>navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,precisao:p.coords.accuracy}),e=>fail(Error(e.code===1?'Localização bloqueada. Nas permissões deste site no navegador ou do aplicativo no celular, altere Localização para Permitir e tente novamente.':'Não foi possível obter a localização. Confira se o GPS está ativo e tente novamente.')),{enableHighAccuracy:true,maximumAge:0,timeout:20000}));
}

async function listarClientesVisitaAdmin({cidade,uf},pagina,tamanhoPagina){
  const normalizar=texto=>texto.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const municipio=normalizar(cidade);
  const filtro=municipio.replaceAll('\\','\\\\').replaceAll('%','\\%').replaceAll('_','\\_').replace(/[aeiouc]/g,'_');
  const inicio=pagina*tamanhoPagina;
  const limite=inicio+tamanhoPagina+1;
  const encontrados=[];
  const lote=200;
  for(let offset=0;encontrados.length<limite;offset+=lote){
    const {data,error}=await sb.from('clientes')
      .select('id,codigo_totvs,razao_social,nome_fantasia,cidade,estado,endereco_logradouro,endereco_numero,endereco_bairro,endereco_cep,endereco_latitude,endereco_longitude')
      .ilike('estado',uf).ilike('cidade',filtro)
      .order('nome_fantasia').order('razao_social').order('id').range(offset,offset+lote-1);
    if(error)throw error;
    encontrados.push(...data.filter(c=>normalizar(c.cidade||'')===municipio));
    if(data.length<lote)break;
  }
  return encontrados.slice(inicio,limite);
}

async function listarHistoricoVisitaAdmin(clienteId,pagina,tamanhoPagina){
  const hoje=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo'}).format(new Date());
  const inicio=pagina*tamanhoPagina;
  const {data,error}=await sb.from('visitas_tecnicas')
    .select('id,data_visita,hora_inicio,checkin_em,checkout_em,status,tipo_atendimento,tecnico_id,objetivo,relatorio_qualidade')
    .eq('cliente_id',clienteId).neq('status','cancelada')
    .or('checkout_em.not.is.null,status.eq.concluida,and(checkin_em.not.is.null,data_visita.lt.'+hoje+')')
    .order('data_visita',{ascending:false}).order('hora_inicio',{ascending:false}).order('id',{ascending:false})
    .range(inicio,inicio+tamanhoPagina);
  if(error)throw error;
  const ids=[...new Set(data.map(v=>v.tecnico_id).filter(Boolean))];
  if(!ids.length)return data.map(v=>({...v,relato_execucao:v.relatorio_qualidade}));
  const profissionais=await sb.from('usuarios').select('id,nome').in('id',ids);
  if(profissionais.error)throw profissionais.error;
  const nomes=new Map(profissionais.data.map(u=>[u.id,u.nome]));
  return data.map(v=>({...v,tecnico_nome:nomes.get(v.tecnico_id),relato_execucao:v.relatorio_qualidade}));
}

const FAIXAS_CONSUMO={
  maior:{cor:'#167744',rotulo:'Maiores consumos'},
  medio:{cor:'#e8ad17',rotulo:'Médios consumos'},
  menor:{cor:'#c82b24',rotulo:'Menores consumos'},
  sem_dados:{cor:'#697586',rotulo:'Sem dados suficientes'}
};
const nomeClienteVisita=c=>[c.codigo_totvs,c.razao_social||c.nome_fantasia].filter(Boolean).join(' — ');
function classificarConsumo(itens){
  const volumes=[...new Set(itens.map(c=>c.media_kg).filter(v=>v!=null).map(Number))].sort((a,b)=>b-a);
  const faixas=new Map(volumes.map((v,i)=>[
    v,i===0?'maior':i===volumes.length-1?'menor':
      ['maior','medio','menor'][Math.floor(i*3/volumes.length)]
  ]));
  return itens.map(c=>({...c,faixa:c.media_kg==null?'sem_dados':faixas.get(Number(c.media_kg))}));
}
function pontoCliente(c){
  if(c.endereco_latitude==null||c.endereco_longitude==null)return null;
  const lat=Number(c.endereco_latitude),lon=Number(c.endereco_longitude);
  return Number.isFinite(lat)&&Number.isFinite(lon)&&(lat!==0||lon!==0)&&Math.abs(lat)<=90&&Math.abs(lon)<=180?[lat,lon]:null;
}
const ESTADOS_GEOCODIFICACAO={
  AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',
  ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',
  MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',
  RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',
  SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'
};
const CAMPOS_ENDERECO_MAPA=['endereco_logradouro','endereco_numero','endereco_bairro','cidade','estado','endereco_cep'];
function enderecoParaGeocodificar(cliente){
  const rua=String(cliente.endereco_logradouro||'').trim();
  const numero=String(cliente.endereco_numero||'').trim();
  const cidade=String(cliente.cidade||'').trim();
  const uf=String(cliente.estado||'').trim().toUpperCase();
  const cep=String(cliente.endereco_cep||'').replace(/\D/g,'');
  if(!rua||!/^\d+\s*[a-z]?$/i.test(numero)||!cidade||!ESTADOS_GEOCODIFICACAO[uf])return null;
  const bairro=String(cliente.endereco_bairro||'').trim();
  return {rua,numero,cidade,uf,cep,
    consulta:[rua+' '+numero,bairro,cidade,ESTADOS_GEOCODIFICACAO[uf],cep.length===8?cep:'','Brasil'].filter(Boolean).join(', ')};
}
const normalizarLocalizacao=valor=>String(valor??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const normalizarLogradouro=valor=>normalizarLocalizacao(valor)
  .replace(/^r /,'rua ').replace(/^av /,'avenida ').replace(/^rod /,'rodovia ')
  .replace(/^trav /,'travessa ').replace(/^al /,'alameda ').replace(/^pc /,'praca ');
const normalizarNumeroEndereco=valor=>normalizarLocalizacao(valor).replace(/\s/g,'').replace(/^0+(?=\d)/,'');

function validarPontoDoEndereco(endereco,resultado){
  if(!resultado||resultado.country_code!=='br'||resultado.result_type!=='building')return null;
  const estado=String(resultado.state_code||'').toUpperCase().replace(/^BR-/,'');
  if(estado?estado!==endereco.uf:normalizarLocalizacao(resultado.state)!==normalizarLocalizacao(ESTADOS_GEOCODIFICACAO[endereco.uf]))return null;
  const cidade=[resultado.city,resultado.town,resultado.village,resultado.municipality,resultado.county];
  if(!cidade.some(c=>normalizarLocalizacao(c)===normalizarLocalizacao(endereco.cidade)))return null;
  if(normalizarLogradouro(resultado.street)!==normalizarLogradouro(endereco.rua)||
      normalizarNumeroEndereco(resultado.housenumber)!==normalizarNumeroEndereco(endereco.numero))return null;
  const cep=String(resultado.postcode||'').replace(/\D/g,'');
  if(endereco.cep.length===8&&cep.length===8&&endereco.cep!==cep)return null;
  const local={endereco_latitude:resultado.lat,endereco_longitude:resultado.lon};
  const coordenadas=pontoCliente(local);
  return coordenadas?{endereco_latitude:coordenadas[0],endereco_longitude:coordenadas[1]}:null;
}
async function consultarEnderecoGeoapify(chave,endereco,sinal){
  const url=new URL('https://api.geoapify.com/v1/geocode/search');
  url.search=new URLSearchParams({
    apiKey:chave,text:endereco,filter:'countrycode:br',lang:'pt',format:'json',limit:'5'
  });
  let resposta;
  try{
    resposta=await fetch(url,{signal:AbortSignal.any([sinal,AbortSignal.timeout(12000)])});
  }catch{
    throw Error('Não foi possível conectar à Geoapify. Confira a conexão e tente novamente.');
  }
  if(resposta.status===401||resposta.status===403)
    return {chaveInvalida:true,erro:'Chave Geoapify inválida ou sem permissão para este site.'};
  if(resposta.status===429)
    return {erro:'Limite de consultas da Geoapify atingido. Confira o limite disponível no seu projeto.'};
  if(!resposta.ok)throw Error('A Geoapify não concluiu a consulta ('+resposta.status+').');
  const {results}=await resposta.json();
  if(!Array.isArray(results))throw Error('A Geoapify retornou um resultado inesperado.');
  return {candidatos:results};
}

async function gravarPontoDoCliente(cliente,coordenadas,sinal){
  let update=sb.from('clientes').update(coordenadas).eq('id',cliente.id);
  for(const campo of [...CAMPOS_ENDERECO_MAPA,'endereco_latitude','endereco_longitude']){
    update=cliente[campo]==null?update.is(campo,null):update.eq(campo,cliente[campo]);
  }
  const {data,error}=await update.select('id').abortSignal(sinal);
  if(error)throw error;
  return Boolean(data?.length);
}

function LocalizadorClientesMapa({registros,aoEncontrar,chaveSessao}){
  const campoChave=useRef(null);
  const operacao=useRef(null);
  const [estado,setEstado]=useState({progresso:'',erro:''});
  const pendentes=registros.filter(c=>!pontoCliente(c));
  const localizaveis=pendentes.map(cliente=>({cliente,endereco:enderecoParaGeocodificar(cliente)})).filter(x=>x.endereco);
  useEffect(()=>()=>operacao.current?.abort(),[]);

  async function localizar(evento){
    evento.preventDefault();
    const chave=campoChave.current?.value.trim()||chaveSessao.current;
    if(!chave||operacao.current||!localizaveis.length)return;
    campoChave.current.value='';
    chaveSessao.current=chave;
    const controlador=new AbortController();
    operacao.current=controlador;
    const sinal=controlador.signal;
    const grupos=new Map();
    for(const registro of localizaveis){
      const consulta=registro.endereco.consulta;
      if(!grupos.has(consulta))grupos.set(consulta,[]);
      grupos.get(consulta).push(registro);
    }
    const consultas=[...grupos.keys()];
    let encontrados=0,semResultado=0,semGravar=0,semConsulta=0,verificados=0;
    const espera=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    const mensagemProgresso=()=>verificados+' de '+consultas.length+' endereços verificados · '+encontrados+' cliente(s) localizado(s).';
    const resumo=()=>encontrados+' localizado(s) · '+semResultado+' sem correspondência exata · '+semGravar+' sem gravação · '+semConsulta+' sem resposta.';
    setEstado({progresso:mensagemProgresso(),erro:''});

    async function localizarEndereco(consulta,indice){
      if(indice)await espera(indice*350);
      sinal.throwIfAborted();
      const resposta=await consultarEnderecoGeoapify(chave,consulta,sinal);
      if(resposta.erro)return resposta;
      const novosPontos=new Map();
      for(const {cliente,endereco} of grupos.get(consulta)){
        sinal.throwIfAborted();
        const ponto=resposta.candidatos.map(c=>validarPontoDoEndereco(endereco,c)).find(Boolean);
        if(!ponto){semResultado++;continue;}
        try{
          if(await gravarPontoDoCliente(cliente,ponto,sinal)){
            novosPontos.set(cliente.id,ponto);
            encontrados++;
          }else semGravar++;
        }catch{semGravar++;}
      }
      return {novosPontos};
    }
    try{
      for(let i=0;i<consultas.length;i+=3){
        const lote=consultas.slice(i,i+3);
        const [retornos]=await Promise.all([
          Promise.allSettled(lote.map(localizarEndereco)),
          i+3<consultas.length?espera(1050):Promise.resolve()
        ]);
        if(sinal.aborted)return;
        const novosPontos=new Map();
        let falhaFatal=null;
        for(const retorno of retornos){
          if(retorno.status==='rejected'){semConsulta++;continue;}
          if(retorno.value.erro){semConsulta++;falhaFatal=retorno.value;continue;}
          retorno.value.novosPontos.forEach((ponto,id)=>novosPontos.set(id,ponto));
        }
        verificados+=lote.length;
        if(novosPontos.size)aoEncontrar(novosPontos);
        if(falhaFatal){
          if(falhaFatal.chaveInvalida)chaveSessao.current=null;
          throw Error(falhaFatal.erro);
        }
        if(i===0&&retornos.every(r=>r.status==='rejected'))throw retornos[0].reason;
        setEstado({progresso:mensagemProgresso(),erro:''});
      }
      if(!sinal.aborted)setEstado({progresso:'',resultado:resumo(),erro:''});
    }catch(e){
      if(!sinal.aborted)setEstado({progresso:'',resultado:resumo(),erro:e.message});
    }finally{operacao.current=null;}
  }

  if(!pendentes.length&&!estado.resultado)return null;
  return h('div',{style:{marginTop:12}},
    pendentes.length>0&&h('p',null,localizaveis.length+' de '+pendentes.length+' cliente(s) sem pin têm endereço com número para consultar.'),
    localizaveis.length>0&&h('form',{onSubmit:localizar},
      h('p',null,'A localização envia apenas os endereços do município à ',
        h('a',{href:'https://www.geoapify.com/geocoding-api/',target:'_blank',rel:'noopener noreferrer'},'Geoapify'),
        '. Mantenha o mapa aberto até concluir.'),
      h('div',{style:{display:'flex',gap:8,alignItems:'end',flexWrap:'wrap'}},
        h(Campo,{label:'Chave Geoapify'},h('input',{ref:campoChave,type:'password',autoComplete:'off',
          className:'form-input',required:!chaveSessao.current,placeholder:chaveSessao.current?'Chave desta sessão':'',disabled:!!estado.progresso})),
        h('button',{className:'btn btn-secondary',type:'submit',disabled:!!estado.progresso},'Localizar clientes pelo endereço'))),
    estado.progresso&&h('p',{role:'status'},estado.progresso),
    estado.resultado&&h('p',{role:'status'},estado.resultado),
    estado.erro&&h('p',{role:'alert'},estado.erro));
}

async function consultarClientesVisita(valores,pagina,administrador){
  if(administrador)return listarClientesVisitaAdmin(valores,pagina,50);
  const {data,error}=await sb.rpc('vt_clientes_por_cidade',{p_cidade:valores.cidade.trim(),p_uf:valores.uf,p_pagina:pagina});
  if(error)throw error;
  return data||[];
}

async function buscarCentroCidadeVisita(cidade,uf,signal){
  const consulta=[cidade,uf,'Brasil'].filter(Boolean).join(', ');
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&q='+encodeURIComponent(consulta);
  const resp=await fetch(url,{headers:{'Accept':'application/json'},signal});
  if(!resp.ok)throw Error('Serviço de localização de cidades indisponível. Tente novamente.');
  const [resultado]=await resp.json();
  const latitude=Number(resultado?.lat),longitude=Number(resultado?.lon);
  if(!Number.isFinite(latitude)||!Number.isFinite(longitude))
    throw Error('Não foi possível localizar a cidade '+consulta+'. Verifique cidade e estado.');
  return {latitude,longitude};
}

function MapaClientesVisita({consulta,centroGPS,administrador,chaveSessao,aoAbrirHistorico,aoNavegar,aoAbrirConsumo}){
  const [registros,setRegistros]=useState(null);
  const [erro,setErro]=useState('');
  const [aviso,setAviso]=useState('');
  const [erroVisual,setErroVisual]=useState('');
  const [semTiles,setSemTiles]=useState(false);
  const [centroMunicipio,setCentroMunicipio]=useState(null);
  const mapaRef=useRef(null);
  const mapaAtivo=useRef(null);
  const acoes=useRef(null);
  acoes.current={aoAbrirHistorico,aoNavegar,aoAbrirConsumo};
  useEffect(()=>{
    if(!consulta)return;
    let ativo=true;
    async function carregarMapa(){
      try{
        const clientes=new Map();
        if(administrador){
          const todos=await listarClientesVisitaAdmin(consulta,0,100000);
          todos.forEach(c=>clientes.set(c.id,c));
        }else{
          for(let pagina=0;ativo;pagina++){
            const lote=await consultarClientesVisita(consulta,pagina,false);
            lote.slice(0,50).forEach(c=>clientes.set(c.id,c));
            if(lote.length<=50)break;
          }
        }
        if(!ativo)return;
        const ids=[...clientes.keys()],consumo=new Map();
        setRegistros(classificarConsumo([...clientes.values()]));
        try{
          for(let i=0;i<ids.length&&ativo;i+=100){
            const {data,error}=await sb.rpc('vt_consumo_clientes',{p_clientes:ids.slice(i,i+100)});
            if(error)throw error;
            (data||[]).forEach(c=>consumo.set(c.cliente_id,c));
          }
        }catch{
          consumo.clear();
          if(ativo)setAviso('Consumo indisponível. Os clientes continuam visíveis no mapa.');
        }
        if(ativo)setRegistros(atuais=>classificarConsumo(atuais.map(c=>({...c,...consumo.get(c.id)}))));
      }catch(e){if(ativo)setErro(e.message||'Não foi possível carregar os clientes.');}
    }
    carregarMapa();
    return ()=>{ativo=false;};
  },[consulta,administrador]);

  const pontos=useMemo(()=>(registros||[]).filter(pontoCliente),[registros]);
  useEffect(()=>{
    if(!mapaRef.current||!window.L)return;
    try{
      const L=window.L,mapa=L.map(mapaRef.current);
      mapaAtivo.current=mapa;
      mapa.setView([-14.2,-51.9],4);
      let carregouFundo=false;
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
        maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).on('tileload',()=>{carregouFundo=true;setSemTiles(false);})
        .on('tileerror',()=>{if(!carregouFundo)setSemTiles(true);}).addTo(mapa);
    }catch{
      mapaAtivo.current?.remove();
      mapaAtivo.current=null;
      setErroVisual('Não foi possível inicializar o mapa. Recolha e abra novamente.');
    }
    return ()=>{mapaAtivo.current?.remove();mapaAtivo.current=null;};
  },[]);

  const precisaCentro=Boolean(consulta&&registros&&!pontos.length&&!consulta.centro);
  useEffect(()=>{
    if(!precisaCentro)return;
    const controlador=new AbortController();
    const timeout=setTimeout(()=>controlador.abort(),8000);
    buscarCentroCidadeVisita(consulta.cidade,consulta.uf,controlador.signal)
      .then(ponto=>{if(!controlador.signal.aborted)setCentroMunicipio([ponto.latitude,ponto.longitude]);})
      .catch(()=>{})
      .finally(()=>clearTimeout(timeout));
    return ()=>{clearTimeout(timeout);controlador.abort();};
  },[precisaCentro,consulta]);

  useEffect(()=>{
    const mapa=mapaAtivo.current;
    if(!mapa||pontos.length)return;
    const centro=consulta?(consulta.centro||centroMunicipio):centroGPS;
    if(centro)mapa.setView(centro,12);
  },[consulta,centroMunicipio,centroGPS,pontos.length]);

  useEffect(()=>{
    const mapa=mapaAtivo.current;
    if(!pontos.length||!mapa)return;
    const L=window.L,marcadores=[];
    const grupos=new Map();
    for(const c of pontos){
      const chave=pontoCliente(c).join(',');
      if(!grupos.has(chave))grupos.set(chave,[]);
      grupos.get(chave).push(c);
    }
    for(const grupo of grupos.values()){
      const popup=document.createElement('div');
      const icones=L.divIcon({className:'',iconSize:[25,32],iconAnchor:[12,29],popupAnchor:[0,-26],
        html:'<div style="width:23px;height:23px;margin-top:2px;transform:rotate(-45deg);border-radius:50% 50% 50% 0;border:2px solid white;box-shadow:0 1px 4px #333;background:'+FAIXAS_CONSUMO[grupo[0].faixa].cor+'"></div>'});
      for(const c of grupo){
        const bloco=document.createElement('section'),nome=document.createElement('strong'),detalhe=document.createElement('div');
        nome.textContent=nomeClienteVisita(c)+(c.nome_fantasia&&c.razao_social!==c.nome_fantasia?' · '+c.nome_fantasia:'');
        detalhe.textContent=c.media_kg==null?FAIXAS_CONSUMO[c.faixa].rotulo:formatoConsumo.format(c.media_kg)+' kg vendidos/mês';
        detalhe.style.color=FAIXAS_CONSUMO[c.faixa].cor;
        bloco.style.padding='5px 0';
        bloco.append(nome,detalhe);
        for(const [rotulo,metodo] of [['Ir até o cliente','aoNavegar'],['Histórico de Visita','aoAbrirHistorico'],['Consumo por SKU','aoAbrirConsumo']]){
          const botao=document.createElement('button');
          botao.type='button';botao.className='btn btn-secondary btn-sm';botao.textContent=rotulo;
          botao.style.margin='5px 4px 0 0';
          botao.onclick=()=>acoes.current[metodo](c);
          bloco.append(botao);
        }
        popup.append(bloco);
      }
      const marcador=L.marker(pontoCliente(grupo[0]),{icon:icones,title:grupo.map(nomeClienteVisita).join(' · ')})
        .addTo(mapa).bindPopup(popup,{maxHeight:280});
      marcadores.push(marcador);
    }
    mapa.fitBounds(L.latLngBounds(pontos.map(pontoCliente)),{padding:[25,25],maxZoom:15});
    return ()=>marcadores.forEach(marcador=>marcador.remove());
  },[pontos]);
  const semPonto=registros?registros.length-pontos.length:0;
  const meses=registros?.find(c=>c.meses!=null)?.meses;
  return h('div',{style:{marginTop:12}},
    erro&&h('p',{role:'alert'},erro),
    consulta&&!erro&&!registros&&h('p',{role:'status'},'Carregando clientes do município…'),
    aviso&&h('p',{role:'status'},aviso),
    registros&&h('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px 14px',marginBottom:8}},
      Object.values(FAIXAS_CONSUMO).map(f=>h('span',{key:f.rotulo,style:{fontSize:12}},
        h('span',{'aria-hidden':true,style:{display:'inline-block',width:10,height:10,marginRight:5,borderRadius:'50%',background:f.cor}}),f.rotulo))),
    meses>0&&h('p',{style:{fontSize:12}},'Média de kg vendidos por mês · '+meses+' de 10 meses importados.'),
    semPonto>0&&h('p',{style:{fontSize:12}},semPonto+' cliente(s) sem coordenadas cadastradas. Consulte-os na lista abaixo.'),
    registros&&!pontos.length&&h('p',null,'Nenhum cliente com coordenadas cadastradas neste município.'),
    erroVisual&&h('p',{role:'alert'},erroVisual),
    semTiles&&h('p',{role:'status'},'O fundo do mapa está indisponível. Os pontos cadastrados e a lista de clientes continuam acessíveis.'),
    window.L?h('div',{ref:mapaRef,'aria-label':'Mapa de clientes do município',style:{height:380,borderRadius:8,border:'1px solid var(--border)',position:'relative',zIndex:0}})
      :h('p',{role:'alert'},'Mapa indisponível. Recarregue a página para tentar novamente.'),
    registros&&administrador&&h(LocalizadorClientesMapa,{registros,chaveSessao,
      aoEncontrar:pontos=>setRegistros(atuais=>atuais.map(c=>pontos.has(c.id)?{...c,...pontos.get(c.id)}:c))}),
    h('div',{style:{fontSize:11,marginTop:4}},'Localização de endereços por ',
      h('a',{href:'https://www.geoapify.com/',target:'_blank',rel:'noopener noreferrer'},'Geoapify')));
}

function ClientesVisitaTecnica({profile,visao}){
  const toast=useToast();
  const administrador=profile.papel==='admin';
  const ufs='AC AL AP AM BA CE DF ES GO MA MT MS MG PA PB PR PE PI RJ RN RS RO RR SC SP SE TO'.split(' ');
  const tamanhoPagina=50;
  const [filtro,setFiltro]=useState({cidade:'',uf:''});
  const [consulta,setConsulta]=useState(null);
  const [lista,setLista]=useState([]);
  const [pagina,setPagina]=useState(0);
  const [temMais,setTemMais]=useState(false);
  const [ocupado,setOcupado]=useState(false);
  const [erro,setErro]=useState('');
  const [cliente,setCliente]=useState(null);
  const [historico,setHistorico]=useState({itens:[],pagina:0,temMais:false,carregando:false,erro:''});
  const cacheMunicipios=useRef(new Map());
  const [mapaAberto,setMapaAberto]=useState(false);
  const [centroGPS,setCentroGPS]=useState(null);
  const chaveGeocodificacao=useRef(null);
  const [consumo,setConsumo]=useState(null);
  const consultaConsumo=useRef(0);

  async function abrirConsumo(c){
    const atual=++consultaConsumo.current;
    setConsumo({cliente:c,itens:null});
    try{
      const {data,error}=await sb.rpc('vt_consumo_cliente_sku',{p_cliente:c.id});
      if(error)throw error;
      if(atual===consultaConsumo.current)setConsumo({cliente:c,itens:data||[]});
    }catch(e){
      if(atual===consultaConsumo.current)setConsumo({cliente:c,erro:e.message||'Não foi possível consultar o consumo.'});
    }
  }
  function fecharConsumo(){consultaConsumo.current++;setConsumo(null);}
  const abrirRota=c=>navegarVisita({clientes:c},toast);

  async function carregarClientes(valores,proxima=0){
    const cidade=valores.cidade.trim();
    if(cidade.length<2)throw Error('Informe o município.');
    const itens=await consultarClientesVisita(valores,proxima,administrador);
    if(!proxima)setConsulta(valores);
    setPagina(proxima);setTemMais(itens.length>tamanhoPagina);
    setLista(atual=>proxima?[...atual,...itens.slice(0,tamanhoPagina)]:itens.slice(0,tamanhoPagina));
  }

  async function buscar(valores,proxima=0){
    setOcupado(true);setErro('');
    try{await carregarClientes(valores,proxima);}
    catch(e){setErro(e.message||'Não foi possível consultar os clientes.');}
    finally{setOcupado(false);}
  }

  async function buscarPeloGPS(){
    setOcupado(true);setErro('');
    try{
      const gps=await localizacaoAtual();
      const ponto={lat:gps.lat.toFixed(2),lon:gps.lng.toFixed(2)};
      const centro=[Number(ponto.lat),Number(ponto.lon)];
      setCentroGPS(centro);
      const chave=ponto.lat+','+ponto.lon;
      let municipio=cacheMunicipios.current.get(chave);
      if(!municipio){
        const parametros=new URLSearchParams({format:'jsonv2',zoom:'10',layer:'address',...ponto});
        const resposta=await fetch('https://nominatim.openstreetmap.org/reverse?'+parametros,{signal:AbortSignal.timeout(8000)});
        if(!resposta.ok)throw Error('Não foi possível identificar o município pelo GPS. Use a busca por cidade.');
        const {address}=await resposta.json();
        const cidade=address?.city||address?.town||address?.municipality||address?.village;
        const uf=/^BR-([A-Z]{2})$/.exec(address?.['ISO3166-2-lvl4']||'')?.[1];
        if(!cidade||!ufs.includes(uf))throw Error('Município ou UF indisponível pelo GPS. Use a busca por cidade.');
        municipio={cidade,uf};
        cacheMunicipios.current.set(chave,municipio);
      }
      setFiltro(municipio);
      await carregarClientes({...municipio,centro});
    }catch(e){setErro(e.message||'Não foi possível localizar o município.');}
    finally{setOcupado(false);}
  }

  async function carregarHistorico(c,proxima=0){
    setCliente(c);
    setHistorico(atual=>({...atual,itens:proxima?atual.itens:[],carregando:true,erro:''}));
    try{
      const resposta=administrador?{data:await listarHistoricoVisitaAdmin(c.id,proxima,tamanhoPagina)}
        :await sb.rpc('vt_historico_visitas_cliente',{p_cliente:c.id,p_pagina:proxima});
      if(resposta.error)throw resposta.error;
      const itens=resposta.data||[];
      setHistorico(atual=>({
        itens:[...(proxima?atual.itens:[]),...itens.slice(0,tamanhoPagina)],pagina:proxima,
        temMais:itens.length>tamanhoPagina,carregando:false,erro:''
      }));
    }catch(e){
      setHistorico(atual=>({...atual,carregando:false,erro:e.message||'Não foi possível consultar o histórico.'}));
    }
  }

  const nomeCliente=nomeClienteVisita;
  const horaRegistro=valor=>valor?horarioVisitaSP.format(new Date(valor)):'—';
  const fechado=()=>{if(!historico.carregando)setCliente(null);};

  if(!podeConsultarClientesVisita(visao,profile.papel))return h('div',{className:'card'},'Acesso não autorizado.');
  return h(React.Fragment,null,
    h('div',{className:'page-head'},h('div',{className:'page-title'},'Clientes')),
    h('div',{className:'card'},
      h('h3',null,'Clientes por município'),
      h('button',{className:'btn btn-primary',disabled:ocupado,onClick:buscarPeloGPS},'Usar minha localização'),
      h('div',{style:{fontSize:12,marginTop:6,color:'var(--muted)'}},
        'A localização aproximada é consultada no ',
        h('a',{href:'https://www.openstreetmap.org/copyright',target:'_blank',rel:'noopener noreferrer'},'OpenStreetMap'),
        ' para identificar o município.'),
      h('form',{style:{marginTop:12,display:'flex',gap:10,alignItems:'end',flexWrap:'wrap'},
        onSubmit:e=>{e.preventDefault();if(!ocupado)buscar(filtro);}},
        h(Campo,{label:'Município'},h('input',{className:'form-input',value:filtro.cidade,required:true,minLength:2,maxLength:120,
          disabled:ocupado,onChange:e=>setFiltro({...filtro,cidade:e.target.value})})),
        h(Campo,{label:'UF'},h('select',{className:'form-select',value:filtro.uf,required:true,disabled:ocupado,
          onChange:e=>setFiltro({...filtro,uf:e.target.value})},h('option',{value:''},'Selecione'),
          ufs.map(uf=>h('option',{key:uf,value:uf},uf)))),
        h('button',{className:'btn btn-secondary',type:'submit',disabled:ocupado},'Buscar clientes')),
      ocupado&&h('p',{role:'status'},'Buscando clientes…'),
      erro&&h('p',{role:'alert'},erro),
      consulta&&h('h4',null,consulta.cidade+' — '+consulta.uf),
      h('button',{className:'btn btn-secondary',type:'button','aria-expanded':mapaAberto,
        onClick:()=>{
          setMapaAberto(!mapaAberto);
          if(!mapaAberto&&!consulta&&!ocupado){
            if(filtro.cidade.trim().length>=2&&filtro.uf)buscar(filtro);
            else buscarPeloGPS();
          }
        }},mapaAberto?'Recolher mapa':'Abrir mapa'),
      mapaAberto&&!consulta&&!ocupado&&h('p',{style:{fontSize:12}},'Informe município e UF para carregar os clientes.'),
      mapaAberto&&h(MapaClientesVisita,{key:consulta?consulta.cidade+'|'+consulta.uf+'|'+Boolean(consulta.centro):'sem-municipio',
        consulta,centroGPS,administrador,chaveSessao:chaveGeocodificacao,
        aoAbrirHistorico:carregarHistorico,aoNavegar:abrirRota,aoAbrirConsumo:abrirConsumo}),
      consulta&&!ocupado&&!erro&&!lista.length&&h('p',null,administrador?'Nenhum cliente neste município.':'Nenhum cliente da carteira neste município.'),
      lista.map(c=>{
        const temEndereco=Boolean(c.endereco_logradouro?.trim()||(c.endereco_latitude!=null&&c.endereco_longitude!=null));
        return h('div',{key:c.id,style:{borderTop:'1px solid var(--border)',padding:'10px 0',display:'flex',gap:10,flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}},
          h('div',null,h('b',null,nomeCliente(c)),
            c.nome_fantasia&&c.nome_fantasia!==c.razao_social&&h('div',null,c.nome_fantasia),
            h('div',{style:{fontSize:12}},temEndereco?(c.endereco_logradouro?.trim()?enderecoVisita({clientes:c}):'Localização cadastrada'):'Endereço não cadastrado')),
          h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
            h('button',{className:'btn btn-secondary btn-sm',onClick:()=>carregarHistorico(c)},'Histórico de Visita'),
            h('button',{className:'btn btn-secondary btn-sm',disabled:!temEndereco,onClick:()=>abrirRota(c)},'Ir até o cliente'),
            h('button',{className:'btn btn-secondary btn-sm',onClick:()=>abrirConsumo(c)},'Consumo por SKU')));
      }),
      temMais&&h('button',{className:'btn btn-secondary',disabled:ocupado,onClick:()=>buscar(consulta,pagina+1)},'Carregar mais clientes')),
    consumo&&h(Modal,{titulo:'Consumo médio mensal por SKU',sub:nomeCliente(consumo.cliente),largo:true,onClose:fecharConsumo,
      acoes:h('button',{className:'btn btn-secondary',onClick:fecharConsumo},'Fechar')},
      consumo.erro?h('p',{role:'alert'},consumo.erro):
        !consumo.itens?h('p',{role:'status'},'Consultando consumo…'):
        !consumo.itens.length?h('p',null,'Nenhum consumo importado para este cliente.'):
        h(React.Fragment,null,h('p',null,consumo.itens[0].meses+' de 10 meses importados · jan–out/2026'),
          h('div',{className:'table-wrap'},
            h('table',null,h('thead',null,h('tr',null,['SKU','Produto','Unidade','Venda/mês','Bonificação/mês'].map(t=>h('th',{key:t},t)))),

    if(!palavras.length){setClientes([]);setBuscandoClientes(false);return;}

    // da RLS de listagem da tela comercial. Banco calcula a carteira.
    const {data,error}=await sb.rpc('vt_buscar_clientes',{p_busca:termo,p_limite:100});
    if(seq!==buscaClienteSeq.current)return;
    setBuscandoClientes(false);
    if(error){setClientes([]);setErroBuscaClientes('Busca indisponível: '+error.message+'. Execute o SQL vt_busca_clientes_rls no Supabase.');return;}
    setClientes(data||[]);

  async function prepararFotosCheckout(fotos){
    const imagens=[];
    for(const foto of fotos){
      const imagem=new Image();
      imagem.src=foto.dados;
      try{await imagem.decode();}
      catch{throw Error('Não foi possível abrir a foto '+foto.nome+'. Remova esse anexo e selecione a imagem novamente.');}
      const canvas=document.createElement('canvas');
      const proporcao=Math.min(1,1280/Math.max(imagem.naturalWidth,imagem.naturalHeight));
      canvas.width=Math.max(1,Math.round(imagem.naturalWidth*proporcao));
      canvas.height=Math.max(1,Math.round(imagem.naturalHeight*proporcao));
      const contexto=canvas.getContext('2d',{alpha:false});
      contexto.fillStyle='#fff';
      contexto.fillRect(0,0,canvas.width,canvas.height);
      contexto.drawImage(imagem,0,0,canvas.width,canvas.height);
      let dados=canvas.toDataURL('image/jpeg',0.78);
      if(dados.length>350000)dados=canvas.toDataURL('image/jpeg',0.60);
      if(dados.length>350000){
        canvas.width=Math.max(1,Math.round(canvas.width*0.65));
        canvas.height=Math.max(1,Math.round(canvas.height*0.65));
        contexto.fillStyle='#fff';
        contexto.fillRect(0,0,canvas.width,canvas.height);
        contexto.drawImage(imagem,0,0,canvas.width,canvas.height);
        dados=canvas.toDataURL('image/jpeg',0.58);
      }
      if(!dados.startsWith('data:image/jpeg;base64,')||dados.length>350000)
        throw Error('Não foi possível reduzir a foto '+foto.nome+'. Selecione uma versão menor.');
      imagens.push({nome:foto.nome,dados});
    }
    return imagens;
  }

        h(Campo,{label:'Tipo de atendimento'},h('select',{className:'form-select',value:tipoAtendimento,onChange:e=>setTipoAtendimento(e.target.value)},h('option',{value:'producao'},'Produção'),h('option',{value:'treinamento'},'Treinamento'))),

          h('label',null,h('input',{type:'checkbox',checked:repetirVisitas,onChange:e=>setRepetirVisitas(e.target.checked)}),' Replicar a tarefa por período'),

              (!clienteNoTerritorio(c)?' · FORA DA CARTEIRA'+(!excecao?' (exige exceção)':''):'')))),
          h(IdentificacaoCliente,{cliente:clientes.find(c=>c.id===form.cliente_id)||enderecoAgendamento}),

            h('div',{style:{marginTop:8}},h('a',{className:'btn btn-secondary btn-sm',target:'_blank',rel:'noopener noreferrer',href:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([enderecoAgendamento.endereco_logradouro,enderecoAgendamento.endereco_numero,enderecoAgendamento.cidade,enderecoAgendamento.estado].filter(Boolean).join(', '))},'Abrir no Google Maps')))

function PaginaRotas({ profile, visao }) {
  const toast = useToast();
  const [rotas, setRotas] = useState(null);
  const [paginaRotas, setPaginaRotas] = useState(0);
  const TAM_PAGINA_ROTAS = 15;
  const [clientesCarregadosRotas, setClientesCarregadosRotas] = useState(false);
  const [mostrarInativas, setMostrarInativas] = useState(false);
  const [alterandoStatusRota, setAlterandoStatusRota] = useState(null);
  const [clientes, setClientes] = useState([]);
  const [usuariosComerciais,setUsuariosComerciais]=useState([]);
  const [carteirasAdm,setCarteirasAdm]=useState([]);
  const [exportandoRotas,setExportandoRotas]=useState(false);
  const [modalNova, setModalNova] = useState(false);
  const [novaRota, setNovaRota] = useState({ nome: '', dia_semana: '' });
  const [modalClientes, setModalClientes] = useState(null); // rota selecionada
  const [vinculados, setVinculados] = useState([]);
  const [clienteAdd, setClienteAdd] = useState('');
  const [buscaCodigoRota, setBuscaCodigoRota] = useState('');
  const [buscandoCodigoRota, setBuscandoCodigoRota] = useState(false);

  useEffect(() => { carregar(); }, []);
  async function buscarClientesParaRota() {
      const ids = await vendedoresVisiveis(profile);
      const todos = [];
      for (let inicio = 0; ; inicio += 500) {
        let consulta = sb.from('clientes')
          .select('id, razao_social, nome_fantasia, cnpj_cpf, codigo_totvs, cidade, vendedor_id, ativo')
          .order('id').range(inicio, inicio + 499);
        if (Array.isArray(ids)) {
          if (!ids.length) return [];
          consulta = consulta.in('vendedor_id', ids);
        }
        const { data, error } = await consulta;
        if (error) throw error;
        todos.push(...(data || []));
        if (!data || data.length < 500) break;
      }
      return todos;
    }
  async function carregar() {
    const ids = await vendedoresVisiveis(profile);
    const permitido = Array.isArray(ids) ? new Set(ids) : null;

    const [rr, ru, ra, rc] = await Promise.all([
      sb.from('rotas').select('*, cliente_rotas(id, cliente_id, clientes(razao_social, nome_fantasia, cnpj_cpf, codigo_totvs, cidade, vendedor_id))').order('dia_semana').order('nome'),
      sb.from('usuarios').select('id,nome,papel,supervisor_id,ativo').limit(10000),
      sb.from('adm_vendas_supervisores').select('adm_vendas_id,supervisor_id'),
      Promise.resolve({ data: [] })
    ]);
    if (rr.error) toast('Erro ao carregar rotas: ' + rr.error.message, 'error');
    if (rc.error) toast('Erro ao carregar clientes para rotas: ' + rc.error.message, 'error');
    if (ru.error) toast('Erro ao carregar usuários: ' + ru.error.message, 'error');
    setRotas(rr.data || []);
    // Clientes carregados somente quando abrir o gerenciamento de uma rota.
    setUsuariosComerciais(ru.data || []);
    setCarteirasAdm(ra.data || []);
  }

  async function exportarRelatorioRotas() {
    if (visao !== 'gestao_adm_vendas') return;
    setExportandoRotas(true);
    try {
      const linhas = [];
      const adms = usuariosComerciais.filter(u => u.papel === 'adm_vendas');
      for (const rota of (rotas || [])) {
        for (const vinculo of (rota.cliente_rotas || [])) {
          const cli = vinculo.clientes;
          if (!cli) continue;
          const vendedor = vendedorCliente(cli);
          const supervisor = supervisorCliente(cli);
          const nomesAdm = (carteirasAdm || [])
            .filter(c => supervisor && c.supervisor_id === supervisor.id)
            .map(c => adms.find(u => u.id === c.adm_vendas_id))
            .filter(Boolean).map(u => u.nome);
          linhas.push({
            'Código Cliente': String(cli.codigo_totvs || ''),
            'Razão Social': cli.razao_social || '',
            'Nome Fantasia': cli.nome_fantasia || '',
            'Rota': rota.nome || '',
            'Dia': DIAS[rota.dia_semana] || '',
            'Vendedor': vendedor ? vendedor.nome : '',
            'Supervisor': supervisor ? supervisor.nome : '',
            'Adm de Vendas': [...new Set(nomesAdm)].join(', ')
          });
        }
      }
      if (!linhas.length) return toast('Não há clientes vinculados às rotas para exportar.', 'error');
      const ws = XLSX.utils.json_to_sheet(linhas);
      ws['!cols'] = [{wch:20},{wch:48},{wch:38},{wch:28},{wch:16},{wch:32},{wch:32},{wch:32}];
      // Preserva zeros à esquerda do código TOTVS como texto.
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Clientes por Rota');
      XLSX.writeFile(wb, 'relatorio_clientes_rotas.xlsx');
      toast(linhas.length + ' vínculo(s) exportado(s).', 'success');
    } catch (e) {
      toast('Erro ao exportar relatório: ' + e.message, 'error');
    } finally {
      setExportandoRotas(false);
    }
  }

  function usuarioComercial(id){ return (usuariosComerciais||[]).find(u=>u.id===id)||null; }
  function vendedorCliente(c){ return c ? usuarioComercial(c.vendedor_id) : null; }
  function supervisorCliente(c){
    const v=vendedorCliente(c);
    if(!v) return null;
    if(v.papel==='supervisor') return v;
    return v.supervisor_id ? usuarioComercial(v.supervisor_id) : null;
  }
  function rotuloClienteRota(c){
    const cod=(c&&c.codigo_totvs)||'SEM CÓDIGO';
    const nome=(c&&c.razao_social)||'—';
    const fantasia=(c&&c.nome_fantasia)||'—';
    const cidade=(c&&c.cidade)||'—';
    const vend=vendedorCliente(c);
    const sup=supervisorCliente(c);
    return cod+' — '+nome+' — '+fantasia+' — '+cidade+' — '+(vend?vend.nome:'—')+' — '+(sup?sup.nome:'—');
  }

  async function criarRota() {
    if (!novaRota.nome.trim() || !novaRota.dia_semana) return toast('Preencha nome e dia.', 'error');
    const { error } = await sb.from('rotas').insert({ nome: novaRota.nome.trim(), dia_semana: Number(novaRota.dia_semana) });
    if (error) return toast(error.message, 'error');
    toast('Rota criada!', 'success');
    setModalNova(false); setNovaRota({ nome: '', dia_semana: '' }); carregar();
  }

  async function alterarStatusRota(rota) {
    const ativar = rota.ativo === false;
    if (!ativar && !window.confirm('Inativar a rota "' + rota.nome + '"? Ela deixará de aparecer nas listas de rotas ativas.')) return;
    setAlterandoStatusRota(rota.id);
    const { error } = await sb.from('rotas').update({ ativo: ativar }).eq('id', rota.id);
    setAlterandoStatusRota(null);
    if (error) return toast('Não foi possível alterar a rota: ' + error.message, 'error');
    toast(ativar ? 'Rota reativada!' : 'Rota inativada!', 'success');
    await carregar();
  }

  async function abrirClientes(rota) {
    if (!clientesCarregadosRotas) {
      try {
        const lista = await buscarClientesParaRota();
        setClientes(lista);
        setClientesCarregadosRotas(true);
      } catch (e) { toast('Erro ao carregar clientes: ' + e.message, 'error'); }
    }
    const { data } = await sb.from('cliente_rotas')
      .select('id, cliente_id, ordem_entrega, clientes(razao_social, nome_fantasia, cnpj_cpf, codigo_totvs, cidade, vendedor_id)')
      .eq('rota_id', rota.id).order('ordem_entrega');
    const ids = await vendedoresVisiveis(profile);
    const permitido = Array.isArray(ids) ? new Set(ids) : null;
    setVinculados((data || []).filter(v => !permitido || (v.clientes && permitido.has(v.clientes.vendedor_id))));
    setModalClientes(rota);
    setClienteAdd('');
    setBuscaCodigoRota('');
  }

  async function localizarClienteCodigoRota() {
    const codigo = String(buscaCodigoRota || '').trim();
    if (!codigo) return toast('Informe o código TOTVS.', 'error');
    setBuscandoCodigoRota(true);
    try {
      const normalizado = codigo.replace(/^0+(?=\\d)/, '');
      const variantes = [...new Set([codigo, normalizado, normalizado.padStart(6, '0')])];
      const { data, error } = await sb.from('clientes')
        .select('id, razao_social, nome_fantasia, cnpj_cpf, codigo_totvs, cidade, vendedor_id, ativo')
        .in('codigo_totvs', variantes).limit(20);
      if (error) throw error;
      const encontrado = (data || []).find(c => String(c.codigo_totvs || '').replace(/^0+(?=\\d)/, '') === normalizado);
      if (!encontrado) return toast('Cliente não retornado pelo Supabase. Verifique código TOTVS e política RLS.', 'error');
      const ids = await vendedoresVisiveis(profile);
      if (Array.isArray(ids) && !ids.includes(encontrado.vendedor_id)) return toast('Cliente fora da carteira autorizada.', 'error');
      setClientes(prev => prev.some(c => c.id === encontrado.id) ? prev : [...prev, encontrado]);
      setClienteAdd(encontrado.id);
      toast('Cliente ' + encontrado.codigo_totvs + ' localizado e selecionado.', 'success');
    } catch (e) {
      toast('Erro ao consultar cliente: ' + e.message, 'error');
    } finally {
      setBuscandoCodigoRota(false);
    }
  }

  async function addCliente() {
    if (!clienteAdd || !modalClientes) return;
    if (!(clientes || []).some(c => c.id === clienteAdd)) return toast('Cliente fora da carteira autorizada.', 'error');
    const { error } = await sb.from('cliente_rotas').insert({
      cliente_id: clienteAdd, rota_id: modalClientes.id, ordem_entrega: vinculados.length + 1
    });
    if (error) return toast(error.message, 'error');
    abrirClientes(modalClientes); carregar();
  }

  async function removeCliente(crId) {
    if (!(vinculados || []).some(v => v.id === crId)) return toast('Cliente fora da carteira autorizada.', 'error');
    const { error } = await sb.from('cliente_rotas').delete().eq('id', crId);
    if (error) return toast(error.message, 'error');
    abrirClientes(modalClientes); carregar();
  }

  const rotasExibidas = (rotas || []).filter(r => mostrarInativas ? r.ativo === false : r.ativo !== false);
  const totalPaginasRotas = Math.max(1, Math.ceil(rotasExibidas.length / TAM_PAGINA_ROTAS));
  const rotasPagina = rotasExibidas.slice(paginaRotas * TAM_PAGINA_ROTAS, (paginaRotas + 1) * TAM_PAGINA_ROTAS);
  if (rotas === null) return h('div', { className: 'empty-state' }, 'Carregando...');

  return h('div', null,
    modalNova && h(Modal, {
      titulo: 'Nova Rota', onClose: () => setModalNova(false),
      acoes: [
        h('button', { key: 'c', className: 'btn btn-secondary', onClick: () => setModalNova(false) }, 'Cancelar'),
        h('button', { key: 'ok', className: 'btn btn-primary', onClick: criarRota }, 'Criar rota')
      ]
    },
      h('div', { className: 'form-grid' },
        h(Campo, { label: 'Nome da rota', obrigatorio: true },
          h(Input, { value: novaRota.nome, placeholder: 'ex: Rio Preto', onChange: e => setNovaRota({ ...novaRota, nome: e.target.value }) })),
        h(Campo, { label: 'Dia da semana', obrigatorio: true },
          h('select', { className: 'form-select', value: novaRota.dia_semana, onChange: e => setNovaRota({ ...novaRota, dia_semana: e.target.value }) },
            h('option', { value: '' }, 'Selecione...'),
            [1,2,3,4,5,6,7].map(d => h('option', { key: d, value: d }, DIAS[d])))))),

    modalClientes && h(Modal, {
      titulo: modalClientes.nome + ' — ' + DIAS[modalClientes.dia_semana],
      sub: vinculados.length + ' cliente(s) na rota',
      largo: true,
      onClose: () => setModalClientes(null),
      acoes: h('button', { className: 'btn btn-secondary', onClick: () => setModalClientes(null) }, 'Fechar')
    },
      h('div', { style: { display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' } },
        h('div', { style: { flex: 1, minWidth: 200 } },
          h(SearchSelect, {
            value: clienteAdd, placeholder: 'Buscar por código, razão social, fantasia, cidade, vendedor ou supervisor...',
            onChange: v => setClienteAdd(v), mostrarCliente: true,
            items: clientes.filter(c => !vinculados.some(v => v.cliente_id === c.id))
              .map(c => {
                const cod = c.codigo_totvs || '';
                const codSemZeros = cod.replace(/^0+/, '');
                const vend=vendedorCliente(c), sup=supervisorCliente(c);
                return {
                  value:c.id,
                  label:rotuloClienteRota(c),
                  search:[cod,codSemZeros,c.razao_social,c.nome_fantasia,c.cnpj_cpf,c.cidade,vend&&vend.nome,sup&&sup.nome].filter(Boolean).join(' '),
                  code:cod, nome_fantasia:c.nome_fantasia, cidade:c.cidade
                };
              })
          })),
        h('button', { className: 'btn btn-primary btn-sm', disabled: !clienteAdd, onClick: addCliente }, '+ Adicionar')),
      h('div', { style: { display: 'flex', gap: 8, alignItems: 'center', marginBottom: 14, flexWrap: 'wrap' } },

// LOGÍSTICA — triagem gerada no banco ao decidir a primeira etapa da ficha.
function nomeDiaRota(d){const dias=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];if(d===null||d===undefined||d==='')return 'Dia não definido';const n=Number(d);if(Number.isInteger(n)&&n>=0&&n<=6)return dias[n];if(Number.isInteger(n)&&n===7)return 'Domingo';return String(d).replace(/-feira/gi,'').replace(/^./,c=>c.toUpperCase());}
function indiceDiaRota(d){
  const t=String(d??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const mapa={domingo:0,segunda:1,terca:2,quarta:3,quinta:4,sexta:5,sabado:6};
  if(Object.prototype.hasOwnProperty.call(mapa,t.split('-')[0]))return mapa[t.split('-')[0]];
  const n=Number(t);return Number.isInteger(n)&&n>=0&&n<=6?n:null;
}
function proximaEntregaRota(d){
  const alvo=indiceDiaRota(d);if(alvo===null)return 'Dia não definido';
  const hoje=new Date(),base=new Date(hoje.getFullYear(),hoje.getMonth(),hoje.getDate());
  const diferenca=(alvo-base.getDay()+7)%7;
  base.setDate(base.getDate()+diferenca);
  return base.toLocaleDateString('pt-BR');
}
function PaginaLogisticaFichas({profile}){
  const toast=useToast();
  const [fila,setFila]=useState([]),[rotas,setRotas]=useState([]),[vinculos,setVinculos]=useState([]),[fichas,setFichas]=useState({});
  const [escolhas,setEscolhas]=useState({}),[carregando,setCarregando]=useState(true),[salvando,setSalvando]=useState(null);
  async function carregar(){
    setCarregando(true);
    const [a,b,c]=await Promise.all([
      sb.from('logistica_fichas').select('*').order('criado_em',{ascending:false}).limit(500),
      sb.from('rotas').select('id,nome,dia_semana,ativo').eq('ativo',true).order('nome'),
      sb.from('cliente_rotas').select('id,cliente_id,rota_id')
    ]);
    if(a.error)toast('Logística: '+a.error.message,'error');
    if(b.error)toast('Rotas: '+b.error.message,'error');
    if(c.error)toast('Vínculos: '+c.error.message,'error');
    const ids=[...new Set((a.data||[]).map(i=>i.ficha_id).filter(Boolean))];
    if(ids.length){const ff=await sb.from('fichas_clientes').select('id,consumo_previsto').in('id',ids);
      if(ff.error)toast('Previsão da ficha: '+ff.error.message,'error');
      setFichas(Object.fromEntries((ff.data||[]).map(i=>[i.id,i])));
    }else setFichas({});
    setFila(a.data||[]);setRotas(b.data||[]);setVinculos(c.data||[]);
    setCarregando(false);
  }
  useEffect(()=>{carregar();},[]);
  function rotasItem(item){
    const escolha=escolhas[item.id];
    if(escolha)return escolha.ids;
    const salvas=Array.isArray(item.rotas_ids)?item.rotas_ids:[];
    const existentes=vinculos.filter(v=>v.cliente_id===item.cliente_id).map(v=>v.rota_id);
    return [...new Set(salvas.length?salvas:existentes.length?existentes:item.rota_id?[item.rota_id]:[])];
  }
  function qtdItem(item){
    return escolhas[item.id]?.qtd||Math.max(1,Number(item.qtd_rotas||rotasItem(item).length||1));
  }
  function mensalItem(item){const ficha=fichas[item.ficha_id];return ficha&&ficha.consumo_previsto!=null?Number(ficha.consumo_previsto)*PESO_PAO_KG*DIAS_MES:null;}
  function calcularKg(item){const mensal=mensalItem(item)||0;const qtd=qtdItem(item);const semanal=Math.round(mensal*12/52*100)/100;const centavos=Math.round(mensal*12/52*100);const base=Math.floor(centavos/qtd);return {semanal,porRota:Array.from({length:qtd},(_,i)=>(base+(i<centavos%qtd?1:0))/100)};}
  function atualizarQtd(item,valor){
    const qtd=Math.max(1,Math.min(7,Number(valor)||1));
    setEscolhas(p=>({...p,[item.id]:{qtd,ids:rotasItem(item).slice(0,qtd)}}));
  }
  function atualizarRota(item,indice,id){
    const ids=[...rotasItem(item)];ids[indice]=id;
    setEscolhas(p=>({...p,[item.id]:{qtd:qtdItem(item),ids}}));
  }
  async function vincular(item){
    // O planejamento da ficha aprovada não depende do cadastro definitivo no ERP.
    // O vínculo em cliente_rotas será feito quando cliente_id estiver disponível.
    const qtd=qtdItem(item),ids=rotasItem(item).slice(0,qtd);
    if(ids.length!==qtd||ids.some(id=>!id))return toast('Selecione todas as rotas.','error');
    if(new Set(ids).size!==ids.length)return toast('Não repita a mesma rota.','error');
    if(ids.some(id=>!rotas.some(r=>r.id===id)))return toast('Uma das rotas não está ativa.','error');
    const mensal=mensalItem(item);
    if(mensal===null||!Number.isFinite(mensal)||mensal<0)return toast('Não foi possível carregar o consumo previsto da ficha comercial.','error');
    const calculado=calcularKg(item);

    setSalvando(item.id);
    const existentes=item.cliente_id?vinculos.filter(v=>v.cliente_id===item.cliente_id):[];
    const faltantes=item.cliente_id?ids.filter(id=>!existentes.some(v=>v.rota_id===id)):[];
    const criados=[];
    for(const id of faltantes){
      const res=await sb.from('cliente_rotas').insert({cliente_id:item.cliente_id,rota_id:id,ordem_entrega:1}).select('id').single();
      if(res.error){
        for(const criado of criados)await sb.from('cliente_rotas').delete().eq('id',criado);
        setSalvando(null);return toast('Não foi possível vincular as rotas: '+res.error.message,'error');
      }
      criados.push(res.data.id);
    }
    const dados={status:'vinculado',rota_id:ids[0],rotas_ids:ids,qtd_rotas:qtd,entregas_semanais:qtd,previsao_kg_rotas:kgPorRota,previsao_kg_semanal:centavos/100,previsao_kg_mensal:mensal,atualizado_por:profile.id,atualizado_em:new Date().toISOString()};
    const u=await sb.from('logistica_fichas').update(dados).eq('id',item.id);
    if(u.error){setSalvando(null);return toast('Vínculos criados, mas não foi possível salvar o planejamento: '+u.error.message,'error');}
    const remover=existentes.filter(v=>!ids.includes(v.rota_id));

    setSalvando(null);

    await carregar();
  }
  const linhas=fila.map(item=>{

    const calculado=calcularKg(item);
    const totalKg=calculado.semanal;
    const selecionadas=ids.map(id=>rotas.find(r=>r.id===id)).filter(Boolean);
    const seletores=[];
    for(let i=0;i<qtd;i++){
      const opcoes=[h('option',{key:'empty',value:''},'Selecione a rota '+(i+1))];

      seletores.push(h('select',{key:i,className:'form-input',value:ids[i]||'',
        onChange:e=>atualizarRota(item,i,e.target.value)},...opcoes));

    const previsoes=Array.from({length:qtd},(_,i)=>h('div',{key:i},
      ids[i]?(calculado.porRota[i].toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' Kg'):'Selecione a rota'));
    return h('tr',{key:item.id},
      h('td',null,(item.ficha_id||'').slice(0,8)),
      h('td',null,item.razao_social||'—'),
      h('td',null,item.decisao_primeira_etapa),
      h('td',null,item.status==='pendente'?'Aguardando planejamento':item.status==='vinculado'?'Rotas planejadas':item.status),
      h('td',null,h('input',{className:'form-input',type:'number',min:1,max:7,step:1,
        style:{width:80},value:qtd,onChange:e=>atualizarQtd(item,e.target.value)})),
      h('td',null,h('div',{style:{display:'grid',gap:6,minWidth:220}},...seletores)),
      h('td',null,mensalItem(item)===null?'Ficha indisponível':mensalItem(item).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})+' Kg'),
      h('td',null,h('div',{style:{display:'grid',gap:6,minWidth:170}},...previsoes)),

      h('td',null,h('button',{className:'btn btn-primary btn-sm',
        disabled:salvando===item.id,onClick:()=>vincular(item)},

    );
  });
  const cabecalho=h('thead',null,h('tr',null,
    ...['Ficha','Cliente','Primeira decisão','Situação','Qtd. rotas','Rotas e dias','Previsão mensal (Kg)','Kg por rota/entrega','Total semanal (Kg)','Ação']
      .map(t=>h('th',{key:t},t))));
  const tabela=h('div',{style:{overflowX:'auto'}},

  return h('div',null,

  async function apropriarBonificacaoComercial(tipo){
    if(!pedidoEditandoId||!clienteAtivo||aplicandoBonifPedido)return;
    const a=acordosBonifPedido.find(a=>a.tipo===tipo&&a.ativo);
    if(!a)return toast('Acordo não disponível. Verifique a ficha e a Conta Corrente.','error');
    const ativos=apropriacoesPedido.filter(x=>!x.estornado_em&&x.compromisso_id===a.id);
    if(ativos.some(x=>x.pedido_id===pedidoEditandoId))return toast('Bonificação já apropriada neste pedido.','error');
    const competencia=String(lancando.data).slice(0,7);
    if(tipo==='negociacao'&&a.periodicidade==='unica'&&ativos.length)
      return toast('A parcela única já foi utilizada.','error');
    if(tipo==='negociacao'&&a.periodicidade==='mensal'&&ativos.some(x=>x.competencia?.slice(0,7)===competencia))
      return toast('Já houve apropriação da negociação neste mês.','error');
    const venda=itens.filter(it=>(it.tipo_item||'venda')!=='bonificacao'&&!['02','03'].includes(it.codigo_operacao||operacaoPedido))
      .reduce((v,it)=>v+Number(it.quantidade||0)*Number(it.valor_unitario||0),0);
    const valor=tipo==='introducao'?
      Number(String(valorIntroducaoPedido||'').replace(/\./g,'').replace(',','.')):
      Math.round(venda*Number(a.percentual||0))/100;
    if(!Number.isFinite(valor)||valor<=0)return toast('Não há valor positivo elegível para apropriar.','error');
    const modalidade=tipo==='introducao'?modoIntroducaoPedido:a.modalidade;
    const bonificados=itens.filter(it=>it.tipo_item==='bonificacao')
      .reduce((v,it)=>v+Number(it.quantidade||0)*Number(tabelaPrecoCliente[it.produto_id]||0),0);
    if(modalidade==='Produto'&&bonificados+0.001<valor)
      return toast('Adicione produtos como Bonificação (operação 04) com valor de tabela suficiente para cobrir '+fmtMoeda(valor)+'. Salve o pedido antes de apropriar.','error');
    const descricao=(modalidade==='Produto'?'[PRODUTO] ':'[DESCONTO] ')+(tipo==='introducao'?'Verba de Introdução':'Negociação '+a.percentual+'%');
    if(!window.confirm('Confirmar '+fmtMoeda(valor)+' de '+(tipo==='introducao'?'Verba de Introdução':'Bonificação de Negociação')+' no pedido '+(pedidoEditandoCodigo||pedidoEditandoId)+'?'+(modalidade==='Desconto'?' O desconto ficará registrado no Meu Cliente; a aplicação no Protheus deverá ser feita manualmente após a importação do CSV.':'')))return;

    setAplicandoBonifPedido(false);

  async function carregarBonificacoesLegadas(clienteId){
    const resposta=await sb.rpc('mc_listar_solicitacoes_adm_vendas');
    const candidatos=(Array.isArray(resposta.data)?resposta.data:[]).filter(b=>
      b.categoria==='bonificacao'&&String(b.cliente_id)===String(clienteId));
    const erroBons=resposta.error||(!Array.isArray(resposta.data)
      ? {message:'A consulta administrativa não retornou uma lista válida.'} : null);
    if(erroBons){
      const erro=erroBons;
      console.error('Falha ao consultar bonificações para pedidos',erro);
      setDiagnosticoBonificacoesLegado({erro:erro.message||String(erro),
        clienteId:clienteId});
      setBonificacoesAbertas([]);
    }else{
      const idsBons=candidatos.map(b=>b.id).filter(Boolean);
      const mapaItens={};
      let erroItensBons=null;
      for(let i=0;i<idsBons.length;i+=120){
        const ri=await sb.from('solicitacao_bonificacao_itens')
          .select('solicitacao_id,produto_id,quantidade,ordem,produtos(codigo,descricao)')
          .in('solicitacao_id',idsBons.slice(i,i+120)).order('ordem');
        if(ri.error){erroItensBons=ri.error;break;}
        (ri.data||[]).forEach(it=>(mapaItens[it.solicitacao_id]??=[]).push(it));
      }
      if(erroItensBons){
        const faltaMigracao=['42P01','PGRST205','PGRST204'].includes(String(erroItensBons.code||''));
        console.warn('Não foi possível carregar itens das bonificações para o pedido:',erroItensBons);
        if(!faltaMigracao){
          setDiagnosticoBonificacoesLegado({erro:'Itens de bonificações indisponíveis: '+erroItensBons.message,clienteId:clienteId});
          setBonificacoesAbertas([]);
          setBonificacoesVinculadas([]);
          return;
        }
        // Antes da v111, solicitações antigas continuam utilizando o produto legado.
      }
      const detalhes=candidatos.map(b=>({
        solicitacao_bonificacao_itens:mapaItens[b.id]||[],
        ...b,
        solicitacao_aprovacoes:b.solicitacao_aprovacoes||[],
        produtos:b.produtos||(produtos||[]).find(p=>p.id===b.produto_id)||null
      }));
      const aprovadas=detalhes.filter(b=>{
        const aps=b.solicitacao_aprovacoes;
        return b.status_fluxo==='aprovada'&&!b.pedido_id&&aps.length>0&&
          aps.some(a=>a.etapa==='financeiro'&&['aprovado','reprovado'].includes(a.status))&&
          aps.some(a=>a.etapa==='diretoria'&&a.status==='aprovado')&&
          aps.every(a=>['aprovado','reprovado','nao_aplica'].includes(a.status));
      });
      setBonificacoesAbertas(aprovadas);
      const bloqueadas=detalhes.filter(b=>!aprovadas.some(x=>x.id===b.id)).map(b=>{
        const aps=b.solicitacao_aprovacoes;
        const abertas=aps.filter(a=>['pendente','aguardando'].includes(a.status));
        const veto=aps.some(a=>a.etapa==='diretoria'&&a.status==='reprovado');
        return {
          id:b.id,codigo:b.codigo||codigoAuditoria(b,'BON'),
          motivo:b.pedido_id?'Já vinculada ao pedido':
            veto?'Vetada pela Diretoria':
            b.status_fluxo==='aberta'?'Em aprovação'+(abertas.length?' — próxima etapa: '+abertas[0].etapa:''):
            b.status_fluxo==='reprovada'?'Reprovada / encerrada':
            b.status_fluxo==='concluida'||b.status_fluxo==='vinculada'?'Realização registrada':
            aps.length?'Verificar pareceres: '+aps.map(a=>a.etapa+': '+a.status).join(' | '):
            'Etapas indisponíveis para esta solicitação'
        };
      });
      setDiagnosticoBonificacoesLegado({
        clienteCodigo:'',clienteId:clienteId,
        bloqueadas,total:detalhes.length,aprovadas:aprovadas.length,
        semSolicitacoes:detalhes.length===0
      });
    }
    setBonificacoesVinculadas([]);

  }
