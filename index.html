  function addItem() { setItens([...itens, { produto_id: '', codigo: '', descricao: '', unidade: '', quantidade: '', valor_unitario: '', tipo_item: 'venda',numero_nf:1,codigo_operacao:operacaoPedido }]); }
  function removeItem(idx) {
    const removido=itens[idx];
    if(removido.solicitacao_bonificacao_id&&removido.item_id)return;
    const restantes=itens.filter((_,i)=>i!==idx).map(it=>({...it}));
    if(removido.compraOrigem){
      // A remoção antes de salvar devolve os pacotes à compra de origem.
      const origem=restantes.find(i=>i.compraChave===removido.compraOrigem);
      if(origem)origem.quantidade=(Math.round(Number(origem.quantidade||0)*1000)+Math.round(Number(removido.quantidade)*1000))/1000;
      else restantes.push({...removido.compraAnterior,quantidade:removido.quantidade});
    }
    setItens(restantes);
    setTesItens({});
  }
  function setItem(idx, campo, valor) {
    setTesItens({});
    setItens(itens.map((it, i) => {
      if (i !== idx || (it.solicitacao_bonificacao_id&&campo!=='numero_nf')) return it;
      const novo = { ...it, [campo]: valor, sugestaoPedidoAnterior:false };
      if(campo==='tipo_item'){
        novo.codigo_operacao=valor==='bonificacao'?'04':operacaoPedido;
        novo.valor_unitario=valor==='bonificacao'?0:
          (Number(tabelaPrecoCliente[novo.produto_id])>0 ? Number(tabelaPrecoCliente[novo.produto_id]) :
           (clienteAtivo?.tabela_preco_id ? '' : (Number(precosHistoricosCliente[novo.produto_id])>0 ? Number(precosHistoricosCliente[novo.produto_id]) : (Number(novo.valor_unitario)>0?Number(novo.valor_unitario):''))));
      }
      if (campo === 'produto_id' && valor) {
        const prod = produtos.find(p => p.id === valor);
        if (prod) { novo.codigo = prod.codigo; novo.descricao = prod.descricao; novo.unidade = prod.unidade; }
        // Preço da tabela > histórico do MESMO produto. Não usar preço de outro produto.
        novo.valor_unitario = (novo.tipo_item || 'venda') === 'bonificacao' ? 0 :
          (Number(tabelaPrecoCliente[valor])>0 ? Number(tabelaPrecoCliente[valor]) :
           (clienteAtivo?.tabela_preco_id ? '' : (Number(precosHistoricosCliente[valor])>0 ? Number(precosHistoricosCliente[valor]) :
              (()=>{const codigo=String(prod?.codigo||'').trim();
                for(const ped of historicoPedidos){
                  const anterior=(ped.pedido_itens||[]).find(it=>String(it.produtos?.codigo||'').trim()===codigo&&Number(it.valor_unitario)>0);
                  if(anterior)return Number(anterior.valor_unitario);
                }
                const ref=(pedidoAnterior?.pedido_itens||[]).find(it=>String(it.produtos?.codigo||'').trim()===codigo&&Number(it.valor_unitario)>0);
                return ref?Number(ref.valor_unitario):'';
              })())));
      }
      return novo;
    }));
  }

  function vincularBonificacaoLegada(sol) {
    if(salvando||carregandoCliente)return;
    if(bonificacoesVinculadas.some(b=>b.id===sol.id))return;
    const aps=sol.solicitacao_aprovacoes||[];
    if(sol.status_fluxo!=='aprovada'||
       !aps.some(a=>a.etapa==='financeiro'&&['aprovado','reprovado'].includes(a.status))||
       !aps.some(a=>a.etapa==='diretoria'&&a.status==='aprovado')||
       !aps.every(a=>['aprovado','reprovado','nao_aplica'].includes(a.status)))
      return toast('Bonificação bloqueada: falta aprovação final da Diretoria.','error');
    const todos=Array.isArray(sol.solicitacao_bonificacao_itens)&&sol.solicitacao_bonificacao_itens.length
      ? sol.solicitacao_bonificacao_itens : [{produto_id:sol.produto_id,quantidade:sol.quantidade}];
    if(!todos.length||todos.some(it=>!it.produto_id||!Number.isFinite(Number(it.quantidade))||Number(it.quantidade)<=0)||
       new Set(todos.map(it=>String(it.produto_id))).size!==todos.length)
      return toast('Itens da bonificação incompletos ou duplicados.','error');
    const copia=itens.map(it=>({...it}));
    for(const bon of todos){
      const qtd=Number(bon.quantidade);
      const idx=copia.findIndex(it=>String(it.produto_id)===String(bon.produto_id)&&(it.tipo_item||'venda')!=='bonificacao');
      if(idx>=0){
        const compra=Number(copia[idx].quantidade||0);
        if(qtd>compra)return toast('A bonificação de '+fmtNum(qtd)+' excede a compra de '+fmtNum(compra)+' para um dos produtos.','error');
        copia[idx].quantidade=compra-qtd;
      }
      const prod=produtos.find(p=>String(p.id)===String(bon.produto_id));
      copia.push({produto_id:bon.produto_id,codigo:prod?.codigo,descricao:prod?.descricao,unidade:prod?.unidade,
        quantidade:qtd,valor_unitario:0,tipo_item:'bonificacao',numero_nf:1,codigo_operacao:'04'});
    }
    setItens(copia);
    setBonificacoesVinculadas(prev=>[...prev,sol]);
  }

  function quantidadeBonificacaoNoPv(sol,item){
    const escolhida=quantidadesBonificacao[sol.id]?.[item.produto_id];
    if(escolhida!==undefined)return escolhida;
    const unicoProdutoComSaldo=sol.itens.filter(i=>Number(i.saldo)>0).length===1;
    return sol.modalidade!=='desconto'&&unicoProdutoComSaldo&&Number(item.saldo)>0?String(item.saldo):'';
  }

  function vincularBonificacao(sol) {
    if(salvando||carregandoCliente||operacaoPedido!=='01')return;
    if(itens.some(it=>it.solicitacao_bonificacao_id===sol.id&&!it.item_id))return;
    const escolhidos=sol.itens.map(item=>({...item,
      qtd:Number(quantidadeBonificacaoNoPv(sol,item)||0)}));
    if(escolhidos.some(i=>!Number.isFinite(i.qtd)||i.qtd<0||i.qtd>Number(i.saldo)||
      Math.round(i.qtd*1000)/1000!==i.qtd)||!escolhidos.some(i=>i.qtd>0)){
      return toast('Informe uma quantidade positiva de até três casas decimais, dentro do saldo aprovado por produto.','error');
    }
    const copia=itens.map(it=>({...it}));
    for(const bon of escolhidos.filter(i=>i.qtd>0)){
      const idx=sol.modalidade==='desconto'?copia.findIndex(it=>it.produto_id===bon.produto_id&&
        (it.tipo_item||'venda')==='venda'&&it.codigo_operacao==='01'&&Number(it.quantidade)>0):-1;
      const compra=idx>=0?copia[idx]:null;
      if(sol.modalidade==='desconto'&&(!compra||bon.qtd>Number(compra.quantidade)))
        return toast('Para descontar '+fmtNum(bon.qtd)+' '+(bon.unidade||'un.')+' do produto '+bon.codigo+
          ', informe essa quantidade na linha de venda do produto.','error');
      const item={produto_id:bon.produto_id,codigo:bon.codigo,descricao:bon.descricao,unidade:bon.unidade,
        quantidade:bon.qtd,valor_unitario:0,tipo_item:'bonificacao',solicitacao_bonificacao_id:sol.id,
        numero_nf:compra?.numero_nf||1,codigo_operacao:'04'};
      if(compra){
        compra.compraChave=compra.compraChave||crypto.randomUUID();
        item.compraOrigem=compra.compraChave;
        item.compraAnterior={...compra};
        compra.quantidade=(Math.round(Number(compra.quantidade)*1000)-Math.round(bon.qtd*1000))/1000;
        if(compra.quantidade===0)copia.splice(idx,1);
      }
      copia.push(item);
    }
    setTesItens({});
    setPedidoConfirmado(null);
    setErroGravacaoPedido(null);
    setItens(copia);
  }

  function vincularAmostra(sol) {
    if (amostrasVinculadas.some(a => a.id === sol.id)) return;
    setAmostrasVinculadas(prev => [...prev, sol]);
  }

  async function salvarPedido() {
    if(salvando||carregandoCliente)return;
    if(pedidoEditandoId&&apropriacoesPedido.some(x=>x.pedido_id===pedidoEditandoId&&!x.estornado_em))return toast('Este pedido já possui bonificação apropriada. Solicite estorno gerencial antes de editar seus itens.','error');
    setErroGravacaoPedido(null);
    const temBonificacaoSolicitada=itens.some(it=>it.produto_id&&it.solicitacao_bonificacao_id);
    // Linhas sugeridas pelo pedido anterior só entram neste PV quando preenchidas.
    const preenchidos=itens.filter(it=>it.produto_id&&
      !(temBonificacaoSolicitada&&it.sugestaoPedidoAnterior&&it.quantidade===''));
    if(!preenchidos.length)return toast('Adicione pelo menos um produto ao pedido.','error');
    const incompletos=preenchidos.filter(it=>!(Number(it.quantidade)>0)||
      ((it.tipo_item||'venda')!=='bonificacao'&&!(Number(it.valor_unitario)>0)));
    if(incompletos.length)return toast('Preencha quantidade e valor de todos os produtos antes de salvar. '+incompletos.length+' item(ns) incompleto(s).','error');
    const validos=preenchidos;
    if(validos.some(it=>it.tipo_item==='bonificacao' && it.codigo_operacao!=='04'))
      return toast('Bonificações devem utilizar a operação 04.','error');
    if(validos.some(it=>(it.tipo_item||'venda')!=='bonificacao' && (it.codigo_operacao||operacaoPedido)==='04'))
      return toast('Operação 04 é exclusiva de Bonificação. Corrija o tipo ou a operação do item.','error');
    if(validos.some(it=>!['01','02','03','04'].includes(it.codigo_operacao||operacaoPedido)))
      return toast('Há itens com operação inválida.','error');
    if(validos.some(it=>!Number.isInteger(Number(it.numero_nf||1))||
      Number(it.numero_nf||1)<1||Number(it.numero_nf||1)>totalNfs))
      return toast('Confira a NF atribuída a cada item.','error');
    if(Array.from({length:totalNfs},(_,i)=>i+1).some(n=>!validos.some(it=>Number(it.numero_nf||1)===n)))
      return toast('Cada NF deve conter pelo menos um item.','error');

    // Revalida com a mesma fonte autorizada utilizada na consulta do pedido.
    // Em Administração de Vendas, RLS pode esconder aprovações no SELECT direto.
    if(bonificacoesVinculadas.length){
      const ids=bonificacoesVinculadas.map(b=>String(b.id));
      let conferidas=[],erroConf=null;
      if(['adm_vendas','gestao_adm_vendas','admin'].includes(profile.papel)){
        const res=await sb.rpc('mc_listar_solicitacoes_adm_vendas');
        erroConf=res.error;
        if(!erroConf)conferidas=(res.data||[]).filter(b=>ids.includes(String(b.id)));
      }else{
        const res=await sb.from('solicitacoes')
          .select('id,cliente_id,pedido_id,status_fluxo,solicitacao_aprovacoes(etapa,status)')
          .in('id',ids);
        erroConf=res.error;
        conferidas=res.data||[];
      }
      if(erroConf)return toast('Não foi possível conferir as bonificações: '+erroConf.message,'error');
      if(conferidas.length!==ids.length||conferidas.some(b=>{
        const aps=b.solicitacao_aprovacoes||[];
        return String(b.cliente_id)!==String(clienteAtivo.id)||b.status_fluxo!=='aprovada'||
          !!b.pedido_id||
          !aps.some(a=>a.etapa==='financeiro'&&['aprovado','reprovado'].includes(a.status))||
          !aps.some(a=>a.etapa==='diretoria'&&a.status==='aprovado')||
          !aps.every(a=>['aprovado','reprovado','nao_aplica'].includes(a.status));
      }))return toast('Bonificação não liberada: confira o parecer Financeiro e a aprovação final da Diretoria.','error');
    }
    setSalvando(true);
    let pedidoId=pedidoEditandoId;
    const payload=validos.map(it=>({
      produto_id:it.produto_id,
      quantidade:Number(it.quantidade),
      valor_unitario:(it.tipo_item||'venda')==='bonificacao'?0:Number(it.valor_unitario),
      tipo_item:it.tipo_item||'venda',
      numero_nf:Number(it.numero_nf||1),
      codigo_operacao:it.tipo_item==='bonificacao'?'04':(it.codigo_operacao||operacaoPedido)
    }));
    try{
      if(temBonificacaoSolicitada){
        const resultado=await sb.rpc('mc_salvar_pedido_bonificacao_pv',{
          p_pedido_id:pedidoId,p_cliente_id:clienteAtivo.id,p_rota_id:lancando.rota.id,p_data:lancando.data,
          p_observacoes:obsPedido.trim()||null,p_operacao:operacaoPedido,p_total_nfs:totalNfs,
          p_itens:payload.map((it,i)=>({...it,solicitacao_bonificacao_id:validos[i].solicitacao_bonificacao_id||null,
            item_id:validos[i].solicitacao_bonificacao_id?validos[i].item_id||null:null}))
        });
        if(resultado.error)throw resultado.error;
        const salvo=resultado.data;
        pedidoId=salvo.id;
        setPedidoEditandoId(pedidoId);setPedidoEditandoCodigo(salvo.codigo||null);
        setItens(salvo.pedido_itens.map(it=>({...it,item_id:it.id,codigo:it.produtos?.codigo,
          descricao:it.produtos?.descricao,unidade:it.produtos?.unidade})));
        setQuantidadesBonificacao({});
        setPedidoConfirmado({codigo:salvo.codigo||pedidoId,quantidade:salvo.pedido_itens.length,
          total:payload.reduce((v,it)=>v+it.quantidade*it.valor_unitario,0),quando:new Date().toLocaleString('pt-BR')});
        await carregarBonificacoesSolicitadas(clienteAtivo.id);
        await carregarBonificacoesComerciais(clienteAtivo.id,pedidoId);
        toast('Pedido salvo e apropriação registrada.','success');
      }else{
        if(pedidoId){
          // Preserva os itens antigos até que os substitutos tenham sido gravados.
          const anteriores=await sb.from('pedido_itens').select('id').eq('pedido_id',pedidoId);
          if(anteriores.error)throw new Error('Não foi possível conferir os itens existentes: '+anteriores.error.message);
          const idsAntigos=(anteriores.data||[]).map(it=>it.id);
          const inseridos=await sb.from('pedido_itens')
            .insert(payload.map(it=>({...it,pedido_id:pedidoId}))).select('id');
          if(inseridos.error)throw new Error('Novos itens não gravados; itens anteriores preservados: '+inseridos.error.message);
          if((inseridos.data||[]).length!==payload.length)
            throw new Error('A gravação retornou menos itens que o previsto. Verifique o pedido antes de tentar novamente.');
          if(idsAntigos.length){
            const excluidos=await sb.from('pedido_itens').delete().in('id',idsAntigos).select('id');
            if(excluidos.error||(excluidos.data||[]).length!==idsAntigos.length)
              throw new Error('Itens novos inseridos, mas não foi possível retirar todos os antigos. Confira o pedido antes de repetir a operação.');
          }
          const cabecalho=await sb.from('pedidos').update({
            observacoes:obsPedido.trim()||null,codigo_operacao:operacaoPedido,total_nfs:totalNfs
          }).eq('id',pedidoId).select('id').maybeSingle();
          if(cabecalho.error||!cabecalho.data)throw new Error('Itens gravados, mas o cabeçalho não foi confirmado: '+(cabecalho.error?.message||'pedido não localizado'));
        }else{
          const novo=await sb.from('pedidos').insert({
            cliente_id:clienteAtivo.id,rota_id:lancando.rota.id,criado_por:profile.id,
            data_pedido:lancando.data,observacoes:obsPedido.trim()||null,
            numero_nf:1,codigo_operacao:operacaoPedido,total_nfs:totalNfs
          }).select('id,codigo').single();
          if(novo.error||!novo.data)throw new Error('Não foi possível criar o pedido: '+(novo.error?.message||'resposta vazia'));
          pedidoId=novo.data.id;
          const inserir=await sb.from('pedido_itens')
            .insert(payload.map(it=>({...it,pedido_id:pedidoId}))).select('id');
          if(inserir.error||(inserir.data||[]).length!==payload.length)
            throw new Error('Pedido '+(novo.data.codigo||pedidoId)+' criado, mas os itens não foram confirmados: '+(inserir.error?.message||'quantidade divergente'));
          setPedidoEditandoCodigo(novo.data.codigo||null);
        }
        // Só informa sucesso após consultar novamente o que está persistido.
        const confere=await sb.from('pedidos').select('id,codigo,total_nfs,codigo_operacao,pedido_itens(id,produto_id,quantidade,valor_unitario,tipo_item,numero_nf,codigo_operacao)')
          .eq('id',pedidoId).maybeSingle();
        if(confere.error||!confere.data)throw new Error('Não foi possível confirmar a gravação no banco: '+(confere.error?.message||'pedido não encontrado'));
        const gravados=confere.data.pedido_itens||[];
        if(gravados.length!==payload.length||
          Number(confere.data.total_nfs)!==totalNfs||
          payload.some(it=>!gravados.some(g=>String(g.produto_id)===String(it.produto_id)&&
            Number(g.quantidade)===Number(it.quantidade)&&
            Math.abs(Number(g.valor_unitario)-Number(it.valor_unitario))<0.0001&&
            Number(g.numero_nf)===it.numero_nf&&g.codigo_operacao===it.codigo_operacao)))
          throw new Error('Os dados gravados não conferem com o pedido informado. Confira no banco antes de repetir o salvamento.');
        const total=payload.reduce((v,it)=>v+it.quantidade*it.valor_unitario,0);
        setPedidoEditandoId(pedidoId);
        await carregarBonificacoesComerciais(clienteAtivo.id,pedidoId);
        setPedidoConfirmado({codigo:confere.data.codigo||pedidoId,quantidade:gravados.length,total,quando:new Date().toLocaleString('pt-BR')});
        // Recarrega os dados persistidos em vez de navegar para o próximo cliente.
        setItens(gravados.map(g=>{
          const anterior=validos.find(it=>String(it.produto_id)===String(g.produto_id)&&Number(it.numero_nf||1)===Number(g.numero_nf));
          return {...(anterior||{}),item_id:g.id,produto_id:g.produto_id,quantidade:g.quantidade,valor_unitario:g.valor_unitario,tipo_item:g.tipo_item,numero_nf:g.numero_nf,codigo_operacao:g.codigo_operacao};
        }));
        toast((confere.data.codigo||pedidoId)+' · '+clienteAtivo.razao_social+' — pedido confirmado no banco · '+fmtMoeda(total),'success');
      }
    }catch(err){
      console.error('Falha ao salvar/confirmar pedido:',err);
      const mensagem='Pedido não confirmado: '+(err?.message||String(err));
      setErroGravacaoPedido(mensagem);
      toast(mensagem,'error');
      return;
    }finally{setSalvando(false);}

    if (bonificacoesVinculadas.length) {
      // Um único comando seguro cria vínculo + conclusão na mesma transação.
      // O UPDATE direto em solicitacoes podia retornar zero linhas silenciosamente
      // quando a Administração de Vendas tinha RLS de somente leitura.
      for (const b of bonificacoesVinculadas) {
        const conclusao=await sb.rpc('mc_vincular_concluir_bonificacao',{
          p_solicitacao_id:b.id,p_pedido_id:pedidoId
        });
        if(conclusao.error||conclusao.data?.situacao!=='concluida'){
          const msg=conclusao.error?.message||'Confirmação de conclusão não retornada pelo banco';
          toast('Pedido confirmado, mas a bonificação '+(b.codigo||b.id)+
            ' ainda não foi concluída: '+msg+
            '. Verifique a migração v105 no Supabase antes de tentar novamente.','error');
          await carregarBonificacoesComerciais(clienteAtivo.id,pedidoId);
          return;
        }
      }
      setBonificacoesVinculadas([]);
      await carregarBonificacoesLegadas(clienteAtivo.id);
      await carregarBonificacoesComerciais(clienteAtivo.id,pedidoId);
      toast('Bonificação vinculada ao pedido e concluída com sucesso.','success');
    }

    if (amostrasVinculadas.length) {
      for (const a of amostrasVinculadas) {
        const { error: erroConclusaoAmostra } = await sb.from('solicitacoes').update({
          status_fluxo: 'vinculada',
          pedido_id: pedidoId,
          vinculada_em: new Date().toISOString(),
          vinculada_por: profile.id
        }).eq('id', a.id);
        if (erroConclusaoAmostra) {
          toast('Pedido salvo, mas não foi possível vincular a amostra: ' + erroConclusaoAmostra.message, 'error');
          return;
        }
      }
    }

    await alterarStatusCliente(clienteAtivo.id, 'pedido_fechado');

    // Permanece no cliente para permitir conferir o pedido confirmado.
    await carregar();
  }

  async function consultarTesPedido(){
    if(!clienteAtivo||consultandoTes)return;
    setConsultandoTes(true);
    const resultado={};let pendentes=0;
    try{
      for(let i=0;i<itens.length;i++){
        const it=itens[i];
        if(!it.produto_id)continue;
        const op=it.tipo_item==='bonificacao'?'04':(it.codigo_operacao||operacaoPedido);
        const res=await sb.rpc('resolver_tes_inteligente',{
          p_cliente_id:clienteAtivo.id,p_produto_id:it.produto_id,p_operacao:op
        });
        if(res.error)throw new Error(res.error.message);
        resultado[i]=res.data||'Pendente';
        if(!res.data)pendentes++;
      }
      setTesItens(resultado);
      toast(pendentes?'TES: '+pendentes+' item(ns) sem regra fiscal única. Confira cadastro fiscal do cliente e grupo do produto.':'TES validada para todos os produtos.',pendentes?'error':'success');
    }catch(e){console.error('Consulta TES:',e);toast('Consulta TES: '+e.message,'error');}
    finally{setConsultandoTes(false);}
  }

  async function exportarCsvTotvs(somentePrevia=false){
    if(exportandoTotvs||!lancando)return;
    const clientesRota=lancando.clientesRota||[];
    const pendentes=clientesRota.filter(c=>statusCliente(c.id)!=='pedido_fechado');
    if(pendentes.length)return toast('Finalize o atendimento dos '+pendentes.length+' cliente(s) restantes antes de exportar.','error');
    setExportandoTotvs(true);
    try{
      const {data:pedidos,error}=await sb.from('pedidos')
        .select('id,codigo,cliente_id,rota_id,data_pedido,total_nfs,clientes(razao_social,codigo_totvs,loja_totvs),pedido_itens(id,produto_id,quantidade,numero_nf,tipo_item,codigo_operacao,produtos(codigo,descricao))')
        .eq('rota_id',lancando.rota.id).eq('data_pedido',lancando.data)
        .order('created_at',{ascending:true});
      if(error)throw new Error('Falha ao consultar pedidos: '+error.message);
      if(!pedidos?.length){setPreviaTotvs({linhas:[],erros:['Não há pedidos nesta rota/data.'],nfs:[],rota:lancando.rota.id,data:lancando.data});return toast('Não há pedidos com itens para faturamento nesta rota/data.','info');}
      // Bonificações como desconto não têm campo correspondente no CSV atual.
      // Conferir antes da exportação para impedir divergências silenciosas.
      const idsPedidos=(pedidos||[]).map(p=>p.id);
      const descontos=idsPedidos.length?await sb.from('bonificacao_apropriacoes')
        .select('id,pedido_id,valor,tipo,modalidade')
        .in('pedido_id',idsPedidos).eq('modalidade','Desconto').is('estornado_em',null)
        :{data:[],error:null};
      if(descontos.error)throw new Error('Não foi possível conferir os descontos financeiros: '+descontos.error.message);
      const idsApropriacoes=(descontos.data||[]).map(d=>d.id);
      const confirmacoes=idsApropriacoes.length?await sb.from('bonificacao_descontos_protheus')
        .select('apropriacao_id,pedido_protheus,confirmado_em,confirmado_por,valor_confirmado')
        .in('apropriacao_id',idsApropriacoes)
        :{data:[],error:null};
      if(confirmacoes.error)throw new Error('Não foi possível consultar confirmações do Protheus: '+confirmacoes.error.message+'. Execute a nova migração SQL.');
      const confirmados=new Map((confirmacoes.data||[]).map(c=>[String(c.apropriacao_id),c]));
      const descontosPorPedido={};
      (descontos.data||[]).forEach(d=>{
        const chave=String(d.pedido_id);
        if(!descontosPorPedido[chave])descontosPorPedido[chave]={valor:0,tipos:[],apropriacoes:[]};
        descontosPorPedido[chave].valor+=Number(d.valor||0);
        descontosPorPedido[chave].tipos.push(d.tipo);
        descontosPorPedido[chave].apropriacoes.push({
          id:d.id,tipo:d.tipo,valor:Number(d.valor||0),
          confirmacao:confirmados.get(String(d.id))||null
        });
      });
      const clientesPermitidos=new Set(clientesRota.map(c=>String(c.id)));
      const porCliente={};
      const erros=[];
      const avisosDesconto=[];
      const linhas=[];
      for(const pedido of pedidos){
        if(!clientesPermitidos.has(String(pedido.cliente_id)))continue;
        // Atendimento concluído sem compra não gera linha no CSV do Protheus.
        // Mesmo que exista cabeçalho legado sem itens, não o exportar nem contar como pedido.
        if(!(pedido.pedido_itens||[]).length)continue;
        const descontoPedido=descontosPorPedido[String(pedido.id)];
        if(descontoPedido){
          avisosDesconto.push({pedido:pedido.codigo||pedido.id,cliente:pedido.clientes?.razao_social||'Cliente',valor:descontoPedido.valor,apropriacoes:descontoPedido.apropriacoes});
        }
        porCliente[pedido.cliente_id]=(porCliente[pedido.cliente_id]||0)+1;
        const cli=pedido.clientes||{};
        const codigoOriginal=String(cli.codigo_totvs||'').replace(/\D/g,'');
        const codigo=codigoOriginal.padStart(6,'0');
        const loja=String(cli.loja_totvs||'').trim();
        if(!codigoOriginal||codigoOriginal.length>6||!loja||!/^[0-9A-Za-z]+$/.test(loja)){
          erros.push('Cliente '+(cli.codigo_totvs||pedido.cliente_id)+': código/loja TOTVS ausente ou inválido');
          continue;
        }
        for(const item of pedido.pedido_itens||[]){
          const prod=String(item.produtos?.codigo||'').trim();
          const operacao=item.tipo_item==='bonificacao'?'04':(item.codigo_operacao||'01');
          const nf=Number(item.numero_nf||1);
          const qtd=Number(item.quantidade);
          if(!prod||!(qtd>0)||!Number.isInteger(nf)||nf<1||nf>Number(pedido.total_nfs||1)){
            erros.push('Pedido '+(pedido.codigo||pedido.id)+': produto, quantidade ou NF inválidos');
            continue;
          }
          const res=await sb.rpc('resolver_tes_inteligente',{
            p_cliente_id:pedido.cliente_id,p_produto_id:item.produto_id,p_operacao:operacao
          });
          if(res.error){
            erros.push('TES '+prod+': '+res.error.message);
            continue;
          }
          const tes=String(res.data||'').trim();
          if(!/^\d{3}$/.test(tes)){
            erros.push('TES sem correspondência única: cliente '+codigo+', produto '+prod+', operação '+operacao);
            continue;
          }
          linhas.push({nf,codigo,loja,produto:prod,descricao:item.produtos?.descricao||'',cliente:cli.razao_social||codigo,pedido:pedido.codigo||pedido.id,qtd,operacao,tes});
        }
      }
      for(const [cliente,qtd] of Object.entries(porCliente))
        if(qtd>1)erros.push('Há '+qtd+' pedidos do mesmo cliente ('+cliente+') nesta rota/data. Revise duplicidades antes da exportação.');
      const nfsPrevia=[...new Set(linhas.map(l=>l.nf))].sort((a,b)=>a-b);
      const novaPrevia={linhas,erros,avisosDesconto,nfs:nfsPrevia,rota:lancando.rota.id,data:lancando.data};
      if(somentePrevia){
        setPreviaTotvs(novaPrevia);
        toast(erros.length?'Prévia gerada com '+erros.length+' pendência(s). Corrija antes de exportar.':'Prévia validada: '+linhas.length+' item(ns), '+nfsPrevia.length+' NF(s).',erros.length?'error':'success');
        return;
      }
      // Uma nova conferência é sempre executada na exportação, mesmo após visualizar a prévia.
      if(!previaTotvs||previaTotvs.rota!==lancando.rota.id||previaTotvs.data!==lancando.data){
        setPreviaTotvs(novaPrevia);
        return toast('Confira a prévia de faturamento antes de gerar o CSV.','info');
      }
      if(JSON.stringify(previaTotvs.linhas)!==JSON.stringify(linhas)||JSON.stringify(previaTotvs.erros)!==JSON.stringify(erros)||JSON.stringify(previaTotvs.avisosDesconto||[])!==JSON.stringify(avisosDesconto)){
        setPreviaTotvs(novaPrevia);
        return toast('Os pedidos ou as regras fiscais mudaram após a prévia. Revise a conferência atualizada.','error');
      }
      if(erros.length){
        console.warn('Exportação TOTVS bloqueada:',erros);
        throw new Error(erros.slice(0,4).join(' | ')+(erros.length>4?' | e mais '+(erros.length-4)+' pendência(s). Consulte o console.':''));
      }
      if(!linhas.length)return toast('Nenhum pedido com itens para exportar nesta rota/data. Clientes sem compra foram ignorados; nenhum CSV foi criado.','info');
      const descontosPendentes=avisosDesconto.flatMap(d=>(d.apropriacoes||[]).filter(ap=>!ap.confirmacao));
      if(descontosPendentes.length){
        const totalDesconto=descontosPendentes.reduce((v,ap)=>v+Number(ap.valor||0),0);
        if(!window.confirm('ATENÇÃO: '+descontosPendentes.length+' desconto(s) ainda não confirmado(s) no Protheus, totalizando '+fmtMoeda(totalDesconto)+'. O CSV NÃO contém esses descontos. Após a importação, será necessário aplicar os descontos manualmente. Deseja gerar os arquivos e assumir essa pendência operacional?')){
          return toast('Exportação cancelada. Descontos aguardam aplicação manual no Protheus.','info');
        }
      }
      const nfs=[...new Set(linhas.map(l=>l.nf))].sort((a,b)=>a-b);
      const cabecalho=['Código do Cliente','Loja do Cliente','Código do Produto','Quantidade Vendida','Código da Operação','Código da TES'];
      const nomeSeguro=String(lancando.rota.nome||'rota').replace(/[^a-zA-Z0-9_-]/g,'_');
      const arquivos=nfs.map(nf=>'TOTVS_'+nomeSeguro+'_'+lancando.data+'_NF'+nf+'.csv');
      const pedidosIncluidos=[...new Set(linhas.map(l=>String(l.pedido)))].sort();
      // Registra ANTES de disponibilizar os arquivos: se a auditoria falhar, não exporta.
      const ultima=await sb.from('totvs_exportacoes').select('id,tentativa')
        .eq('rota_id',lancando.rota.id).eq('data_pedido',lancando.data)
        .order('tentativa',{ascending:false}).limit(1);
      if(ultima.error)throw new Error('Histórico de exportações indisponível: '+ultima.error.message+'. Execute a migração SQL.');
      let motivo=null;
      if((ultima.data||[]).length){
        motivo=window.prompt('Esta rota/data já possui exportação TOTVS. Informe a justificativa da REEXPORTAÇÃO (mínimo 10 caracteres):','');
        if(motivo===null)return toast('Reexportação cancelada. Nenhum CSV gerado.','info');
        if(motivo.trim().length<10)return toast('Justificativa da reexportação deve ter pelo menos 10 caracteres.','error');
      }
      // A assinatura preserva o conteúdo da prévia, sem incluir nomes ou dados confidenciais em logs externos.
      const assinatura=JSON.stringify(linhas.map(l=>[l.nf,l.pedido,l.codigo,l.loja,l.produto,l.qtd,l.operacao,l.tes]));
      const registro=await sb.rpc('registrar_exportacao_totvs',{
        p_rota_id:lancando.rota.id,p_data_pedido:lancando.data,
        p_arquivos:arquivos,p_pedidos:pedidosIncluidos,
        p_itens_quantidade:linhas.length,p_assinatura_conteudo:assinatura,
        p_motivo_reexportacao:motivo
      });
      if(registro.error)throw new Error('Exportação bloqueada: não foi possível registrar o histórico: '+registro.error.message);
      const novoHistorico=await sb.from('totvs_exportacoes')
        .select('id,tentativa,tipo,gerado_em,usuario_id,motivo_reexportacao,arquivos,pedidos,itens_quantidade,status')
        .eq('rota_id',lancando.rota.id).eq('data_pedido',lancando.data).order('tentativa',{ascending:false}).limit(50);
      if(!novoHistorico.error)setHistoricoExportacoesTotvs(novoHistorico.data||[]);
      for(const nf of nfs){
        const registros=linhas.filter(l=>l.nf===nf).sort((a,b)=>a.codigo.localeCompare(b.codigo))
          .map(l=>[l.codigo,l.loja,l.produto,String(l.qtd).replace('.',','),l.operacao,l.tes]);
        downloadCsv('TOTVS_'+nomeSeguro+'_'+lancando.data+'_NF'+nf,cabecalho,registros);
      }
      toast('CSV(s) preparados para download e registrados no histórico: '+linhas.length+' item(ns), '+nfs.length+' arquivo(s). Confirme o recebimento dos arquivos no navegador.','success');
    }catch(e){
      console.error('Falha exportação TOTVS:',e);
      toast('CSV não gerado: '+(e?.message||String(e)),'error');
    }finally{setExportandoTotvs(false);}
  }

  async function confirmarDescontoManual(ap){
    if(confirmandoDescontoTotvs||!lancando||!ap?.id||ap.confirmacao)return;
    const numero=window.prompt('Informe o número do pedido já importado no Protheus (o desconto deve estar aplicado manualmente):','');
    if(numero===null)return;
    if(!numero.trim())return toast('Informe o número do pedido no Protheus.','error');
    if(!window.confirm('Confirma que o desconto de '+fmtMoeda(ap.valor)+' já foi aplicado manualmente no pedido '+numero.trim()+' do Protheus? Esta confirmação ficará registrada com usuário e data.'))return;
    setConfirmandoDescontoTotvs(ap.id);
    try{
      const {error}=await sb.rpc('confirmar_desconto_protheus',{
        p_apropriacao_id:ap.id,p_pedido_protheus:numero.trim(),p_observacao:null
      });
      if(error)throw error;
      toast('Desconto confirmado. A confirmação ficará registrada com usuário, data e pedido Protheus.','success');
      // Recarregar a prévia a partir do banco e não alterar apenas o estado local.
      setPreviaTotvs(null);
      await exportarCsvTotvs(true);
    }catch(e){toast('Não foi possível confirmar desconto: '+(e?.message||e),'error');}
    finally{setConfirmandoDescontoTotvs(null);}
  }

// helpers de download
function downloadCsv(nome, headers, exemplos) {
  const bom = '\uFEFF'; // UTF-8 BOM para Excel abrir com acentos
  const linhas = [headers.join(';'), ...exemplos.map(r => r.join(';'))];
  const blob = new Blob([bom + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

function downloadXlsx(nome, headers, exemplos) {
  const ws = XLSX.utils.aoa_to_sheet([headers, ...exemplos]);
  // largura automatica
  ws['!cols'] = headers.map(h => ({ wch: Math.max(h.length + 4, 14) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dados');
  XLSX.writeFile(wb, nome + '.xlsx');
}

function lerArquivo(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('Falha ao ler arquivo'));
    if (file.name.match(/\.xlsx?$/i)) reader.readAsArrayBuffer(file);
    else reader.readAsText(file, 'UTF-8');
  });
}

function normalizarCabecalhoImportacao(v) {
  return String(v == null ? '' : v)
    .replace(/^\uFEFF/,'')
    .replace(/\u00A0/g,' ')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .trim().toLowerCase()
    .replace(/[^a-z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'');
}

function cabecalhoCanonicoImportacao(v) {
  const h=normalizarCabecalhoImportacao(v);
  const aliases={
    'razao_social':'razao_social','razao':'razao_social','nome_razao_social':'razao_social',
    'nome_fantasia':'nome_fantasia','fantasia':'nome_fantasia','nome_comercial':'nome_fantasia',
    'codigo_totvs':'codigo_totvs','cod_totvs':'codigo_totvs','codigo_cliente':'codigo_totvs',
    'cnpj_cpf':'cnpj_cpf','cnpj':'cnpj_cpf','cpf':'cnpj_cpf',
    'cidade':'cidade','estado':'estado','uf':'estado',
    'telefone':'telefone','fone':'telefone','email':'email','e_mail':'email',
    'condicao_pagamento':'condicao_pagamento','cond_pagamento':'condicao_pagamento',
    'acordo_comercial':'acordo_comercial',
    'codigo_vendedor':'codigo_vendedor','cod_vendedor':'codigo_vendedor'
  };
  return aliases[h] || h;
}

function montarPreviewImportacao(matriz) {
  if(!Array.isArray(matriz) || !matriz.length) return null;

  // Localiza a linha real de cabeçalho. Para Clientes, prioriza a linha
  // que contenha razao_social; para os demais modelos usa a primeira
  // linha com pelo menos duas colunas nomeadas.
  let idxCab=-1;
  for(let i=0;i<Math.min(matriz.length,25);i++){
    const hs=(matriz[i]||[]).map(cabecalhoCanonicoImportacao);
    if(hs.includes('razao_social')) { idxCab=i; break; }
    if(idxCab<0 && hs.includes('codigo_totvs') && hs.filter(Boolean).length===1) idxCab=i;
    if(idxCab<0 && hs.filter(Boolean).length>=2) idxCab=i;
  }
  if(idxCab<0) return null;

  const headers=(matriz[idxCab]||[]).map(cabecalhoCanonicoImportacao);
  const rows=matriz.slice(idxCab+1)
    .filter(r=>(r||[]).some(c=>String(c == null ? '' : c).trim()!==''))
    .map(r=>{
      const obj={};
      headers.forEach((hd,i)=>{
        if(!hd) return;
        const valor=(r && i<r.length) ? r[i] : '';
        obj[hd]=String(valor == null ? '' : valor).replace(/\u00A0/g,' ').trim();
      });
      return obj;
    });

  return {headers:headers.filter(Boolean),rows};
}

function parseArquivo(conteudo, nomeArquivo) {
  const ext = nomeArquivo.toLowerCase().split('.').pop();
  if (['xlsx', 'xls'].includes(ext)) {
    const wb = XLSX.read(conteudo, { type: 'array', cellDates: false, raw: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const dados = XLSX.utils.sheet_to_json(ws, {
      header: 1,
      defval: '',
      raw: false,
      blankrows: false
    });
    return montarPreviewImportacao(dados);
  }

  const texto=String(conteudo == null ? '' : conteudo).replace(/^\uFEFF/,'');
  const linhas=texto.split(/\r?\n/).filter(l=>l.trim());
  if(linhas.length<2) return null;
  const sep=linhas[0].includes('\t')?'\t':linhas[0].includes(';')?';':',';

  // Mantém o comportamento atual para CSV simples, mas passa toda a
  // matriz pelo mesmo normalizador usado no Excel.
  const matriz=linhas.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));
  return montarPreviewImportacao(matriz);
}
