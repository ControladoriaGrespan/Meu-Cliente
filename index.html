    setUsuarios(u);
    const mm={}; m.forEach(x=>{if(x.ativo){if(!mm[x.usuario_id])mm[x.usuario_id]=[];mm[x.usuario_id].push(x.modulo);}}); setMods(mm);
    const cc={}; c.forEach(x=>{if(!cc[x.adm_vendas_id])cc[x.adm_vendas_id]=[];cc[x.adm_vendas_id].push(x.supervisor_id);}); setCarts(cc);
  }
  async function altMod(u,k,a){
    const {error}=await sb.from('usuario_modulos').upsert({usuario_id:u.id,modulo:k,ativo:a},{onConflict:'usuario_id,modulo'});
    if(error)return toast(error.message,'error');
    setMods(prev=>{const z=new Set(prev[u.id]||[]);a?z.add(k):z.delete(k);return {...prev,[u.id]:Array.from(z)};});
  }
  async function altCart(adm,sp,a){
    let r;
    if(a) r=await sb.from('adm_vendas_supervisores').upsert({adm_vendas_id:adm,supervisor_id:sp},{onConflict:'adm_vendas_id,supervisor_id'});
    else r=await sb.from('adm_vendas_supervisores').delete().eq('adm_vendas_id',adm).eq('supervisor_id',sp);
    if(r.error)return toast(r.error.message,'error');
    setCarts(prev=>{const z=new Set(prev[adm]||[]);a?z.add(sp):z.delete(sp);return {...prev,[adm]:Array.from(z)};});
  }
  if(!usuarios)return h('div',{className:'empty-state'},'Carregando...');
  const sups=usuarios.filter(u=>u.papel==='supervisor'&&u.ativo===true);
  const adms=usuarios.filter(u=>['adm_vendas','gestao_adm_vendas'].includes(u.papel)&&u.ativo===true);

  const linhasUsuarios=usuarios.map(u=>{
    const checks=Object.keys(MODULOS).map(k=>
      h('td',{key:k,style:{textAlign:'center'}},
        h('input',{type:'checkbox',checked:(mods[u.id]||[]).includes(k),onChange:e=>altMod(u,k,e.target.checked)})));
    return h('tr',{key:u.id},
      h('td',null,h('b',null,u.nome),h('div',{style:{fontSize:11,color:'var(--text-muted)'}},ROLE_LABELS[u.papel]||u.papel)),
      ...checks);
  });

  const blocosCarteira=adms.map(adm=>{
    const checks=sups.map(sp=>h('label',{key:sp.id,style:{display:'flex',gap:6,alignItems:'center',fontSize:13}},
      h('input',{type:'checkbox',checked:(carts[adm.id]||[]).includes(sp.id),onChange:e=>altCart(adm.id,sp.id,e.target.checked)}),
      sp.nome));
    return h('div',{key:adm.id,style:{padding:'12px 0',borderBottom:'1px solid var(--border)'}},
      h('b',null,adm.nome),
      h('div',{style:{display:'flex',gap:14,flexWrap:'wrap',marginTop:8}},...checks));
  });

  return h('div',null,
    h('div',{className:'page-head'},
      h('div',null,h('div',{className:'page-title'},'Módulos e Carteiras'),h('div',{className:'page-sub'},'Permissões por usuário e carteira da Administração de Vendas')),
      h('button',{className:'btn btn-primary',onClick:onUsuarios},'Usuários e Hierarquia')),
    h('div',{className:'card'},
      h('div',{className:'section-title'},'Acesso aos módulos'),
      h('div',{style:{overflowX:'auto'}},
        h('table',{className:'data-table'},
          h('thead',null,h('tr',null,h('th',null,'Usuário'),...Object.keys(MODULOS).map(k=>h('th',{key:k,style:{textAlign:'center'}},MODULOS[k].label)))),
          h('tbody',null,...linhasUsuarios)))),
    h('div',{className:'card',style:{marginTop:18}},
      h('div',{className:'section-title'},'Carteira — Administração de Vendas'),
      h('div',{className:'page-sub',style:{marginBottom:12}},'Cada Adm. de Vendas pode responder por um ou mais Supervisores.'),
      ...(blocosCarteira.length?blocosCarteira:[h('div',{key:'vazio',className:'empty-state'},'Nenhum Adm. de Vendas cadastrado.')]))
  );
}

function PaginaGamificacaoComercial({profile}){
  const [periodo,setPeriodo]=useState('mes');
  const [categoria,setCategoria]=useState('vendedor');
  const [aba,setAba]=useState('geral');
  const [dados,setDados]=useState([]);
  const [carregando,setCarregando]=useState(false);
  const [erro,setErro]=useState('');
  const [atualizadoEm,setAtualizadoEm]=useState('');
  const [regras,setRegras]=useState([]);
  const [editandoRegras,setEditandoRegras]=useState(false);
  const [salvandoRegras,setSalvandoRegras]=useState(false);
  const [erroRegras,setErroRegras]=useState('');
  const [regrasDisponiveis,setRegrasDisponiveis]=useState(false);
  const toast=useToast();
  const abas=[
    {id:'fichas',label:'Fichas',tipo:'inteiro'},
    {id:'faturamento_previsto',label:'Faturamento Previsto',tipo:'moeda'},
    {id:'faturamento_realizado',label:'Faturamento Realizado',tipo:'moeda'},
    {id:'volume_previsto_ton',label:'Volume (Ton) Previsto',tipo:'ton'},
    {id:'volume_realizado_ton',label:'Volume (Ton) Realizado',tipo:'ton'},
    {id:'geral',label:'Ranking Geral',tipo:'pontos'}
  ];
  const campos=abas.slice(0,5).map(a=>a.id);
  const num=x=>Number(x)||0;
  const formatar=(v,t)=>t==='moeda'?fmtMoeda(num(v)):t==='ton'?num(v).toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3})+' t':t==='pontos'?num(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' pts':num(v).toLocaleString('pt-BR');
  function intervalo(){
    const hoje=new Date(),inicio=new Date(hoje.getFullYear(),hoje.getMonth(),1);
    if(periodo==='trimestre')inicio.setMonth(Math.floor(hoje.getMonth()/3)*3);
    if(periodo==='ano')inicio.setMonth(0);
    const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
    return [iso(inicio),iso(hoje)];
  }
  async function carregar(){
    if(profile?.papel!=='admin')return;
    setCarregando(true);setErro('');
    const [p_inicio,p_fim]=intervalo();
    const [resultado,config]=await Promise.all([
      sb.rpc('ranking_gamificacao_metricas',{p_inicio,p_fim}),
      sb.from('gamificacao_regras').select('papel,indicador,peso,meta')
    ]);
    const {data,error}=resultado;
    if(config.error){setErroRegras('Configuração de metas indisponível: '+config.error.message);setRegrasDisponiveis(false);}
    else {setRegras(config.data||[]);setErroRegras('');setRegrasDisponiveis(true);}
    if(error){setErro(error.message);setDados([]);}
    else {setDados(data||[]);setAtualizadoEm(new Date().toLocaleString('pt-BR'));}
    setCarregando(false);
  }
  useEffect(()=>{carregar();},[periodo,profile?.papel]);
  useEffect(()=>{setEditandoRegras(false);},[categoria]);
  function regra(indicador){
    return regras.find(r=>r.papel===categoria&&r.indicador===indicador)||
      {papel:categoria,indicador,peso:20,meta:0};
  }
  function mudarRegra(indicador,campo,valor){
    setRegras(lista=>{
      const alvo={...regra(indicador),[campo]:valor};
      const outros=lista.filter(x=>!(x.papel===categoria&&x.indicador===indicador));
      return [...outros,alvo];
    });
  }
  async function salvarRegras(){
    const payload=campos.map(indicador=>{
      const r=regra(indicador);
      return {indicador,peso:Number(r.peso),meta:Number(r.meta)};
    });
    if(payload.some(x=>!Number.isFinite(x.peso)||x.peso<0||x.peso>100||!Number.isFinite(x.meta)||x.meta<0))
      return toast('Informe pesos de 0 a 100 e metas não negativas.','error');
    if(Math.abs(payload.reduce((s,x)=>s+x.peso,0)-100)>0.001)
      return toast('A soma dos cinco pesos deve ser exatamente 100%.','error');
    setSalvandoRegras(true);
    const {error}=await sb.rpc('salvar_gamificacao_regras',{p_papel:categoria,p_regras:payload});
    setSalvandoRegras(false);
    if(error)return toast('Não foi possível salvar regras: '+error.message,'error');
    setEditandoRegras(false);toast('Regras de pontuação atualizadas.','success');
    await carregar();
  }
  if(profile?.papel!=='admin')return h('div',{className:'empty-state'},'Acesso restrito ao administrador.');
  const titulo={vendedor:'Vendedores',supervisor:'Supervisores',coordenador:'Coordenadores'};
  const participantes=dados.filter(x=>x.papel===categoria);
  const max=Object.fromEntries(campos.map(c=>[c,Math.max(0,...participantes.map(x=>num(x[c])))]));
  const classif=participantes.map(x=>({...x,geral:Math.round(10*campos.reduce((s,c)=>{
    const regraAtual=regra(c);
    const base=num(regraAtual.meta)>0?num(regraAtual.meta):max[c];
    // Metas positivas limitam a contribuição ao peso, sem pontuação acima do máximo.
    return s+(base>0?num(regraAtual.peso)*Math.min(1,Math.max(0,num(x[c]))/base):0);
  },0))/10}));
  const atual=abas.find(x=>x.id===aba)||abas[5];
  const ordenados=classif.sort((a,b)=>num(b[aba])-num(a[aba])||num(b.geral)-num(a.geral)||String(a.nome).localeCompare(String(b.nome),'pt-BR'));
  const soma=ordenados.reduce((v,x)=>v+num(x[aba]),0);
  return h('div',null,
    h('div',{className:'page-head'},
      h('div',null,h('div',{className:'page-title'},'★ Gamificação Comercial'),
        h('div',{className:'page-sub'},'Rankings por indicador — exclusivo do administrador')),
      h('button',{className:'btn btn-secondary',onClick:carregar,disabled:carregando},carregando?'Atualizando...':'↻ Atualizar')),
    h('div',{className:'card',style:{marginBottom:14}},
      h('div',{style:{display:'flex',gap:12,flexWrap:'wrap',alignItems:'end'}},
        h(Campo,{label:'Período'},h('select',{className:'form-select',value:periodo,onChange:e=>setPeriodo(e.target.value)},
          h('option',{value:'mes'},'Mês atual'),h('option',{value:'trimestre'},'Trimestre atual'),h('option',{value:'ano'},'Ano atual'))),
        h(Campo,{label:'Ranking de'},h('select',{className:'form-select',value:categoria,onChange:e=>setCategoria(e.target.value)},
          h('option',{value:'vendedor'},'Vendedores'),h('option',{value:'supervisor'},'Supervisores'),h('option',{value:'coordenador'},'Coordenadores')))),
      h('div',{className:'page-sub',style:{marginTop:10}},
        'Previsto: projeções mensais das fichas cadastradas no período; toneladas previstas = consumo (pães/dia) × 0,080 kg × 26 dias / 1.000. '+
        'Realizado: apenas pedidos de Venda (operação 01) no Meu Cliente, excluindo amostras, trocas e bonificações. '+
        'NÃO é o faturamento ou volume efetivamente faturado no Protheus.'),
      atualizadoEm&&h('div',{className:'page-sub',style:{marginTop:6}},'Atualizado em '+atualizadoEm)),
    h('div',{className:'card',style:{marginBottom:14}},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap'}},
        h('div',{className:'section-title'},'Regras e metas — '+titulo[categoria]),
        h('button',{className:'btn btn-secondary btn-sm',disabled:!regrasDisponiveis||salvandoRegras,
          onClick:()=>{setEditandoRegras(x=>!x);if(editandoRegras)carregar();}},
          editandoRegras?'Cancelar edição':'⚙ Configurar pontuação')),
      erroRegras&&h('div',{style:{color:'var(--danger)',marginTop:8}},erroRegras),
      editandoRegras&&h('div',null,
        h('div',{className:'page-sub',style:{marginBottom:10}},'A meta é opcional: use 0 para pontuar proporcionalmente ao líder. Com meta positiva, atingir 100% da meta concede o peso integral do indicador. Os pesos devem somar 100%.'),
        h('div',{className:'table-wrap'},
          h('table',{className:'data-table'},
            h('thead',null,h('tr',null,h('th',null,'Indicador'),h('th',null,'Peso (%)'),h('th',null,'Meta da categoria'))),
            h('tbody',null,...abas.slice(0,5).map(a=>{
              const ra=regra(a.id);
              return h('tr',{key:a.id},h('td',null,a.label),
                h('td',null,h('input',{className:'form-input sm',type:'number',min:0,max:100,step:'0.01',
                  style:{maxWidth:120},value:ra.peso,onChange:e=>mudarRegra(a.id,'peso',e.target.value)})),
                h('td',null,h('input',{className:'form-input sm',type:'number',min:0,step:a.tipo==='inteiro'?'1':'0.001',
                  style:{maxWidth:160},value:ra.meta,onChange:e=>mudarRegra(a.id,'meta',e.target.value)}))
              );
            })))),
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,marginTop:10}},
          h('strong',null,'Soma dos pesos: '+campos.reduce((n,c)=>n+num(regra(c).peso),0).toLocaleString('pt-BR')+'%'),
          h('button',{className:'btn btn-primary',disabled:salvandoRegras,onClick:salvarRegras},
            salvandoRegras?'Salvando...':'Salvar regras')))),
    h('div',{style:{display:'flex',flexWrap:'wrap',gap:7,marginBottom:14}},
      ...abas.map(a=>h('button',{key:a.id,className:'btn '+(aba===a.id?'btn-primary':'btn-secondary')+' btn-sm',onClick:()=>setAba(a.id)},a.label))),
    erro&&h('div',{className:'card',style:{color:'var(--danger)'}},'Não foi possível consultar as métricas: '+erro+'. Execute a migração SQL.'),
    !erro&&h('div',{className:'kpi-grid'},
      h(Kpi,{icon:'★',cor:'warning',valor:aba==='geral'?'100 pts':formatar(soma,atual.tipo),label:aba==='geral'?'Pontuação máxima individual':'Total da categoria'}),
      h(Kpi,{icon:'☺',cor:'accent',valor:ordenados.length,label:'Participantes'}),
      h(Kpi,{icon:'▣',cor:'info',valor:ordenados.filter(x=>num(x[aba])>0).length,label:'Com resultado'})),
    !erro&&h('div',{className:'card',style:{marginTop:14}},
      h('div',{className:'section-title'},atual.label+' — '+titulo[categoria]),
      aba==='geral'&&h('div',{className:'page-sub',style:{marginBottom:12}},
        'Ranking Geral: os pesos somam 100 pontos. Com meta configurada, cada indicador pontua conforme o atingimento da meta, limitado ao seu peso. Sem meta, a referência é o líder da mesma função.'),
      carregando?h('div',{className:'empty-state'},'Calculando ranking...'):
      !ordenados.length?h('div',{className:'empty-state'},'Nenhum participante ativo encontrado.'):
      h('div',{className:'table-wrap'},
        h('table',{className:'data-table'},
          h('thead',null,h('tr',null,...['Posição','Participante',atual.label,...(aba==='geral'?abas.slice(0,5).map(a=>a.label):[])].map(t=>h('th',{key:t},t)))),
          h('tbody',null,...ordenados.map((x,i)=>h('tr',{key:x.usuario_id},
            h('td',null,h('span',{style:{fontWeight:800,fontSize:18}},i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1)+'º')),
            h('td',null,h('strong',null,x.nome||'—')),
            h('td',null,h('strong',null,formatar(x[aba],atual.tipo))),
            ...(aba==='geral'?abas.slice(0,5).map(a=>h('td',{key:a.id},formatar(x[a.id],a.tipo))):[])
          ))))))
  );
}

function DashboardComercialV38({profile,visao,modulo}) {
  const [loading,setLoading]=useState(true);
  const [vendedores,setVendedores]=useState([]);
  const [supervisores,setSupervisores]=useState([]);
  const [filtroSup,setFiltroSup]=useState('');
  const [filtroVend,setFiltroVend]=useState('');
  const [clientes,setClientes]=useState([]);
  const [fichas,setFichas]=useState([]);
  const [sols,setSols]=useState([]);
  const [titulos,setTitulos]=useState([]); // reservado para integração Protheus / financeiro
  const [atividadePedidos,setAtividadePedidos]=useState([]);
  const [erroAtividade,setErroAtividade]=useState('');
  const [carregandoAtividade,setCarregandoAtividade]=useState(false);

  useEffect(()=>{carregarEstrutura();},[profile.id,visao,modulo]);
  useEffect(()=>{if(vendedores.length||visao==='vendedor')carregarDados();},[filtroSup,filtroVend,vendedores.length]);

  async function carregarEstrutura(){
    setLoading(true);
    let supIds=null, vendIds=null;

    if(visao==='vendedor'){
      vendIds=[profile.id];
    } else if(visao==='supervisor'){
      supIds=[profile.id];
    } else if(visao==='coordenador'){
      const {data:ss}=await sb.from('usuarios').select('id,nome').eq('papel','supervisor').eq('coordenador_id',profile.id).eq('ativo',true);
      setSupervisores(ss||[]); supIds=(ss||[]).map(x=>x.id);
    } else if(visao==='adm_vendas'){
      const {data:cart}=await sb.from('adm_vendas_supervisores').select('supervisor_id').eq('adm_vendas_id',profile.id);
      supIds=(cart||[]).map(x=>x.supervisor_id);
      if(supIds.length){
        const {data:ss}=await sb.from('usuarios').select('id,nome').in('id',supIds).eq('ativo',true).order('nome');
        setSupervisores(ss||[]);
      } else setSupervisores([]);
    } else if(['gestao_adm_vendas','diretoria','admin'].includes(visao)){
      const {data:ss}=await sb.from('usuarios').select('id,nome').eq('papel','supervisor').eq('ativo',true).order('nome');
      setSupervisores(ss||[]); supIds=(ss||[]).map(x=>x.id);
    }

    if(!vendIds){
      if(supIds && !supIds.length){setVendedores([]);setLoading(false);return;}
      let q=sb.from('usuarios').select('id,nome,supervisor_id').eq('papel','vendedor').eq('ativo',true).order('nome');
      if(supIds)q=q.in('supervisor_id',supIds);
      const {data:vv}=await q; setVendedores(vv||[]);
    } else {
      const {data:vv}=await sb.from('usuarios').select('id,nome,supervisor_id').in('id',vendIds).eq('ativo',true);
      setVendedores(vv||[]);
    }
    setLoading(false);
  }

  function idsSelecionados(){
    let vs=vendedores;
    if(filtroSup)vs=vs.filter(v=>v.supervisor_id===filtroSup);
    if(filtroVend)vs=vs.filter(v=>v.id===filtroVend);
    return vs.map(v=>v.id);
  }

  async function carregarDados(){
    const ids=idsSelecionados();
    if(!ids.length){setClientes([]);setFichas([]);setSols([]);setAtividadePedidos([]);setErroAtividade('');return;}
    const [rc,rf]=await Promise.all([
      sb.from('clientes').select('id,codigo_totvs,razao_social,vendedor_id').in('vendedor_id',ids),
      sb.from('fichas_clientes').select('id,vendedor_id,faturamento_previsto,created_at,ficha_aprovacoes(status)').in('vendedor_id',ids)
    ]);
    const cls=rc.data||[]; setClientes(cls); setFichas(rf.data||[]);
    setCarregandoAtividade(true);
    const atividade=await sb.rpc('comercial_atividade_pedidos',{p_vendedores:ids});
    setCarregandoAtividade(false);
    if(atividade.error){
      setErroAtividade('Indicadores de pedidos indisponíveis. Verifique a migração SQL e as permissões: '+atividade.error.message);
      setAtividadePedidos([]);
    }else{
      setErroAtividade('');
      setAtividadePedidos(atividade.data||[]);
    }
    const cliIds=cls.map(c=>c.id);
    if(cliIds.length){
      const {data:ss}=await sb.from('solicitacoes')
        .select('id,cliente_id,categoria,tipo,status_fluxo,created_at')
        .in('cliente_id',cliIds);
      setSols(ss||[]);
    } else setSols([]);
    // "Títulos / NF" fica propositalmente vazio até integração:
    // estrutura visual já está pronta e não inventa dados financeiros.
    setTitulos([]);
  }

  function fichaStatus(f){
    const a=f.ficha_aprovacoes||[];
    if(a.some(x=>x.status==='reprovado'))return'reprovada';

function PaginaDashboard({ profile, visao, ehPreview, modulo }) {
  const [dados,setDados]=useState(null);
  const [equipe,setEquipe]=useState([]);
  const [supervisoresDash,setSupervisoresDash]=useState([]);

  useEffect(()=>{carregar();},[visao,profile.id]);

  function statusFicha(f){
    const aps=f.ficha_aprovacoes||[];
    const reprovada=aps.some(a=>a.status==='reprovado');
    const aprovada=aps.length>0 && aps.every(a=>CONCLUIDAS.includes(a.status)) && aps.some(a=>a.status==='aprovado') && !reprovada;
    const andamento=!aprovada&&!reprovada;
    return {aprovada,reprovada,andamento};
  }
  function resumo(lista){
    const total=lista.length;
    const aprovadas=lista.filter(f=>statusFicha(f).aprovada).length;
    const reprovadas=lista.filter(f=>statusFicha(f).reprovada).length;
    const andamento=lista.filter(f=>statusFicha(f).andamento).length;
    const fat=lista.reduce((a,f)=>a+Number(f.faturamento_previsto||0),0);
    return {total,aprovadas,reprovadas,andamento,faturamento:fat,media:total?fat/total:0,taxa:total?(aprovadas/total*100):0};
  }

  async function carregar(){
    setDados(null);setEquipe([]);setSupervisoresDash([]);
    if(['vendedor','supervisor','coordenador','diretoria','admin','adm_vendas','gestao_adm_vendas'].includes(visao)){
      let ids=null;
      if(!ehPreview) ids=await vendedoresVisiveis(profile);
      let q=sb.from('fichas_clientes')
        .select('id,vendedor_id,faturamento_previsto,created_at,usuarios:vendedor_id(nome),ficha_aprovacoes(status)');
      if(Array.isArray(ids)){
        if(!ids.length){setDados(resumo([]));return;}
        q=q.in('vendedor_id',ids);
      } else if(visao==='vendedor') q=q.eq('vendedor_id',profile.id);
      const {data}=await q;
      const lista=data||[];
      setDados(resumo(lista));

      if(visao!=='vendedor'){
        const map={};
        lista.forEach(f=>{
          const id=f.vendedor_id||'sem';
          if(!map[id])map[id]={id,nome:(f.usuarios&&f.usuarios.nome)||'Sem vendedor',fichas:[]};
          map[id].fichas.push(f);
        });
        setEquipe(Object.values(map).map(x=>({...x,...resumo(x.fichas)})).sort((a,b)=>b.total-a.total));
      }

      if(modulo==='administracao_vendas'){
        let qs=sb.from('usuarios').select('id,nome').eq('papel','supervisor').eq('ativo',true);
        if(visao==='adm_vendas'){
          const {data:cart}=await sb.from('adm_vendas_supervisores').select('supervisor_id').eq('adm_vendas_id',profile.id);
          const sid=(cart||[]).map(x=>x.supervisor_id);
          if(!sid.length){setSupervisoresDash([]);return;}
          qs=qs.in('id',sid);
        }
        const {data:sups}=await qs;
        const supRows=[];
        for(const sp of (sups||[])){
          const {data:vends}=await sb.from('usuarios').select('id').eq('papel','vendedor').eq('supervisor_id',sp.id).eq('ativo',true);
          const vids=(vends||[]).map(v=>v.id);
          const fichas=vids.length?lista.filter(f=>vids.includes(f.vendedor_id)):[];
          supRows.push({id:sp.id,nome:sp.nome,vendedores:vids.length,...resumo(fichas)});
        }
        setSupervisoresDash(supRows.sort((a,b)=>b.total-a.total));
      }
      return;
    }

    // Demais papéis mantêm a visão de fila operacional.
    let q=sb.from('ficha_aprovacoes').select('id,status,fichas_clientes(faturamento_previsto)');
    q=visao==='financeiro'?q.or('etapa.eq.financeiro,and(etapa.eq.analise_credito,status.eq.pendente)'):q.eq('etapa',visao);
    if(!ehPreview && ['supervisor','coordenador'].includes(visao))q=q.eq('responsavel_id',profile.id);
    const qs=sb.from('solicitacao_aprovacoes').select('id,status').eq('etapa',visao);
    const [rf,rs]=await Promise.all([visao==='manutencao'?Promise.resolve({data:[]}):q,qs]);
    const lf=rf.data||[],ls=rs.data||[];
    setDados({operacional:true,total:lf.length,aprovadas:lf.filter(x=>x.status==='aprovado').length,
      reprovadas:lf.filter(x=>x.status==='reprovado').length,andamento:lf.filter(x=>['pendente','aguardando'].includes(x.status)).length,
      solicitacoes:ls.filter(x=>x.status==='pendente').length,media:0,taxa:0});
  }

  if(!dados)return h('div',{className:'empty-state'},'Carregando...');
  const kpis=dados.operacional?[
    {icon:'⚑',cor:'warning',valor:dados.andamento,label:'Fichas pendentes'},
    {icon:'⚒',cor:'warning',valor:dados.solicitacoes,label:'Solicitações pendentes'},
    {icon:'✓',cor:'success',valor:dados.aprovadas,label:'Aprovadas'},
    {icon:'✗',cor:'danger',valor:dados.reprovadas,label:'Reprovadas'}
  ]:[
    {icon:'≡',cor:'accent',valor:dados.total,label:'Fichas enviadas'},
    {icon:'✓',cor:'success',valor:dados.aprovadas,label:'Fichas aprovadas'},
    {icon:'◳',cor:'warning',valor:dados.andamento,label:'Em andamento'},
    {icon:'%',cor:'info',valor:dados.taxa.toFixed(1)+'%',label:'Taxa de aprovação'},
    {icon:'R$',cor:'info',valor:fmtMoeda(dados.media),label:'Faturamento médio esperado'}
  ];

  return h('div',null,
    h('div',{className:'page-head'},h('div',null,
      h('div',{className:'page-title'},modulo==='administracao_vendas'?'Dashboard — Administração de Vendas':'Dashboard de Vendas'),
      h('div',{className:'page-sub'},
        visao==='vendedor'?'Seu desempenho comercial':
        visao==='adm_vendas'?'Indicadores da sua carteira de Supervisores':
        visao==='gestao_adm_vendas'?'Indicadores consolidados de todas as carteiras':'Desempenho da estrutura comercial'))),
    h('div',{className:'kpi-grid'},...kpis.map((k,i)=>h(Kpi,{key:i,...k}))),
    modulo==='administracao_vendas' && supervisoresDash.length>0 && h('div',{className:'card',style:{marginTop:18}},
      h('div',{className:'section-title'},'Desempenho por Carteira / Supervisor'),
      h('div',{style:{overflowX:'auto'}},
        h('table',{className:'data-table'},
          h('thead',null,h('tr',null,
            h('th',null,'Supervisor'),h('th',null,'Vendedores'),h('th',null,'Fichas enviadas'),h('th',null,'Aprovadas'),
            h('th',null,'Em andamento'),h('th',null,'Taxa aprovação'),h('th',null,'Fat. médio esperado'))),
          h('tbody',null,...supervisoresDash.map(sp=>h('tr',{key:sp.id},
            h('td',null,h('b',null,sp.nome)),h('td',null,sp.vendedores),h('td',null,sp.total),h('td',null,sp.aprovadas),
            h('td',null,sp.andamento),h('td',null,sp.taxa.toFixed(1)+'%'),h('td',null,fmtMoeda(sp.media)))))))),
    equipe.length>0 && h('div',{className:'card',style:{marginTop:18}},
      h('div',{className:'section-title'},'Desempenho por Vendedor'),
      h('div',{style:{overflowX:'auto'}},
        h('table',{className:'data-table'},
          h('thead',null,h('tr',null,
            h('th',null,'Vendedor'),h('th',null,'Enviadas'),h('th',null,'Aprovadas'),h('th',null,'Em andamento'),
            h('th',null,'Taxa aprovação'),h('th',null,'Fat. médio esperado'))),
          h('tbody',null,...equipe.map(v=>h('tr',{key:v.id},
            h('td',null,h('b',null,v.nome)),h('td',null,v.total),h('td',null,v.aprovadas),h('td',null,v.andamento),
            h('td',null,v.taxa.toFixed(1)+'%'),h('td',null,fmtMoeda(v.media))))))))
  );
}


// Confirmação administrativa com campo de senha mascarado.
// A senha existe somente em memória durante a confirmação.
function solicitarSenhaAdministrador(nomeUsuario) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';

    const box = document.createElement('div');
    box.style.cssText = 'width:min(430px,100%);background:#fff;border-radius:14px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.28);color:#172033';

    const titulo = document.createElement('div');
    titulo.textContent = 'Confirmar exclusão de usuário';
    titulo.style.cssText = 'font-size:18px;font-weight:800;margin-bottom:7px';

    const texto = document.createElement('div');
    texto.textContent = 'Digite sua senha de Administrador para excluir ' + nomeUsuario + '.';
    texto.style.cssText = 'font-size:13px;color:#667085;margin-bottom:16px;line-height:1.45';

    const input = document.createElement('input');
    input.type = 'password';
    input.autocomplete = 'current-password';
    input.placeholder = 'Senha do Administrador';
    input.style.cssText = 'width:100%;box-sizing:border-box;border:1px solid #cfd6e4;border-radius:8px;padding:11px 12px;font-size:14px;outline:none';

    const erro = document.createElement('div');
    erro.style.cssText = 'min-height:18px;color:#b42318;font-size:12px;margin-top:6px';

    const acoes = document.createElement('div');
    acoes.style.cssText = 'display:flex;justify-content:flex-end;gap:8px;margin-top:15px';

    const cancelar = document.createElement('button');
    cancelar.textContent = 'Cancelar';
    cancelar.style.cssText = 'border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer';

    const confirmar = document.createElement('button');
    confirmar.textContent = 'Confirmar exclusão';
    confirmar.style.cssText = 'border:0;background:#e6321f;color:#fff;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer';

    function fechar(valor) {
      document.removeEventListener('keydown', tecla);
      overlay.remove();
      resolve(valor);
    }
    function tecla(e) {
      if (e.key === 'Escape') fechar(null);
      if (e.key === 'Enter' && document.activeElement === input) {
        if (!input.value) { erro.textContent = 'Informe sua senha.'; return; }
        fechar(input.value);
      }
    }
    cancelar.onclick = () => fechar(null);
    confirmar.onclick = () => {
      if (!input.value) { erro.textContent = 'Informe sua senha.'; input.focus(); return; }
      fechar(input.value);
    };
    overlay.onclick = e => { if (e.target === overlay) fechar(null); };
    document.addEventListener('keydown', tecla);

    acoes.append(cancelar, confirmar);
    box.append(titulo, texto, input, erro, acoes);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    setTimeout(() => input.focus(), 30);
  });
}

function exportarRelatorioXlsx(nome, colunas, registros){
  if(!window.XLSX)throw Error('Biblioteca de Excel indisponível.');
  const ws=XLSX.utils.aoa_to_sheet([colunas,...registros]);
  ws['!cols']=colunas.map((c,i)=>({wch:Math.min(55,Math.max(17,c.length+4,...registros.slice(0,100).map(r=>String(r[i]??'').length+2)))}));
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(0,registros.length),c:colunas.length-1}})};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Relatório');
  XLSX.writeFile(wb,nome+'.xlsx');
}

    );

      exportarRelatorioXlsx('grespan_auditoria_acessos',
        ['Nome','E-mail','Função','Cadastro','Última atividade','Sessões 7 dias','Sessões 30 dias','Sessões total'],

      toast('Auditoria exportada.','success');
    }catch(e){toast(e.message||String(e),'error');}
  }
  const historico=(dados?.sessoes||[]).filter(v=>v.usuario_id===selecionado);
  const detalhe=selecionado?h('div',{className:'card',style:{marginTop:12}},
    h('div',{className:'section-title'},'Sessões de '+(usuarios.find(u=>u.id===selecionado)?.nome||'')),
    h('div',{className:'table-wrap',style:{overflow:'auto',maxHeight:360}},
      h('table',{className:'data-table'},
        h('thead',null,h('tr',null,...['Entrada','Última atividade','Módulo','Página','Dispositivo','Eventos'].map(t=>h('th',{key:t},t)))),
        h('tbody',null,...historico.map((v,i)=>h('tr',{key:i},
          h('td',null,fmt(v.inicio_em)),h('td',null,fmt(v.ultima_atividade_em)),
          h('td',null,MODULOS[v.ultimo_modulo]?.label||v.ultimo_modulo||'—'),
          h('td',null,v.ultima_pagina||'—'),h('td',null,v.dispositivo||'—'),h('td',null,v.eventos)
        )))
      )
    )
  ):null;
  const painel=dados?h('div',null,
    h('div',{className:'kpi-grid'},...cards),
    h('div',{className:'card',style:{marginTop:15}},
      h('div',{style:{display:'flex',gap:10,marginBottom:12,flexWrap:'wrap'}},
        h('input',{className:'form-input',value:filtro,placeholder:'Buscar usuário, e-mail ou função',onChange:e=>setFiltro(e.target.value)}),
        h('select',{className:'form-select',value:periodo,onChange:e=>setPeriodo(e.target.value)},
          h('option',{value:'7'},'Últimos 7 dias'),h('option',{value:'30'},'Últimos 30 dias'))
      ),
      h('div',{className:'page-sub'},filtrados.length+' usuários. Histórico disponível a partir da implantação.'),
      h('div',{className:'table-wrap',style:{overflowX:'auto',maxHeight:540,overflowY:'auto'}},
        h('table',{className:'data-table'},
          h('thead',null,h('tr',null,...cab.map(v=>h('th',{key:v},v)))),
          h('tbody',null,...linhas)
        )
      )

    detalhe,
    h('div',{className:'page-sub',style:{marginTop:12}},'Auditoria de sessões, sem IP ou GPS. Definir aviso de privacidade e política de retenção.')
  ):null;
  return h('div',null,
    h('div',{className:'page-head'},
      h('div',null,h('div',{className:'page-title'},'Auditoria de Acessos'),h('div',{className:'page-sub'},'Uso do sistema por usuário e último acesso.')),

        h('button',{className:'btn btn-secondary',disabled:carregando,onClick:carregar},carregando?'Consultando...':'Atualizar'),

      )
    ),
    erro?h('div',{className:'card'},'Auditoria indisponível: '+erro+'. Execute a migração SQL da auditoria.'):null,

}


function PaginaGestaoCarteiras({profile}){
  const toast=useToast();
  const [usuarios,setUsuarios]=useState([]);
  const [clientes,setClientes]=useState([]);
  const [linhas,setLinhas]=useState([]);
  const [arquivo,setArquivo]=useState('');
  const [origem,setOrigem]=useState('');
  const [destino,setDestino]=useState('');
  const [motivo,setMotivo]=useState('');
  const [carregando,setCarregando]=useState(false);
  const [aplicando,setAplicando]=useState(false);
  const [tipo,setTipo]=useState('sa1');
  const [filtro,setFiltro]=useState('todos');
  const [historico,setHistorico]=useState([]);
  const [aviso,setAviso]=useState('');
  const norm=v=>String(v??'').trim().replace(/^0+/,'')||'0';
  const loja=v=>String(v??'01').trim().padStart(2,'0');
  async function carregarBase(){
    setCarregando(true);
    try{
      const u=await sb.from('usuarios').select('id,nome,papel,ativo,codigo_vendedor,supervisor_id').limit(10000);
      if(u.error)throw u.error;
      const todos=[];
      for(let i=0;i<30000;i+=500){
        const c=await sb.from('clientes').select('id,codigo_totvs,loja_totvs,razao_social,vendedor_id')
          .order('id').range(i,i+499);
        if(c.error)throw c.error;
        todos.push(...(c.data||[]));
        if((c.data||[]).length<500)break;
      }
      setUsuarios(u.data||[]);setClientes(todos);
      const h=await sb.rpc('carteira_historico');
      if(!h.error)setHistorico(h.data||[]);
      setAviso(todos.length+' clientes carregados para comparação. Nenhum cadastro foi alterado.');
    }catch(e){setAviso('Erro ao carregar base: '+(e.message||e));}
    finally{setCarregando(false);}
  }
  useEffect(()=>{if(profile.papel==='admin')carregarBase();},[profile.id]);
  function montarIndices(){
    const cli=new Map(),vendedores=new Map(),usr=Object.fromEntries(usuarios.map(u=>[u.id,u]));
    clientes.forEach(c=>{
      const k=String(c.codigo_totvs||'').trim()+'|'+loja(c.loja_totvs);
      if(!cli.has(k))cli.set(k,[]);cli.get(k).push(c);
    });
    usuarios.filter(u=>u.papel==='vendedor'&&u.ativo!==false).forEach(u=>{
      const k=norm(u.codigo_vendedor);
      if(!u.codigo_vendedor)return;
      if(!vendedores.has(k))vendedores.set(k,[]);vendedores.get(k).push(u);
    });
    return {cli,vendedores,usr};
  }
  function analisar(lista){
    const {cli,vendedores,usr}=montarIndices(),repetidos=new Set();
    return lista.map((r,i)=>{
      const cod=String(r.codigo_totvs||'').trim(),lj=loja(r.loja_totvs);
      const encontrados=cli.get(cod+'|'+lj)||[];
      const vCod=norm(r.codigo_vendedor),possiveis=vendedores.get(vCod)||[];
      let status='Alterar',dest=null,c=encontrados[0]||null;
      if(!cod||!r.codigo_vendedor||vCod==='0')status='Vendedor não informado (ignorado)';
      else if(encontrados.length===0)status='Cliente não localizado';
      else if(encontrados.length>1)status='Cliente ambíguo';
      else if(possiveis.length===0)status='Vendedor sem usuário ativo';
      else if(possiveis.length>1)status='Código de vendedor duplicado';
      else{
        dest=possiveis[0];
        if(c.vendedor_id===dest.id)status='Sem mudança';
        // O supervisor do SA1 é conferência. Não muda a hierarquia automaticamente.
        const sup=usr[dest.supervisor_id],codSup=norm(r.codigo_supervisor);
        if(status==='Alterar'&&r.codigo_supervisor&&codSup!=='0'&&sup?.codigo_vendedor&&norm(sup.codigo_vendedor)!==codSup)
          status='Conferir supervisor';
      }
      const key=cod+'|'+lj;
      if(repetidos.has(key)&&status==='Alterar')status='Cliente repetido no arquivo';
      repetidos.add(key);
      return {...r,linha:i+1,cliente:c,destino:dest,status};
    });
  }
  // Reconhece a exportação SA1 padrão do TOTVS e os campos CSV duplicados
  // de aspas que envolvem cada linha. Utiliza somente as 44 primeiras colunas.
  function csvCampos(texto){
    const campos=[];let atual='',aspas=false;
    for(let i=0;i<texto.length;i++){
      const ch=texto[i];
      if(ch==='"'){
        if(aspas&&texto[i+1]==='"'){atual+='"';i++;}
        else aspas=!aspas;
      }else if(ch===','&&!aspas){campos.push(atual);atual='';if(campos.length>=44)break;}
      else atual+=ch;
    }
    if(campos.length<44)campos.push(atual);
    return campos;
  }
  async function carregarSa1(file){
    if(!file)return;
    setLinhas([]);setArquivo(file.name);setTipo('sa1');
    try{
      const raw=await file.arrayBuffer();
      if(raw.byteLength>25000000)throw Error('Arquivo superior a 25 MB.');
      const texto=new TextDecoder('iso-8859-1').decode(raw);
      const linhasFisicas=texto.split(/\r?\n/);
      const grupos=[];
      for(const l of linhasFisicas){
        if(/^"\d{4},/.test(l)||/^"Filial,/.test(l))grupos.push(l);
        else if(grupos.length)grupos[grupos.length-1]+=' '+l;
      }
      const registro=grupos.map(x=>{
        let t=x;
        if(t.startsWith('"'))t=t.slice(1);
        const final=t.lastIndexOf('";;;');if(final>=0)t=t.slice(0,final);
        t=t.replace(/""/g,'"');
        return csvCampos(t);
      });
      if(!registro.length)throw Error('Nenhuma linha SA1 identificada.');
      const cab=registro[0].map(x=>String(x||'').trim());
      const cCod=cab.indexOf('Codigo'),cLoja=cab.indexOf('Loja'),cV=cab.indexOf('Vendedor'),cS=cab.indexOf('* Supervisor'),cNome=cab.indexOf('Nome');
      if([cCod,cLoja,cV,cS].some(v=>v<0))throw Error('Colunas Código, Loja, Vendedor ou Supervisor não encontradas.');
      const rows=registro.slice(1).filter(r=>r[cCod]&&/^\d+$/.test(String(r[cCod]).trim())).map(r=>({
        codigo_totvs:String(r[cCod]||'').trim(),loja_totvs:loja(r[cLoja]),
        codigo_vendedor:String(r[cV]||'').trim(),codigo_supervisor:String(r[cS]||'').trim(),
        razao_social:String(r[cNome]||'').trim()
      }));
      if(rows.length>10000)throw Error('Arquivo acima do limite de 10 mil clientes.');
      setLinhas(analisar(rows));setAviso(rows.length+' registros SA1 analisados. Somente mudanças validadas podem ser confirmadas.');
    }catch(e){setAviso('Falha na leitura da SA1: '+(e.message||e));}
  }
  function prepararTransferencia(){
    if(!origem||!destino||origem===destino)return toast('Selecione vendedores diferentes.','error');
    const {usr}=montarIndices(),d=usr[destino];
    if(!d||d.papel!=='vendedor'||d.ativo===false)return toast('Vendedor de destino inválido.','error');
    setTipo('manual');setArquivo('Transferência manual');
    setLinhas(clientes.filter(c=>c.vendedor_id===origem).map(c=>({
      cliente:c,codigo_totvs:c.codigo_totvs,loja_totvs:loja(c.loja_totvs),razao_social:c.razao_social,
      codigo_vendedor:d.codigo_vendedor,codigo_supervisor:'',destino:d,status:'Alterar'
    })));
    setAviso('Prévia de transferência manual. Histórico de pedidos não será alterado.');
  }
  const alteracoes=linhas.filter(r=>r.status==='Alterar');
  const visiveis=linhas.filter(r=>filtro==='todos'||r.status===filtro);
  async function aplicar(){
    if(!alteracoes.length)return toast('Não existem alterações elegíveis.','error');
    if(motivo.trim().length<6)return toast('Informe o motivo da movimentação.','error');
    if(!window.confirm('Confirmar '+alteracoes.length+' mudanças de carteira? Os pedidos históricos serão preservados.'))return;
    setAplicando(true);let feitos=0;
    try{
      for(let i=0;i<alteracoes.length;i+=100){
        const lote=alteracoes.slice(i,i+100).map(r=>({
          cliente_id:r.cliente.id,vendedor_anterior_id:r.cliente.vendedor_id||null,vendedor_novo_id:r.destino.id,
          codigo_totvs:r.cliente.codigo_totvs,loja_totvs:loja(r.cliente.loja_totvs)
        }));
        const {data,error}=await sb.rpc('carteira_aplicar_lote',{p_movimentos:lote,p_motivo:motivo.trim(),p_origem:tipo==='manual'?'MANUAL':'SA1'});
        if(error)throw error;
        feitos+=Number(data?.alterados||0);
        setAviso(feitos+' de '+alteracoes.length+' alterações confirmadas.');
      }
      setLinhas([]);setArquivo('');setMotivo('');
      toast(feitos+' vínculos atualizados.','success');
      await carregarBase();
    }catch(e){setAviso('Operação interrompida após '+feitos+' atualizações. '+(e.message||e)+'. Atualize a prévia antes de tentar novamente.');}
    finally{setAplicando(false);}
  }
  const ativos=usuarios.filter(u=>u.papel==='vendedor'&&u.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome));
  const selectV=(valor,atualizar,label)=>h('select',{className:'form-select',value:valor,onChange:e=>atualizar(e.target.value)},
    h('option',{value:''},label),
    ...usuarios.filter(u=>u.papel==='vendedor').sort((a,b)=>a.nome.localeCompare(b.nome))
      .map(u=>h('option',{value:u.id,key:u.id},u.nome+' ('+(u.codigo_vendedor||'sem código')+')'+(u.ativo===false?' [inativo]':''))));
  const cab=['Código','Loja','Cliente','Vendedor SA1','Supervisor SA1','Vendedor atual','Novo vendedor','Resultado'];
  const mapU=Object.fromEntries(usuarios.map(u=>[u.id,u]));
  const tabela=h('div',{className:'table-wrap',style:{maxHeight:470,overflow:'auto'}},
    h('table',{className:'data-table'},
      h('thead',null,h('tr',null,...cab.map(t=>h('th',{key:t},t)))),
      h('tbody',null,...visiveis.slice(0,800).map((r,i)=>h('tr',{key:i},
        h('td',null,r.codigo_totvs||'—'),h('td',null,r.loja_totvs||'—'),
        h('td',null,r.cliente?.razao_social||r.razao_social||'—'),
        h('td',null,r.codigo_vendedor||'—'),h('td',null,r.codigo_supervisor||'—'),
        h('td',null,mapU[r.cliente?.vendedor_id]?.nome||'Sem vínculo'),
        h('td',null,r.destino?.nome||'—'),h('td',null,r.status)
      )))
    )
  );
  if(profile.papel!=='admin')return h('div',{className:'card'},'Acesso restrito ao Administrador do Sistema.');
  const opcoes=['todos',...new Set(linhas.map(r=>r.status))];
  return h('div',null,
    h('div',{className:'page-head'},h('div',null,h('div',{className:'page-title'},'Gestão de Carteiras Comerciais'),
      h('div',{className:'page-sub'},'Atualização de vínculos cliente × vendedor com prévia e auditoria.'))),
    h('div',{className:'card'},
      h('div',{className:'section-title'},'Importar SA1 do Protheus'),
      h('div',{className:'page-sub',style:{marginBottom:10}},'Aceita o CSV original exportado pelo TOTVS. Não altera razão social, CNPJ, endereço, preços ou pedidos. Código 000000 é ignorado.'),
      h('input',{type:'file',accept:'.csv',disabled:carregando||aplicando,onChange:e=>carregarSa1(e.target.files?.[0])}),
      h('div',{style:{marginTop:10}},h('button',{className:'btn btn-secondary btn-sm',disabled:carregando||aplicando,onClick:carregarBase},carregando?'Carregando...':'Atualizar cadastros')),
      h('div',{className:'page-sub',style:{marginTop:8}},arquivo||'Nenhum arquivo selecionado.')
    ),
    h('div',{className:'card',style:{marginTop:12}},
      h('div',{className:'section-title'},'Transferir carteira de um vendedor'),
      h('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}},
        selectV(origem,setOrigem,'Vendedor de origem'),
        selectV(destino,setDestino,'Vendedor de destino'),
        h('button',{className:'btn btn-secondary',disabled:!clientes.length||aplicando,onClick:prepararTransferencia},'Prévia da transferência'))
    ),
    aviso&&h('div',{className:'page-sub',style:{margin:12}},aviso),
    linhas.length>0&&h('div',{className:'card',style:{marginTop:12}},
      h('div',{className:'section-title'},'Prévia — '+linhas.length+' clientes analisados | '+alteracoes.length+' alterações elegíveis'),
      h('div',{className:'page-sub',style:{marginBottom:12}},'Clientes não localizados, sem vendedor, com vendedor não cadastrado, supervisor divergente e sem mudança não serão atualizados. Prévia limitada aos primeiros 800 registros do filtro.'),
      h('select',{className:'form-select',style:{marginBottom:10,maxWidth:280},value:filtro,onChange:e=>setFiltro(e.target.value)},
        ...opcoes.map(v=>h('option',{key:v,value:v},v==='todos'?'Todos os resultados':v+' ('+linhas.filter(r=>r.status===v).length+')'))),
      tabela,
      h(Campo,{label:'Motivo obrigatório (ex.: reorganização comercial / troca de vendedor)'},
        h('input',{className:'form-input',maxLength:240,value:motivo,onChange:e=>setMotivo(e.target.value),placeholder:'Informe o motivo da movimentação'})),
      h('button',{className:'btn btn-primary',disabled:!alteracoes.length||aplicando||motivo.trim().length<6,onClick:aplicar},
        aplicando?'Aplicando alterações...':'Confirmar '+alteracoes.length+' alterações de carteira')
    ),
    h('div',{className:'card',style:{marginTop:12}},
      h('div',{className:'section-title'},'Histórico de movimentações'),
      h('div',{className:'page-sub'},'Últimos registros de alterações aplicadas por administradores.'),
      h('div',{className:'table-wrap',style:{maxHeight:280,overflow:'auto'}},
        h('table',{className:'data-table'},
          h('thead',null,h('tr',null,...['Data','Cliente','De','Para','Motivo','Administrador'].map(t=>h('th',{key:t},t)))),
          h('tbody',null,...historico.slice(0,300).map((r,i)=>h('tr',{key:i},
            h('td',null,new Date(r.realizado_em).toLocaleString('pt-BR')),h('td',null,r.cliente||r.codigo_totvs),
            h('td',null,r.vendedor_anterior||'—'),h('td',null,r.vendedor_novo||'—'),
            h('td',null,r.motivo),h('td',null,r.responsavel)
          )))
        )
      )
    )
  );
}

function PaginaRelatoriosAdmin({profile}){

  })();},[]);

  const ultimo=Object.fromEntries(acessos.map(a=>[a.usuario_id,a.ultimo_acesso]));

    (!filtro||[u.nome,u.email,u.papel,u.codigo_vendedor].some(x=>String(x||'').toLowerCase().includes(filtro.toLowerCase()))));
  function exportar(){

// PDF do relatório de visita técnica (texto, fotos e assinatura). Usado pela equipe técnica e,
// em consulta, pelo módulo Vendas. r = conteúdo do relatório; v = visita com v.clientes.
function gerarPdfRelatorioVisita(r,v,tecnicoNome){
  const c=v.clientes||{},doc=new window.jspdf.jsPDF(),W=210;
  const novaPagina=()=>{doc.addPage();y=22;doc.setTextColor(30,36,44);};
  let y=22;
  const verificar=h=>{if(y+h>277)novaPagina();};
  doc.setFillColor(190,30,38);doc.rect(0,0,W,12,'F');
  doc.setTextColor(30,36,44);doc.setFont('helvetica','bold');logoGrespanPDF(doc,14,16,11);
  doc.setFontSize(11);doc.text(r.tipo_formulario==='treinamento'?'RELATÓRIO DE TREINAMENTO TÉCNICO':'RELATÓRIO DE VISITA TÉCNICA',14,35);y=45;
  const secao=t=>{verificar(16);doc.setFillColor(242,243,245);doc.rect(14,y-5,182,10,'F');doc.setTextColor(150,25,32);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text(t,18,y+1);y+=13;};
  const linha=(label,val)=>{
    const texto=String(val??'—');verificar(12);
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(30,36,44);
    doc.text(label+':',16,y);y+=5;
    doc.setFont('helvetica','normal');doc.setFontSize(9);
    const linhas=doc.splitTextToSize(texto,176);
    linhas.forEach(t=>{
      verificar(7);
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(30,36,44);
      doc.text(String(t),18,y);y+=5;
    });
    y+=5;
  };
  secao('CLIENTE');linha('Razão social',c.razao_social||c.nome_fantasia);linha('Código TOTVS',c.codigo_totvs);linha('Endereço',enderecoVisita(v));
  secao('ATENDIMENTO');linha('Técnico responsável',tecnicoNome);linha('Data',v.data_visita);linha('Check-in',v.checkin_em?new Date(v.checkin_em).toLocaleString('pt-BR'):'');linha('Check-out',v.checkout_em?new Date(v.checkout_em).toLocaleString('pt-BR'):'');
  const campos=r.tipo_formulario==='treinamento'?[['Serviço prestado','servico_prestado'],['Orientação','orientacao'],...VT_CAMPOS_TREINAMENTO.map((c,i)=>[(i+1)+') '+c[3],c[0]])]:[['Serviço prestado','servico_prestado'],['Orientação','orientacao'],['Relato de execução','relato_execucao'],['Vendedor responsável','vendedor_responsavel'],['Equipamentos','equipamentos'],['Logística','logistica'],['Sugestões de melhoria','sugestao_melhoria'],['Observações','observacoes'],['Tipos de produção','tipo_producao']];
  secao(r.tipo_formulario==='treinamento'?'TREINAMENTO TÉCNICO (EQUIPE TÉCNICA)':'RELATÓRIO DE EXECUÇÃO');campos.forEach(([l,k])=>linha(l,r[k]));
  if(r.imagens?.length){secao('REGISTRO FOTOGRÁFICO');for(const foto of r.imagens){try{const tipo=foto.dados.startsWith('data:image/png')?'PNG':'JPEG';verificar(77);doc.addImage(foto.dados,tipo,18,y,90,65,undefined,'FAST');y+=73;}catch(e){linha('Foto',foto.nome+' (não foi possível incluir no PDF)');}}}
  secao('ASSINATURA DO RESPONSÁVEL');linha('Nome',r.responsavel_nome);
  if(r.assinatura){verificar(38);doc.addImage(r.assinatura,'PNG',18,y,145,32);y+=36;}
  doc.setFontSize(8);doc.setTextColor(100);doc.text('GRESPAN · Registro eletrônico de visita técnica',14,289);
  doc.save('grespan-visita-'+(c.codigo_totvs||v.id)+'.pdf');
}

function PaginaRelatoriosVisitas({profile,visao}){
  const toast=useToast();

        }));

      h(Campo,{label:'Data inicial'},h('input',{className:'form-input',type:'date',value:inicio,onChange:e=>setInicio(e.target.value)})),
      h(Campo,{label:'Data final'},h('input',{className:'form-input',type:'date',value:fim,onChange:e=>setFim(e.target.value)})),
      h(Campo,{label:'Profissional'},h('select',{className:'form-select',value:profissional,onChange:e=>setProfissional(e.target.value)},
        h('option',{value:''},'Todos'),usuarios.filter(u=>['tec_panificacao','lider_tec_panificacao','supervisor_tec_panificacao'].includes(u.papel)).map(u=>h('option',{key:u.id,value:u.id},u.nome)))),
      h(Campo,{label:'Cliente / código TOTVS'},h('input',{className:'form-input',value:cliente,onChange:e=>setCliente(e.target.value)})),
      h(Campo,{label:'Status'},h('select',{className:'form-select',value:status,onChange:e=>setStatus(e.target.value)},
        h('option',{value:''},'Todos'),h('option',{value:'agendada'},'Agendada'),h('option',{value:'em_andamento'},'Em andamento'),h('option',{value:'concluida'},'Concluída'),h('option',{value:'cancelada'},'Cancelada'))),
      h('button',{className:'btn btn-primary',disabled:carregando,onClick:exportar},carregando?'Gerando...':'Exportar Excel (.xlsx)')));
}

function PaginaAdmin({ profile }) {
  const toast = useToast();
  const [caminhoes,setCaminhoes]=useState([]);
  const [erroCaminhoes,setErroCaminhoes]=useState('');
  const [usuarios, setUsuarios] = useState(null);
  const [novo, setNovo] = useState(NOVO_VAZIO);
  const [criando, setCriando] = useState(false);
  const [modalNovo, setModalNovo] = useState(false);
  const [edicoes, setEdicoes] = useState({});
  const [fPapel,setFPapel]=useState('');
  const [fSupervisor,setFSupervisor]=useState('');
  const [fCoordenador,setFCoordenador]=useState('');

  useEffect(() => { carregar(); }, []);
  async function carregar() {
    const [u,c]=await Promise.all([
      sb.from('usuarios').select('*').order('papel').order('nome'),
      sb.from('caminhoes_equipamentos').select('*').order('placa')
    ]);
    if(u.error)toast(u.error.message,'error');
    setCaminhoes(c.data||[]);setErroCaminhoes(c.error?.message||'');
    setUsuarios(u.data || []);
    setEdicoes({});
  }

  const supervisores = (usuarios || []).filter(u => ['supervisor','supervisor_tec_panificacao','lider_tec_panificacao'].includes(u.papel) && u.ativo === true);
  const coordenadores = (usuarios || []).filter(u => u.papel === 'coordenador' && u.ativo === true);
  // Hierarquia técnica separada: Supervisor Técnico responde ao Coordenador Técnico; os demais, ao Coordenador Comercial.
  const coordenadoresTecnicos = (usuarios || []).filter(u => u.papel === 'coordenador_tec_panificacao' && u.ativo === true);
  const coordenadoresDoPapel = papel => ['supervisor_tec_panificacao','lider_tec_panificacao','tec_panificacao'].includes(papel) ? coordenadoresTecnicos : coordenadores;

  function editar(id, campo, valor) {
    setEdicoes(prev => ({ ...prev, [id]: { ...(prev[id] || {}), [campo]: valor } }));
  }
  function valorDe(u, campo) {
    const e = edicoes[u.id];
    return e && campo in e ? e[campo] : (u[campo] === null ? '' : u[campo]);
  }

  function validarCaminhaoMotorista(caminhaoId,usuarioId,ativo){
    if(erroCaminhoes)return 'Não foi possível consultar as placas: '+erroCaminhoes;
    const caminhao=caminhoes.find(c=>c.id===caminhaoId&&c.propriedade==='manutencao'&&(c.ativo||!ativo));
    if(!caminhao)return 'Selecione a placa de um caminhão da Manutenção.';
    if(ativo&&usuarios.some(u=>u.id!==usuarioId&&u.papel==='motorista_manutencao'&&u.ativo!==false&&u.caminhao_equipamentos_id===caminhaoId))
      return 'Essa placa já está vinculada a um motorista ativo.';
    return '';
  }

  async function salvarUsuario(u) {
    const e = edicoes[u.id];
    if (!e) return;
    const papelEscolhido=valorDe(u,'papel');
    const supEscolhido=papelEscolhido==='motorista_manutencao'?'':valorDe(u,'supervisor_id');
    const papelSuperiorEsperado=papelEscolhido==='tec_panificacao'?'lider_tec_panificacao':papelEscolhido==='lider_tec_panificacao'?'supervisor_tec_panificacao':papelEscolhido==='vendedor'?'supervisor':null;
    const coordEscolhido=papelEscolhido==='motorista_manutencao'?'':valorDe(u,'coordenador_id');
    const caminhaoId=papelEscolhido==='motorista_manutencao'?valorDe(u,'caminhao_equipamentos_id'):null;
    if(papelEscolhido==='motorista_manutencao'){
      const erro=validarCaminhaoMotorista(caminhaoId,u.id,valorDe(u,'ativo')!==false);
      if(erro)return toast(erro,'error');
    }
    if(supEscolhido && (!supervisores.some(x=>x.id===supEscolhido) || (papelSuperiorEsperado && !supervisores.some(x=>x.id===supEscolhido&&x.papel===papelSuperiorEsperado))))
      return toast('O supervisor selecionado está inativo ou não está disponível.','error');
    if(coordEscolhido && coordEscolhido!==(u.coordenador_id||'') && !coordenadoresDoPapel(papelEscolhido).some(x=>x.id===coordEscolhido))
      return toast('O coordenador selecionado está inativo ou não pertence à hierarquia deste perfil.','error');
    const nomeEditado=String(valorDe(u,'nome')||'').trim();
    if(!nomeEditado) return toast('O nome do usuário é obrigatório.','error');
    const { error } = await sb.from('usuarios').update({
      nome: nomeEditado,
      papel: valorDe(u, 'papel'),
      telefone: valorDe(u, 'telefone') || null,
      codigo_vendedor: valorDe(u, 'codigo_vendedor') || null,
      supervisor_id: supEscolhido || null,
      coordenador_id: coordEscolhido || null,
      ...(papelEscolhido==='motorista_manutencao'||u.caminhao_equipamentos_id?{caminhao_equipamentos_id:caminhaoId}:{}),
      exigir_troca_senha: !!valorDe(u, 'exigir_troca_senha'),
      ativo: valorDe(u, 'ativo'),
    }).eq('id', u.id);
    if (error) return toast(error.message, 'error');
    toast('Usuário atualizado.', 'success');
    carregar();
  }

  async function excluirUsuario(u) {
    if (!profile || profile.papel !== 'admin') return toast('Somente Administradores podem excluir usuários.', 'error');
    if (u.id === profile.id) return toast('Você não pode excluir o próprio usuário que está logado.', 'error');

    const nome = u.nome || u.email || 'Usuário';
    if (!window.confirm(
      'EXCLUSÃO DEFINITIVA DE USUÁRIO\n\n' + nome + '\n' + (u.email || '') +
      '\n\nO usuário perderá o acesso ao sistema. Esta ação não poderá ser desfeita.\n\nDeseja continuar?'
    )) return;

    const senhaAdmin = await solicitarSenhaAdministrador(nome);
    if (!senhaAdmin) return toast('Exclusão cancelada.', 'info');

    // Reautentica o Administrador atual. A senha não é salva nem enviada
    // para a função de exclusão; é usada somente pelo Supabase Auth.
    const emailAdmin = profile.email || '';
    const { error: authError } = await sb.auth.signInWithPassword({
      email: emailAdmin,
      password: senhaAdmin
    });

    if (authError) return toast('Senha de Administrador incorreta. Usuário não excluído.', 'error');

    const { error } = await sb.rpc('excluir_usuario_definitivamente', { p_usuario_id: u.id });
    if (error) return toast('Não foi possível excluir o usuário: ' + error.message, 'error');

    toast('Usuário excluído definitivamente.', 'success');
    carregar();
  }

  async function criarUsuario() {
    if (!novo.nome.trim() || !novo.email.trim() || !novo.senha) return toast('Nome, e-mail e senha são obrigatórios.', 'error');
    if (novo.senha.length < 6) return toast('A senha precisa ter ao menos 6 caracteres.', 'error');
    if(novo.papel==='motorista_manutencao'){
      const erro=validarCaminhaoMotorista(novo.caminhao_equipamentos_id,null,true);
      if(erro)return toast(erro,'error');
    }
    if(novo.supervisor_id && !supervisores.some(x=>x.id===novo.supervisor_id&&(!['vendedor','lider_tec_panificacao','tec_panificacao'].includes(novo.papel)||x.papel===(novo.papel==='vendedor'?'supervisor':novo.papel==='lider_tec_panificacao'?'supervisor_tec_panificacao':'lider_tec_panificacao'))))
      return toast('O supervisor selecionado está inativo ou não está disponível.','error');
    if(novo.coordenador_id && !coordenadoresDoPapel(novo.papel).some(x=>x.id===novo.coordenador_id))
      return toast('O coordenador selecionado está inativo ou não está disponível.','error');
    setCriando(true);
    const { data: auth, error: errAuth } = await sbSignup.auth.signUp({ email: novo.email.trim(), password: novo.senha });
    if (errAuth || !auth.user) { setCriando(false); return toast(errAuth ? errAuth.message : 'Falha ao criar login.', 'error'); }

    const { error } = await sb.from('usuarios').insert({
      id: auth.user.id, nome: novo.nome.trim(), email: novo.email.trim(),
      telefone: novo.telefone || null, codigo_vendedor: novo.codigo_vendedor || null, papel: novo.papel,
      supervisor_id: novo.papel==='motorista_manutencao'?null:novo.supervisor_id || null,
      coordenador_id: novo.papel==='motorista_manutencao'?null:novo.coordenador_id || null,
      ...(novo.papel==='motorista_manutencao'?{caminhao_equipamentos_id:novo.caminhao_equipamentos_id}:{}),
    });
    setCriando(false);
    if (error) return toast('Login criado, mas o perfil falhou: ' + error.message, 'error');
    toast('Usuário criado! Informe a senha temporária por fora do sistema.', 'success');
    setNovo(NOVO_VAZIO); setModalNovo(false); carregar();
  }

  if (usuarios === null) return h('div', { className: 'empty-state' }, 'Carregando...');

  const usuariosFiltrados=usuarios.filter(u=>{
    if(fPapel && u.papel!==fPapel) return false;
    if(fSupervisor && u.supervisor_id!==fSupervisor) return false;
    if(fCoordenador && u.coordenador_id!==fCoordenador) return false;
    return true;
  });

  return h('div', null,
    modalNovo && h(Modal, {
      titulo: 'Novo usuário',
      sub: 'O login é criado automaticamente — informe a senha temporária à pessoa por fora do sistema.',
      onClose: () => setModalNovo(false),
      acoes: [
        h('button', { key: 'c', className: 'btn btn-secondary', onClick: () => setModalNovo(false) }, 'Cancelar'),
        h('button', { key: 'ok', className: 'btn btn-primary', onClick: criarUsuario, disabled: criando }, criando ? 'Criando...' : 'Criar usuário')
      ]
    },
      h('div', { className: 'form-grid' },
        h(Campo, { label: 'Nome', obrigatorio: true }, h(Input, { value: novo.nome, onChange: e => setNovo({ ...novo, nome: e.target.value }) })),
        h(Campo, { label: 'E-mail', obrigatorio: true }, h(Input, { type: 'email', value: novo.email, onChange: e => setNovo({ ...novo, email: e.target.value }) })),
        h(Campo, { label: 'Senha temporária', obrigatorio: true }, h(Input, { value: novo.senha, placeholder: 'mín. 6 caracteres', onChange: e => setNovo({ ...novo, senha: e.target.value }) })),
        h(Campo, { label: 'Telefone (WhatsApp)' }, h(Input, { value: novo.telefone, inputMode: 'numeric', placeholder: '+55 (14) 99999-9999', onChange: e => setNovo({ ...novo, telefone: mascaraTelefoneIntl(e.target.value) }) })),
        h(Campo, { label: 'Código do vendedor' }, h(Input, { value: novo.codigo_vendedor, placeholder: 'Ex.: 0012', onChange: e => setNovo({ ...novo, codigo_vendedor: e.target.value }) })),
        h(Campo, { label: 'Papel', obrigatorio: true },
          h('select', { className: 'form-select', value: novo.papel, onChange: e => setNovo({ ...novo, papel: e.target.value, supervisor_id:'', coordenador_id:'', caminhao_equipamentos_id:'' }) },
            PAPEIS.map(p => h('option', { key: p, value: p }, ROLE_LABELS[p])))),
        novo.papel==='motorista_manutencao'&&h(Campo,{label:'Placa do veículo',obrigatorio:true},
          selecionarPlaca(caminhoes,novo.caminhao_equipamentos_id,id=>setNovo({...novo,caminhao_equipamentos_id:id}))),
        ['vendedor','lider_tec_panificacao','tec_panificacao'].includes(novo.papel) && h(Campo, { label: novo.papel==='tec_panificacao'?'Líder Tec Panificação':novo.papel==='lider_tec_panificacao'?'Supervisor Tec Panificação':'Supervisor responsável' },
          h('select', { className: 'form-select', value: novo.supervisor_id, onChange: e => setNovo({ ...novo, supervisor_id: e.target.value }) },
            h('option', { value: '' }, 'Selecione...'),
            supervisores.filter(s=>novo.papel==='tec_panificacao'?s.papel==='lider_tec_panificacao':novo.papel==='lider_tec_panificacao'?s.papel==='supervisor_tec_panificacao':s.papel==='supervisor').map(s => h('option', { key: s.id, value: s.id }, s.nome)))),
        ['supervisor','supervisor_tec_panificacao'].includes(novo.papel) && h(Campo, { label: novo.papel==='supervisor_tec_panificacao'?'Coordenador Tec Panificação':'Coordenador responsável' },
          h('select', { className: 'form-select', value: novo.coordenador_id, onChange: e => setNovo({ ...novo, coordenador_id: e.target.value }) },
            h('option', { value: '' }, 'Selecione...'),
            coordenadoresDoPapel(novo.papel).map(c => h('option', { key: c.id, value: c.id }, c.nome)))))),

    h('div', { className: 'page-head' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Gestão de Usuários'),
        h('div', { className: 'page-sub' }, usuariosFiltrados.length + ' de ' + usuarios.length + ' usuário(s) · hierarquia comercial e técnica')),
      h('div',{style:{display:'flex',gap:8}},
        h('button', { className:'btn btn-secondary', onClick:()=>window.dispatchEvent(new CustomEvent('abrir-config-modulos')) }, 'Módulos e Carteiras'),
        h('button', { className: 'btn btn-primary', onClick: () => setModalNovo(true) }, '+ Novo usuário'))),

    h('div',{className:'card',style:{marginBottom:12}},
      h('div',{className:'section-title'},'Filtros'),
      h('div',{className:'form-grid',style:{gridTemplateColumns:'repeat(3,minmax(180px,1fr))'}},
        h(Campo,{label:'Papel'},
          h('select',{className:'form-select',value:fPapel,onChange:e=>setFPapel(e.target.value)},
            h('option',{value:''},'Todos os papéis'),
            PAPEIS.map(p=>h('option',{key:p,value:p},ROLE_LABELS[p])))),
        h(Campo,{label:'Supervisor'},
          h('select',{className:'form-select',value:fSupervisor,onChange:e=>setFSupervisor(e.target.value)},
            h('option',{value:''},'Todos os supervisores'),
            supervisores.map(x=>h('option',{key:x.id,value:x.id},x.nome)))),
        h(Campo,{label:'Coordenador'},
          h('select',{className:'form-select',value:fCoordenador,onChange:e=>setFCoordenador(e.target.value)},
            h('option',{value:''},'Todos os coordenadores'),
            coordenadores.map(x=>h('option',{key:x.id,value:x.id},x.nome))))),
      (fPapel||fSupervisor||fCoordenador)&&h('button',{
        className:'btn btn-secondary btn-sm',
        onClick:()=>{setFPapel('');setFSupervisor('');setFCoordenador('');}
      },'Limpar filtros')),

    h('div', { className: 'card', style: { padding: 0 } },
      h('div', { className: 'table-wrap' },
        h('table', null,
          h('thead', null, h('tr', null,
            ['Nome','Papel','Cód. Vendedor','Telefone','Placa do veículo','Superior imediato','Coordenador','Exigir troca senha','Ativo',''].map(c => h('th', { key: c }, c)))),
          h('tbody', null,
            usuariosFiltrados.map(u => {
              const alterado = !!edicoes[u.id];
              return h('tr', { key: u.id },
                h('td', null,
                  h('input',{
                    className:'form-input sm',
                    style:{minWidth:190,fontWeight:600},
                    value:valorDe(u,'nome'),
                    onChange:e=>editar(u.id,'nome',e.target.value),
                    placeholder:'Nome do usuário'
                  }),
                  h('div', { style: { fontSize: 11, color: 'var(--text-muted)',marginTop:4 } }, u.email)),
                h('td', null,
                  h('select', { className: 'form-select sm', style: { minWidth: 120 }, value: valorDe(u, 'papel'), onChange: e => editar(u.id, 'papel', e.target.value) },
                    PAPEIS.map(p => h('option', { key: p, value: p }, ROLE_LABELS[p])))),
                h('td', null,
                  h('input', { className: 'form-input sm', style: { minWidth: 100 }, value: valorDe(u, 'codigo_vendedor'), placeholder: '—',
                    onChange: e => editar(u.id, 'codigo_vendedor', e.target.value) })),
                h('td', null,
                  h('input', { className: 'form-input sm', style: { minWidth: 150 }, value: valorDe(u, 'telefone'), placeholder: '+55 (14) ...', inputMode: 'numeric',
                    onChange: e => editar(u.id, 'telefone', mascaraTelefoneIntl(e.target.value)) })),
                h('td',null,valorDe(u,'papel')==='motorista_manutencao'?selecionarPlaca(caminhoes,valorDe(u,'caminhao_equipamentos_id'),id=>editar(u.id,'caminhao_equipamentos_id',id)):'—'),
                h('td', null,
                  h('select', { className: 'form-select sm', style: { minWidth: 120 }, value: valorDe(u, 'supervisor_id'), onChange: e => editar(u.id, 'supervisor_id', e.target.value) },
                    h('option', { value: '' }, '—'),
                    supervisores.filter(s=>valorDe(u,'papel')==='tec_panificacao'?s.papel==='lider_tec_panificacao':valorDe(u,'papel')==='lider_tec_panificacao'?s.papel==='supervisor_tec_panificacao':valorDe(u,'papel')==='vendedor'?s.papel==='supervisor':false).map(s => h('option', { key: s.id, value: s.id }, s.nome)),

                h('td', null,
                  h('select', { className: 'form-select sm', style: { minWidth: 120 }, value: valorDe(u, 'coordenador_id'), onChange: e => editar(u.id, 'coordenador_id', e.target.value) },

                    coordenadoresDoPapel(valorDe(u,'papel')).map(c => h('option', { key: c.id, value: c.id }, c.nome)),
                    valorDe(u,'coordenador_id')&&!coordenadoresDoPapel(valorDe(u,'papel')).some(c=>c.id===valorDe(u,'coordenador_id'))&&h('option',{value:valorDe(u,'coordenador_id')},(usuarios.find(c=>c.id===valorDe(u,'coordenador_id'))?.nome||'Vínculo legado')+' (revisar vínculo)'))),
                h('td', { style: { textAlign: 'center' } },
                  h('input', { type: 'checkbox', style: { width: 16, height: 16, accentColor: 'var(--accent)' },
                    checked: !!valorDe(u, 'exigir_troca_senha'), onChange: e => editar(u.id, 'exigir_troca_senha', e.target.checked) })),
                h('td', { style: { textAlign: 'center' } },
                  h('input', { type: 'checkbox', style: { width: 16, height: 16, accentColor: 'var(--accent)' },
                    checked: !!valorDe(u, 'ativo'), onChange: e => editar(u.id, 'ativo', e.target.checked) })),
                h('td', null,
                  h('div', { style:{display:'flex',gap:6,alignItems:'center'} },
                    h('button', { className: 'btn btn-primary btn-sm', disabled: !alterado, onClick: () => salvarUsuario(u) }, 'Salvar'),
                    u.id !== profile.id && h('button', {
                      className:'btn btn-sm',
                      style:{background:'#fff',color:'#b42318',border:'1px solid #f0b4ae'},
                      onClick:()=>excluirUsuario(u),
                      title:'Excluir usuário definitivamente'
                    }, 'Excluir'))));
            }))))));
}

// MODAL: ANALISE DE CREDITO (preencher campos antes do financeiro)
// =====================================================================
function ModalAnaliseCredito({ aprovacao, podeAprovarFinanceiro, onClose, onSaved }) {
  const toast = useToast();
  const ficha=aprovacao.fichas_clientes;
  const [credito, setCredito] = useState('');
  const [condicao, setCondicao] = useState('');
  const [risco,setRisco]=useState('');
  const [obs, setObs] = useState('');
  const [salvando, setSalvando] = useState(false);
  async function salvar(aprovarFinanceiro){
    if(salvando)return;
    const valor=moedaParaNumero(credito);
    if(!Number.isFinite(valor)||valor<=0)return toast('Informe o crédito liberado.','error');
    if(!condicao.trim())return toast('Informe a condição de pagamento.','error');
    if(!risco)return toast('Informe o risco de crédito.','error');

    setSalvando(true);
    const winRef=preAbrirJanelaWhats();
    const {data:ordem,error}=await sb.rpc('mc_registrar_analise_credito_ficha',{
      p_aprovacao:aprovacao.id,p_credito:valor,p_condicao:condicao.trim(),p_risco:risco,
      p_observacoes:obs.trim()||null,p_aprovar_financeiro:aprovarFinanceiro
    });
    if(error){
      setSalvando(false);
      if(winRef&&!winRef.closed)winRef.close();
      return toast(error.message,'error');
    }

    let avisos=[];
    try{
      avisos=await avisarProximo(aprovacao.ficha_id,ordem,ficha,winRef);
    }catch(error){
      if(winRef&&!winRef.closed)winRef.close();
      console.warn('Aviso da análise de crédito:',error);
    }
    setSalvando(false);
    toast(aprovarFinanceiro?'Análise de crédito concluída. Ficha encaminhada à Diretoria.':
      'Análise de crédito concluída. Ficha liberada para o Financeiro.','success');
    onSaved(avisos);

  async function geo(e){
    if(!e)return e;if(e.latitude!=null&&e.longitude!=null)return e;
    try{
      const q=[e.endereco_rua,e.endereco_numero,e.endereco_bairro,e.endereco_cidade,e.endereco_estado,e.endereco_cep,'Brasil'].filter(Boolean).join(', ');
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q),{headers:{'Accept-Language':'pt-BR'}});
      const j=await r.json();
      if(j&&j[0]){
        const latitude=Number(j[0].lat),longitude=Number(j[0].lon);
        await sb.from('entregas_equipamentos').update({latitude,longitude}).eq('id',e.id);
        return {...e,latitude,longitude};
      }
    }catch(ex){console.warn('Geocodificação',ex);}
    return e;
  }
  function dist(a,b){const R=6371,r=x=>x*Math.PI/180,d1=r(b.latitude-a.latitude),d2=r(b.longitude-a.longitude),z=Math.sin(d1/2)**2+Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(z));}
  function otimiza(xs){
    const p=xs.filter(x=>x&&x.latitude!=null&&x.longitude!=null),sem=xs.filter(x=>!x||x.latitude==null||x.longitude==null);
    if(p.length<2)return p.concat(sem);
    const rest=p.slice(1),ord=[p[0]];
    while(rest.length){let bi=0,bd=Infinity;rest.forEach((x,i)=>{const d=dist(ord[ord.length-1],x);if(d<bd){bd=d;bi=i;}});ord.push(rest.splice(bi,1)[0]);}
    return ord.concat(sem);
  }

  function baseMapa(el,ref){
    if(!window.L){el.innerHTML='<div style="padding:18px">Mapa indisponível. Verifique a conexão.</div>';return null;}
    if(ref.current){try{ref.current.remove();}catch(_){}ref.current=null;}
    const m=L.map(el).setView([-22.2,-49.9],6);ref.current=m;
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors',crossOrigin:true}).addTo(m);
    return m;
  }

  async function desenhaRota(r){
    if(!r||!r.id)return;
    const el=document.getElementById('mapa-rota-equip');if(!el)return;
    const m=baseMapa(el,mapRotaRef);if(!m)return;const pts=[];

  async function criar(){
    if(criandoRota)return;
    if(!dataRota)return toast('Informe a data da rota.','error');
    if(!caminhaoSelecionado)return toast('Selecione o caminhão.','error');
    if(requerRotaComercial&&!rotaComercialId)return toast('Selecione a rota comercial.','error');

    const ids=[...new Set((selecionadas||[]).filter(Boolean).map(String))];
    if(!ids.length)return toast('Selecione as solicitações que farão parte da rota.','error');

    setCriandoRota(true);
    try{
      const demandas=ids.map(id=>entregaPorId(id)).filter(e=>e&&e.id);
      if(!demandas.length)throw new Error('Nenhuma demanda válida foi selecionada.');

      const divergentes=demandas.filter(e=>e.data_prevista&&e.data_prevista!==dataRota);
      if(divergentes.length&&!window.confirm(divergentes.length+' demanda(s) possuem data prevista diferente da data da rota. Deseja continuar?'))return;

      let xs=(await Promise.all(demandas.map(geo))).filter(e=>e&&e.id);
      const unicas=new Map();
      xs.forEach(e=>unicas.set(String(e.id),e));
      xs=[...unicas.values()];
      if(!xs.length)throw new Error('Nenhuma demanda válida foi localizada para criar a rota.');

      const nomeFinal=nomeRota.trim()||('Entrega Equipamentos '+new Date(dataRota+'T12:00:00').toLocaleDateString('pt-BR'));
      const idsFinal=[...new Set(xs.map(e=>String(e.id)))];

      // A criação inteira é feita no PostgreSQL em uma única transação.
      // O banco deduplica os IDs antes do INSERT e usa ON CONFLICT DO NOTHING.
      const {data,error}=await sb.rpc('mc_criar_rota_equipamentos_frota',{
        p_nome:nomeFinal,
        p_data_rota:dataRota,
        p_entrega_ids:idsFinal,
        p_caminhao_id:caminhaoId,
        p_rota_comercial_id:requerRotaComercial?rotaComercialId:null
      });
      if(error)throw error;

      const resultado=Array.isArray(data)?data[0]:data;
      const qtd=resultado&&resultado.quantidade!=null?Number(resultado.quantidade):idsFinal.length;
      setSelecionadas([]);setDataRota('');setNomeRota('');setCaminhaoId('');setRotaComercialId('');
      await enviarProgramacaoRota(resultado?.rota_id,true,qtd);
      await carregar();
    }catch(err){
      const msg=err&&err.message?err.message:String(err);
      toast('Não foi possível criar a rota: '+msg,'error');
      await carregar();
    }finally{
      setCriandoRota(false);
    }
  }
  async function enviarProgramacaoRota(rotaId,recemCriada=false,quantidade=0){
    if(!rotaId){
      toast('Rota criada. Abra a lista de rotas para enviar a programação ao Supervisor.','info');
      return;
    }
    setRotaEnviando(rotaId);
    try{
      const {data,error}=await sb.rpc('mc_enviar_programacao_manutencao',{p_rota_id:rotaId});
      if(error)throw error;
      if(data?.length){
        const prefixo=recemCriada?'Rota criada com '+quantidade+' demanda(s). ':'';
        toast(prefixo+'Programação enviada para aprovação do Supervisor.','success');
      }else{
        toast('A rota já foi enviada e não tem decisões pendentes.','info');
      }
    }catch(error){
      const prefixo=recemCriada?'A rota foi criada, mas a programação não foi enviada. ':'Não foi possível enviar a programação. ';
      toast(prefixo+error.message,'error');
    }finally{
      setRotaEnviando(null);
    }
  }

  async function desmontarRota(r){
