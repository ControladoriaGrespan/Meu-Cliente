  // Relação de equipamentos (itens a retirar / a entregar) para conferência antes de aprovar.
  async function enriquecerEquipamentosPendentes(lista){
    const ids=[...new Set((lista||[]).map(ap=>ap.solicitacoes)
      .filter(sol=>sol&&sol.id&&(!sol.categoria||sol.categoria==='equipamento')).map(sol=>sol.id))];
    if(!ids.length)return lista||[];
    const mapa={};let falhou=false;
    try{
      for(let i=0;i<ids.length;i+=100){
        const {data,error}=await sb.from('solicitacao_equipamentos')
          .select('solicitacao_id,movimento,equipamento,quantidade,patrimonio').in('solicitacao_id',ids.slice(i,i+100));
        if(error)throw error;
        (data||[]).forEach(item=>(mapa[item.solicitacao_id]??=[]).push(item));
      }
    }catch(e){
      console.error('Pendências - itens de equipamentos:',e);
      falhou=true;
    }
    return (lista||[]).map(ap=>{
      const sol=ap.solicitacoes;
      if(!sol||!ids.includes(sol.id))return ap;
      if(mapa[sol.id])return {...ap,solicitacoes:{...sol,solicitacao_equipamentos:mapa[sol.id]}};
      return falhou&&!sol.solicitacao_equipamentos?.length?{...ap,solicitacoes:{...sol,erroCarregamentoEquipamentos:true}}:ap;
    });
  }

  async function enriquecerBonificacoesPendentes(lista){
    const ids=[...new Set((lista||[]).map(ap=>ap.solicitacoes).filter(sol=>sol?.categoria==='bonificacao').map(sol=>sol.id))];
    if(!ids.length)return lista||[];
    const mapa={};
    for(let i=0;i<ids.length;i+=120){
      const r=await sb.from('solicitacao_bonificacao_itens')
        .select('solicitacao_id,produto_id,quantidade,ordem,produtos(codigo,descricao)')
        .in('solicitacao_id',ids.slice(i,i+120)).order('ordem');
      if(r.error){
        console.warn('Produtos da bonificação na fila de aprovações:',r.error);
        toast('Não foi possível consultar todos os produtos de bonificação. Verifique a migração v111.','error');
        return lista||[];
      }
      (r.data||[]).forEach(it=>(mapa[it.solicitacao_id]??=[]).push(it));
    }
    return (lista||[]).map(ap=>ap.solicitacoes?.categoria==='bonificacao'
      ? {...ap,solicitacoes:{...ap.solicitacoes,solicitacao_bonificacao_itens:mapa[ap.solicitacoes.id]||[]}} : ap);
  }

  useEffect(() => { carregar(); carregarProgramacoesRota(); carregarFilaSupervisorDireta(); }, [visao, profile&&profile.id]);
  async function carregar() {
    setPendentes(null);
    setPendSolic(null);
    if(etapa==='manutencao'){setDemandasManut(null);setErroFilaManut('');}

    try{
      // MANUTENÇÃO: carrega sua fila de forma independente.
      // Assim uma consulta auxiliar com erro nunca deixa a página presa em "Carregando...".
      if(etapa==='manutencao'){
        setPendentes([]);

        let rs={data:[],error:null};
        try{
          rs=await sb.from('solicitacao_aprovacoes')
            .select('*, solicitacoes(*, clientes(razao_social, nome_fantasia, cnpj_cpf, codigo_totvs), usuarios:solicitante_id(nome), produtos(codigo, descricao), solicitacao_aprovacoes(*))')
            .eq('etapa','manutencao').eq('status','pendente')
            .order('criado_em',{ascending:true});
        }catch(e){
          rs.error=e;
        }
        if(rs.error)setErroFilaManut('Não foi possível carregar as aprovações: '+rs.error.message);
        const fila=(rs.data||[]).filter(ap=>ehPreview||!ap.responsavel_id||ap.responsavel_id===profile.id);
        const trocas=fila.filter(ap=>ap.solicitacoes?.tipo==='troca');
        const itensTrocas=new Map();
        if(trocas.length){
          try{
            for(let i=0;i<trocas.length;i+=100){
              const ids=trocas.slice(i,i+100).map(ap=>ap.solicitacao_id);
              const {data,error}=await sb.from('solicitacao_equipamentos')
                .select('solicitacao_id,movimento,equipamento,quantidade,patrimonio').in('solicitacao_id',ids);
              if(error)throw error;
              (data||[]).forEach(item=>{
                if(!itensTrocas.has(item.solicitacao_id))itensTrocas.set(item.solicitacao_id,[]);
                itensTrocas.get(item.solicitacao_id).push(item);
              });
            }
          }catch(e){
            setErroFilaManut('Não foi possível carregar todos os itens das trocas: '+e.message);
          }
        }
        setPendSolic(fila.map(ap=>itensTrocas.has(ap.solicitacao_id)
          ? {...ap,solicitacoes:{...ap.solicitacoes,solicitacao_equipamentos:itensTrocas.get(ap.solicitacao_id)}}
          : ap));

        let rd={data:[],error:null};
        try{
          // select('*') evita quebrar a tela quando há diferença de schema entre versões.
          rd=await sb.from('entregas_equipamentos')
            .select('*')
            .order('created_at',{ascending:false});
        }catch(e){
          console.error('Pendências - entregas equipamentos:',e);
        }

        if(rd&&rd.error){
          console.error('Pendências - entregas equipamentos:',rd.error);
          setDemandasManut([]);
          return;
        }

        const base=((rd&&rd.data)||[]).filter(x=>x&&x.id);
        const fids=[...new Set(base.map(x=>x.ficha_id).filter(Boolean))];
        const cids=[...new Set(base.map(x=>x.cliente_id).filter(Boolean))];

        let ff={data:[],error:null}, cc={data:[],error:null};

        // Ficha e cliente são enriquecimento visual. Falha aqui não pode bloquear a fila.
        if(fids.length){
          try{
            ff=await sb.from('fichas_clientes').select('*').in('id',fids);
          }catch(e){
            console.error('Pendências - fichas_clientes:',e);
          }
        }
        if(cids.length){
          try{
            cc=await sb.from('clientes').select('*').in('id',cids);
          }catch(e){
            console.error('Pendências - clientes:',e);
          }
        }

        if(ff&&ff.error)console.error('Pendências - fichas_clientes:',ff.error);
        if(cc&&cc.error)console.error('Pendências - clientes:',cc.error);

        const fichasOk=((ff&&ff.data)||[]).filter(x=>x&&x.id);
        const clientesOk=((cc&&cc.data)||[]).filter(x=>x&&x.id);
        const fm=new Map(fichasOk.map(x=>[x.id,x]));
        const cm=new Map(clientesOk.map(x=>[x.id,x]));

        setDemandasManut(base.map(x=>({
          ...x,
          _ref:cm.get(x.cliente_id)||fm.get(x.ficha_id)||null
        })));
        return;
      }

      // Administrador real: fila completa com detalhes autorizados pela RPC
      // SECURITY DEFINER, sem depender de RLS de carteiras/equipes.
      if(etapa==='admin'&&!ehPreview){
        const adm=await sb.rpc('mc_admin_listar_pendencias');
        if(adm.error)throw new Error('Fila administrativa indisponível. Execute a migração v110: '+adm.error.message);
        setPendentes(Array.isArray(adm.data?.fichas)?adm.data.fichas:[]);
        setPendSolic(await enriquecerEquipamentosPendentes(await enriquecerBonificacoesPendentes(Array.isArray(adm.data?.solicitacoes)?adm.data.solicitacoes:[])));
        return;
      }
      // DEMAIS ETAPAS
      // Busca primeiro as aprovações: embeds de ficha podem falhar ou voltar null por RLS.
      let q=sb.from('ficha_aprovacoes').select('*').eq('status','pendente');
      if(etapa==='financeiro')q=q.in('etapa',['analise_credito','financeiro']);
      else if(etapa!=='admin')q=q.eq('etapa',etapa);

      if(!ehPreview&&(etapa==='supervisor'||etapa==='coordenador')){
        q=q.eq('responsavel_id',profile.id);
      }

      // Solicitações: primeiro busca a APROVAÇÃO pendente e depois enriquece os dados.
      // Não dependemos do embed solicitacoes(...) para a fila existir, porque RLS/relação
      // pode devolver solicitacoes=null mesmo com a aprovação corretamente pendente.
      let qs=sb.from('solicitacao_aprovacoes').select('*').eq('status','pendente');
      if(etapa!=='admin')qs=qs.eq('etapa',etapa);

      if(!ehPreview&&(etapa==='supervisor'||etapa==='coordenador')){
        qs=qs.eq('responsavel_id',profile.id);
      }

      const resultados=await Promise.allSettled([
        q.order('criado_em',{ascending:true}),
        qs.order('criado_em',{ascending:true})
      ]);

      const rf=resultados[0].status==='fulfilled'?resultados[0].value:{data:[],error:resultados[0].reason};
      const rs=resultados[1].status==='fulfilled'?resultados[1].value:{data:[],error:resultados[1].reason};

      if(rf&&rf.error)console.error('Pendências - fichas:',rf.error);
      if(rs&&rs.error)console.error('Pendências - solicitações:',rs.error);

      const aprovacoesFicha=((rf&&rf.data)||[]).filter(ap=>ap&&ap.id);
      const fichaIds=[...new Set(aprovacoesFicha.map(ap=>ap.ficha_id).filter(Boolean))];
      let detalhesFicha=[];
      if(fichaIds.length){
        const df=await sb.from('fichas_clientes')
          .select('*, usuarios:vendedor_id(nome), clientes(codigo_totvs), ficha_aprovacoes(etapa,status,decidido_em,observacao)')
          .in('id',fichaIds);
        if(df.error){
          console.error('Pendências - detalhes das fichas:',df.error);
          const fallback=await sb.from('fichas_clientes').select('*').in('id',fichaIds);
          if(fallback.error)console.error('Pendências - fallback fichas:',fallback.error);
          detalhesFicha=fallback.data||[];
        }else detalhesFicha=df.data||[];
      }
      // Ler a fila completa por ficha; o SELECT incorporado pode estar limitado por RLS.
      // A consulta adicional não altera o acesso: utiliza apenas permissões do usuário.
      if(fichaIds.length){
        const historico=await sb.from('ficha_aprovacoes')
          .select('id,ficha_id,etapa,ordem,status,observacao,decidido_em')
          .in('ficha_id',fichaIds);
        if(!historico.error){
          const hm={};(historico.data||[]).forEach(a=>(hm[a.ficha_id]??=[]).push(a));
          detalhesFicha=detalhesFicha.map(f=>({...f,ficha_aprovacoes:hm[f.id]||f.ficha_aprovacoes||[]}));
        }else console.warn('Histórico completo de fichas indisponível:',historico.error);
      }
      const mapaFicha=new Map(detalhesFicha.map(f=>[String(f.id),f]));
      const pendenciasEnriquecidas=aprovacoesFicha.map(ap=>({
        ...ap,fichas_clientes:mapaFicha.get(String(ap.ficha_id))||null
      }));
      setPendentes(pendenciasEnriquecidas);
      if(pendenciasEnriquecidas.some(ap=>!ap.fichas_clientes))
        toast('Há aprovações pendentes, mas o acesso aos dados da ficha está bloqueado. Verifique a política RLS de fichas_clientes.','error');

      // Enriquece as aprovações de solicitação sem deixar o relacionamento embutido
      // esconder a fila da Gestão Adm. de Vendas.
      let aprovsSolic=((rs&&rs.data)||[]).filter(ap=>ap&&ap.id);
      if(aprovsSolic.length){
        const solIds=[...new Set(aprovsSolic.map(ap=>ap.solicitacao_id).filter(Boolean))];
        let sols=[];
        if(solIds.length){
          const rsol=await sb.from('solicitacoes')
            .select('*, clientes(razao_social, nome_fantasia, cnpj_cpf, codigo_totvs), usuarios:solicitante_id(nome), produtos(codigo, descricao), solicitacao_aprovacoes(*)')
            .in('id',solIds);
          if(rsol.error)console.error('Pendências - detalhes solicitações:',rsol.error);
          else sols=rsol.data||[];
        }
        const sm=new Map(sols.map(x=>[String(x.id),x]));

        // Se a leitura direta foi bloqueada/omitida por RLS, usa a RPC segura da
        // Migração 115. A função valida auth.uid(), papel/etapa e status pendente
        // antes de devolver somente a solicitação vinculada à aprovação.
        const faltantes=aprovsSolic.filter(ap=>!sm.has(String(ap.solicitacao_id)));
        if(faltantes.length){
          const recuperados=await Promise.all(faltantes.map(async ap=>{
            const rr=await sb.rpc('obter_solicitacao_pendencia',{p_aprovacao_id:ap.id});
            if(rr.error){
              console.error('Pendências - RPC detalhe '+ap.id+':',rr.error);
              return null;
            }
            return rr.data||null;
          }));
          recuperados.filter(Boolean).forEach(sol=>{if(sol&&sol.id)sm.set(String(sol.id),sol);});
        }

        // Carregar histórico completo uma única vez por lote, sem depender
        // da relação embutida, que pode retornar somente a etapa atual.
        const hist=await sb.from('solicitacao_aprovacoes')
          .select('id,solicitacao_id,ordem,etapa,status,observacao,decidido_em')
          .in('solicitacao_id',solIds);
        if(!hist.error){
          const hm={};(hist.data||[]).forEach(a=>(hm[a.solicitacao_id]??=[]).push(a));
          sols.forEach(sol=>{sol.solicitacao_aprovacoes=hm[sol.id]||sol.solicitacao_aprovacoes||[];});
          sm.forEach((sol,id)=>{sol.solicitacao_aprovacoes=hm[id]||sol.solicitacao_aprovacoes||[];});
        }else console.warn('Histórico completo de solicitações indisponível:',hist.error);
        aprovsSolic=await enriquecerEquipamentosPendentes(aprovsSolic.map(ap=>({...ap,solicitacoes:sm.get(String(ap.solicitacao_id))||null})));
      }
      // A fila não deve oferecer aprovação de solicitações já reprovadas/encerradas.
      // Quando o detalhe estiver bloqueado por RLS, conservar a pendência;
      // o salvamento terá uma segunda conferência obrigatória.
      setPendSolic(await enriquecerBonificacoesPendentes(aprovsSolic.filter(ap=>
        // Apenas a etapa ativa pertence à fila; se há responsável designado,
        // só esse usuário a enxerga (exceto consulta no Modo Admin).
        (etapa==='admin'||ehPreview||!ap.responsavel_id||String(ap.responsavel_id)===String(profile.id)) &&
        (!ap.solicitacoes ||
        (!['concluida','vinculada','aprovada'].includes(ap.solicitacoes.status_fluxo) &&
         !(ap.solicitacoes.status_fluxo==='reprovada' &&
           (ap.solicitacoes.categoria!=='bonificacao' ||
            (ap.solicitacoes.solicitacao_aprovacoes||[]).some(x=>x.etapa==='diretoria'&&x.status==='reprovado')))))
      )));
    }catch(e){
      console.error('Falha ao carregar Pendências:',e);
      setPendentes([]);
      setPendSolic([]);
      if(etapa==='manutencao')setDemandasManut([]);
      toast('Não foi possível carregar todos os dados de Pendências. Verifique o Console.','error');
    }finally{
      // Garantia absoluta contra loading infinito.
      setPendentes(v=>v===null?[]:v);
      setPendSolic(v=>v===null?[]:v);
      if(etapa==='manutencao')setDemandasManut(v=>v===null?[]:v);
    }
  }

  // decide uma etapa de SOLICITACAO de equipamento
  async function decidirSolicitacao(ap, status, observacao) {
    // A decisão e o avanço agora são atômicos no banco.
    // Evita corrida entre Coordenador e Gestão Adm. de Vendas.
    const winRef=preAbrirJanelaWhats();
    const {data:resultado,error}=await sb.rpc('mc_decidir_solicitacao_workflow',{
      p_aprovacao_id:ap.id,p_status:status,p_observacao:observacao||null
    });
    if(error){
      if(winRef&&!winRef.closed)winRef.close();
      await carregar();
      return toast('Não foi possível decidir a etapa: '+error.message+'. Verifique a migração v99 do workflow.','error');
    }
    const avanco={data:resultado||{}};
    const solEstado={data:{categoria:ap.solicitacoes?.categoria}};
    const proximaEtapa=avanco.data&&avanco.data.proxima_etapa
      ? avanco.data.proxima_etapa:null;
    if(status==='reprovado' && solEstado.data.categoria==='bonificacao' && ap.etapa==='financeiro'){
      toast('Parecer do Financeiro registrado. A Diretoria fará a decisão final.','info');
    }

    // O retorno da RPC informa a etapa real, sem depender de RLS para encontrá-la.
    if (proximaEtapa && (status==='aprovado' ||
        (solEstado.data.categoria==='bonificacao' && ap.etapa!=='diretoria' && status==='reprovado'))) {
      const prox={etapa:proximaEtapa,responsavel_id:avanco.data.responsavel_id};
      let dest = [];
      if (prox.responsavel_id) {
        const { data } = await sb.from('usuarios').select('*').eq('id', prox.responsavel_id).single();
        if (data) dest = [data];
      } else {
        const { data } = await sb.from('usuarios').select('*').eq('papel', prox.etapa).eq('ativo', true);
        dest = data || [];
      }
      dest = dest.filter(d => d.telefone);
      const sol = ap.solicitacoes;
      const tipoMsg = sol.categoria === 'bonificacao' ? 'BONIFICAÇÃO' :
        sol.categoria === 'amostra' ? 'ENVIO DE AMOSTRA' :
        sol.tipo === 'troca' ? 'TROCA DE EQUIPAMENTO' :
        sol.tipo === 'retirada' ? 'RETIRADA DE EQUIPAMENTO' :
        sol.tipo === 'aumento' ? 'AUMENTO DE EQUIPAMENTO' : 'MANUTENÇÃO';
      const detalheMsg = sol.categoria === 'equipamento' ? `\nServiço: ${sol.equipamento || '—'}` :
        sol.categoria === 'bonificacao'
          ? '\nProdutos: '+((sol.solicitacao_bonificacao_itens?.length
            ? sol.solicitacao_bonificacao_itens
            : [{produtos:sol.produtos,quantidade:sol.quantidade}])
            .map(it=>(it.produtos?.codigo||'Produto')+' '+fmtNum(it.quantidade||0)).join('; ')) :
        `\nTipo: ${sol.tipo_amostra === 'kit' ? 'KIT' : 'Produto'}`;
      const msg = `🔧 Solicitação de ${tipoMsg} aguardando sua aprovação\n*${sol.clientes && sol.clientes.razao_social}*${detalheMsg}\n\nAcesse o sistema:\n${linkSistema()}`;
      if(ehCelularWhats())agendarAvisoWhats(dest,msg);
      else if (dest.length === 1) abrirWhats(dest[0].telefone, msg, winRef);
      else if (dest.length > 1) {
        // Mais de um aprovador: disponibilizar links, sem perder destinatários.
        agendarAvisoWhats(dest,msg);
        if(winRef&&!winRef.closed)winRef.close();
      } else if (winRef && !winRef.closed) winRef.close();
    } else if (winRef && !winRef.closed) winRef.close();

    // Manutenção de equipamento: após a própria Manutenção aprovar, vira ordem operacional PENDENTE.
    if(status==='aprovado' && ap.etapa==='manutencao' && ap.solicitacoes && ap.solicitacoes.tipo==='manutencao'){
      const sol=ap.solicitacoes,cli=sol.clientes||{};
      const {error:em}=await sb.from('entregas_equipamentos').upsert({
        solicitacao_id:sol.id,cliente_id:sol.cliente_id,origem_tipo:'solicitacao_manutencao',tipo_demanda:'manutencao',status:'pendente',
        equipamento_resumo:sol.equipamento||sol.descricao||'Manutenção de equipamento',
        equipamento_coleta:sol.equipamento||null,patrimonio_coleta:sol.patrimonio||null,criado_por:profile.id
      },{onConflict:'solicitacao_id'});
      if(em)toast('Solicitação aprovada, mas a ordem operacional não foi criada: '+em.message,'error');
    }

    // Troca e retirada: a demanda operacional é criada no banco pelos triggers das migrações 99/110,
    // preservando todos os itens de solicitacao_equipamentos.

    const parecerSemVeto=ap.solicitacoes&&ap.solicitacoes.categoria==='bonificacao'&&
      ap.etapa==='financeiro'&&status==='reprovado';
    toast(parecerSemVeto?'Parecer desfavorável registrado; solicitação encaminhada à próxima etapa.':
      status==='reprovado'?'Solicitação reprovada.':'Etapa aprovada.',
      status==='aprovado'?'success':'info');
    carregar(); onChanged && onChanged();
  }

  async function confirmar() {
    const {ap,status}=decidindo;
    if(ap.etapa==='diretoria'&&status==='aprovado'&&ap.fichas_clientes.precisa_equipamento&&!condicaoDiretoria) return toast('Confirme Novo ou Usado.','error');
    // Recusas que devolvem a ficha ao vendedor para ajuste precisam dizer o que ajustar.
    const devolveParaAjuste=status==='ajuste'||(status==='reprovado'&&['supervisor','coordenador'].includes(ap.etapa));
    if(devolveParaAjuste&&!obs.trim()) return toast('Informe na observação o que o vendedor precisa ajustar.','error');
    const winRef=preAbrirJanelaWhats();
    if(status==='ajuste'){
      const {error:erroAjuste}=await sb.rpc('mc_solicitar_ajuste_ficha',{p_aprovacao:ap.id,p_observacao:obs.trim()});
      if(erroAjuste){
        if(winRef&&!winRef.closed)winRef.close();
        return toast(/mc_solicitar_ajuste_ficha|schema cache/i.test(erroAjuste.message||'')
          ?'O pedido de ajuste ainda não está disponível no banco (migração 20261125_fluxo_ajuste_ficha.sql).':erroAjuste.message,'error');
      }
      await avisarVendedorFicha(ap.fichas_clientes,ROLE_LABELS[ap.etapa],obs.trim(),true,winRef);
      setDecidindo(null);setObs('');setCondicaoDiretoria('');
      toast('Ficha devolvida ao vendedor para ajuste.','info');carregar();onChanged&&onChanged();
      return;
    }
    if(ap.etapa==='diretoria'&&status==='aprovado'&&ap.fichas_clientes.precisa_equipamento){
      const {error:x}=await sb.from('fichas_clientes').update({equipamento_condicao_manutencao:condicaoDiretoria}).eq('id',ap.ficha_id); if(x){if(winRef)winRef.close();return toast(x.message,'error');}
    }
    const {error}=await sb.rpc('decidir_ficha_workflow',{
      p_aprovacao_id:ap.id,
      p_status:status,
      p_observacao:obs.trim()||null
    });
    if(error){if(winRef)winRef.close();return toast(error.message,'error');}
    if(ap.etapa==='diretoria'&&status==='aprovado'&&ap.fichas_clientes.precisa_equipamento){
      const {data:f,error:erroFicha}=await sb.from('fichas_clientes').select('*').eq('id',ap.ficha_id).single();
      if(erroFicha){
        if(winRef)winRef.close();
        setDecidindo(null);setObs('');setCondicaoDiretoria('');carregar();onChanged&&onChanged();
        return toast('Ficha aprovada, mas não foi possível carregar os equipamentos para gerar a entrega: '+erroFicha.message,'error');
      }
      const {data:demanda,error:ee}=await sb.from('entregas_equipamentos').upsert({ficha_id:ap.ficha_id,cliente_id:null,origem_tipo:'ficha_novo_cliente',tipo_demanda:'envio',status:'pendente',data_prevista:null,endereco_rua:f.entrega_rua,endereco_numero:f.entrega_numero,endereco_bairro:f.entrega_bairro,endereco_cidade:f.entrega_cidade,endereco_estado:f.entrega_estado,endereco_cep:f.entrega_cep,equipamento_resumo:resumoEquipamentos({...f,equipamento_condicao:condicaoDiretoria}),equipamento_entrega:resumoEquipamentos({...f,equipamento_condicao:condicaoDiretoria}),equipamento_condicao:condicaoDiretoria,criado_por:profile.id},{onConflict:'ficha_id'}).select().single();
      if(ee) toast('Aprovada, mas não foi possível gerar a entrega: '+ee.message,'error');
      else if(demanda){
        const itens=itensEquipamentosFicha(f,condicaoDiretoria);
        const {data:exist}=await sb.from('comodato_equipamentos').select('id').eq('entrega_id',demanda.id).limit(1);
        if(itens.length&&(!exist||!exist.length)){
          const {error:ei}=await sb.from('comodato_equipamentos').insert(itens.map((it,i)=>({...it,entrega_id:demanda.id,ordem:i+1})));
          if(ei)toast('Entrega criada, mas houve erro nos itens do comodato: '+ei.message,'error');
        }
      }
      // Confirma que a demanda operacional realmente existe.
      const {data:demandaConfirmada,error:erroConfirmacao}=await sb.from('entregas_equipamentos')
        .select('id,status').eq('ficha_id',ap.ficha_id).maybeSingle();
      if(erroConfirmacao||!demandaConfirmada){
        toast('A Diretoria aprovou a ficha, mas a demanda da Manutenção não foi confirmada. Execute a Migração 46 e tente novamente.','error');
      } else {
        toast('Demanda de entrega enviada para a Manutenção.','success');
      }
      if(winRef)winRef.close();
    } else if(status==='aprovado'){
      // Aprovou: avisa o próximo da fila.
      const varios=await avisarProximo(ap.ficha_id,ap.ordem,ap.fichas_clientes,winRef);setDestinatarios(varios);
    } else if(['supervisor','coordenador','financeiro'].includes(ap.etapa)){
      // Reprovou: a ficha volta para o vendedor (antes o aviso ia, por engano, para a etapa seguinte).
      await avisarVendedorFicha(ap.fichas_clientes,ROLE_LABELS[ap.etapa],obs.trim(),devolveParaAjuste,winRef);
    } else if(winRef&&!winRef.closed)winRef.close();
    setDecidindo(null);setObs('');setCondicaoDiretoria('');
    toast(devolveParaAjuste?'Ficha reprovada e devolvida ao vendedor para ajuste.':`Ficha ${status} com sucesso.`,status==='aprovado'?'success':'info');carregar();onChanged&&onChanged();
  }

    }).eq('id',d.id);

  function dataExtensoComodato(){
    const d=new Date(),m=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

  async function baixarComodatoFila(dem){
    if(!window.jspdf)return toast('Biblioteca de PDF não carregada.','error');
    try{
      const [qi,qc,qf]=await Promise.all([
        sb.from('comodato_equipamentos').select('*').eq('entrega_id',dem.id).order('ordem'),
        sb.from('contratos_comodato').select('*').eq('entrega_id',dem.id).maybeSingle(),
        dem.ficha_id?sb.from('fichas_clientes').select('id,codigo,acordo_comercial_numero,razao_social,nome_fantasia,cnpj_cpf,rua,numero,bairro,cidade,estado,cep,consumo_previsto').eq('id',dem.ficha_id).maybeSingle():Promise.resolve({data:null})
      ]);

function PaginaSolicitacoes({ profile, visao, modulo, ehPreview, onChanged }) {
  const [fichas, setFichas] = useState(null);
  const [solicitacoes, setSolicitacoes] = useState(null);
  const [erroConsultaSolicitacoes,setErroConsultaSolicitacoes] = useState('');
  const [detalhe, setDetalhe] = useState(null);
  const [ajustando,setAjustando]=useState(null);
  const [modalNova, setModalNova] = useState(false);
  const [sub, setSub] = useState('equipamento');
  const [subStatus,setSubStatus] = useState('aprovacao');
  const [buscaSolicitacao,setBuscaSolicitacao]=useState('');
  const [indicadoresClientes,setIndicadoresClientes]=useState({});
  const [erroIndicadores,setErroIndicadores]=useState('');
  const [detalheBonificacao,setDetalheBonificacao]=useState(null);
  const [linhasBonificacao,setLinhasBonificacao]=useState(null);
  const [concluindoSolicitacao,setConcluindoSolicitacao]=useState(null);
  const toast=useToast();
  const [entregasPorSolicitacao,setEntregasPorSolicitacao]=useState({});
  const [erroStatusRealizacao,setErroStatusRealizacao]=useState('');
  const [erroItensSolicitacoes,setErroItensSolicitacoes]=useState('');
  const [rotasPorCliente,setRotasPorCliente]=useState({});
  const [erroRotasSolicitacoes,setErroRotasSolicitacoes]=useState('');

  const ehVendedor = visao === 'vendedor';
  const podeBonificacao = modulo === 'vendas' && ['vendedor','supervisor','admin'].includes(visao);
  const podeAmostra = modulo === 'vendas' && ['vendedor','supervisor','tecnico','admin'].includes(visao);
  const podeEquipamento = (modulo === 'vendas' && ['vendedor','supervisor','coordenador','admin'].includes(visao))
    || (modulo === 'administracao_vendas' && ['adm_vendas','gestao_adm_vendas','admin'].includes(visao));

  async function carregarIndicadoresSolicitacoes(lista){
    setIndicadoresClientes({});
    const ids=[...new Set((lista||[]).map(s=>s.cliente_id).filter(Boolean))];
    const mapa={};
    for(let i=0;i<ids.length;i+=100){
      const bloco=ids.slice(i,i+100);
      const {data,error}=await sb.rpc('mc_resumo_consumo_solicitacoes',{p_clientes:bloco});
      bloco.forEach(id=>mapa[id]=null);
      if(error){setErroIndicadores('Indicadores fiscais: '+error.message);}
      else (data||[]).forEach(r=>mapa[r.cliente_id]=r);
      setIndicadoresClientes({...mapa});
    }
  }
  async function abrirBonificacoesCliente(cliente){
    setDetalheBonificacao(cliente);setLinhasBonificacao(null);
    const {data,error}=await sb.rpc('mc_bonificacoes_sku_mensal',{p_cliente:cliente.id});
    setLinhasBonificacao(error?{erro:error.message}:(data||[]));
  }
  async function carregarRotasSolicitacoes(lista) {
    const ids=[...new Set((lista||[]).map(s=>s.cliente_id).filter(Boolean))];
    if(!ids.length){setRotasPorCliente({});return;}
    const mapa={};
    for(let i=0;i<ids.length;i+=120){
      const r=await sb.from('cliente_rotas')
        .select('cliente_id,rotas(id,nome,ativo)')
        .in('cliente_id',ids.slice(i,i+120));
      if(r.error){
        console.error('Rotas das solicitações:',r.error);
        setErroRotasSolicitacoes('Não foi possível consultar as rotas dos clientes: '+r.error.message);
        setRotasPorCliente({});
        return;
      }
      (r.data||[]).forEach(v=>{
        const rt=v.rotas;
        if(!rt||rt.ativo===false)return;
        if(!mapa[v.cliente_id])mapa[v.cliente_id]=[];
        if(!mapa[v.cliente_id].some(x=>String(x.id)===String(rt.id)))mapa[v.cliente_id].push(rt);
      });
    }
    Object.values(mapa).forEach(arr=>arr.sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR')));
    setRotasPorCliente(mapa);
  }

  async function carregarItensSolicitacoes(lista) {
    const ids=(lista||[]).filter(s=>!s.categoria||s.categoria==='equipamento').map(s=>s.id).filter(Boolean);
    if(!ids.length)return lista||[];
    const porSolicitacao={};
    // Não deixar uma falha de RLS ou consulta ocultar itens sem aviso.
    for(let i=0;i<ids.length;i+=120){
      const {data,error}=await sb.from('solicitacao_equipamentos')
        .select('solicitacao_id,movimento,equipamento,quantidade,patrimonio')
        .in('solicitacao_id',ids.slice(i,i+120));
      if(error){
        console.error('Falha ao carregar itens de equipamentos:',error);
        setErroItensSolicitacoes('Não foi possível carregar a relação completa de equipamentos: '+error.message);
        return (lista||[]).map(s=>({...s,erroCarregamentoEquipamentos:
          !s.categoria||s.categoria==='equipamento'}));
      }
      (data||[]).forEach(d=>{
        if(!porSolicitacao[d.solicitacao_id])porSolicitacao[d.solicitacao_id]=[];
        porSolicitacao[d.solicitacao_id].push(d);
      });
    }
    return (lista||[]).map(s=>({...s,solicitacao_equipamentos:
      porSolicitacao[s.id]||s.solicitacao_equipamentos||[]}));
  }

  async function carregarItensBonificacoes(lista){
    const ids=(lista||[]).filter(s=>s.categoria==='bonificacao').map(s=>s.id).filter(Boolean);
    if(!ids.length)return lista||[];
    const mapa={};
    for(let i=0;i<ids.length;i+=120){
      const {data,error}=await sb.from('solicitacao_bonificacao_itens')
        .select('solicitacao_id,produto_id,quantidade,ordem,produtos(codigo,descricao)')
        .in('solicitacao_id',ids.slice(i,i+120)).order('ordem');
      if(error){
        console.warn('Itens de bonificação indisponíveis:',error);
        setErroItensSolicitacoes('Não foi possível consultar todos os produtos das bonificações: '+error.message);
        return lista||[];
      }
      (data||[]).forEach(it=>(mapa[it.solicitacao_id]??=[]).push(it));
    }
    return (lista||[]).map(s=>s.categoria==='bonificacao'
      ? {...s,solicitacao_bonificacao_itens:mapa[s.id]||[]} : s);
  }

  async function carregarSituacaoEquipamentos(lista){
    const ids=(lista||[]).filter(s=>(!s.categoria||s.categoria==='equipamento') &&
      !Array.isArray(s.entregas_operacionais)).map(s=>s.id).filter(Boolean);
    if(!ids.length){setEntregasPorSolicitacao({});return;}
    let todos=[];
    for(let i=0;i<ids.length;i+=150){
      const q=await sb.from('entregas_equipamentos')
        .select('id,solicitacao_id,status,concluida_em')
        .in('solicitacao_id',ids.slice(i,i+150));
      if(q.error){
        console.warn('Status operacional da Manutenção:',q.error);
        setErroStatusRealizacao('Não foi possível conferir todas as conclusões da Manutenção: '+q.error.message);
        break;
      }
      todos.push(...(q.data||[]));
    }
    const mapa={};
    todos.forEach(d=>{
      if(!mapa[d.solicitacao_id])mapa[d.solicitacao_id]=[];
      mapa[d.solicitacao_id].push(d);
    });
    setEntregasPorSolicitacao(mapa);
  }

  function situacaoSolicitacao(s){
    const st=String(s.status_fluxo||'aberta').toLowerCase();
    if(st==='concluida')return 'concluido';
    if(st==='vinculada')return 'realizacao';
    // Reprovação definitiva não é realização nem conclusão.
    if(st==='reprovada')return 'reprovada';
    const etapas=s.solicitacao_aprovacoes||[];
    const decisaoFinal=st==='aprovada' ||
      (etapas.some(a=>a.etapa==='diretoria'&&a.status==='aprovado') &&
       etapas.every(a=>['aprovado','reprovado','nao_aplica'].includes(a.status)));
    if(!decisaoFinal)return 'aprovacao';
    if(s.categoria==='equipamento'||!s.categoria){
      const entregas=s.entregas_operacionais||entregasPorSolicitacao[s.id]||[];
      if(entregas.length&&entregas.every(e=>e.status==='concluida'))return 'concluido';
    }
    return 'realizacao';
  }

  const podeConcluirAdm=modulo==='administracao_vendas' &&
    ['adm_vendas','gestao_adm_vendas','admin'].includes(profile.papel);
  async function concluirSolicitacaoAdm(sol){
    if(concluindoSolicitacao)return;
    if(!podeConcluirAdm||!['bonificacao','amostra'].includes(sol.categoria))return;
    if(sol.status_fluxo!=='vinculada'){
      return toast('A solicitação precisa estar vinculada ao pedido antes da conclusão.','error');
    }
    if(!window.confirm('Confirmar que a realização de '+codigoAuditoria(sol,sol.categoria==='bonificacao'?'BON':'AMO')+
      ' foi conferida pela Administração de Vendas?'))return;
    setConcluindoSolicitacao(sol.id);
    const {error}=await sb.rpc('mc_concluir_solicitacao_adm_vendas',{p_solicitacao_id:sol.id});
    setConcluindoSolicitacao(null);
    if(error)return toast('Não foi possível concluir a solicitação: '+error.message,'error');
    toast('Realização confirmada pela Administração de Vendas.','success');
    await carregar();
  }

  useEffect(() => { carregar(); }, [visao,modulo,profile.id]);
  async function carregar() {
    setErroConsultaSolicitacoes('');
    setErroItensSolicitacoes('');
    setErroRotasSolicitacoes('');
    setErroStatusRealizacao('');
    setEntregasPorSolicitacao({});
    const adminVendas=modulo==='administracao_vendas' &&
      ['adm_vendas','gestao_adm_vendas','admin'].includes(profile.papel);
    // Perfil administrativo possui consulta de leitura de todas as solicitações,
    // independente de carteiras. O banco valida auth.uid() e papel ativo.
    if(adminVendas){
      const resultado=await sb.rpc('mc_listar_solicitacoes_adm_vendas');
      if(resultado.error){
        console.error('Solicitações Administração de Vendas:',resultado.error);
        setErroConsultaSolicitacoes('Não foi possível consultar o histórico: '+resultado.error.message+
          '. Verifique a migração 20261111_solicitacoes_leitura_adm_vendas.sql no Supabase.');
        setSolicitacoes([]);
      }else{
        const lista=await carregarItensBonificacoes(await carregarItensSolicitacoes(Array.isArray(resultado.data)?resultado.data:[]));
        setSolicitacoes(lista);
        await Promise.all([carregarSituacaoEquipamentos(lista),carregarRotasSolicitacoes(lista),carregarIndicadoresSolicitacoes(lista)]);
      }
      setFichas([]);
      return;
    }
    const [rf,rs]=await Promise.all([
      ehVendedor
        ? sb.from('fichas_clientes')
            .select('*, usuarios:vendedor_id(nome), ficha_aprovacoes(id, etapa, status, decidido_em, observacao, ajuste_solicitado_em)')
            .eq('vendedor_id',profile.id).order('created_at',{ascending:false})
        : Promise.resolve({data:[]}),
      sb.from('solicitacoes')
        .select('*, clientes(razao_social, nome_fantasia, cnpj_cpf, codigo_totvs), usuarios:solicitante_id(nome), produtos(codigo, descricao), solicitacao_aprovacoes(*)')
        .order('created_at',{ascending:false})
    ]);
    if(rs.error){
      console.error('Consulta de solicitações:',rs.error);
      setErroConsultaSolicitacoes('Falha ao carregar solicitações: '+rs.error.message);
    }
    setFichas(rf.data||[]);
    const lista=await carregarItensBonificacoes(await carregarItensSolicitacoes(rs.data||[]));
    setSolicitacoes(lista);
    await Promise.all([carregarSituacaoEquipamentos(lista),carregarRotasSolicitacoes(lista),carregarIndicadoresSolicitacoes(lista)]);
  }

  if (solicitacoes === null) return h('div', { className: 'empty-state' }, 'Carregando...');

  // Ficha devolvida para ajuste: o vendedor edita no mesmo formulário do cadastro.
  if (ajustando) return h(PaginaEmissao,{profile,fichaAjuste:ajustando,
    onCancel:()=>setAjustando(null),
    onSaved:()=>{setAjustando(null);carregar();onChanged?.();}});

  const normalizarBusca=valor=>String(valor??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const buscaNormalizada=normalizarBusca(buscaSolicitacao);
  const termosBusca=buscaNormalizada.split(/\s+/).filter(Boolean);
  const solicitacoesVisiveis=termosBusca.length?solicitacoes.filter(s=>{
    const cliente=s.clientes;
    const campos=[codigoAuditoria(s,prefixoSolicitacao(s)),cliente?.codigo_totvs,
      cliente?.razao_social,cliente?.nome_fantasia].map(normalizarBusca);
    return termosBusca.every(termo=>campos.some(campo=>campo.includes(termo)));
  }):solicitacoes;
  const equipamentos = solicitacoesVisiveis.filter(s => !s.categoria || s.categoria === 'equipamento');
  const bonificacoes = solicitacoesVisiveis.filter(s => s.categoria === 'bonificacao');
  const amostras = solicitacoesVisiveis.filter(s => s.categoria === 'amostra');
  const abas = [
    { id: 'equipamento', label: 'Equipamentos (' + equipamentos.length + ')' },
    { id: 'bonificacao', label: 'Bonificações (' + bonificacoes.length + ')' },
    { id: 'amostra', label: 'Amostras (' + amostras.length + ')' }
  ];
  if (ehVendedor) abas.push({ id: 'fichas', label: 'Minhas fichas (' + (fichas || []).length + ')' });

  const listaCategoria = sub === 'bonificacao' ? bonificacoes : sub === 'amostra' ? amostras : equipamentos;
  const quantidadePorSituacao=ch=>listaCategoria.filter(s=>situacaoSolicitacao(s)===ch).length;
  const lista=listaCategoria.filter(s=>situacaoSolicitacao(s)===subStatus);
  const podeCriar = podeEquipamento || podeBonificacao || podeAmostra;

  return h('div', null,
    detalheBonificacao&&h(Modal,{titulo:'Bonificações por SKU e mês',
      sub:detalheBonificacao.nome+' · notas fiscais de 2026',largo:true,
      onClose:()=>{setDetalheBonificacao(null);setLinhasBonificacao(null);},
      acoes:h('button',{className:'btn btn-secondary',onClick:()=>setDetalheBonificacao(null)},'Fechar')},
      linhasBonificacao===null?h('p',null,'Consultando histórico…')
      :linhasBonificacao.erro?h('p',{style:{color:'var(--danger)'}},linhasBonificacao.erro)
      :!linhasBonificacao.length?h('p',null,'Sem bonificações no período importado.')
      :h('div',{style:{maxHeight:'60vh',overflow:'auto'}},
        h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:12}},
          h('thead',null,h('tr',null,...['Mês','SKU','Descrição','Quantidade','Kg','R$ bonificado'].map(v=>h('th',{style:{padding:8,textAlign:'left'}},v)))),
          h('tbody',null,...linhasBonificacao.map((v,i)=>h('tr',{key:i},
            ...[String(v.mes||'').slice(0,7).split('-').reverse().join('/'),v.codigo,v.descricao,
              fmtNum(v.quantidade)+' '+v.unidade,v.kg===null?'—':fmtNum(v.kg),fmtMoeda(v.valor_rs)]
              .map(c=>h('td',{style:{padding:7,borderTop:'1px solid var(--border)'}},c)))))))),
    detalhe && h(DetalheFicha, { ficha:detalhe,usuarioId:ehPreview?null:profile.id,onClose:()=>setDetalhe(null),
      onReenviada:()=>{setDetalhe(null);carregar();onChanged?.();},
      onAjustar:ehPreview?undefined:(ficha,recusa)=>{setDetalhe(null);setAjustando({ficha,recusa});} }),
    modalNova && h(ModalNovaSolicitacao, {
      profile, visao, modulo, onClose: () => setModalNova(false),
      onCriada: (categoria) => { setModalNova(false); setSub(categoria || 'equipamento'); setSubStatus('aprovacao'); carregar(); }
    }),

    h('div', { className: 'page-head' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Solicitações'),
        h('div', { className: 'page-sub' }, 'Equipamentos · bonificações · envio de amostras')),
      h('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
        sub!=='fichas'&&h('input',{type:'search',className:'form-input',style:{width:'min(360px, 100%)'},
          value:buscaSolicitacao,onChange:e=>setBuscaSolicitacao(e.target.value),
          placeholder:'Buscar por código, razão social ou nome fantasia',
          'aria-label':'Buscar solicitações por código, razão social ou nome fantasia'}),
        podeCriar&&h('button',{className:'btn btn-primary',onClick:()=>setModalNova(true)},'+ Solicitação'))),

    erroConsultaSolicitacoes && h('div',{className:'card',style:{borderColor:'var(--danger)',marginBottom:12,color:'var(--danger)'}},
      h('strong',null,'Erro ao consultar solicitações'),
      h('div',{style:{marginTop:6,fontSize:13}},erroConsultaSolicitacoes),
      h('button',{className:'btn btn-secondary btn-sm',style:{marginTop:10},onClick:carregar},'Tentar novamente')),

    erroIndicadores&&h('div',{style:{fontSize:12,color:'var(--warning)',marginBottom:10}},erroIndicadores),
    h('div', { className: 'tabs', style: { display: 'flex', gap: 2, borderBottom: '1px solid var(--border)', marginBottom: 18, flexWrap: 'wrap' } },
      abas.map(a => h('button', {
        key: a.id, onClick: () => { setSub(a.id); setSubStatus('aprovacao'); },
        style: {
          padding: '10px 18px', fontSize: 13, fontWeight: 500, cursor: 'pointer',
          background: 'none', border: 'none', fontFamily: 'inherit',
          borderBottom: '2px solid ' + (sub === a.id ? 'var(--accent)' : 'transparent'),
          color: sub === a.id ? 'var(--accent)' : 'var(--text-muted)'
        }
      }, a.label))),

    sub!=='fichas' && h('div',{className:'tabs',style:{display:'flex',gap:5,flexWrap:'wrap',marginBottom:16,borderBottom:'1px solid var(--border)'}},
      ...[
        ['aprovacao','Pendente Aprovação'],
        ['realizacao','Pendente Realização'],
        ['concluido','Concluído'],
        ['reprovada','Reprovadas']
      ].map(([id,nome])=>h('button',{
        key:id,onClick:()=>setSubStatus(id),
        style:{padding:'9px 12px',border:'none',background:'none',cursor:'pointer',
          borderBottom:'2px solid '+(subStatus===id?'var(--accent)':'transparent'),

    subStatus==='reprovada'&&h('div',{className:'card',style:{marginBottom:12,fontSize:12}},

    sub==='equipamento'&&erroStatusRealizacao &&
      h('div',{className:'card',style:{marginBottom:12,borderColor:'var(--warning)',fontSize:12}},
        erroStatusRealizacao,
        h('div',{style:{marginTop:5}},'Itens sem confirmação operacional permanecem em Pendente Realização.')),

    sub === 'fichas'
      ? ((fichas || []).length === 0
          ? h('div', { className: 'card' }, h(Empty, { icon: '\u2691', texto: 'Você ainda não enviou nenhuma ficha.' }))
          : fichas.map(f => h('div', { className: 'card', key: f.id, style: { cursor: 'pointer' }, onClick: () => setDetalhe(f) },
              h('div', { style: { display: 'flex', flexWrap: 'wrap', justifyContent: 'space-between', gap: 10, marginBottom: 10 } },
                h('div', null,
                  h('div', { style: { fontSize: 15, fontWeight: 600 } }, f.razao_social),
                  h('div', { style: { fontSize: 12, color: 'var(--text-muted)' } }, f.cnpj_cpf + ' · enviada em ' + fmtData(f.created_at))),
                h('div', { style: { fontWeight: 700, fontFamily: "'JetBrains Mono', monospace" } }, fmtMoeda(f.faturamento_previsto))),
              h(Stepper, { aprovacoes: f.ficha_aprovacoes }))))
      : (lista.length === 0
          ? h('div', { className: 'card' }, h(Empty, { icon: '\u2692', texto: termosBusca.length?'Nenhuma solicitação encontrada nesta situação.':'Nenhuma solicitação nesta situação.' }))
          : lista.map(x => h('div',{key:x.id},
              h(CardSolicitacao,{s:x,rotas:rotasPorCliente[x.cliente_id]||[],erroRotas:erroRotasSolicitacoes,indicadores:indicadoresClientes[x.cliente_id],onAbrirBonificacoes:()=>abrirBonificacoesCliente({id:x.cliente_id,nome:x.clientes?.razao_social||'Cliente'})}),
              podeConcluirAdm && subStatus==='realizacao' &&
                ['bonificacao','amostra'].includes(x.categoria) &&
                x.status_fluxo==='vinculada' &&
                h('div',{className:'card',style:{marginTop:-5,marginBottom:12,padding:12,
                  borderColor:'var(--accent)',display:'flex',alignItems:'center',
                  justifyContent:'space-between',gap:10,flexWrap:'wrap'}},
                  h('span',{style:{fontSize:12}},
                    'Vinculada ao pedido. A Administração de Vendas confirma a realização.'),
                  h('button',{className:'btn btn-success btn-sm',
                    disabled:!!concluindoSolicitacao,
                    onClick:()=>concluirSolicitacaoAdm(x)},
                    concluindoSolicitacao===x.id?'Concluindo...':'✓ Confirmar realização'))
            ))));
}



function mascaraTelefoneBR(valor) {
  const d = String(valor || '').replace(/\D/g, '').slice(0, 13);
  // Aceita números já gravados com DDI 55 e também somente DDD+número.
  let n = d;
  let ddi = '';
  if (n.length > 11 && n.startsWith('55')) {
    ddi = '+55 ';
    n = n.slice(2);
  }
  if (n.length <= 2) return ddi + (n ? '(' + n : '');
  const ddd = n.slice(0,2);
  const resto = n.slice(2);
  if (!resto) return ddi + '(' + ddd + ') ';
  if (resto.length <= 4) return ddi + '(' + ddd + ') ' + resto;
  if (resto.length <= 8) return ddi + '(' + ddd + ') ' + resto.slice(0,4) + '-' + resto.slice(4);
  return ddi + '(' + ddd + ') ' + resto.slice(0,5) + '-' + resto.slice(5,9);
}

function PaginaMeuPerfil({ profile, onProfileUpdated }) {
  const toast = useToast();
  const [nome, setNome] = useState(profile.nome || '');
  const [telefone, setTelefone] = useState(mascaraTelefoneBR(profile.telefone || ''));
  const [senha, setSenha] = useState('');
  const [senha2, setSenha2] = useState('');
  const [salvando, setSalvando] = useState(false);
  const [acompanhamentoMap, setAcompanhamentoMap] = useState({});

  async function salvarDados() {
    if (!nome.trim()) return toast('Informe o nome.', 'error');
    setSalvando(true);
    const { error } = await sb.from('usuarios')
      .update({ nome: nome.trim(), telefone: telefone.trim() || null })
      .eq('id', profile.id);
    setSalvando(false);
    if (error) return toast(error.message, 'error');
    toast('Perfil atualizado.', 'success');
    if (onProfileUpdated) onProfileUpdated({ ...profile, nome:nome.trim(), telefone:telefone.trim() || null });
  }

  async function alterarSenha() {
    if (senha.length < 8) return toast('A nova senha deve ter pelo menos 8 caracteres.', 'error');
    if (senha !== senha2) return toast('As senhas não conferem.', 'error');
    setSalvando(true);
    const { error: authErr } = await sb.auth.updateUser({ password: senha });
    if (authErr) { setSalvando(false); return toast(authErr.message, 'error'); }

    // Regra solicitada: ao salvar uma nova senha, remove automaticamente a exigência.
    const { error: flagErr } = await sb.from('usuarios')
      .update({
        exigir_troca_senha: false,
        senha_alterada_em: new Date().toISOString()
      })
      .eq('id', profile.id);

    setSalvando(false);
    if (flagErr) return toast('Senha alterada, mas houve erro ao atualizar o controle: ' + flagErr.message, 'error');
    setSenha(''); setSenha2('');
    toast('Senha alterada com sucesso.', 'success');
    if (onProfileUpdated) onProfileUpdated({ ...profile, exigir_troca_senha:false });
  }

  return h('div', null,
    h('div', { className:'page-head' },
      h('div', null,
        h('div', { className:'page-title' }, 'Meu Perfil'),
        h('div', { className:'page-sub' }, 'Gerencie seus dados e sua senha'))),
    profile.exigir_troca_senha && h('div', { className:'card', style:{borderLeft:'4px solid #e6321f', marginBottom:16} },
      h('div', { className:'strong' }, 'Troca de senha obrigatória'),
      h('div', { className:'page-sub', style:{marginTop:4} }, 'Defina uma nova senha. Após salvar, esta exigência será removida automaticamente.')),
    h('div', { className:'card', style:{maxWidth:720} },
      h('div', { className:'section-title' }, 'Dados do perfil'),
      h('div', { className:'form-grid' },
        h(Campo, { label:'Nome', obrigatorio:true }, h(Input,{value:nome,onChange:e=>setNome(e.target.value)})),
        h(Campo, { label:'E-mail' }, h(Input,{value:profile.email || '',disabled:true})),
        h(Campo, { label:'Telefone' }, h(Input,{value:telefone,onChange:e=>setTelefone(mascaraTelefoneBR(e.target.value)),placeholder:'(14) 99999-9999',inputMode:'tel'})),
        h(Campo, { label:'Perfil' }, h(Input,{value:ROLE_LABELS[profile.papel] || profile.papel,disabled:true}))
      ),
      h('button',{className:'btn btn-primary',onClick:salvarDados,disabled:salvando},'Salvar dados')),
    h('div',{className:'card',style:{maxWidth:720,marginTop:16}},
      h('div',{className:'section-title'},'Alterar senha'),
      h('div',{className:'form-grid'},
        h(Campo,{label:'Nova senha',obrigatorio:true},h(Input,{type:'password',value:senha,onChange:e=>setSenha(e.target.value),placeholder:'Mínimo 8 caracteres'})),
        h(Campo,{label:'Confirmar nova senha',obrigatorio:true},h(Input,{type:'password',value:senha2,onChange:e=>setSenha2(e.target.value)}))
      ),
      h('button',{className:'btn btn-primary',onClick:alterarSenha,disabled:salvando},'Salvar nova senha'))
  );
}

async function vendedoresVisiveis(profile) {
  if (!profile) return [];
  if (profile.papel === 'vendedor') return [profile.id];

  if (profile.papel === 'supervisor') {
    const {data}=await sb.from('usuarios').select('id').eq('papel','vendedor').eq('supervisor_id',profile.id).eq('ativo',true);
    return [...new Set([profile.id, ...(data||[]).map(x=>x.id)])];
  }

  if (profile.papel === 'coordenador') {
    const {data:sups}=await sb.from('usuarios').select('id').eq('papel','supervisor').eq('coordenador_id',profile.id).eq('ativo',true);
    const ids=(sups||[]).map(x=>x.id);
    if(!ids.length)return [];
    const {data}=await sb.from('usuarios').select('id').eq('papel','vendedor').in('supervisor_id',ids).eq('ativo',true);
    return (data||[]).map(x=>x.id);
  }

  if (profile.papel === 'adm_vendas') {
    const {data:carteira}=await sb.from('adm_vendas_supervisores').select('supervisor_id').eq('adm_vendas_id',profile.id);
    const supIds=(carteira||[]).map(x=>x.supervisor_id);
    if(!supIds.length)return [];
    const {data}=await sb.from('usuarios').select('id').eq('papel','vendedor').in('supervisor_id',supIds).eq('ativo',true);
    return (data||[]).map(x=>x.id);
  }

  // Gestão Adm. Vendas, Diretoria, Financeiro e Admin mantêm visão ampla
  // quando a RLS correspondente permitir.
  return null;
}

function PaginaClientes({ profile, modulo }) {
  const toast = useToast();
  const [clientes, setClientes] = useState(null);
  const [busca, setBusca] = useState('');
  const [somenteSemCodigo, setSomenteSemCodigo] = useState(false);
  const [paginaClientes, setPaginaClientes] = useState(0);
  const [totalClientes, setTotalClientes] = useState(0);
  const [tabelasPrecoClientes, setTabelasPrecoClientes] = useState({});
  const TAM_PAGINA_CLIENTES = 50;
  const [editandoTotvs, setEditandoTotvs] = useState({});
  const [enderecoCliente,setEnderecoCliente]=useState(null);
  const [salvandoEndereco,setSalvandoEndereco]=useState(false);
  const [fiscalCliente,setFiscalCliente]=useState(null);
  const [contaCorrenteCliente,setContaCorrenteCliente]=useState(null);
  const [salvandoFiscal,setSalvandoFiscal]=useState(false);
  const [editandoAcordo, setEditandoAcordo] = useState({});
  const [levantamentoAcordos,setLevantamentoAcordos]=useState(null);
  const [carregandoAcordos,setCarregandoAcordos]=useState(false);
  const [filtroTipoAcordo,setFiltroTipoAcordo]=useState('todos');
  const podeEditar = ['admin','financeiro','adm_vendas','gestao_adm_vendas'].includes(profile.papel);
  const podeEditarAcordo = modulo === 'administracao_vendas' && ['admin','financeiro','adm_vendas','gestao_adm_vendas'].includes(profile.papel);

  useEffect(() => { const timer = setTimeout(() => carregar(), 300); return () => clearTimeout(timer); }, [paginaClientes, busca, somenteSemCodigo]);
  useEffect(() => { (async () => {
    // O cadastro DA0 grava a descrição na coluna 'descricao', não 'nome'.
    // A consulta anterior falhava silenciosamente e ocultava todos os vínculos na tela de Clientes.
    const { data, error } = await sb.from('tabelas_preco').select('id,codigo,descricao').limit(10000);
    if (error) { console.error('Falha ao carregar tabelas de preço dos clientes:', error); toast('Não foi possível consultar as tabelas de preço: '+error.message,'error'); return; }
    setTabelasPrecoClientes(Object.fromEntries((data || []).map(x => [x.id, [x.codigo,x.descricao].filter(Boolean).join(' — ')])));
  })(); }, []);

  async function carregar() {
    const idsVisiveis = await vendedoresVisiveis(profile);
    if (Array.isArray(idsVisiveis) && !idsVisiveis.length) {
      setClientes([]); setTotalClientes(0); return;
    }
    const filtro = busca.trim().replace(/[,()]/g, ' ');
    async function consultar(comFicha) {
      let q = sb.from('clientes')
        .select(comFicha
          ? '*, usuarios:vendedor_id(nome, codigo_vendedor), fichas_clientes!clientes_ficha_id_fkey(faturamento_previsto, created_at, ficha_aprovacoes(etapa, status, ordem, decidido_em))'
          : '*, usuarios:vendedor_id(nome, codigo_vendedor)', { count: 'exact' })
        .order('created_at', { ascending: false }).order('id')
        .range(paginaClientes * TAM_PAGINA_CLIENTES, (paginaClientes + 1) * TAM_PAGINA_CLIENTES - 1);
      // Cliente nascido de ficha só aparece depois de aprovado em todas as etapas (campo calculado no banco).
      q = q.is('mc_cliente_liberado', true);
      if (Array.isArray(idsVisiveis)) q = q.in('vendedor_id', idsVisiveis);
      if (somenteSemCodigo) q = q.or('codigo_totvs.is.null,codigo_totvs.eq.');
      if (filtro) q = q.or(['razao_social','nome_fantasia','cnpj_cpf','codigo_totvs','cidade'].map(k => k + '.ilike.%' + filtro + '%').join(','));
      const { data, count, error } = await q;
      if (error) throw error;
      return { data, count };
    }
    try {
      let resultado;
      try { resultado = await consultar(true); }
      catch (e) { console.warn('Consulta de ficha indisponível:', e.message); resultado = await consultar(false); }
      setClientes(resultado.data || []);
      setTotalClientes(resultado.count || 0);
    } catch (error) {
      toast(/mc_cliente_liberado/.test(error.message || '')
        ? 'A lista de clientes depende da migração 20261126_cliente_liberado_apos_aprovacao.sql, ainda não aplicada no banco.'
        : 'Erro ao carregar clientes: ' + error.message, 'error');
      setClientes([]); setTotalClientes(0);
    }
    setEditandoTotvs({}); setEditandoAcordo({});
  }

  function classificarRegistroAcordo(valor){
    const t=String(valor||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const risco=/inadimpl|negativ|protest|serasa|spc|risco|credito|cobranc|atraso|divida|devedor|judicial|restric|bloqueio|pendenc.*financ/.test(t);
    const comercial=/bonific|verba|acordo|contrato|descont|comodato|parceria|prazo|preco|condic.*comerc|equipament|negociac/.test(t);
    return risco&&comercial?'Misto — revisar':risco?'Possível risco financeiro':comercial?'Possível acordo comercial':'Não classificado — revisar';
  }
  async function levantarAcordos(){
    if(carregandoAcordos)return;
    setCarregandoAcordos(true);
    try{
      const idsVisiveis=await vendedoresVisiveis(profile);
      if(Array.isArray(idsVisiveis)&&idsVisiveis.length===0){
        setLevantamentoAcordos([]);return;
      }
      const todos=[];
      // A lista de clientes é paginada em 50. Aqui consultamos a coluna
      // completa em lotes para não excluir registros de outras páginas.
      for(let inicio=0;inicio<200000;inicio+=500){
        let q=sb.from('clientes')
          .select('id,codigo_totvs,razao_social,nome_fantasia,cnpj_cpf,cidade,estado,vendedor_id,acordo_comercial,usuarios:vendedor_id(nome,codigo_vendedor)')
          .not('acordo_comercial','is',null)
          .is('mc_cliente_liberado',true)
          .order('id',{ascending:true})
          .range(inicio,inicio+499);
        if(Array.isArray(idsVisiveis))q=q.in('vendedor_id',idsVisiveis);
        const {data,error}=await q;
        if(error)throw error;
        todos.push(...(data||[]).filter(c=>String(c.acordo_comercial||'').trim()));
        if((data||[]).length<500)break;
        if(inicio>=199500)throw new Error('Levantamento ultrapassou o limite de consulta; reduza o escopo antes de exportar.');
      }
      setLevantamentoAcordos(todos);
      toast('Levantamento concluído: '+todos.length+' cliente(s) com observação na coluna Acordo.','success');
    }catch(e){
      toast('Erro ao levantar acordos: '+(e.message||e),'error');
      setLevantamentoAcordos(null);
    }finally{setCarregandoAcordos(false);}
  }
  function exportarLevantamentoAcordos(){
    if(!levantamentoAcordos)return;
    const cab=['Código TOTVS','Razão Social','Nome Fantasia','CNPJ','Cidade','UF','Código Vendedor','Vendedor','Classificação sugerida','Texto original da coluna Acordo','Situação do levantamento','Observações para conferência'];
    const registros=levantamentoAcordos.filter(c=>
      filtroTipoAcordo==='todos'||classificarRegistroAcordo(c.acordo_comercial)===filtroTipoAcordo
    ).map(c=>[c.codigo_totvs||'',c.razao_social||'',c.nome_fantasia||'',c.cnpj_cpf||'',c.cidade||'',c.estado||'',
      c.usuarios?.codigo_vendedor||'',c.usuarios?.nome||'',classificarRegistroAcordo(c.acordo_comercial),
      c.acordo_comercial||'','Pendente de revisão','']);
    const esc=v=>{
      // Também impede execução de fórmulas ao abrir dados livres no Excel.
      let str=String(v??'');
      if(/^[\s]*[=+@\-\t\r]/.test(str))str="'"+str;
      return '"'+str.replace(/"/g,'""')+'"';
    };
    const csv='\uFEFF'+[cab,...registros].map(cols=>cols.map(esc).join(';')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    const link=document.createElement('a');
    link.href=url;link.download='Levantamento_Acordos_Riscos_Meu_Cliente_'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

  async function salvarTotvs(c) {
    const valor = String(editandoTotvs[c.id] == null ? (c.codigo_totvs || '') : editandoTotvs[c.id]).trim();
    if (!valor) return toast('Informe o código TOTVS do cliente.', 'error');
    const { error } = await sb.rpc('atualizar_codigo_totvs_cliente', {
      p_cliente_id: c.id,
      p_codigo_totvs: valor
    });
    if (error) return toast('Não foi possível salvar o código TOTVS: ' + error.message, 'error');
    toast('Código TOTVS salvo com sucesso.', 'success');
    carregar();
  }

  async function salvarAcordo(c) {
    const valor = String(editandoAcordo[c.id] == null ? (c.acordo_comercial || '') : editandoAcordo[c.id]).trim();
    const { error } = await sb.from('clientes').update({ acordo_comercial: valor || null }).eq('id', c.id);
    if (error) return toast('Não foi possível salvar o Acordo: ' + error.message, 'error');
    toast(valor ? 'Acordo atualizado com sucesso.' : 'Acordo removido com sucesso.', 'success');
    carregar();
  }

  async function salvarFiscalCliente(){
    const f=fiscalCliente;if(!f)return;
    const loja=String(f.loja_totvs||'').trim();
    if(!/^\d{2}$/.test(loja))return toast('Loja TOTVS: informe 2 dígitos (ex.: 01).','error');
    if(!['Cons.Final','Solidario','Produtor Rural'].includes(f.tipo_cliente_tes))
      return toast('Selecione o tipo fiscal do cliente.','error');
    if(!['C01','C02','C03','SEM GRUPO'].includes(f.grupo_tributario_tes))
      return toast('Selecione o grupo tributário do cliente.','error');
    setSalvandoFiscal(true);
    const {error}=await sb.from('clientes').update({
      loja_totvs:loja,tipo_cliente_tes:f.tipo_cliente_tes,
      grupo_tributario_tes:f.grupo_tributario_tes
    }).eq('id',f.id);
    setSalvandoFiscal(false);
    if(error)return toast('Classificação fiscal não salva: '+error.message,'error');
    setFiscalCliente(null);toast('Classificação fiscal atualizada.','success');carregar();
  }

    setSalvandoEndereco(false);
    if(error)return toast('Erro ao salvar endereço: '+error.message,'error');
    setEnderecoCliente(null);toast('Endereço atualizado.','success');carregar();
  }
  async function consultarCepCliente(cep){
    const limpo=String(cep||'').replace(/\D/g,'');if(limpo.length!==8)return;
    try{const resposta=await fetch('https://viacep.com.br/ws/'+limpo+'/json/');const d=await resposta.json();if(!d.erro)setEnderecoCliente(x=>x?({...x,endereco_logradouro:d.logradouro||x.endereco_logradouro,endereco_bairro:d.bairro||x.endereco_bairro,cidade:d.localidade||x.cidade,estado:d.uf||x.estado}):x);}catch(e){console.warn('CEP indisponível',e);}
  }
  function statusCliente(c) {

  const filtrados = clientes || [];

function listarEquipamentos(f) {
  if (!f || !f.precisa_equipamento) return [];
  const itens = [];
  const eq=f.equipamentos_quantidades||{};
  for(const forno of fornosDaFicha(f))itens.push(forno.nome+(forno.modelo?' - '+forno.modelo+' esteiras':'')+' (x'+forno.quantidade+')');
  (f.freezer_tipos || []).forEach(t => itens.push('Freezer ' + t));
  if (f.armario_tipo) itens.push('Armário ' + f.armario_tipo);
  if (f.camara_climatica) itens.push('Câmara Climática ' + f.camara_climatica);
  if (f.esteiras_quantidade) itens.push(`Esteiras (x${f.esteiras_quantidade})`);
  if (f.assadeiras_quantidade) itens.push(`Assadeiras (x${f.assadeiras_quantidade})`);
  return itens;
}

function rotaSolicitacao(tipo, justificativa, categoria, papel='vendedor') {
  const todas=categoria==='amostra'?['supervisor','coordenador','gestao_adm_vendas']
    :categoria==='bonificacao'?['vendedor','supervisor','coordenador','gestao_adm_vendas','financeiro','diretoria']
    :tipo==='manutencao'?['manutencao']
    :tipo==='troca'?['vendedor','supervisor','coordenador','manutencao','diretoria']
    :tipo==='retirada'?['vendedor','supervisor','coordenador']
    :['vendedor','supervisor','coordenador','gestao_adm_vendas','diretoria'];
  const ini=['vendedor','supervisor','coordenador'].includes(papel)?papel:'supervisor';
  const pos=todas.indexOf(ini);
  return pos<0?todas:todas.slice(pos);
}

function StepperGenerico({ aprovacoes, atualId }) {
  const ordenadas=[...(aprovacoes||[])].filter(Boolean).sort((a,b)=>(Number(a.ordem)||0)-(Number(b.ordem)||0)
    ||String(a.etapa||'').localeCompare(String(b.etapa||'')));
  if(!ordenadas.length)return h('div',{className:'page-sub'},'Histórico de aprovações indisponível.');
  const icones={aprovado:'✓',reprovado:'✗',pendente:'●',aguardando:'○',nao_aplica:'–'};
  const grupos=[];
  ordenadas.forEach(ap=>{
    let grupo=grupos[grupos.length-1];
    if(!grupo||grupo.ordem!==ap.ordem)grupos.push(grupo={ordem:ap.ordem,itens:[]});
    grupo.itens.push(ap);
  });
  return h('div',{className:'stepper',style:{display:'flex',alignItems:'center',flexWrap:'wrap',gap:5}},
    ...grupos.map((g,i)=>h(React.Fragment,{key:'ordem_'+g.ordem},
      i>0&&h('span',{className:'step-arrow',style:{margin:'0 3px'}},'›'),
      h('span',{style:{display:'inline-flex',gap:4,flexWrap:'wrap',alignItems:'center',
        padding:g.itens.length>1?'3px 5px':0,
        border:g.itens.length>1?'1px dashed var(--border)':'none',borderRadius:6}},
        ...g.itens.map(ap=>h('span',{
          key:ap.id||ap.etapa,
          className:'badge '+(STATUS_CLASSE[ap.status]||'badge-gray'),
          title:(ROLE_LABELS[ap.etapa]||ap.etapa)+' — '+
            ({aprovado:'Aprovado',reprovado:'Reprovado',pendente:'Pendente de decisão',
              aguardando:'Aguardando etapa anterior',nao_aplica:'Não se aplica'}[ap.status]||ap.status||'—')+
            (ap.observacao?' | Observação: '+ap.observacao:'')+
            (ap.decidido_em?' | Data: '+fmtData(ap.decidido_em):''),
          style:atualId&&String(ap.id)===String(atualId)?{outline:'1px solid var(--accent)',outlineOffset:1}:{}
        },(icones[ap.status]||'○')+' '+(ROLE_LABELS[ap.etapa]||ap.etapa))))))
  );
}

function ModalNovaSolicitacao({ profile, visao, modulo, onClose, onCriada }) {
  const toast = useToast();
  const [clientes, setClientes] = useState(null);
  const [produtos, setProdutos] = useState([]);
  const [clienteId, setClienteId] = useState('');

  const [tipo, setTipo] = useState('');
  const novaLinhaEquip = () => ({ equipamento:'', quantidade:1, patrimonio:'' });
  const [equipamentosSolicitados, setEquipamentosSolicitados] = useState([novaLinhaEquip()]);
  const [equipamentosEntrega, setEquipamentosEntrega] = useState([novaLinhaEquip()]);
  const [justificativa, setJustificativa] = useState('');
  const [descricao, setDescricao] = useState('');
  const [produtoId, setProdutoId] = useState('');
  const [quantidade, setQuantidade] = useState('');
  const novaLinhaBonificacao=()=>({produto_id:'',quantidade:''});
  const [itensBonificacao,setItensBonificacao]=useState([novaLinhaBonificacao()]);
  const [modalidadeBonificacao, setModalidadeBonificacao] = useState('');
  const [tipoAmostra, setTipoAmostra] = useState('');
  const [salvando, setSalvando] = useState(false);
  const [erroDiagnostico,setErroDiagnostico] = useState(null);
  const [acompanhamentoMap, setAcompanhamentoMap] = useState({});
  function alterarLinhaEquip(setter, idx, campo, valor) { setter(prev => prev.map((x,i) => i === idx ? { ...x, [campo]: valor } : x)); }
  function adicionarLinhaEquip(setter) { setter(prev => [...prev, novaLinhaEquip()]); }
  function removerLinhaEquip(setter, idx) { setter(prev => prev.length <= 1 ? prev : prev.filter((_,i) => i !== idx)); }

  useEffect(() => {
    (async () => {
      let qc = sb.from('clientes').select('id, razao_social, nome_fantasia, cidade, cnpj_cpf, codigo_totvs, vendedor_id, fichas_clientes(*)').order('razao_social').limit(10000);
      const idsVisiveis = await vendedoresVisiveis(profile);
      if (Array.isArray(idsVisiveis)) {
        if (!idsVisiveis.length) { setClientes([]); }
        else qc = qc.in('vendedor_id', idsVisiveis);
      }
      const [rc, rp] = await Promise.all([
        qc,
        sb.from('produtos').select('id, codigo, descricao, ativo').eq('ativo', true).order('codigo')
      ]);
      setClientes(rc.data || []); setProdutos(rp.data || []);
    })();
  }, []);

  const categoriasPermitidas = [];
  if (modulo === 'administracao_vendas') {
    // Administração de Vendas abre somente solicitação de troca de equipamento.
    if (['adm_vendas','gestao_adm_vendas','admin'].includes(visao)) categoriasPermitidas.push(['equipamento','Troca de Equipamento']);
  } else {
    if (['vendedor','supervisor','coordenador','admin'].includes(visao)) categoriasPermitidas.push(['equipamento','Equipamento']);
    if (['vendedor','supervisor','admin'].includes(visao)) categoriasPermitidas.push(['bonificacao','Bonificação']);
    if (['vendedor','supervisor','admin'].includes(visao)) categoriasPermitidas.push(['amostra','Kit / Amostra']);
  }

  const clienteSel = (clientes || []).find(c => c.id === clienteId);
  const equipamentos = clienteSel ? listarEquipamentos(clienteSel.fichas_clientes) : [];
  const rota = categoria ? rotaSolicitacao(tipo, justificativa, categoria, profile.papel) : [];

  useEffect(() => { setEquipamentosSolicitados([novaLinhaEquip()]); setEquipamentosEntrega([novaLinhaEquip()]); }, [clienteId]);
  useEffect(() => {
    setTipo(modulo === 'administracao_vendas' && categoria === 'equipamento' ? 'troca' : '');
    setEquipamentosSolicitados([novaLinhaEquip()]); setEquipamentosEntrega([novaLinhaEquip()]);
    setJustificativa(''); setProdutoId(''); setQuantidade(''); setItensBonificacao([novaLinhaBonificacao()]); setModalidadeBonificacao(''); setTipoAmostra('');
  }, [categoria]);

  async function criarAprovacaoManual(solicitacaoId, etapa) {
    const { data: existentes } = await sb.from('solicitacao_aprovacoes').select('id').eq('solicitacao_id', solicitacaoId).limit(1);
    if (existentes && existentes.length) return;
    await sb.from('solicitacao_aprovacoes').insert({
      solicitacao_id: solicitacaoId, etapa, ordem: 1, status: 'pendente'
    });
  }

  async function salvar() {
    setErroDiagnostico(null);
    if (!categoria) return toast('Selecione a categoria.', 'error');
    if (!clienteId) return toast('Selecione o cliente.', 'error');

    let payload = {
      cliente_id: clienteId, solicitante_id: profile.id, categoria,
      descricao: descricao.trim() || null,
      // Compatibilidade com o schema legado: equipamento ainda é NOT NULL.
      // Para categorias não relacionadas a equipamento usamos um marcador técnico.
      equipamento: categoria === 'bonificacao' ? 'BONIFICAÇÃO' :
                   categoria === 'amostra' ? 'AMOSTRA' : ''
    };

    if (categoria === 'equipamento') {
      if (!tipo) return toast('Selecione o tipo de solicitação.', 'error');
      const linhas = equipamentosSolicitados.filter(x => x.equipamento && Number(x.quantidade) > 0);
      const entregas = tipo === 'troca' ? equipamentosEntrega.filter(x => x.equipamento && Number(x.quantidade) > 0) : [];
      if (!linhas.length) return toast('Inclua pelo menos um equipamento e quantidade.', 'error');
      if (tipo === 'troca' && !justificativa) return toast('Informe a justificativa da troca.', 'error');
      if (tipo === 'retirada' && !justificativa) return toast('Informe o motivo da retirada.', 'error');
      if (tipo === 'troca' && !entregas.length) return toast('Inclua pelo menos um equipamento a entregar e quantidade.', 'error');
      const primeiro = linhas[0], primeiraEntrega = entregas[0];
      const tipoNormalizado=String(tipo||'').trim().toLowerCase();
      const justificativaNormalizada=String(justificativa||'').trim().normalize('NFC');
      const motivosRetirada=['Baixo consumo','Encerramento do contrato'];
      const motivosTroca=['Relacionamento','Equipamento Antigo','Equipamento Danificado'];
      if(tipoNormalizado==='retirada'&&!motivosRetirada.includes(justificativaNormalizada))
        return toast('Selecione um motivo válido para a retirada.','error');
      if(tipoNormalizado==='troca'&&!motivosTroca.includes(justificativaNormalizada))
        return toast('Selecione uma justificativa válida para a troca.','error');
      payload = { ...payload, tipo:tipoNormalizado, equipamento: primeiro.equipamento,
        patrimonio: (primeiro.patrimonio || '').trim() || null, quantidade: Number(primeiro.quantidade),
        justificativa: ['troca','retirada'].includes(tipoNormalizado) ? justificativaNormalizada : null };
    } else if (categoria === 'bonificacao') {
      if(!itensBonificacao.length||itensBonificacao.length>100||
         itensBonificacao.some(it=>!it.produto_id||!Number.isFinite(Number(it.quantidade))||Number(it.quantidade)<=0||Number(it.quantidade)>1000000))
        return toast('Informe produto e quantidade válida em todas as linhas (até 100 produtos).','error');
      if(new Set(itensBonificacao.map(it=>String(it.produto_id))).size!==itensBonificacao.length)
        return toast('O mesmo produto não pode ser incluído duas vezes. Ajuste a quantidade em uma única linha.','error');
      if (!modalidadeBonificacao) return toast('Informe se será acréscimo ou desconto do pedido.', 'error');
      payload = { ...payload, tipo: 'bonificacao', produto_id: itensBonificacao[0].produto_id,
        quantidade: Number(itensBonificacao[0].quantidade),
        modalidade_bonificacao: modalidadeBonificacao, status_fluxo: 'aberta' };
    } else {
      if (!tipoAmostra) return toast('Informe KIT ou Produto.', 'error');
      if (tipoAmostra === 'produto' && (!produtoId || Number(quantidade) <= 0)) return toast('Informe produto e quantidade.', 'error');
      payload = { ...payload, tipo: 'amostra', tipo_amostra: tipoAmostra,
        produto_id: tipoAmostra === 'produto' ? produtoId : null,
        quantidade: tipoAmostra === 'produto' ? Number(quantidade) : 1, status_fluxo: 'aberta' };
    }

    setSalvando(true);
    // Bonificação usa uma transação no Supabase: cabeçalho + todos os itens ou nenhum.
    // O INSERT legado continua disparando exatamente os mesmos triggers de aprovação.
    const resultado=categoria==='bonificacao'
      ? await sb.rpc('mc_criar_bonificacao_multiplos_itens',{
          p_cliente_id:clienteId,p_solicitante_id:profile.id,p_descricao:descricao.trim()||null,
          p_modalidade:modalidadeBonificacao,
          p_itens:itensBonificacao.map(it=>({produto_id:it.produto_id,quantidade:Number(it.quantidade)}))
        })
      : await sb.from('solicitacoes').insert(payload).select().single();
    const error=resultado.error;
    const nova=categoria==='bonificacao'?{id:resultado.data}:resultado.data;
    setSalvando(false);
    if (error) {
      // Diagnóstico visível para usuários de celular, inclusive quando o toast desaparece.
      // Não exibe endereço, CNPJ, token ou dados pessoais do usuário.
      const diagnostico={
        versao:'MC-20261111-JOSE-1',
        categoria:String(payload.categoria||''),
        tipo:String(payload.tipo||''),
        justificativa:String(payload.justificativa==null?'NULL':payload.justificativa),
        codigoErro:String(error.code||''),
        mensagem:String(error.message||''),
        detalhes:String(error.details||''),
        dica:String(error.hint||'')
      };
      setErroDiagnostico(diagnostico);
      console.error('[Meu Cliente] Falha ao salvar solicitação',diagnostico);
      if (error.code === '23514' && String(error.message || '').includes('solicitacoes_justificativa_check')) {
        return toast('O banco rejeitou a justificativa. Confira o diagnóstico em vermelho no formulário.','error');
      }
      return toast(error.message, 'error');
    }
    if (categoria === 'equipamento') {
      const detalhes = [];
      equipamentosSolicitados.filter(x => x.equipamento && Number(x.quantidade) > 0).forEach(x => detalhes.push({
        solicitacao_id:nova.id, movimento: tipo === 'troca' ? 'coletar' : 'equipamento', equipamento:x.equipamento, quantidade:Number(x.quantidade), patrimonio:(x.patrimonio||'').trim()||null
      }));
      if (tipo === 'troca') equipamentosEntrega.filter(x => x.equipamento && Number(x.quantidade) > 0).forEach(x => detalhes.push({
        solicitacao_id:nova.id, movimento:'entregar', equipamento:x.equipamento, quantidade:Number(x.quantidade), patrimonio:(x.patrimonio||'').trim()||null
      }));
      const { error: erroItens } = await sb.from('solicitacao_equipamentos').insert(detalhes);
      if (erroItens) return toast('Solicitação criada, mas houve erro ao gravar os equipamentos: ' + erroItens.message, 'error');
    }
    toast('Solicitação enviada!', 'success');
    onCriada(categoria);
  }

  return h(Modal, {
    titulo: 'Nova solicitação',
    sub: 'Registre equipamentos, bonificações ou envio de amostras',
    largo: true, onClose,

      h('button', { key: 'c', className: 'btn btn-secondary', onClick: onClose }, 'Cancelar'),

function IndicadoresSolicitacao({info,onAbrir}) {
  if(info===undefined)return h('div',{style:{fontSize:12,color:'var(--text-muted)'}},'Carregando indicadores fiscais…');
  if(info===null)return h('div',{style:{fontSize:12,color:'var(--text-muted)'}},'Indicadores fiscais indisponíveis.');
  const meses=Number(info.meses||0);
  if(!meses)return h('div',{style:{fontSize:12,color:'var(--text-muted)'}},'Ainda não há meses de NF importados.');
  const rs=Number(info.vendas_rs||0)-Number(info.bonificacoes_rs||0);
  const kg=info.vendas_kg===null||info.bonificacoes_kg===null?null:Number(info.vendas_kg)-Number(info.bonificacoes_kg);
  const kpi=(nome,valor,legenda)=>h('div',{style:{flex:'1 1 180px'}},
    h('div',{style:{fontSize:11,color:'var(--text-muted)'}},nome),
    h('div',{style:{fontWeight:700,fontSize:14,marginTop:3}},valor),
    h('div',{style:{fontSize:10,color:'var(--text-muted)',marginTop:3}},legenda));
  return h('div',{style:{display:'flex',gap:12,flexWrap:'wrap',padding:12,border:'1px solid var(--border)',borderRadius:8,margin:'10px 0'}},
    kpi('Consumo líquido/mês',fmtMoeda(rs)+' · '+(kg===null?'Kg indisponível':fmtNum(kg)+' kg'),'Venda − bonificação / '+meses+' meses'),
    kpi('Preço kg francês',info.preco_kg_frances==null?'Não cadastrado':fmtMoeda(info.preco_kg_frances),'Última ficha'),
    h('div',{style:{flex:'1 1 180px'}},
      h('div',{style:{fontSize:11,color:'var(--text-muted)'}},'Bonificado total no período'),
      h('div',{style:{fontWeight:700,fontSize:14,marginTop:3}},fmtMoeda(info.total_bonificado_rs||0)),
      h('button',{className:'btn btn-secondary btn-sm',style:{marginTop:6},onClick:onAbrir},'Ver SKU × mês')),
    Number(info.itens_sem_peso)>0&&h('div',{style:{width:'100%',fontSize:11,color:'var(--warning)'}},
      'Peso incompleto em '+info.itens_sem_peso+' registro(s) fiscais.'));
}
