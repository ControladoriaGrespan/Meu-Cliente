  --bg-card: #ffffff;

  --border: #d4d8e0;

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; }

/* Layout */
.app-layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; background: var(--bg-card); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 50; transition: width 0.25s ease, transform 0.25s ease; overflow: hidden;

.sidebar.collapsed .nav-label,
.sidebar.collapsed .nav-section,

.sidebar-nav { flex: 1; padding: 12px 10px; overflow-y: auto; }

function mascaraTelefone(v) {
  const d = (v || '').replace(/\D/g, '').slice(0, 11);
  if (!d) return '';
  if (d.length <= 2) return '(' + d;
  if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
function mascaraTelefoneIntl(v) {
  const d = (v || '').replace(/\D/g, '').slice(0, 13);
  if (d.length <= 2) return d;
  if (d.length <= 4) return `+${d.slice(0,2)} (${d.slice(2)}`;
  if (d.length <= 9) return `+${d.slice(0,2)} (${d.slice(2,4)}) ${d.slice(4)}`;
  return `+${d.slice(0,2)} (${d.slice(2,4)}) ${d.slice(4,9)}-${d.slice(9)}`;
}
function mascaraCpf(v) {
  const n = String(v || '').replace(/\D/g, '').slice(0, 11);
  if (n.length <= 3) return n;
  if (n.length <= 6) return n.slice(0,3) + '.' + n.slice(3);
  if (n.length <= 9) return n.slice(0,3) + '.' + n.slice(3,6) + '.' + n.slice(6);
  return n.slice(0,3) + '.' + n.slice(3,6) + '.' + n.slice(6,9) + '-' + n.slice(9,11);
}

function mascaraCnpj(v) {
  const d = (v || '').replace(/\D/g, '').slice(0, 14);
  if (d.length <= 2) return d;
  if (d.length <= 5) return `${d.slice(0,2)}.${d.slice(2)}`;
  if (d.length <= 8) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5)}`;
  if (d.length <= 12) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8)}`;
  return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
}
// Confere os dois dígitos verificadores do CNPJ (módulo 11 da Receita Federal).
// Não consulta a Receita: detecta número digitado errado ou inventado, não situação cadastral.
function cnpjValido(v) {
  const d = String(v || '').replace(/\D/g, '');
  if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
  const dv = base => {
    let soma = 0, peso = base.length - 7;
    for (const c of base) { soma += Number(c) * peso; peso = peso === 2 ? 9 : peso - 1; }
    const r = soma % 11;
    return r < 2 ? 0 : 11 - r;
  };
  const d1 = dv(d.slice(0, 12));
  return d1 === Number(d[12]) && dv(d.slice(0, 12) + d1) === Number(d[13]);
}
// Consulta gratuita do CNPJ em serviços públicos (CNPJ.ws; BrasilAPI como reserva).
// Retorna {status:'ok',dados} | {status:'nao_encontrado'} | {status:'indisponivel'}.
// Nunca lança erro: serviço de terceiros fora do ar não pode travar o cadastro.
async function consultarCnpjPublico(cnpj) {
  const d = String(cnpj || '').replace(/\D/g, '');
  const txt = v => String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
  const buscar = async url => {
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 8000);
    try {
      const r = await fetch(url, { signal: ctrl.signal, headers: { Accept: 'application/json' } });
      if (r.status === 404) return { status: 'nao_encontrado' };
      if (!r.ok) return { status: 'indisponivel' };
      return { status: 'ok', json: await r.json() };
    } catch (e) { return { status: 'indisponivel' }; }
    finally { clearTimeout(t); }
  };
  const rua = (tipo, logradouro) => {
    const t = txt(tipo), l = txt(logradouro);
    return t && !l.toUpperCase().startsWith(t.toUpperCase()) ? t + ' ' + l : l;
  };
  let r = await buscar('https://publica.cnpj.ws/cnpj/' + d);
  if (r.status === 'ok') {
    const j = r.json || {}, e = j.estabelecimento || {};
    if (!txt(j.razao_social)) return { status: 'indisponivel' };
    return { status: 'ok', dados: {
      razao_social: txt(j.razao_social), nome_fantasia: txt(e.nome_fantasia), situacao: txt(e.situacao_cadastral),
      rua: rua(e.tipo_logradouro, e.logradouro), numero: txt(e.numero), bairro: txt(e.bairro),
      cidade: txt(e.cidade && e.cidade.nome), estado: txt(e.estado && e.estado.sigla).toUpperCase().slice(0, 2),
      cep: txt(e.cep), telefone: txt(e.ddd1) + txt(e.telefone1), email: txt(e.email).toLowerCase() } };
  }
  if (r.status === 'nao_encontrado') return r;
  r = await buscar('https://brasilapi.com.br/api/cnpj/v1/' + d);
  if (r.status === 'ok') {
    const j = r.json || {};
    if (!txt(j.razao_social)) return { status: 'indisponivel' };
    return { status: 'ok', dados: {
      razao_social: txt(j.razao_social), nome_fantasia: txt(j.nome_fantasia), situacao: txt(j.descricao_situacao_cadastral),
      rua: rua(j.descricao_tipo_de_logradouro, j.logradouro), numero: txt(j.numero), bairro: txt(j.bairro),
      cidade: txt(j.municipio), estado: txt(j.uf).toUpperCase().slice(0, 2),
      cep: txt(j.cep), telefone: txt(j.ddd_telefone_1), email: txt(j.email).toLowerCase() } };
  }
  return r.status === 'nao_encontrado' ? r : { status: 'indisponivel' };
}

function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const addToast = useCallback((msg, type = 'info') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4000);

    children,
    h('div', { className: 'toast-container' },
      toasts.map(t => h('div', { key: t.id, className: `toast toast-${t.type}` }, t.msg))));
}

// Avisos WhatsApp: o aplicativo cria um link pré-preenchido, sem enviar a mensagem.
// O envio exige confirmação pelo usuário dentro do WhatsApp (não há API WhatsApp integrada).
const MC_WHATS_STORAGE='mc_whats_pendentes_v106';
function numeroWhats(telefone){
  let numero=String(telefone||'').replace(/\D/g,'');
  if(/^\d{10,11}$/.test(numero))numero='55'+numero;
  return /^\d{12,13}$/.test(numero)&&numero.startsWith('55')?numero:null;
}
function urlWhats(telefone,mensagem){
  const num=numeroWhats(telefone);
  return num?'https://wa.me/'+num+'?text='+encodeURIComponent(mensagem||''):null;
}
function lerAvisosWhats(){
  try {
    const v=JSON.parse(sessionStorage.getItem(MC_WHATS_STORAGE)||'[]');
    return Array.isArray(v)?v.filter(x=>x&&urlWhats(x.telefone,x.mensagem)):[];
  }catch(e){return [];}
}
function salvarAvisosWhats(avisos){
  try{sessionStorage.setItem(MC_WHATS_STORAGE,JSON.stringify((avisos||[]).slice(-30)));}catch(e){}
}
function preAbrirJanelaWhats(){
  return ehCelularWhats()?null:window.open('','_blank');
}
function abrirWhats(telefone,mensagem,winRef){
  const url=urlWhats(telefone,mensagem);
  if(!url){if(winRef&&!winRef.closed)winRef.close();return false;}
  if(winRef&&!winRef.closed)winRef.location.href=url;
  else if(ehCelularWhats()){
    // Somente links acionados pelo toque devem navegar no celular.
    // Chamadas assíncronas ficam na fila persistida de avisos.
    agendarAvisoWhats([{telefone,mensagem,nome:'Responsável'}],mensagem);
  }else window.open(url,'_blank','noopener,noreferrer');
  return true;
}
function enviarWhatsComClique(telefone,mensagem){
  const url=urlWhats(telefone,mensagem);
  if(!url)return false;
  // Chamado somente pelo toque; não tentar abrir antes do término do Supabase.
  window.location.href=url;
  return true;
}
function agendarAvisoWhats(destinatarios,mensagem){
  const validos=(destinatarios||[]).map(d=>({
    id:d.id||d.telefone,nome:d.nome||'Responsável',telefone:d.telefone,
    mensagem:d._msg||d.mensagem||mensagem||''
  })).filter(d=>urlWhats(d.telefone,d.mensagem));
  if(validos.length){
    const antigos=lerAvisosWhats();
    const chaves=new Set(antigos.map(x=>numeroWhats(x.telefone)+'|'+x.mensagem));
    validos.forEach(d=>{
      const chave=numeroWhats(d.telefone)+'|'+d.mensagem;
      if(!chaves.has(chave)){antigos.push(d);chaves.add(chave);}
    });
    salvarAvisosWhats(antigos);
    window.dispatchEvent(new CustomEvent('mc-whatsapp-pendente',{detail:antigos}));
  }
  return validos.length;
}

    return ()=>window.removeEventListener('mc-whatsapp-pendente',receber);

// descobre o proximo responsavel e avisa. Retorna a lista quando ha
// mais de um destinatario (ai a tela mostra botoes, um clique por pessoa)
async function avisarProximo(fichaId, ordemAtual, ficha, winRef) {
  // Próximo da fila = a etapa que ficou na vez depois da atual. Não basta somar 1 à ordem:
  // etapas sem responsável são puladas ("não se aplica") e ninguém seria avisado.
  const { data: proxima } = await sb.from('ficha_aprovacoes').select('*')
    .eq('ficha_id', fichaId).eq('status', 'pendente').gt('ordem', ordemAtual)
    .order('ordem').limit(1).maybeSingle();
  if (!proxima) { if (winRef && !winRef.closed) winRef.close(); return []; }

  let dest = [];
  if (proxima.responsavel_id) {
    const { data } = await sb.from('usuarios').select('*').eq('id', proxima.responsavel_id).single();
    if (data) dest = [data];
  } else {
    const { data } = await sb.from('usuarios').select('*').eq('papel', proxima.etapa).eq('ativo', true);
    dest = data || [];
  }
  dest = dest.filter(d => d.telefone);
  const msg = msgAprovacao(ficha, ROLE_LABELS[proxima.etapa]);

  if (dest.length === 0) { if (winRef && !winRef.closed) winRef.close(); return []; }
  if(ehCelularWhats()){
    agendarAvisoWhats(dest,msg);
    if(winRef&&!winRef.closed)winRef.close();
    return [];
  }
  if (dest.length === 1) {
    abrirWhats(dest[0].telefone,msg,winRef);
    return [];
  }
  if (winRef && !winRef.closed) winRef.close();
  return dest.map(d => ({ ...d, _msg: msg }));
}

// Recusa do Supervisor, do Coordenador ou do Financeiro: a ficha volta para o vendedor.
// "ajuste" = ele pode editar a ficha inteira e reenviar; senão, é uma reprovação comum.
async function avisarVendedorFicha(ficha, etapaLabel, motivo, ajuste, winRef) {
  const fechar = () => { if (winRef && !winRef.closed) winRef.close(); };
  const { data: vend } = await sb.from('usuarios').select('id,nome,telefone').eq('id', ficha.vendedor_id).maybeSingle();
  if (!vend || !vend.telefone) { fechar(); return false; }
  const msg = (ajuste ? '↩️ Ficha devolvida para ajuste' : '✗ Ficha reprovada')
    + `\n*${ficha.razao_social}* (${ficha.cnpj_cpf})\nEtapa: ${etapaLabel}\nMotivo: ${motivo || 'não informado'}\n\n`
    + (ajuste ? 'Acesse o sistema, abra a ficha, faça o ajuste e reenvie para aprovação:' : 'Acesse o sistema para ver os detalhes:')
    + `\n${linkSistema()}`;
  if (ehCelularWhats()) { agendarAvisoWhats([vend], msg); fechar(); return true; }
  return abrirWhats(vend.telefone, msg, winRef);
}
// Uma recusa permite ajuste (editar a ficha inteira) quando veio do Supervisor ou do
// Coordenador, ou quando o Financeiro usou "Solicitar ajuste".
function recusaPermiteAjuste(ap) {
  if (!ap || ap.status !== 'reprovado') return false;
  if (ap.etapa === 'supervisor' || ap.etapa === 'coordenador') return true;
  return ap.etapa === 'financeiro' && !!ap.ajuste_solicitado_em
    && new Date(ap.ajuste_solicitado_em).getTime() === new Date(ap.decidido_em).getTime();
}

// Rascunho da ficha em preenchimento. No celular, o navegador pode encerrar a página
// enquanto o vendedor está na câmera/galeria escolhendo um anexo; ao voltar, a página
// recarrega do zero. O rascunho fica só no aparelho do usuário e é apagado ao enviar a ficha.
const RASCUNHO_FICHA_DIAS = 7;
function chaveRascunhoFicha(usuarioId) { return 'mc_ficha_rascunho_v1_' + usuarioId; }
function lerRascunhoFicha(usuarioId) {
  try {
    const r = JSON.parse(localStorage.getItem(chaveRascunhoFicha(usuarioId)) || 'null');
    if (!r || !r.f || typeof r.f !== 'object') return null;
    if (Date.now() - Number(r.salvoEm || 0) > RASCUNHO_FICHA_DIAS * 86400000) { localStorage.removeItem(chaveRascunhoFicha(usuarioId)); return null; }
    return r;
  } catch (e) { return null; }
}
function gravarRascunhoFicha(usuarioId, f, mesmoEndereco) {
  try {
    const vazio = JSON.stringify(f) === JSON.stringify(FORM_VAZIO) && !mesmoEndereco;
    if (vazio) localStorage.removeItem(chaveRascunhoFicha(usuarioId));
    else localStorage.setItem(chaveRascunhoFicha(usuarioId), JSON.stringify({ f, mesmoEndereco: !!mesmoEndereco, salvoEm: Date.now() }));
  } catch (e) {}
}
function apagarRascunhoFicha(usuarioId) {
  try { localStorage.removeItem(chaveRascunhoFicha(usuarioId)); } catch (e) {}
  gravarAnexosRascunhoFicha(usuarioId, []);
}
// Os anexos já escolhidos não cabem no localStorage; ficam no IndexedDB do navegador.
function abrirBancoRascunhoFicha() {
  return new Promise((ok, falha) => {
    try {
      const req = indexedDB.open('mc_ficha_rascunho', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('anexos');
      req.onsuccess = () => ok(req.result);
      req.onerror = () => falha(req.error);
    } catch (e) { falha(e); }
  });
}
async function gravarAnexosRascunhoFicha(usuarioId, arquivos) {
  try {
    const db = await abrirBancoRascunhoFicha();
    const tx = db.transaction('anexos', 'readwrite');
    if (arquivos && arquivos.length) tx.objectStore('anexos').put(arquivos, usuarioId);
    else tx.objectStore('anexos').delete(usuarioId);
    tx.oncomplete = () => db.close();
    tx.onabort = tx.onerror = () => db.close();
  } catch (e) {}
}
async function lerAnexosRascunhoFicha(usuarioId) {
  try {
    const db = await abrirBancoRascunhoFicha();
    return await new Promise(ok => {
      const req = db.transaction('anexos', 'readonly').objectStore('anexos').get(usuarioId);
      req.onsuccess = () => { db.close(); ok(Array.isArray(req.result) ? req.result.filter(a => a instanceof Blob && a.name) : []); };
      req.onerror = () => { db.close(); ok([]); };
    });
  } catch (e) { return []; }
}

// Converte uma ficha gravada no banco para os campos do formulário (modo de ajuste).
function formDaFicha(x) {
  const txt = v => v == null ? '' : String(v);
  const moeda = v => v == null || Number(v) === 0 ? '' : mascaraMoeda(String(Math.round(Number(v) * 100)));
  const simNao = v => v === true ? 'Sim' : v === false ? 'Não' : '';
  return { ...FORM_VAZIO,
    razao_social: txt(x.razao_social), nome_fantasia: txt(x.nome_fantasia), cnpj_cpf: txt(x.cnpj_cpf),
    representante_nome: txt(x.representante_nome), representante_cpf: txt(x.representante_cpf),
    rua: txt(x.rua), numero: txt(x.numero), bairro: txt(x.bairro), cidade: txt(x.cidade), estado: txt(x.estado), cep: txt(x.cep),
    entrega_rua: txt(x.entrega_rua), entrega_numero: txt(x.entrega_numero), entrega_bairro: txt(x.entrega_bairro),
    entrega_cidade: txt(x.entrega_cidade), entrega_estado: txt(x.entrega_estado), entrega_cep: txt(x.entrega_cep),
    telefone: txt(x.telefone), email: txt(x.email),

    // Consumo gravado com casas decimais (ex.: 1,3) fica em branco para o vendedor informar o número certo.

    contrato: simNao(x.contrato), contrato_prazo_meses: txt(x.contrato_prazo_meses),
    verba_introducao: moeda(x.verba_introducao), duracao_verba: txt(x.duracao_verba),
    tecnico_panificacao: simNao(x.tecnico_panificacao), senioridade_tecnico: txt(x.senioridade_tecnico), tecnico_periodicidade: txt(x.tecnico_periodicidade),
    precisa_equipamento: simNao(x.precisa_equipamento), equipamento_condicao: txt(x.equipamento_condicao),
    forno_tipo: txt(x.forno_tipo), forno_quantidade: txt(x.forno_quantidade), forno_esteiras: txt(x.forno_esteiras),
    freezer_tipos: Array.isArray(x.freezer_tipos) ? [...x.freezer_tipos] : [],
    armario_tipo: txt(x.armario_tipo), camara_climatica: txt(x.camara_climatica),
    esteiras_quantidade: txt(x.esteiras_quantidade), assadeiras_quantidade: txt(x.assadeiras_quantidade),
    equipamentos_quantidades: { ...(x.equipamentos_quantidades || {}) },
    bonificacao_percentual: Number(x.bonificacao_percentual) > 0 ? String(Number(x.bonificacao_percentual)) : '',
    bonificacao_periodicidade: txt(x.bonificacao_periodicidade), bonificacao_modalidade: x.bonificacao_modalidade || 'Produto',
    observacoes: txt(x.observacoes) };
}

// fichaAjuste = { ficha, recusa }: edição de uma ficha devolvida para ajuste (reenvia em vez de criar).
function PaginaEmissao({ profile, onSaved, fichaAjuste, onCancel }) {
  const toast = useToast();
  const rascunhoInicial = useMemo(() => fichaAjuste ? null : lerRascunhoFicha(profile.id), [profile.id]);
  const [f, setF] = useState(() => fichaAjuste ? formDaFicha(fichaAjuste.ficha)
    : rascunhoInicial ? { ...FORM_VAZIO, ...rascunhoInicial.f } : FORM_VAZIO);
  const [salvando, setSalvando] = useState(false);
  const [acompanhamentoMap, setAcompanhamentoMap] = useState({});
  const [destinatarios, setDestinatarios] = useState([]);
  const [mesmoEnderecoEntrega, setMesmoEnderecoEntrega] = useState(() => !!(rascunhoInicial && rascunhoInicial.mesmoEndereco));
  const [documentosFicha,setDocumentosFicha]=useState([]);
  const [tabelaSugeridaFicha,setTabelaSugeridaFicha]=useState({estado:'vazio',texto:''});
  const [rascunhoRecuperado, setRascunhoRecuperado] = useState(() => rascunhoInicial ? rascunhoInicial.salvoEm : null);
  const [previaArquivo, setPreviaArquivo] = useState(null);

  const set = (campo, valor) => setF(prev => ({ ...prev, [campo]: valor }));

  // Grava o rascunho pouco depois de cada alteração e, sem esperar, quando a tela é minimizada.
  const rascunhoAtual = useRef({ f, mesmoEnderecoEntrega });
  rascunhoAtual.current = { f, mesmoEnderecoEntrega };
  const rascunhoLiberado = useRef(!fichaAjuste); // no ajuste de uma ficha existente não há rascunho
  useEffect(() => {
    if (!rascunhoLiberado.current) return;
    const t = setTimeout(() => gravarRascunhoFicha(profile.id, f, mesmoEnderecoEntrega), 400);
    return () => clearTimeout(t);
  }, [f, mesmoEnderecoEntrega]);
  useEffect(() => {
    const gravarJa = () => {
      if (document.visibilityState === 'hidden' && rascunhoLiberado.current)
        gravarRascunhoFicha(profile.id, rascunhoAtual.current.f, rascunhoAtual.current.mesmoEnderecoEntrega);
    };
    document.addEventListener('visibilitychange', gravarJa);
    window.addEventListener('pagehide', gravarJa);
    return () => { document.removeEventListener('visibilitychange', gravarJa); window.removeEventListener('pagehide', gravarJa); };
  }, [profile.id]);
  // Anexos escolhidos antes de a página ser encerrada.
  const anexosCarregados = useRef(false);
  useEffect(() => {
    let ativo = true;
    if (fichaAjuste) return;
    lerAnexosRascunhoFicha(profile.id).then(salvos => {
      if (!ativo) return;
      anexosCarregados.current = true;
      if (salvos.length) setDocumentosFicha(atuais => atuais.length ? atuais : salvos);
    });
    return () => { ativo = false; };
  }, [profile.id]);
  useEffect(() => {
    if (anexosCarregados.current && rascunhoLiberado.current) gravarAnexosRascunhoFicha(profile.id, documentosFicha);
  }, [documentosFicha]);
  function limparFormulario() {
    if (!window.confirm('Limpar todos os campos e anexos desta ficha?')) return;
    setF(FORM_VAZIO); setMesmoEnderecoEntrega(false); setDocumentosFicha([]);
    cnpjPedido.current = ''; setCnpjConsulta({ status: 'vazio', cnpj: '' });
    setRascunhoRecuperado(null); apagarRascunhoFicha(profile.id);
  }

  // Consulta pública do CNPJ: disparada só quando o usuário completa ou altera o campo.
  const [cnpjConsulta, setCnpjConsulta] = useState({ status: 'vazio', cnpj: '' });
  const cnpjPedido = useRef('');
  async function aoMudarCnpj(valor) {
    const masc = mascaraCnpj(valor), d = masc.replace(/\D/g, '');
    set('cnpj_cpf', masc);
    if (d.length !== 14 || !cnpjValido(d)) { cnpjPedido.current = ''; setCnpjConsulta({ status: 'vazio', cnpj: '' }); return; }
    if (cnpjPedido.current === d) return;
    cnpjPedido.current = d;
    setCnpjConsulta({ status: 'consultando', cnpj: d });
    const r = await consultarCnpjPublico(d);
    if (cnpjPedido.current !== d) return; // o usuário já digitou outro CNPJ
    setCnpjConsulta({ status: r.status, cnpj: d, razao_social: r.dados && r.dados.razao_social, situacao: r.dados && r.dados.situacao });
    if (r.status !== 'ok') return;
    const x = r.dados;
    // Preenche com os dados da Receita; campos sem informação ficam como estavam. Tudo segue editável.
    setF(prev => ({ ...prev,
      razao_social: x.razao_social || prev.razao_social,
      nome_fantasia: x.nome_fantasia || prev.nome_fantasia,
      rua: x.rua || prev.rua, numero: x.numero || prev.numero, bairro: x.bairro || prev.bairro,
      cidade: x.cidade || prev.cidade, estado: x.estado || prev.estado,
      cep: x.cep ? mascaraCep(x.cep) : prev.cep,
      telefone: x.telefone ? mascaraTelefone(x.telefone) : prev.telefone,
      email: x.email || prev.email }));
  }

  const totalVerbas = (moedaParaNumero(f.verba_introducao) || 0);
  const temVerba = totalVerbas > 0;
  const temTecnico = f.tecnico_panificacao === 'Sim';
  const precisaEquip = f.precisa_equipamento === 'Sim';
  // Zero numérico indica “Não”. O texto da quantidade permanece editável até salvar.
  const equipamentoSelecionado = chave => {
    const quantidade = f.equipamentos_quantidades[chave];
    return quantidade != null && quantidade !== 0;
  };

  // limpa os dependentes quando o gatilho e desligado
  useEffect(() => { if (!temVerba && f.duracao_verba) set('duracao_verba', ''); }, [temVerba]);
  useEffect(() => { if (!temTecnico && (f.senioridade_tecnico || f.tecnico_periodicidade)) setF(prev=>({...prev,senioridade_tecnico:'',tecnico_periodicidade:''})); }, [temTecnico]);
  useEffect(() => {
    if (!precisaEquip) setF(prev => ({ ...prev, equipamento_condicao: '', forno_tipo: '', forno_quantidade: '',
      forno_esteiras: '', freezer_tipos: [], armario_tipo: '', camara_climatica: '',
      esteiras_quantidade: '', assadeiras_quantidade: '', equipamentos_quantidades: {} }));
  }, [precisaEquip]);

  useEffect(() => {
    if (!mesmoEnderecoEntrega) return;
    setF(prev => ({
      ...prev,
      entrega_rua: prev.rua,
      entrega_numero: prev.numero,
      entrega_bairro: prev.bairro,
      entrega_cidade: prev.cidade,
      entrega_estado: prev.estado,
      entrega_cep: prev.cep
    }));
  }, [mesmoEnderecoEntrega, f.rua, f.numero, f.bairro, f.cidade, f.estado, f.cep]);

  const faturamento = useMemo(() => {
    const p = moedaParaNumero(f.preco_kg), c = Number(f.consumo_previsto);
    return (p && c) ? p * c * PESO_PAO_KG * DIAS_MES : null;
  }, [f.preco_kg, f.consumo_previsto]);

  // Sugestão comercial, baseada no preço real do pacote de 8kg do produto 10000122 na DA1.
  // A vinculação definitiva é feita no Supabase quando o cliente nasce da ficha.
  useEffect(() => {
    const preco=moedaParaNumero(f.preco_kg);
    if(!(preco>0)){setTabelaSugeridaFicha({estado:'vazio',texto:''});return;}
    let ativo=true;
    setTabelaSugeridaFicha({estado:'consultando',texto:'Consultando tabelas pelo preço do Francês...'});
    (async()=>{
      try{
        const pr=await sb.from('produtos').select('id').eq('codigo','10000122').maybeSingle();
        if(pr.error)throw pr.error;
        if(!pr.data){if(ativo)setTabelaSugeridaFicha({estado:'pendente',texto:'Produto referência 10000122 não cadastrado. Tabela será definida manualmente.'});return;}
        const rs=await sb.from('tabela_preco_itens')
          .select('preco_unitario,tabelas_preco(id,codigo,descricao,ativo)')
          .eq('produto_id',pr.data.id).limit(1000);
        if(rs.error)throw rs.error;
        const precoPacote=Math.round(preco*800)/100;
        const candidatas=(rs.data||[]).filter(i=>i.tabelas_preco?.ativo===true &&
          Math.abs(Math.round(Number(i.preco_unitario)*100)-Math.round(precoPacote*100))===0)
          .map(i=>i.tabelas_preco);
        const unicas=[...new Map(candidatas.map(t=>[t.id,t])).values()];
        if(!ativo)return;
        if(unicas.length===1){
          const t=unicas[0];
          setTabelaSugeridaFicha({estado:'encontrada',texto:'Tabela sugerida: '+t.codigo+' — '+(t.descricao||'')+' (R$ '+preco.toFixed(2).replace('.',',')+'/kg). Será vinculada ao cadastro do cliente após a aprovação da ficha.'});
        }else if(unicas.length>1){
          setTabelaSugeridaFicha({estado:'pendente',texto:'Mais de uma tabela corresponde a R$ '+preco.toFixed(2).replace('.',',')+'/kg ('+unicas.map(t=>t.codigo).join(', ')+'). O vínculo precisará ser definido pelo Adm. de Vendas.'});
        }else{
          setTabelaSugeridaFicha({estado:'pendente',texto:'Nenhuma tabela ativa tem o Francês a R$ '+preco.toFixed(2).replace('.',',')+'/kg. Cadastre os preços da DA1 ou solicite a criação da tabela antes do primeiro pedido.'});
        }
      }catch(e){if(ativo)setTabelaSugeridaFicha({estado:'erro',texto:'Não foi possível consultar as tabelas: '+e.message});}
    })();
    return ()=>{ativo=false;};
  },[f.preco_kg]);

  function toggleFreezer(tipo) {
    setF(prev => ({ ...prev, freezer_tipos: prev.freezer_tipos.includes(tipo)
      ? prev.freezer_tipos.filter(x => x !== tipo) : [...prev.freezer_tipos, tipo] }));
  }

  async function salvar() {
    const obrig = [
      ['razao_social','Razão Social'], ['nome_fantasia','Nome Fantasia'], ['cnpj_cpf','CNPJ'], ['rua','Rua'], ['numero','Número'],
      ['bairro','Bairro'], ['cidade','Cidade'], ['estado','Estado'], ['cep','CEP'],
      ['telefone','Telefone'], ['email','E-mail'], ['numero_checkouts','Número de Checkouts'], ['numero_lojas','Número de Lojas'], ['preco_kg','Preço Kg'],
      ['prazo_pagamento','Prazo Pagamento'], ['consumo_previsto','Consumo Previsto'],
      ['tecnico_panificacao','Técnico de Panificação'], ['precisa_equipamento','Precisa de Equipamento'], ['contrato','Contrato'],
      ['entrega_rua','Rua de Entrega'],['entrega_numero','Número de Entrega'],['entrega_bairro','Bairro de Entrega'],['entrega_cidade','Cidade de Entrega'],['entrega_estado','Estado de Entrega'],['entrega_cep','CEP de Entrega'],
    ];
    if(f.contrato==='Sim')obrig.push(['contrato_prazo_meses','Prazo do contrato']);
    const faltando = obrig.filter(([k]) => !String(f[k] || '').trim()).map(([, l]) => l);
    if (faltando.length) return toast('Preencha: ' + faltando.join(', '), 'error');
    if (!cnpjValido(f.cnpj_cpf)) return toast('CNPJ inválido. Confira os números digitados.', 'error');
    if (cnpjConsulta.status === 'nao_encontrado' && cnpjConsulta.cnpj === String(f.cnpj_cpf).replace(/\D/g, '')
      && !window.confirm('Este CNPJ não foi encontrado na consulta pública da Receita.\n\nEmpresas abertas há poucos dias podem ainda não aparecer. Deseja salvar a ficha mesmo assim?')) return;
    const prazoContrato=Number(f.contrato_prazo_meses);
    if(f.contrato==='Sim'&&(!/^\d+$/.test(f.contrato_prazo_meses)||!Number.isInteger(prazoContrato)||prazoContrato<1||prazoContrato>2147483647))
      return toast('Informe o prazo do contrato em meses inteiros positivos.','error');
    if (temVerba && (!/^\d+$/.test(f.duracao_verba)||Number(f.duracao_verba)<1)) return toast('Informe o prazo da Verba de Introdução em meses inteiros positivos.', 'error');
    if(!/^\d+$/.test(f.prazo_pagamento)||Number(f.prazo_pagamento)<1)return toast('Informe o prazo de pagamento em dias inteiros positivos.','error');
    if(!/^\d+$/.test(String(f.consumo_previsto))||Number(f.consumo_previsto)<1)return toast('Informe o Consumo Previsto em pães por dia, número inteiro sem ponto nem vírgula (ex.: 1300).','error');
    if (temTecnico && !f.senioridade_tecnico) return toast('Informe a Senioridade do Técnico.', 'error');
    if(temTecnico&&!f.tecnico_periodicidade)return toast('Informe a periodicidade do Técnico.', 'error');
    if(moedaParaNumero(f.preco_kg)>9.99)return toast('Preço do Kg: máximo de 1 dígito inteiro e 2 decimais (ex.: 7,50).', 'error');
    if (precisaEquip && !f.equipamento_condicao) return toast('Informe se o equipamento é Novo ou Usado.', 'error');
    if(Number(f.bonificacao_percentual)<0||Number(f.bonificacao_percentual)>100)return toast('Bonificação deve estar entre 0% e 100%.','error');
    if(Number(f.bonificacao_percentual)>0&&!f.bonificacao_periodicidade)return toast('Informe a periodicidade da bonificação.','error');
    if(precisaEquip){
      for(const [ch,nome] of EQUIPAMENTOS_VARIANTES){
        const quantidade=Number(f.equipamentos_quantidades[ch]);
        if(equipamentoSelecionado(ch)&&(!Number.isSafeInteger(quantidade)||quantidade<1))
          return toast('Informe uma quantidade inteira maior que zero para '+nome+'.','error');
      }
      for(const [tipo,nome] of TIPOS_FORNO){
        for(const modelo of MODELOS_FORNO){
          const quantidade=Number(f.equipamentos_quantidades[chaveModeloForno(tipo,modelo)]||0);
          if(!Number.isSafeInteger(quantidade)||quantidade<0||quantidade>9999)
            return toast('Informe uma quantidade inteira de 0 a 9.999 para '+nome+' de '+modelo+' esteiras.','error');
        }
      }
    }

    const dadosFornos=dadosFornosPorModelo(f.equipamentos_quantidades);
    setSalvando(true);
    const winRef = preAbrirJanelaWhats(); // abre ja no gesto do usuario
    const num = v => v === '' || v === null ? null : Number(v);

    const dados = {
      razao_social: f.razao_social.trim(), nome_fantasia: f.nome_fantasia.trim(), cnpj_cpf: f.cnpj_cpf, representante_nome: f.representante_nome.trim(), representante_cpf: f.representante_cpf,
      rua: f.rua.trim(), numero: f.numero.trim(), bairro: f.bairro.trim(),
      cidade: f.cidade.trim(), estado: f.estado.toUpperCase(), cep: f.cep,
      entrega_rua:f.entrega_rua.trim(), entrega_numero:f.entrega_numero.trim(), entrega_bairro:f.entrega_bairro.trim(), entrega_cidade:f.entrega_cidade.trim(), entrega_estado:f.entrega_estado.toUpperCase(), entrega_cep:f.entrega_cep, contrato:f.contrato==='Sim',
      contrato_prazo_meses:f.contrato==='Sim'?prazoContrato:null,
      telefone: f.telefone, email: f.email.trim(),
      numero_checkouts: num(f.numero_checkouts), numero_lojas: num(f.numero_lojas),
      preco_kg: moedaParaNumero(f.preco_kg),
      prazo_pagamento: f.prazo_pagamento.trim(),
      consumo_previsto: num(f.consumo_previsto),
      verba_introducao: moedaParaNumero(f.verba_introducao) || 0,
      verba_manutencao_cliente: 0,
      verba_negociacao_cliente: 0,
      verbas_acordo: totalVerbas,
      duracao_verba: temVerba ? f.duracao_verba.trim() : null,
      tecnico_panificacao: temTecnico,
      senioridade_tecnico: temTecnico ? f.senioridade_tecnico : null,
       tecnico_periodicidade: temTecnico ? f.tecnico_periodicidade : null,
      precisa_equipamento: precisaEquip,
      equipamento_condicao: precisaEquip ? f.equipamento_condicao : null,
      forno_tipo: precisaEquip ? dadosFornos.forno_tipo : null,
      forno_quantidade: precisaEquip ? dadosFornos.forno_quantidade : null,
      forno_esteiras: precisaEquip ? dadosFornos.forno_esteiras : null,
      freezer_tipos: precisaEquip && f.freezer_tipos.length ? f.freezer_tipos : null,
      armario_tipo: precisaEquip ? (f.armario_tipo || null) : null,
      camara_climatica: precisaEquip ? (f.camara_climatica || null) : null,
      esteiras_quantidade: precisaEquip ? num(f.esteiras_quantidade) : null,
      assadeiras_quantidade: precisaEquip ? num(f.assadeiras_quantidade) : null,
      equipamentos_quantidades: precisaEquip ? dadosFornos.equipamentos_quantidades : {},
      bonificacao_percentual: Number(f.bonificacao_percentual)||0,
      bonificacao_periodicidade: Number(f.bonificacao_percentual)>0 ? f.bonificacao_periodicidade : null,
      bonificacao_modalidade: Number(f.bonificacao_percentual)>0 ? f.bonificacao_modalidade : null,
      observacoes: f.observacoes.trim() || null,
    };
    let nova, error;
    if (fichaAjuste) {
      const original = fichaAjuste.ficha;
      // Forno gravado no formato antigo (sem quantidade por modelo): mantém se o vendedor não informou os modelos.
      if (precisaEquip && !dados.forno_tipo && original.forno_tipo
          && !TIPOS_FORNO.some(([tipo]) => MODELOS_FORNO.some(modelo => Object.hasOwn(f.equipamentos_quantidades, chaveModeloForno(tipo, modelo))))) {
        dados.forno_tipo = original.forno_tipo; dados.forno_quantidade = original.forno_quantidade; dados.forno_esteiras = original.forno_esteiras;
      }
      const r = await sb.rpc('mc_reenviar_ficha_ajustada', {
        p_ficha: original.id, p_aprovacao: fichaAjuste.recusa.id,
        p_recusado_em: fichaAjuste.recusa.decidido_em ?? null, p_dados: dados });
      error = r.error && /mc_reenviar_ficha_ajustada|schema cache/i.test(r.error.message || '')
        ? { message: 'O reenvio de ficha ajustada ainda não está disponível no banco (migração 20261125_fluxo_ajuste_ficha.sql).' } : r.error;
      nova = { ...original, ...dados };
    } else {
      const r = await sb.from('fichas_clientes').insert({ vendedor_id: profile.id, ...dados }).select().single();
      error = r.error; nova = r.data;
    }

    if (error) {setSalvando(false); if (winRef && !winRef.closed) winRef.close(); return toast(error.message, 'error'); }
    // Documentos ficam em bucket privado, com metadados vinculados à ficha.
    let falhasDocs=0;
    for(const arquivo of documentosFicha){
      const nomeSeguro=arquivo.name.replace(/[^a-zA-Z0-9._-]/g,'_');
      const caminho=nova.id+'/'+crypto.randomUUID()+'-'+nomeSeguro;
      const up=await sb.storage.from('fichas-documentos').upload(caminho,arquivo,{upsert:false,contentType:arquivo.type||'application/octet-stream'});
      if(up.error){falhasDocs++;console.error('Upload documento:',up.error);continue;}
      const reg=await sb.from('ficha_documentos').insert({ficha_id:nova.id,nome_arquivo:arquivo.name,caminho_storage:caminho,tipo_mime:arquivo.type||null,tamanho_bytes:arquivo.size,enviado_por:profile.id});
      if(reg.error){falhasDocs++;console.error('Registro documento:',reg.error);await sb.storage.from('fichas-documentos').remove([caminho]);}
    }
    setSalvando(false);
    if(falhasDocs)toast(falhasDocs+' documento(s) não foram anexados. A ficha foi salva; verifique o console e as políticas do Storage.','error');

    const varios = await avisarProximo(nova.id, 0, nova, winRef);
    if (fichaAjuste) {
      // A tela de ajuste fecha em seguida; avisos com mais de um destinatário ficam no painel de WhatsApp pendentes.

function linhaInfo(label, valor) {
  if (valor === null || valor === undefined || valor === '' || valor === '—') return null;
  return h('div', { style: { display: 'flex', gap: 8, fontSize: 13, padding: '3px 0', alignItems: 'baseline' } },
    h('span', { style: { color: 'var(--text-muted)', minWidth: 112, flexShrink: 0 } }, label),
    h('span', { style: { color: 'var(--text-primary)', minWidth: 0, wordBreak: 'break-word' } }, valor));
}


const TIPOS_FORNO=[['forno_gas','Forno a Gás','GÁS'],['forno_eletrico','Forno Elétrico','ELÉTRICO']];
const MODELOS_FORNO=['5','8'];
// As quantidades por modelo complementam os totais por tipo usados pelo Financeiro.
const chaveModeloForno=(tipo,modelo)=>tipo+'_'+modelo+'_esteiras';

function fornosDaFicha(f){
  const eq=f.equipamentos_quantidades||{};
  const fornos=TIPOS_FORNO.flatMap(([tipo,nome,descricao])=>{
    const modelos=MODELOS_FORNO.map(modelo=>({modelo,quantidade:Number(eq[chaveModeloForno(tipo,modelo)]||0)}))
      .filter(item=>item.quantidade>0);
    if(modelos.length)return modelos.map(item=>({...item,tipo,nome,descricao}));
    const quantidade=Number(eq[tipo]||0);
    return quantidade>0?[{tipo,nome,descricao,quantidade,modelo:String(eq[tipo+'_esteiras']||f.forno_esteiras||'')}]:[];
  });
  return fornos.length||!f.forno_tipo?fornos:[{nome:'Forno '+f.forno_tipo,
    descricao:String(f.forno_tipo).toUpperCase(),quantidade:Number(f.forno_quantidade||1),modelo:String(f.forno_esteiras||'')}];
}

function dadosFornosPorModelo(eq){
  const quantidades={...eq};
  for(const [tipo] of TIPOS_FORNO){
    const ativos=MODELOS_FORNO.filter(modelo=>Number(eq[chaveModeloForno(tipo,modelo)])>0);
    if(!MODELOS_FORNO.some(modelo=>Object.hasOwn(eq,chaveModeloForno(tipo,modelo))))continue;
    quantidades[tipo]=ativos.reduce((total,modelo)=>total+Number(eq[chaveModeloForno(tipo,modelo)]),0);
    quantidades[tipo+'_esteiras']=ativos.length===1?ativos[0]:'';
    for(const modelo of MODELOS_FORNO){
      const chave=chaveModeloForno(tipo,modelo);
      quantidades[chave]=Number(eq[chave]||0);
    }
  }
  const gas=Number(quantidades.forno_gas||0), eletrico=Number(quantidades.forno_eletrico||0);
  const modelos=fornosDaFicha({equipamentos_quantidades:quantidades}).map(forno=>forno.modelo);
  return {equipamentos_quantidades:quantidades,forno_tipo:gas&&eletrico?'Gás e Elétrico':gas?'Gás':eletrico?'Elétrico':null,
    forno_quantidade:gas+eletrico,forno_esteiras:modelos.length&&modelos.every(m=>m===modelos[0])?modelos[0]||null:null};
}

const EQUIPAMENTOS_VARIANTES=[['freezer_horizontal','Freezer Horizontal'],['freezer_vertical','Freezer Vertical'],['expositor','Expositor'],['mini_camara','Mini câmara'],['armario_completo','Armário Completo'],['armario_vazio','Armário Vazio'],['armario_esqueleto','Armário Esqueleto'],['camara_20','Câmara Climática 20 Esteiras'],['camara_40','Câmara Climática 40 Esteiras']];
function itensEquipamentosFicha(f,condicaoFinal){
  const c=(condicaoFinal||f.equipamento_condicao_manutencao||f.equipamento_condicao||'').toUpperCase(),a=[];
  for(const forno of fornosDaFicha(f))a.push({quantidade:forno.quantidade,
    descricao:'FORNO '+forno.descricao+(forno.modelo?' '+forno.modelo+' ESTEIRAS':''),patrimonio:'',condicao:c});
  EQUIPAMENTOS_VARIANTES.forEach(([k,nome])=>{const qtd=Number((f.equipamentos_quantidades||{})[k]||0);if(qtd>0)a.push({quantidade:qtd,descricao:nome.toUpperCase(),patrimonio:'',condicao:c});});
  if(!Object.keys(f.equipamentos_quantidades||{}).length)(f.freezer_tipos||[]).forEach(x=>a.push({quantidade:1,descricao:'FREEZER '+String(x).toUpperCase(),patrimonio:'',condicao:c}));
  if(!Object.keys(f.equipamentos_quantidades||{}).length&&f.armario_tipo)a.push({quantidade:1,descricao:'ARMÁRIO '+String(f.armario_tipo).toUpperCase(),patrimonio:'',condicao:c});
  if(!Object.keys(f.equipamentos_quantidades||{}).length&&f.camara_climatica)a.push({quantidade:1,descricao:'CÂMARA CLIMÁTICA '+String(f.camara_climatica).toUpperCase(),patrimonio:'',condicao:c});
  if(Number(f.assadeiras_quantidade||0)>0)a.push({quantidade:Number(f.assadeiras_quantidade),descricao:'ASSADEIRA',patrimonio:'',condicao:c});
  if(Number(f.esteiras_quantidade||0)>0)a.push({quantidade:Number(f.esteiras_quantidade),descricao:'ESTEIRA',patrimonio:'',condicao:c});
  return a;
}

function resumoEquipamentos(f) {
  if (!f.precisa_equipamento) return 'Não';
  const partes = [f.equipamento_condicao];
  for(const forno of fornosDaFicha(f))partes.push(forno.nome+' x'+forno.quantidade+(forno.modelo?' ('+forno.modelo+' esteiras)':''));
  EQUIPAMENTOS_VARIANTES.forEach(([k,nome])=>{const qtd=Number((f.equipamentos_quantidades||{})[k]||0);if(qtd>0)partes.push(nome+' x'+qtd);});
  if (!Object.keys(f.equipamentos_quantidades||{}).length&&f.freezer_tipos && f.freezer_tipos.length) partes.push('Freezer: ' + f.freezer_tipos.join(', '));
  if (!Object.keys(f.equipamentos_quantidades||{}).length&&f.armario_tipo) partes.push('Armário ' + f.armario_tipo);
  if (!Object.keys(f.equipamentos_quantidades||{}).length&&f.camara_climatica) partes.push('Câmara ' + f.camara_climatica);
  if (f.esteiras_quantidade) partes.push(f.esteiras_quantidade + ' esteiras');
  if (f.assadeiras_quantidade) partes.push(f.assadeiras_quantidade + ' assadeiras');
  return partes.filter(Boolean).join(' · ');
}

function codigoAuditoria(obj, fallbackPrefixo) {
  if (!obj) return '—';
  return obj.codigo || (obj.id ? (fallbackPrefixo || 'REG') + '-' + String(obj.id).slice(0,8).toUpperCase() : '—');
}
function identificacaoCliente(c) {
  if (!c) return 'SEM CÓDIGO — Cliente não identificado';
  const codigo = c.codigo_totvs || 'SEM CÓDIGO';
  const nome = c.razao_social || c.nome_fantasia || c.nome || 'Cliente não identificado';
  return codigo + ' — ' + nome;
}
function identificacaoFichaCliente(f) {
  if (!f) return 'SEM CÓDIGO — Cliente não identificado';
  const codigo = f.codigo_totvs || (f.clientes && f.clientes.codigo_totvs) || 'SEM CÓDIGO';
  return codigo + ' — ' + (f.razao_social || f.nome_fantasia || f.clientes?.nome_fantasia || 'Cliente não identificado');
}
function prefixoSolicitacao(s) {
  if (!s) return 'SOL';
  if (s.categoria === 'bonificacao') return 'BON';
  if (s.categoria === 'amostra') return 'AMO';
  if (s.tipo === 'manutencao') return 'MAN';
  if (s.tipo === 'troca') return 'TRC';
  if (s.tipo === 'aumento') return 'AUM';
  return 'SOL';
}

// Logo oficial (640x186 px, fundo transparente). Nos PDFs a largura segue a proporção da imagem.
const GRESPAN_LOGO_PROPORCAO = 640 / 186;
function logoGrespanPDF(doc, x, y, altura) {
  try { doc.addImage(GRESPAN_LOGO_DOC, 'PNG', x, y, altura * GRESPAN_LOGO_PROPORCAO, altura, 'logo-grespan', 'FAST'); } catch (e) {}
}
function pdfDoc(titulo, codigo, clienteLinha) {
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert('Biblioteca de PDF não carregada. Verifique a conexão com a internet e tente novamente.');
    return null;
  }
  const doc = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
  const logo = GRESPAN_LOGO_DOC;

function pdfLinha2(ctx,l1,v1,l2,v2) {
  if((v1===null||v1===undefined||v1==='') && (v2===null||v2===undefined||v2==='')) return;
  const d=ctx.doc,x1=18,x2=108;
  d.setFont('helvetica','normal');d.setFontSize(8.7);
  const preparar=(val,w)=>d.splitTextToSize(val===null||val===undefined||val===''?'—':String(val),w);
  const a=preparar(v1,82),b=preparar(v2,84);
  // Reserva o espaço real das linhas quebradas, inclusive antes de nova página.
  pdfGarantir(ctx,Math.max(a.length,b.length)*4+7);
  function campo(x,label,lines){
    d.setFont('helvetica','bold');d.setFontSize(7.2);d.setTextColor(90,94,100);
    d.text(String(label||''),x,ctx.y);
    d.setFont('helvetica','normal');d.setFontSize(8.7);d.setTextColor(25,25,25);
    d.text(lines,x,ctx.y+4.2);
  }
  campo(x1,l1,a);campo(x2,l2,b);
  ctx.y+=Math.max(a.length,b.length)*4+7;
}
function pdfTxt(ctx,label,valor,opts={}) {
  if(valor===null||valor===undefined||valor==='') return;
  const d=ctx.doc;
  d.setFont('helvetica',opts.bold?'bold':'normal');d.setFontSize(opts.size||8.7);
  const lines=d.splitTextToSize(String(valor),174);
  const passo=4,incremento=label?7:3;
  // Texto extenso pode atravessar páginas; desenhe cada linha respeitando o rodapé.
  if(label){
    pdfGarantir(ctx,12);
    d.setFont('helvetica','bold');d.setFontSize(7.2);d.setTextColor(90,94,100);
    d.text(String(label),18,ctx.y);
    ctx.y+=4.2;
  }
  d.setFont('helvetica',opts.bold?'bold':'normal');d.setFontSize(opts.size||8.7);
  d.setTextColor(opts.muted?105:25,opts.muted?108:25,opts.muted?113:25);
  lines.forEach(line=>{
    pdfGarantir(ctx,passo+2);
    d.setFont('helvetica',opts.bold?'bold':'normal');d.setFontSize(opts.size||8.7);
    d.setTextColor(opts.muted?105:25,opts.muted?108:25,opts.muted?113:25);
    d.text(String(line),18,ctx.y);
    ctx.y+=passo;
  });
  ctx.y+=incremento;
}
function pdfTabela(ctx,colunas,linhas) {
  const d=ctx.doc, widths=colunas.map(c=>c.w), totalH=8;
  pdfGarantir(ctx,totalH+8);
  const desenhaHeader=()=>{
    let x=15;
    colunas.forEach((c,i)=>{
      // jsPDF compartilha o estado PDF da cor de preenchimento com o texto.
      // Cada chamada a text() altera essa cor: SEM reinicializá-la, as
      // células seguintes ficavam pretas em alguns leitores de PDF.
      d.setFillColor(238,239,241);
      d.setDrawColor(210,213,218);
      d.rect(x,ctx.y,widths[i],7,'FD');
      d.setFont('helvetica','bold');d.setFontSize(7.2);d.setTextColor(45,45,45);
      d.text(String(c.label||''),x+1.5,ctx.y+4.6);
      x+=widths[i];
    });
    ctx.y+=7;
  };
  desenhaHeader();
  linhas.forEach((row,ri)=>{
    d.setFont('helvetica','normal');d.setFontSize(7.4);
    const cellLines=colunas.map(c=>d.splitTextToSize(String(row[c.key]??''),c.w-3));
    const h=Math.max(7,...cellLines.map(a=>a.length*3.5+3));
    if(ctx.y+h>278){pdfNovaPagina(ctx);desenhaHeader();}
    let x=15;
    colunas.forEach((c,i)=>{
      // Fundo sempre explícito: branco nas linhas pares e cinza suave
      // nas alternadas, antes do texto de CADA coluna.
      if(ri%2===1)d.setFillColor(250,250,250);
      else d.setFillColor(255,255,255);
      d.setDrawColor(225,227,230);
      d.rect(x,ctx.y,c.w,h,'FD');
      d.setFont('helvetica','normal');d.setFontSize(7.4);d.setTextColor(35,35,35);
      d.text(cellLines[i],x+1.5,ctx.y+4.2);
      x+=c.w;
    });
    ctx.y+=h;
  });
  ctx.y+=4;
}
function pdfRodape(ctx) {

}

  let headers;

  }));

    sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},...(headers?{headers}:{}),children}]
  });

// Fonte única dos equipamentos para tela e PDF. O campo legado s.equipamento
// representa somente o primeiro item e não substitui solicitacao_equipamentos.
function itensDaSolicitacao(s) {
  if(!s||!(s.categoria==='equipamento'||!s.categoria))return [];
  const itens=Array.isArray(s.solicitacao_equipamentos)?s.solicitacao_equipamentos:[];
  if(itens.length)return itens.filter(i=>i&&i.equipamento).map(i=>({
    equipamento:String(i.equipamento),quantidade:Number(i.quantidade)||1,
    patrimonio:i.patrimonio||'',movimento:i.movimento||'equipamento'
  }));
  // Compatibilidade apenas com solicitações antigas sem registros de detalhe.
  return s.equipamento?[{equipamento:s.equipamento,quantidade:Number(s.quantidade)||1,
    patrimonio:s.patrimonio||'',movimento:'equipamento'}]:[];
}
function rotuloMovimentoEquipamento(item,tipo) {
  return item.movimento==='coletar'?'Retirar / coletar':
    item.movimento==='entregar'?'Entregar':
    tipo==='retirada'?'Retirar':tipo==='manutencao'?'Manutenção':'Solicitado';
}
function baixarSolicitacaoPDF(s) {

  const ctx=pdfDoc('Solicitação',cod,identificacaoCliente(cli)+(cli.cnpj_cpf?' | '+cli.cnpj_cpf:''));
  if(!ctx)return;
  const categoria=s.categoria==='bonificacao'?'Bonificação':s.categoria==='amostra'?'Amostra':'Equipamento / Serviço';
  pdfSec(ctx,'Identificação');
  pdfLinha2(ctx,'Código',cod,'Status',s.status_fluxo||'aberta');

function baixarPedidoPDF(cliente,pedido,itens,rotaNome,dataPedido,observacoes) {

  pdfSec(ctx,'Dados do Pedido');
  pdfLinha2(ctx,'Pedido',cod,'Data',fmtData(dataPedido||(pedido&&pedido.data_pedido)));
  pdfLinha2(ctx,'Rota',rotaNome,'Acordo Comercial',cliente.acordo_comercial);
  pdfTxt(ctx,'Observações',observacoes||(pedido&&pedido.observacoes));

    total+=vt;
    return {item:i+1,tipo:(it.tipo_item||'venda')==='bonificacao'?'BONIF.':'COMPRA',codigo:prod.codigo||it.codigo||'',descricao:prod.descricao||it.descricao||'',qtd:fmtNum(q),unit:fmtMoeda(vu),total:fmtMoeda(vt)};
  });
  pdfSec(ctx,'Itens do Pedido');
  pdfTabela(ctx,[
    {key:'item',label:'Item',w:12},{key:'tipo',label:'Tipo',w:20},{key:'codigo',label:'Código',w:24},
    {key:'descricao',label:'Descrição',w:62},{key:'qtd',label:'Qtde',w:18},{key:'unit',label:'Preço Un.',w:22},{key:'total',label:'Subtotal',w:22}
  ],rows);
  pdfSec(ctx,'Resumo do Pedido');
  pdfLinha2(ctx,'Quantidade de Itens',lista.length,'Valor Total',fmtMoeda(total));
  pdfRodape(ctx);ctx.doc.save(cod+'_pedido_'+nomePdf(cliente.razao_social)+'_'+String(dataPedido||'').replace(/\D/g,'')+'.pdf');
}

function EditorQuantidadesFicha({ficha,onClose,onSalvar}){
  const toast=useToast();
  const camposFornos=TIPOS_FORNO.flatMap(([tipo,nome])=>{
    const itens=fornosDaFicha(ficha).filter(forno=>forno.tipo===tipo);
    return itens.some(forno=>!MODELOS_FORNO.includes(forno.modelo))?[[tipo,nome]]:
      MODELOS_FORNO.map(modelo=>[chaveModeloForno(tipo,modelo),nome+' · '+modelo+' esteiras']);
  });
  const campos=[...camposFornos,...EQUIPAMENTOS_VARIANTES];
  const original=ficha.equipamentos_quantidades||{};
  const legado=!Object.keys(original).length;
  const fornoSemDetalhamento=!!ficha.forno_tipo&&!Number(original.forno_gas||0)&&!Number(original.forno_eletrico||0);
  const [valores,setValores]=useState(()=>{
    const valores={...original,esteiras_quantidade:ficha.esteiras_quantidade??0,assadeiras_quantidade:ficha.assadeiras_quantidade??0};
    if(fornoSemDetalhamento)valores.forno_legado=ficha.forno_quantidade||1;
    for(const forno of fornosDaFicha(ficha)){
      if(forno.tipo&&MODELOS_FORNO.includes(forno.modelo))
        valores[chaveModeloForno(forno.tipo,forno.modelo)]=forno.quantidade;
    }
    if(legado){
      const normalizar=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
      const descricoes=[...(ficha.freezer_tipos||[]),ficha.armario_tipo,ficha.camara_climatica].map(normalizar).filter(Boolean);
      for(const [k,nome] of EQUIPAMENTOS_VARIANTES){
        const rotulo=normalizar(nome);
        if(descricoes.some(d=>rotulo===d||rotulo.endsWith(' '+d)||d===rotulo.replace(' esteiras','')||rotulo.endsWith(' '+d+' esteiras')))valores[k]=1;
      }
    }
    return valores;
  });
  const [salvando,setSalvando]=useState(false);
  const quantidadesCampos=fornoSemDetalhamento?[['forno_legado','Forno '+ficha.forno_tipo],...EQUIPAMENTOS_VARIANTES]:campos;
  async function salvar(){
    if(salvando)return;
    const camposNumericos=[...quantidadesCampos.map(([k])=>k),'esteiras_quantidade','assadeiras_quantidade'];
    if(camposNumericos.some(k=>!/^[0-9]{1,4}$/.test(String(valores[k]??0))))
      return toast('Use quantidades inteiras entre 0 e 9.999.','error');
    const anteriores={equipamentos_quantidades:ficha.equipamentos_quantidades??null,
      forno_tipo:ficha.forno_tipo??null,forno_quantidade:ficha.forno_quantidade??null,forno_esteiras:ficha.forno_esteiras??null,
      esteiras_quantidade:ficha.esteiras_quantidade??null,assadeiras_quantidade:ficha.assadeiras_quantidade??null};
    const eq={...original};
    quantidadesCampos.filter(([k])=>k!=='forno_legado').forEach(([k])=>{eq[k]=Number(valores[k]??0);});
    const dadosFornos=dadosFornosPorModelo(eq);
    const fornoLegado=Number(valores.forno_legado??0);
    const ajustes={...dadosFornos,
      forno_tipo:fornoLegado?ficha.forno_tipo:dadosFornos.forno_tipo,
      forno_quantidade:fornoLegado||dadosFornos.forno_quantidade||null,
      forno_esteiras:fornoLegado?ficha.forno_esteiras:dadosFornos.forno_esteiras,
      esteiras_quantidade:Number(valores.esteiras_quantidade??0)||null,
      assadeiras_quantidade:Number(valores.assadeiras_quantidade??0)||null};
    const atualizada={...ficha,...ajustes};
    const condicao=ficha.equipamento_condicao_manutencao||ficha.equipamento_condicao;
    const itens=itensEquipamentosFicha(atualizada,condicao);
    if(!itens.length)return toast('Mantenha pelo menos um equipamento ou acessório na ficha.','error');
    setSalvando(true);
    try{
      const {data,error}=await sb.rpc('mc_corrigir_quantidades_ficha',{p_ficha:ficha.id,p_anterior:anteriores,p_quantidades:ajustes,
        p_resumo:resumoEquipamentos({...atualizada,equipamento_condicao:condicao}),p_itens:itens});
      if(error)throw error;
      onSalvar(atualizada);
      toast(data?'Quantidades corrigidas na ficha e na entrega da Manutenção.':'Quantidades corrigidas na ficha.','success');
    }catch(error){toast(error.message,'error');}
    finally{setSalvando(false);}
  }
  const campo=(k,nome)=>h(Campo,{key:k,label:nome},h(Input,{type:'number',min:0,max:9999,step:1,
    value:valores[k]??0,disabled:salvando,onChange:e=>setValores({...valores,[k]:e.target.value})}));
  return h(Modal,{titulo:'Corrigir quantidades',sub:identificacaoFichaCliente(ficha),largo:true,onClose:()=>{if(!salvando)onClose();},acoes:[
    h('button',{key:'cancelar',className:'btn btn-secondary',disabled:salvando,onClick:onClose},'Cancelar'),
    h('button',{key:'salvar',className:'btn btn-primary',disabled:salvando,onClick:salvar},salvando?'Salvando…':'Salvar quantidades')
  ]},
    h('p',null,'Informe 0 para retirar um item.'),
    h('div',{className:'form-grid'},[...quantidadesCampos,['esteiras_quantidade','Esteiras'],['assadeiras_quantidade','Assadeiras']].map(([k,n])=>campo(k,n))));
}

function DetalheFicha({ ficha, onClose, onCorrigirQuantidades, onPrazoContratoSalvo, usuarioId, onReenviada, onAjustar }) {
  const toast = useToast();
  const f = ficha;
  const endereco = [f.rua, f.numero, f.bairro, f.cidade, f.estado].filter(Boolean).join(', ');
  const podeAnexar=!!usuarioId&&usuarioId===f.vendedor_id;
  const recusa=(f.ficha_aprovacoes||[]).find(a=>a.status==='reprovado');
  // Recusa com ajuste: o vendedor edita a ficha inteira e a aprovação recomeça do início.
  const podeAjustar=podeAnexar&&!!onAjustar&&recusaPermiteAjuste(recusa);
  const rotuloEtapa=etapa=>ETAPAS.find(e=>e.key===etapa)?.label||etapa;
  const [reenvios,setReenvios]=useState([]);
  const [erroDocs,setErroDocs]=useState(false);
  const [documentos, setDocumentos] = useState([]);
  const [carregandoDocs, setCarregandoDocs] = useState(true);
  const [enviandoDocs, setEnviandoDocs] = useState(false);
  const [arquivosDocs, setArquivosDocs] = useState([]);
  const [tipoDoc, setTipoDoc] = useState('outro');
  const [previaLocal,setPreviaLocal]=useState(null);
  const [prazoEditado,setPrazoEditado]=useState(null);
  const [salvandoPrazo,setSalvandoPrazo]=useState(false);
  async function salvarPrazoContrato(e){
    e.preventDefault();
    if(salvandoPrazo||!onPrazoContratoSalvo)return;
    const prazo=Number(prazoEditado);
    if(!/^\d+$/.test(prazoEditado)||prazo<1||prazo>2147483647)
      return toast('Informe o prazo do contrato em meses inteiros positivos.','error');
    setSalvandoPrazo(true);
    try{
      const {error}=await sb.rpc('mc_editar_prazo_contrato_ficha',{
        p_ficha:f.id,p_prazo_meses:prazo,p_prazo_anterior:f.contrato_prazo_meses??null
      });
      if(error)throw error;
      onPrazoContratoSalvo(prazo);
      setPrazoEditado(null);
      toast('Prazo do contrato salvo.','success');
    }catch(error){toast(error.message,'error');}
    finally{setSalvandoPrazo(false);}
  }
  useEffect(() => { let ativo=true;
    sb.from('ficha_documentos').select('*').eq('ficha_id',f.id).order('criado_em',{ascending:false})
      .then(({data,error})=>{
        if(!ativo)return;
        setDocumentos(data||[]);
        setCarregandoDocs(false);
        setErroDocs(!!error);
        if(error)toast('Não foi possível carregar os anexos: '+error.message,'error');
      });
    sb.from('ficha_reenvios').select('id,etapa,motivo_recusa,recusado_em,reenviado_em')
      .eq('ficha_id',f.id).order('reenviado_em',{ascending:false})
      .then(({data,error})=>{if(ativo&&!error)setReenvios(data||[]);});
    return ()=>{ativo=false;};
  },[f.id]);
  async function visualizarDocumento(doc){
    const aba=window.open('','_blank');
    if(aba)aba.opener=null;
    try{
      const {data,error}=await sb.storage.from('fichas-documentos').createSignedUrl(
        doc.caminho_storage,120,aba?undefined:{download:doc.nome_arquivo}
      );
      if(error||!data?.signedUrl)throw Error(error?.message||'acesso negado');
      if(aba&&!aba.closed)aba.location.replace(data.signedUrl);
      else{
        const link=document.createElement('a');
        link.href=data.signedUrl;
        link.rel='noreferrer';
        link.click();
      }
    }catch(error){
      if(aba)aba.close();
      toast('Não foi possível abrir o documento: '+error.message,'error');
    }
  }
  async function enviarDocumentosFicha(reenviar=false){
    if(!podeAnexar||enviandoDocs||(!reenviar&&!arquivosDocs.length))return;
    setEnviandoDocs(true);
    const novos=[],falhas=[];
    try{
      const bucket=sb.storage.from('fichas-documentos');
      for(const arquivo of arquivosDocs){
        try{
          const seguro=arquivo.name.replace(/[^a-zA-Z0-9._-]/g,'_');
          const caminho=f.id+'/'+crypto.randomUUID()+'-'+seguro;
          const upload=await bucket.upload(caminho,arquivo,{upsert:false,contentType:arquivo.type||'application/octet-stream'});
          if(upload.error)throw upload.error;
          const registro={ficha_id:f.id,nome_arquivo:arquivo.name,caminho_storage:caminho,tipo_mime:arquivo.type||null,tamanho_bytes:arquivo.size,enviado_por:usuarioId,tipo_documento:tipoDoc,origem_documento:'manual'};
          const {data,error}=await sb.from('ficha_documentos').insert(registro).select('*').single();
          if(error){
            await bucket.remove([caminho]);
            throw error;
          }
          novos.push(data);
        }catch(error){
          console.error('Anexo da ficha:',error);
          falhas.push(arquivo);
        }
      }
      setDocumentos(anteriores=>[...novos,...anteriores]);
      setArquivosDocs(falhas);
      if(falhas.length){
        toast(falhas.length+' arquivo(s) não puderam ser anexados. Os arquivos com erro continuam selecionados.','error');
        return;
      }
      if(reenviar){
        const {data:etapa,error}=await sb.rpc('mc_reenviar_ficha_com_documentos',{
          p_ficha:f.id,p_aprovacao:recusa.id,p_recusado_em:recusa.decidido_em??null
        });
        if(error)throw error;
        toast('Ficha reenviada para aprovação · '+rotuloEtapa(etapa)+'.','success');
        onReenviada();
      }else{
        toast(novos.length+' documento(s) anexado(s) com sucesso.','success');
      }
    }catch(error){
      toast((novos.length?'Anexos salvos. ':'')+'Não foi possível reenviar: '+error.message,'error');
    }finally{setEnviandoDocs(false);}
  }
  return h(Modal, {
    titulo: identificacaoFichaCliente(f), sub: codigoAuditoria(f, 'FIC') + (f.cnpj_cpf ? ' · ' + f.cnpj_cpf : ''), largo:true,onClose:()=>{if(!enviandoDocs)onClose();},
    acoes: [
      h('button', { key:'pdf', className:'btn btn-secondary', onClick: () => baixarFichaPDF(f) }, '↓ Baixar Ficha'),
      fichaAprovadaDiretoria(f) && (f.contrato || Number(f.verbas_acordo||0)>0 || Number(f.bonificacao_percentual||0)>0) && h('button',{key:'contrato',className:'btn btn-primary',onClick:()=>solicitarAssinaturaContrato(f)},f.contrato?'Gerar minuta — Contrato SIM':'Gerar minuta — Acordo NÃO'),
      fichaAprovadaDiretoria(f) && (f.contrato || Number(f.verbas_acordo||0)>0 || Number(f.bonificacao_percentual||0)>0) && h('button',{key:'contrato-word',className:'btn btn-secondary',onClick:()=>solicitarContratoWord(f)},'↓ Baixar minuta Word'),
      h('button', { key:'fechar', className: 'btn btn-secondary', disabled:enviandoDocs, onClick: onClose }, 'Fechar')
    ].filter(Boolean)
  },
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 20 } },
      h('div', null,
        h('div', { className: 'section-title' }, 'Dados Básicos'),
        linhaInfo('Endereço', endereco),
        linhaInfo('CEP', f.cep),
        linhaInfo('Telefone', f.telefone),
        linhaInfo('E-mail', f.email),
        linhaInfo('Representante Legal',f.representante_nome),
        linhaInfo('CPF Representante',f.representante_cpf),
        linhaInfo('Checkouts', f.numero_checkouts),
        linhaInfo('Lojas', f.numero_lojas),
        linhaInfo('Vendedor', f.usuarios && f.usuarios.nome),
        linhaInfo('Endereço de entrega',[f.entrega_rua,f.entrega_numero,f.entrega_bairro,f.entrega_cidade,f.entrega_estado,f.entrega_cep].filter(Boolean).join(', '))),
      h('div', null,
        h('div', { className: 'section-title' }, 'Negociação Comercial'),
        linhaInfo('Contrato',f.contrato?'Sim':'Não'),
        f.contrato&&f.contrato_prazo_meses!=null&&linhaInfo('Prazo do contrato',f.contrato_prazo_meses+(f.contrato_prazo_meses===1?' mês':' meses')),

function PaginaFichas({ profile, ehPreview, onChanged }) {
  const [fichas, setFichas] = useState(null);
  const [busca, setBusca] = useState('');
  const [detalhe, setDetalhe] = useState(null);
  const [ajustando,setAjustando]=useState(null);
  const [corrigindo,setCorrigindo]=useState(false);
  const [erroFichas,setErroFichas]=useState('');
  const leituraAdmVendas=['adm_vendas','gestao_adm_vendas'].includes(profile.papel);

  useEffect(() => { carregar(); }, [profile.id]);
  async function carregar() {
    setErroFichas('');
    const resultado=leituraAdmVendas
      ? await sb.rpc('mc_listar_fichas_adm_vendas')
      : await sb.from('fichas_clientes')
          .select('*, usuarios:vendedor_id(nome), ficha_aprovacoes(id, etapa, status, decidido_em, observacao, ajuste_solicitado_em)')
          .order('created_at', { ascending: false });
    if(resultado.error){
      console.error('Histórico de fichas:',resultado.error);
      setErroFichas('Não foi possível consultar o histórico de fichas: '+resultado.error.message+
        (leituraAdmVendas?' · Verifique a migração 20261124_historico_fichas_adm_vendas.sql no Supabase.':''));
      setFichas([]);
      return;
    }
    if(!Array.isArray(resultado.data)){
      setErroFichas('O histórico de fichas retornou um formato inesperado.');
      setFichas([]);
      return;
    }
    setFichas(resultado.data);
  }

  const filtradas = useMemo(() => {
    if (!fichas) return [];
    const t = busca.trim().toLowerCase();
    if (!t) return fichas;
    return fichas.filter(f =>
      (f.razao_social || '').toLowerCase().includes(t) ||
      (f.cnpj_cpf || '').includes(t) ||
      (f.cidade || '').toLowerCase().includes(t) ||
      ((f.usuarios && f.usuarios.nome) || '').toLowerCase().includes(t));
  }, [fichas, busca]);

  const totalFat = filtradas.reduce((s, f) => s + Number(f.faturamento_previsto || 0), 0);

  function dataEtapa(f, etapa) {
    const ap = (f.ficha_aprovacoes || []).find(a => a.etapa === etapa);
    if (!ap) return h('span', { style: { color: 'var(--text-muted)' } }, '—');
    if (ap.status === 'nao_aplica') return h('span', { style: { color: 'var(--text-muted)' }, title: 'Etapa pulada (sem responsável)' }, '–');
    if (ap.status === 'aguardando') return h('span', { style: { color: 'var(--text-muted)' } }, '○');
    if (ap.status === 'pendente') return h('span', { style: { color: 'var(--warning)' }, title: 'Aguardando decisão' }, '●');
    const cor = ap.status === 'aprovado' ? 'var(--success)' : 'var(--danger)';
    return h('span', { style: { color: cor, whiteSpace: 'nowrap' } },
      (ap.status === 'aprovado' ? '✓ ' : '✗ ') + fmtData(ap.decidido_em));
  }

  if (fichas === null) return h('div', { className: 'empty-state' }, 'Carregando...');

  // Ficha devolvida para ajuste: o vendedor edita no mesmo formulário do cadastro.
  if (ajustando) return h(PaginaEmissao,{profile,fichaAjuste:ajustando,
    onCancel:()=>setAjustando(null),
    onSaved:()=>{setAjustando(null);carregar();onChanged?.();}});

  return h('div', null,
    detalhe&&(corrigindo?h(EditorQuantidadesFicha,{ficha:detalhe,onClose:()=>setCorrigindo(false),
      onSalvar:f=>{setDetalhe(f);setCorrigindo(false);carregar();}}):
      h(DetalheFicha,{ficha:detalhe,usuarioId:ehPreview?null:profile.id,onClose:()=>setDetalhe(null),
        onReenviada:()=>{setDetalhe(null);carregar();onChanged?.();},
        onAjustar:ehPreview?undefined:(ficha,recusa)=>{setDetalhe(null);setAjustando({ficha,recusa});},
        onCorrigirQuantidades:profile.papel==='admin'?()=>setCorrigindo(true):undefined,
        onPrazoContratoSalvo:profile.papel==='admin'?prazo=>{
          const atualizar=f=>f?.id===detalhe.id?{...f,contrato_prazo_meses:prazo}:f;
          setDetalhe(atualizar);
          setFichas(lista=>lista.map(atualizar));
        }:undefined})),
    erroFichas && h('div', { className: 'card', role:'alert',
      style:{borderColor:'var(--danger)',color:'var(--danger)',marginBottom:14} },
      h('strong',null,'Erro ao carregar fichas'),
      h('div',{style:{fontSize:12,marginTop:6}},erroFichas),
      h('button',{className:'btn btn-secondary btn-sm',style:{marginTop:8},onClick:carregar},'Tentar novamente')),
    h('div', { className: 'page-head' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Fichas de Clientes'),
        h('div', { className: 'page-sub' }, filtradas.length + ' ficha(s) · Faturamento previsto ' + fmtMoeda(totalFat) + '/mês')),
      h('input', { className: 'form-input', style: { maxWidth: 260 }, placeholder: 'Buscar cliente, CNPJ, vendedor...', value: busca, onChange: e => setBusca(e.target.value) })),

    filtradas.length === 0
      ? h('div', { className: 'card' }, h(Empty, { icon: '\u2261', texto: 'Nenhuma ficha visível para você.' }))
      : h('div', { className: 'card', style: { padding: 0 } },
          h('div', { className: 'table-wrap' },
            h('table', null,
              h('thead', null, h('tr', null,
                ['Cliente','CNPJ','Vendedor','Cidade','Preço Kg','Pães/dia','Fat. Previsto/mês','Criação','Superv.','Coord.','Financ.','Diretoria']
                  .map(c => h('th', { key: c }, c)))),
              h('tbody', null,
                filtradas.map(f => h('tr', { key: f.id, style: { cursor: 'pointer' }, onClick: () => setDetalhe(f) },
                  h('td', { className: 'strong' }, f.razao_social),
                  h('td', { className: 'mono' }, f.cnpj_cpf || '—'),
                  h('td', null, (f.usuarios && f.usuarios.nome) || '—'),
                  h('td', null, (f.cidade || '—') + (f.estado ? '/' + f.estado : '')),
                  h('td', { className: 'mono' }, fmtMoeda(f.preco_kg)),
                  h('td', { className: 'mono' }, f.consumo_previsto ? fmtNum(f.consumo_previsto) : '—'),
                  h('td', { className: 'mono strong' }, fmtMoeda(f.faturamento_previsto)),
                  h('td', { className: 'mono' }, fmtData(f.created_at)),
                  h('td', { className: 'mono' }, dataEtapa(f, 'supervisor')),
                  h('td', { className: 'mono' }, dataEtapa(f, 'coordenador')),
                  h('td', { className: 'mono' }, dataEtapa(f, 'financeiro')),
                  h('td', { className: 'mono' }, dataEtapa(f, 'diretoria')))))))));
}

function PaginaPendencias({ profile, visao, ehPreview, onChanged }) {
  const toast = useToast();
  const [pendentes, setPendentes] = useState(null);
  const [decidindo, setDecidindo] = useState(null); // { ap, status }
  const [obs, setObs] = useState('');
  const [condicaoDiretoria,setCondicaoDiretoria]=useState('');
  const [destinatarios, setDestinatarios] = useState([]);
  const [detalhe, setDetalhe] = useState(null);
  const [origemAprovacao,setOrigemAprovacao] = useState(null);

  // Admin real lista todas as etapas; modo Ver como continua sendo simulação.
  const etapa = visao;
  const [pendSolic, setPendSolic] = useState(null);
  const [demandasManut,setDemandasManut]=useState(null);
  const [erroFilaManut,setErroFilaManut]=useState('');
  const [subManut,setSubManut]=useState('envio');
  const [subStatusManut,setSubStatusManut]=useState('pendente');
  const [demandaAberta,setDemandaAberta]=useState(null);
  const [dataLiberacao,setDataLiberacao]=useState('');
  const [rotasProg,setRotasProg]=useState([]);
  const [itensProg,setItensProg]=useState([]);
  const [demandasProg,setDemandasProg]=useState([]);
  const [aprovProg,setAprovProg]=useState([]);
  const [usuariosProg,setUsuariosProg]=useState([]);
  const [rotaExpandida,setRotaExpandida]=useState(null);
  const [enviandoRota,setEnviandoRota]=useState(null);
  const [decisaoProg,setDecisaoProg]=useState(null);
  const [obsProg,setObsProg]=useState('');
  const [authUidProg,setAuthUidProg]=useState(null);
  const [filaProgSupervisor,setFilaProgSupervisor]=useState(null);
  const [erroFilaProgSupervisor,setErroFilaProgSupervisor]=useState('');

  async function carregarFilaSupervisorDireta(){
    if(etapa!=='supervisor'){
      setFilaProgSupervisor([]);
      setErroFilaProgSupervisor('');
      return;
    }
    const {data,error}=await sb.rpc('mc_listar_programacoes_supervisor');
    setErroFilaProgSupervisor(error?.message||'');
    setFilaProgSupervisor(data||[]);
  }

  // v66 — funções da aprovação de rotas.
  // Na v65 os estados e a interface chamavam estas funções, mas as definições
  // não estavam presentes no arquivo final. Isso causava ReferenceError ao
  // montar PaginaPendencias em Financeiro e Manutenção.
  async function carregarProgramacoesRota(){
    if(!['manutencao','supervisor','admin'].includes(etapa)){
      setRotasProg([]);setItensProg([]);setDemandasProg([]);setAprovProg([]);setUsuariosProg([]);
      return;
    }
    try{
      let ra;
      if(etapa==='supervisor'&&!ehPreview){
        // v103: usa o UID autenticado real, não depende do id carregado no profile.
        const au=await sb.auth.getUser();
        if(au.error)throw au.error;
        const uid=au.data&&au.data.user&&au.data.user.id;
        if(!uid)throw new Error('Usuário autenticado não identificado.');
        setAuthUidProg(uid);
        ra=await sb.from('rota_programacao_aprovacoes')
          .select('*')
          .eq('supervisor_id',uid)
          .eq('status','pendente');
      }else{
        setAuthUidProg(profile&&profile.id?profile.id:null);
        ra=await sb.from('rota_programacao_aprovacoes').select('*');
      }
      if(ra.error)throw ra.error;
      const aps=(ra.data||[]).filter(Boolean);
      setAprovProg(aps);

      let rotaIds=[...new Set(aps.map(a=>a.rota_id).filter(Boolean))], rotas=[];
      if(etapa==='manutencao'||(etapa==='admin'&&ehPreview)){
        const rr=await sb.from('rotas_equipamentos').select('*').order('data_rota',{ascending:false});
        if(rr.error)throw rr.error;
        rotas=(rr.data||[]).filter(Boolean);
        rotaIds=rotas.map(r=>r.id);
      }else if(rotaIds.length){
        const rr=await sb.from('rotas_equipamentos').select('*').in('id',rotaIds).order('data_rota',{ascending:false});
        if(rr.error)throw rr.error;
        rotas=(rr.data||[]).filter(Boolean);
      }
      setRotasProg(rotas);
      if(!rotaIds.length){setItensProg([]);setDemandasProg([]);setUsuariosProg([]);return;}

      const ri=await sb.from('rota_equipamento_itens').select('*').in('rota_id',rotaIds).order('ordem');
      if(ri.error)throw ri.error;
      const its=(ri.data||[]).filter(Boolean);setItensProg(its);
      const entIds=[...new Set([...its.map(i=>i.entrega_id),...aps.map(a=>a.entrega_id)].filter(Boolean))];

      let base=[];
      if(entIds.length){
        const re=await sb.from('entregas_equipamentos').select('*').in('id',entIds);
        if(re.error)throw re.error;
        base=(re.data||[]).filter(Boolean);
      }

      const fids=[...new Set(base.map(x=>x.ficha_id).filter(Boolean))];
      const cids=[...new Set(base.map(x=>x.cliente_id).filter(Boolean))];
      const supids=[...new Set(aps.map(a=>a.supervisor_id).filter(Boolean))];

      const [ff,cc,uu]=await Promise.all([
        fids.length?sb.from('fichas_clientes').select('*').in('id',fids):Promise.resolve({data:[],error:null}),
        cids.length?sb.from('clientes').select('*').in('id',cids):Promise.resolve({data:[],error:null}),
        supids.length?sb.from('usuarios').select('id,nome,telefone,papel').in('id',supids):Promise.resolve({data:[],error:null})
      ]);
      if(ff.error)console.error('Programação - fichas:',ff.error);
      if(cc.error)console.error('Programação - clientes:',cc.error);
      if(uu.error)console.error('Programação - supervisores:',uu.error);

      const fm=new Map((ff.data||[]).filter(x=>x&&x.id).map(x=>[x.id,x]));
      const cm=new Map((cc.data||[]).filter(x=>x&&x.id).map(x=>[x.id,x]));
      setDemandasProg(base.map(x=>({...x,_ref:cm.get(x.cliente_id)||fm.get(x.ficha_id)||null})));
      setUsuariosProg((uu.data||[]).filter(Boolean));
    }catch(e){
      console.error('Falha ao carregar programações de rota:',e);
      setRotasProg([]);setItensProg([]);setDemandasProg([]);setAprovProg([]);setUsuariosProg([]);
      if(etapa==='supervisor') toast('Erro ao carregar programações de rota: '+(e&&e.message?e.message:String(e)),'error');
    }
  }

  function demandaProgPorId(id){return (demandasProg||[]).find(d=>d&&String(d.id)===String(id))||null;}
  function aprovDemanda(id,rotaId){
    return (aprovProg||[]).filter(a=>a&&String(a.entrega_id)===String(id)&&
      (rotaId==null||String(a.rota_id)===String(rotaId)));
  }
  function statusAprovDemanda(id,rotaId){
    const a=aprovDemanda(id,rotaId);
    if(!a.length)return 'nao_enviado';
    if(a.some(x=>x.status==='reprovado'))return 'reprovado';
    if(a.every(x=>x.status==='aprovado'))return 'aprovado';
    if(a.some(x=>x.status==='pendente'&&x.enviado_em))return 'pendente';
    return 'nao_enviado';
  }
  function statusAprovRota(id){
    const status=(itensProg||[]).filter(i=>i&&String(i.rota_id)===String(id))
      .map(i=>demandaProgPorId(i.entrega_id))
      .filter(d=>d&&['envio','troca','retirada'].includes(tipoOperacional(d)))
      .map(d=>statusAprovDemanda(d.id,id));
    if(status.includes('reprovado'))return 'reprovado';
    if(status.includes('nao_enviado'))return 'nao_enviado';
    return status.length&&status.every(st=>st==='aprovado')?'aprovado':'pendente';
  }
  function labelAprov(st){return st==='aprovado'?'Aprovado':st==='reprovado'?'Reprovado':st==='nao_enviado'?'A enviar para aprovação':'Aguardando aprovação';}
  function badgeAprov(st){return st==='aprovado'?'badge-green':st==='reprovado'?'badge-red':st==='pendente'?'badge-yellow':'badge-gray';}
  function listaEquip(d){
    if(!d)return ['Equipamento não informado'];
    if(tipoOperacional(d)==='troca')return [
      'Retirar: '+(d.equipamento_coleta||'—')+(d.patrimonio_coleta?' · Patrimônio '+d.patrimonio_coleta:''),
      'Entregar: '+(d.equipamento_entrega||'—')+(d.patrimonio_entrega?' · Patrimônio '+d.patrimonio_entrega:'')
    ];
    const txt=d.equipamento_resumo||d.equipamento_entrega||d.equipamento_coleta||d.equipamento||'Equipamento não informado';
    return String(txt).split(/\s*[·;|]\s*/).filter(Boolean);
  }
  function nomeDemandaProg(d){
    const r=(d&&d._ref)||{};
    return (r.codigo_totvs?r.codigo_totvs+' — ':'')+(r.razao_social||r.nome_fantasia||'Cliente');
  }
  function tituloRota(r){
    const its=(itensProg||[]).filter(i=>i&&String(i.rota_id)===String(r.id));
    const ds=its.map(i=>demandaProgPorId(i.entrega_id)).filter(Boolean);
    const cidades=[...new Set(ds.map(d=>d.endereco_cidade||((d._ref||{}).cidade)).filter(Boolean))];
    return (r.codigo||r.nome||'Rota')+' - '+(cidades.length===1?cidades[0]:(cidades.length>1?cidades.length+' cidades':'Sem cidade'));
  }
  function supervisoresRota(rid){
    const ids=[...new Set((aprovProg||[]).filter(a=>a&&String(a.rota_id)===String(rid)).map(a=>a.supervisor_id).filter(Boolean))];
    return ids.map(id=>(usuariosProg||[]).find(u=>u&&String(u.id)===String(id))).filter(Boolean);
  }
  function msgRotaWhats(r){
    return '🚚 Programação de rota aguardando sua aprovação\n*'+tituloRota(r)+'*\nData: '+fmtData(r.data_rota)+'\n\nAcesse o sistema para aprovar ou reprovar as demandas sob sua responsabilidade:\n'+linkSistema()+'?rota_aprovacao='+encodeURIComponent(r.id);
  }
  async function enviarRotaWhatsSupervisores(r){
    if(enviandoRota)return;
    setEnviandoRota(r.id);
    const celular=ehCelularWhats();
    const conhecidos=supervisoresRota(r.id).filter(u=>numeroWhats(u.telefone));
    const janelas=celular?[]:conhecidos.map(()=>window.open('about:blank','_blank')).filter(Boolean);
    try{
      const {data:ids,error}=await sb.rpc('mc_enviar_programacao_manutencao',{p_rota_id:r.id});
      if(error)throw error;
      await carregarProgramacoesRota();
      if(!ids?.length)return toast('A rota já foi enviada e não tem decisões pendentes.','info');

      const {data:usuarios,error:erroUsuarios}=await sb.from('usuarios').select('id,nome,telefone').in('id',ids);
      if(erroUsuarios)return toast('Programação enviada. Não foi possível consultar os telefones dos supervisores.','info');
      const porId=new Map((usuarios||[]).map(u=>[String(u.id),u]));
      const sups=ids.map(id=>porId.get(String(id))||{id,nome:'Supervisor'});
      const semTelefone=sups.filter(u=>!numeroWhats(u.telefone));
      const comTelefone=sups.filter(u=>numeroWhats(u.telefone));
      const msg=msgRotaWhats(r);
      const avisos=[];
      comTelefone.forEach(sup=>{
        const janela=janelas.shift();
        if(janela&&!janela.closed)abrirWhats(sup.telefone,msg,janela);
        else avisos.push(sup);
      });
      if(avisos.length)agendarAvisoWhats(avisos,msg);
      const avisosMsg=avisos.length?' Use os botões de WhatsApp para avisar os supervisores.':'';
      const telefonesMsg=semTelefone.length?' Telefone não disponível para: '+semTelefone.map(u=>u.nome||'Supervisor').join(', ')+'.':'';
      toast('Programação disponível em Pendências do Supervisor.'+avisosMsg+telefonesMsg,semTelefone.length?'info':'success');
    }catch(e){
      toast('Não foi possível enviar a programação: '+e.message,'error');
    }finally{
      janelas.forEach(w=>{if(!w.closed)w.close();});
      setEnviandoRota(null);
    }
  }
  async function decidirProgramacao(aprovacao,status,observacao){
    const a=aprovacao||decisaoProg;if(!a)return;
    const st=status||a.status;
    let obs=String(observacao!=null?observacao:obsProg||'').trim();

    if(st==='reprovado'&&!obs){
      const digitada=window.prompt('Informe o motivo da reprovação:','');
      if(digitada===null)return;
      obs=String(digitada||'').trim();
      if(!obs)return toast('A observação é obrigatória para reprovar a programação.','error');
    }

    // IMPORTANTE:
    // Esta aprovação é somente da DATA/PROGRAMAÇÃO pelo Supervisor.
    // A demanda operacional continua "roteirizada" e permanece na tela da Manutenção.
    const rr=await sb.rpc('decidir_programacao_rota',{
      p_aprovacao_id:a.id,
      p_status:st,
      p_observacao:obs||null
    });
    if(rr.error)return toast(rr.error.message,'error');

    setDecisaoProg(null);
    setObsProg('');

    if(st==='aprovado'){
      toast('Data da programação aprovada.','success');
    }else{
      toast('Programação reprovada. A rota permanece na Manutenção para revisão.','info');
    }

    await carregarProgramacoesRota();
    await carregarFilaSupervisorDireta();
    if(etapa==='manutencao')await carregar();
  }

    const blocos=(rotasProg||[]).filter(r=>r&&r.id).map(r=>{

      let ds=its.map(i=>demandaProgPorId(i.entrega_id)).filter(Boolean);
      if(etapa==='manutencao'&&subManut!=='manutencao')ds=ds.filter(d=>tipoOperacional(d)===subManut&&d.status==='roteirizada');
      if(modoSupervisor){
        const permitidas=new Set((aprovProg||[]).filter(a=>a&&String(a.rota_id)===String(r.id)&&String(a.supervisor_id)===String(authUidProg||profile.id)).map(a=>String(a.entrega_id)));
