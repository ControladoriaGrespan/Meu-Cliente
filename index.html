function PaginaPedidos({ profile }) {
  const toast = useToast();
  const [rotas, setRotas] = useState(null);
  const [produtos, setProdutos] = useState([]);
  const [pedidosMap, setPedidosMap] = useState({});
  const [semanaOffset, setSemanaOffset] = useState(0);
  // tela de lancamento
  const [lancando, setLancando] = useState(null); // { rota, data, clientesRota }
  const [clienteAtivo, setClienteAtivo] = useState(null);
  const [pedidoAnterior, setPedidoAnterior] = useState(null);
  const [pedidoEditandoId, setPedidoEditandoId] = useState(null);
  const [pedidoEditandoCodigo, setPedidoEditandoCodigo] = useState(null);
  // Bonificações aprovadas disponíveis para vincular ao pedido.
  // Estes estados eram utilizados na v13, mas não estavam declarados,
  // causando ReferenceError e tela branca ao selecionar o cliente.
  const [bonificacoesAbertas, setBonificacoesAbertas] = useState([]);
  const [bonificacoesVinculadas, setBonificacoesVinculadas] = useState([]);
  const [itens, setItens] = useState([]);
  const [obsPedido, setObsPedido] = useState('');
  const [salvando, setSalvando] = useState(false);
  // modal +
  const [modalNovo, setModalNovo] = useState(false);
  const [novoRota, setNovoRota] = useState('');
  const [novoData, setNovoData] = useState('');

  useEffect(() => { carregar(); }, [semanaOffset]);

  function datas() {
    const hoje = new Date();
    const seg = new Date(hoje);
    seg.setDate(seg.getDate() - seg.getDay() + 1 + semanaOffset * 7);
    const inicio = new Date(seg);
    inicio.setDate(inicio.getDate() - 7); // 1 semana antes
    const ds = [];
    for (let i = 0; i < 21; i++) { // 3 semanas
      const d = new Date(inicio);
      d.setDate(d.getDate() + i);
      if (d.getDay() === 0) continue; // pula domingos
      ds.push(d.toISOString().slice(0, 10));
    }
    return ds;
  }

  function semanaNum(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const jan1 = new Date(d.getFullYear(), 0, 1);
    return Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  }

  const diasLabel = ['', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  function diaLabel(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const dia = d.getDate().toString().padStart(2, '0');
    const mes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][d.getMonth()];
    const dow = d.getDay() === 0 ? 7 : d.getDay();
    return { dia, mes, dow: diasLabel[dow], dateStr };
  }

  const hojeStr = new Date().toISOString().slice(0, 10);

  async function carregar() {
    const datasArr = datas();
    const de = datasArr[0], ate = datasArr[datasArr.length - 1];
    const [rr, rp, rpd] = await Promise.all([
      sb.from('rotas').select('*, cliente_rotas(id, cliente_id)').eq('ativo', true).order('dia_semana').order('nome'),
      sb.from('produtos').select('*').eq('ativo', true).order('codigo'),
      sb.from('pedidos')
        .select('id, rota_id, cliente_id, data_pedido, pedido_itens(quantidade, valor_unitario, produto_id, produtos(peso_kg))')
        .gte('data_pedido', de).lte('data_pedido', ate)
    ]);
    setRotas(rr.data || []);
    setProdutos(rp.data || []);
    // agrupa: chave = rotaId_data -> total kg
    const mapa = {};
    (rpd.data || []).forEach(ped => {
      const key = (ped.rota_id || 'sem') + '_' + ped.data_pedido;
      if (!mapa[key]) mapa[key] = { kg: 0, valor: 0, pedidos: 0 };
      mapa[key].pedidos++;
      (ped.pedido_itens || []).forEach(it => {
        const peso = (it.produtos && it.produtos.peso_kg) || 0;
        mapa[key].kg += Number(it.quantidade) * peso;
        mapa[key].valor += Number(it.quantidade) * Number(it.valor_unitario);
      });
    });
    setPedidosMap(mapa);
  }

  function classeCor(kg) {
    if (!kg || kg <= 0) return 'cal-vazio';
    if (kg < 50) return 'cal-leve';
    if (kg < 200) return 'cal-medio';
    if (kg < 500) return 'cal-pesado';
    return 'cal-muito';
  }

  function fmtKg(kg) {
    if (!kg || kg <= 0) return '';
    if (kg >= 1000) return (kg / 1000).toFixed(1) + 't';
    return Math.round(kg) + 'kg';
  }

  // ---- lancamento de pedido ----
  async function abrirLancamento(rotaId, dataStr) {
    const rota = (rotas || []).find(r => r.id === rotaId);
    if (!rota) return;
    const { data: crs } = await sb.from('cliente_rotas')
      .select('id, ordem_entrega, clientes(id, razao_social, cnpj_cpf, codigo_totvs, telefone, condicao_pagamento, acordo_comercial)')
      .eq('rota_id', rotaId).order('ordem_entrega');
    const cls = (crs || []).map(cr => cr.clientes).filter(Boolean);
    setLancando({ rota, data: dataStr, clientesRota: cls });
    setClienteAtivo(null); setPedidoAnterior(null); setBonificacoesAbertas([]); setBonificacoesVinculadas([]); setItens([]); setObsPedido('');
  }

  async function selecionarCliente(cli) {
    setClienteAtivo(cli); setItens([]); setObsPedido(''); setPedidoEditandoId(null); setPedidoEditandoCodigo(null);
    const { data: bons } = await sb.from('solicitacoes')
      .select('*, produtos(codigo, descricao), solicitacao_aprovacoes(status)')
      .eq('cliente_id', cli.id).eq('categoria', 'bonificacao')
      .in('status_fluxo', ['aberta','aprovada'])
      .order('created_at', { ascending: true });
    const aprovadas = (bons || []).filter(b => {
      const aps = b.solicitacao_aprovacoes || [];
      return aps.length === 0 || aps.every(a => ['aprovado','nao_aplica'].includes(a.status));
    });
    setBonificacoesAbertas(aprovadas);
    setBonificacoesVinculadas([]);

    // verifica se ja existe pedido para este cliente NESTA data
    const { data: pedidoHoje } = await sb.from('pedidos')
      .select('*, pedido_itens(*, produtos(codigo, descricao, unidade, peso_kg))')
      .eq('cliente_id', cli.id).eq('data_pedido', lancando.data)
      .order('created_at', { ascending: false }).limit(1).maybeSingle();

    if (pedidoHoje && pedidoHoje.pedido_itens && pedidoHoje.pedido_itens.length > 0) {
      // editar pedido existente
      setPedidoEditandoId(pedidoHoje.id);
      setPedidoEditandoCodigo(pedidoHoje.codigo || null);
      setObsPedido(pedidoHoje.observacoes || '');
      setItens(pedidoHoje.pedido_itens.map(it => ({
        item_id: it.id,
        produto_id: it.produto_id,
        codigo: it.produtos && it.produtos.codigo,
        descricao: it.produtos && it.produtos.descricao,
        unidade: it.produtos && it.produtos.unidade,
        quantidade: it.quantidade,
        valor_unitario: it.valor_unitario,
        tipo_item: it.tipo_item || 'venda',
      })));
      // busca pedido anterior (o penultimo)
      const { data: ant } = await sb.from('pedidos')
        .select('*, pedido_itens(*, produtos(codigo, descricao, unidade, peso_kg))')
        .eq('cliente_id', cli.id).lt('data_pedido', lancando.data)
        .order('data_pedido', { ascending: false }).limit(1).maybeSingle();
      setPedidoAnterior(ant);
    } else {
      // novo pedido: busca o ultimo pedido como referencia
      setPedidoEditandoId(null);
      setPedidoEditandoCodigo(null);
      const { data: ultPedido } = await sb.from('pedidos')
        .select('*, pedido_itens(*, produtos(codigo, descricao, unidade, peso_kg))')
        .eq('cliente_id', cli.id)
        .order('data_pedido', { ascending: false }).limit(1).maybeSingle();
      setPedidoAnterior(ultPedido);
      if (ultPedido && ultPedido.pedido_itens) {
        setItens(ultPedido.pedido_itens.map(it => ({
          produto_id: it.produto_id,
          codigo: it.produtos && it.produtos.codigo,
          descricao: it.produtos && it.produtos.descricao,
          unidade: it.produtos && it.produtos.unidade,
          quantidade: '', valor_unitario: it.valor_unitario, tipo_item: it.tipo_item || 'venda',
        })));
      }
    }
  }

  function addItem() { setItens([...itens, { produto_id: '', codigo: '', descricao: '', unidade: '', quantidade: '', valor_unitario: '', tipo_item: 'venda' }]); }
  function removeItem(idx) { setItens(itens.filter((_, i) => i !== idx)); }
  function setItem(idx, campo, valor) {
    setItens(itens.map((it, i) => {
      if (i !== idx) return it;
      const novo = { ...it, [campo]: valor };
      if (campo === 'produto_id' && valor) {
        const prod = produtos.find(p => p.id === valor);
        if (prod) { novo.codigo = prod.codigo; novo.descricao = prod.descricao; novo.unidade = prod.unidade; }
        if (pedidoAnterior && pedidoAnterior.pedido_itens) {
          const ant = pedidoAnterior.pedido_itens.find(a => a.produto_id === valor);
          if (ant) novo.valor_unitario = ant.valor_unitario;
        }
      }
      return novo;
    }));
  }

  function vincularBonificacao(sol) {
    if (bonificacoesVinculadas.some(b => b.id === sol.id)) return;

    const qtdBonificacao = Number(sol.quantidade || 0);
    if (!sol.produto_id || qtdBonificacao <= 0) {
      return toast('A solicitação de bonificação não possui produto/quantidade válida.', 'error');
    }

    setItens(prev => {
      const novos = prev.map(it => ({ ...it }));

      // Regra comercial:
      // Se o pedido já possui o mesmo produto como COMPRA, a bonificação
      // abate a quantidade comprada e fica demonstrada em uma linha separada.
      const idxCompra = novos.findIndex(it =>
        it.produto_id === sol.produto_id &&
        (it.tipo_item || 'venda') !== 'bonificacao'
      );

      if (idxCompra >= 0) {
        const qtdCompra = Number(novos[idxCompra].quantidade || 0);

        if (qtdBonificacao > qtdCompra) {
          toast(
            'A bonificação de ' + fmtNum(qtdBonificacao) +
            ' é maior que a quantidade de compra (' + fmtNum(qtdCompra) + ').',
            'error'
          );
          return prev;
        }

        novos[idxCompra].quantidade = qtdCompra - qtdBonificacao;
      }

      const prod = produtos.find(p => p.id === sol.produto_id);
      novos.push({
        produto_id: sol.produto_id,
        codigo: prod && prod.codigo,
        descricao: prod && prod.descricao,
        unidade: prod && prod.unidade,
        quantidade: qtdBonificacao,
        valor_unitario: 0,
        tipo_item: 'bonificacao',
        solicitacao_bonificacao_id: sol.id
      });

      return novos;
    });

    setBonificacoesVinculadas([...bonificacoesVinculadas, sol]);
  }

  async function salvarPedido() {
    const validos = itens.filter(it => it.produto_id && Number(it.quantidade) > 0 && ((it.tipo_item || 'venda') === 'bonificacao' || Number(it.valor_unitario) > 0));
    if (!validos.length) return toast('Adicione pelo menos um item.', 'error');
    setSalvando(true);

    let pedidoId = pedidoEditandoId;

    if (pedidoId) {
      // EDITAR: atualiza observacoes e substitui os itens
      await sb.from('pedidos').update({ observacoes: obsPedido.trim() || null }).eq('id', pedidoId);
      // remove itens antigos e insere novos
      await sb.from('pedido_itens').delete().eq('pedido_id', pedidoId);
      const { error: errIt } = await sb.from('pedido_itens').insert(
        validos.map(it => ({ pedido_id: pedidoId, produto_id: it.produto_id, quantidade: Number(it.quantidade), valor_unitario: (it.tipo_item || 'venda') === 'bonificacao' ? 0 : Number(it.valor_unitario), tipo_item: it.tipo_item || 'venda' })));
      setSalvando(false);
      if (errIt) return toast(errIt.message, 'error');
      const total = validos.reduce((s, it) => s + Number(it.quantidade) * Number(it.valor_unitario), 0);
      toast((pedidoEditandoCodigo || 'Pedido') + ' · ' + clienteAtivo.razao_social + ' — atualizado · ' + fmtMoeda(total), 'success');
    } else {
      // CRIAR novo pedido
      const { data: pedido, error } = await sb.from('pedidos').insert({
        cliente_id: clienteAtivo.id, rota_id: lancando.rota.id, criado_por: profile.id,
        data_pedido: lancando.data, observacoes: obsPedido.trim() || null,
      }).select().single();
      if (error) { setSalvando(false); return toast(error.message, 'error'); }
      pedidoId = pedido.id;
      setPedidoEditandoCodigo(pedido.codigo || null);
      const { error: errIt } = await sb.from('pedido_itens').insert(
        validos.map(it => ({ pedido_id: pedidoId, produto_id: it.produto_id, quantidade: Number(it.quantidade), valor_unitario: (it.tipo_item || 'venda') === 'bonificacao' ? 0 : Number(it.valor_unitario), tipo_item: it.tipo_item || 'venda' })));
      setSalvando(false);
      if (errIt) return toast(errIt.message, 'error');
      const total = validos.reduce((s, it) => s + Number(it.quantidade) * Number(it.valor_unitario), 0);
      toast((pedido.codigo || codigoAuditoria(pedido, 'PED')) + ' · ' + clienteAtivo.razao_social + ' — ' + validos.length + ' item(ns) · ' + fmtMoeda(total), 'success');
    }

    if (bonificacoesVinculadas.length) {
      for (const b of bonificacoesVinculadas) {
        const { error: erroConclusaoBonificacao } = await sb.from('solicitacoes').update({
          status_fluxo: 'concluida',
          pedido_id: pedidoId,
          vinculada_em: new Date().toISOString(),
          vinculada_por: profile.id
        }).eq('id', b.id);

        if (erroConclusaoBonificacao) {
          toast('Pedido salvo, mas não foi possível concluir a bonificação: ' + erroConclusaoBonificacao.message, 'error');
          return;
        }
      }
    }

    const idx = lancando.clientesRota.findIndex(c => c.id === clienteAtivo.id);
    if (idx >= 0 && idx < lancando.clientesRota.length - 1) {
      selecionarCliente(lancando.clientesRota[idx + 1]);
    } else {
      toast('Todos os clientes desta rota foram atendidos!', 'success');
      setLancando(null); carregar();
    }
  }

                    title: rota.nome + ' — ' + d + (cell ? '\n' + cell.pedidos + ' pedido(s) · ' + fmtKg(kg) + ' · ' + fmtMoeda(cell.valor) : '\nSem pedido')
                  },
                    kg > 0
                      ? h('span', { className: 'cal-valor ' + classeCor(kg) }, fmtKg(kg))
                      : h('span', { style: { color: 'var(--text-muted)', fontSize: 10 } }, '·'));
                }));
            }))))));
}

// helpers de download
function downloadCsv(nome, headers, exemplos) {
  const bom = '\uFEFF'; // UTF-8 BOM para Excel abrir com acentos
  const linhas = [headers.join(';'), ...exemplos.map(r => r.join(';'))];
  const blob = new Blob([bom + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

function downloadXlsx(nome, headers, exemplos) {
  const ws = XLSX.utils.aoa_to_sheet([headers, ...exemplos]);
  // largura automatica
  ws['!cols'] = headers.map(h => ({ wch: Math.max(h.length + 4, 14) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dados');
  XLSX.writeFile(wb, nome + '.xlsx');
}

function lerArquivo(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('Falha ao ler arquivo'));
    if (file.name.match(/\.xlsx?$/i)) reader.readAsArrayBuffer(file);
    else reader.readAsText(file, 'UTF-8');
  });
}

function parseArquivo(conteudo, nome) {
  if (nome.match(/\.xlsx?$/i)) {
    const wb = XLSX.read(conteudo, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const dados = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
    if (dados.length < 2) return null;
    const headers = dados[0].map(h => String(h).trim().toLowerCase());
    const rows = dados.slice(1).filter(r => r.some(c => String(c).trim())).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = String(r[i] || '').trim());
      return obj;
    });
    return { headers, rows };
  }
  // CSV / TSV
  const linhas = conteudo.trim().split('\n').filter(l => l.trim());
  if (linhas.length < 2) return null;
  const sep = linhas[0].includes('\t') ? '\t' : linhas[0].includes(';') ? ';' : ',';
  const headers = linhas[0].split(sep).map(h => h.trim().toLowerCase().replace(/"/g, ''));
  const rows = linhas.slice(1).map(l => {
    const cols = l.split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
    const obj = {};
    headers.forEach((h, i) => obj[h] = cols[i] || '');
    return obj;
  });
  return { headers, rows };
}

function PaginaImportacao({ profile }) {
  const toast = useToast();
  const [aba, setAba] = useState('produtos');
  const [preview, setPreview] = useState(null);
  const [importando, setImportando] = useState(false);
  const [resultado, setResultado] = useState('');
  const [nomeArquivo, setNomeArquivo] = useState('');

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setNomeArquivo(file.name);
    setPreview(null); setResultado('');
    try {
      const conteudo = await lerArquivo(file);
      const parsed = parseArquivo(conteudo, file.name);
      if (!parsed || !parsed.rows.length) {
        toast('Arquivo vazio ou formato não reconhecido.', 'error');
        return;
      }
      setPreview(parsed);
      toast(parsed.rows.length + ' linha(s) carregada(s) de ' + file.name, 'info');
    } catch (err) {
      toast('Erro ao ler arquivo: ' + err.message, 'error');
    }
    e.target.value = ''; // limpa input para permitir reupload do mesmo arquivo
  }

  // ---------- PRODUTOS ----------
  async function importarProdutos(rows) {
    const obrig = rows.every(r => r.codigo && r.descricao);
    if (!obrig) return toast('As colunas "codigo" e "descricao" são obrigatórias.', 'error');
    setImportando(true);
    let ok = 0, erros = 0, msgs = [];
    for (const r of rows) {
      const { error } = await sb.from('produtos').upsert({
        codigo: r.codigo,
        descricao: r.descricao,
        unidade: r.unidade || 'PCT',
        peso_kg: r.peso_kg ? Number(String(r.peso_kg).replace(',', '.')) : 0,
        ativo: true,
      }, { onConflict: 'codigo' });
      if (error) { erros++; msgs.push(r.codigo + ': ' + error.message); } else ok++;
    }
    setImportando(false);
    setResultado('✓ ' + ok + ' produto(s) importado(s)' + (erros ? ' · ✗ ' + erros + ' erro(s)\n' + msgs.slice(0, 5).join('\n') : ''));
    if (ok > 0) toast(ok + ' produto(s) importado(s)!', 'success');
  }

  // ---------- PEDIDOS ----------
  async function importarPedidos(rows) {
    setImportando(true);
    const { data: clientes } = await sb.from('clientes').select('id, cnpj_cpf, codigo_totvs').limit(10000);
    const { data: produtos } = await sb.from('produtos').select('id, codigo').limit(10000);
    // normaliza codigo para match flexivel:
    // indexa de 3 formas: exato, sem zeros a esquerda, e com pad ate 6 digitos
    const norm = v => String(v || '').trim();
    const semZeros = v => norm(v).replace(/^0+/, '') || '0';
    const pad6 = v => semZeros(v).padStart(6, '0');
    function indexar(mapa, chave, id) {
      const k = norm(chave).toLowerCase();
      if (k) mapa[k] = id;                            // exato
      const sz = semZeros(chave).toLowerCase();
      if (sz) mapa[sz] = id;                           // sem zeros (2989)
      const p6 = pad6(chave).toLowerCase();
      if (p6) mapa[p6] = id;                           // padded (002989)
    }
    function buscar(mapa, chave) {
      const k = norm(chave).toLowerCase();
      return mapa[k] || mapa[semZeros(chave).toLowerCase()] || mapa[pad6(chave).toLowerCase()];
    }

    const cliMap = {};
    (clientes || []).forEach(c => {
      if (c.cnpj_cpf) cliMap[c.cnpj_cpf.replace(/\D/g, '')] = c.id;
      if (c.codigo_totvs) indexar(cliMap, c.codigo_totvs, c.id);
    });
    const prodMap = {};
    (produtos || []).forEach(p => { indexar(prodMap, p.codigo, p.id); });
    const { data: rotas } = await sb.from('rotas').select('id, nome');
    const rotaMap = {};
    (rotas || []).forEach(r => { rotaMap[r.nome.toLowerCase().trim()] = r.id; });

    // diagnostico: quantos registros foram carregados pra match
    const nCli = Object.keys(cliMap).length;
    const nProd = Object.keys(prodMap).length;
    if (nCli === 0) {
      setImportando(false);
      return toast('Nenhum cliente encontrado no banco. Importe os clientes antes dos pedidos.', 'error');
    }
    if (nProd === 0) {
      setImportando(false);
      return toast('Nenhum produto encontrado no banco. Importe os produtos antes dos pedidos.', 'error');
    }
    toast('Match: ' + (clientes || []).length + ' clientes (' + nCli + ' chaves) e ' + (produtos || []).length + ' produtos (' + nProd + ' chaves) carregados do banco.', 'info');

    const grupos = {};
    let linhaErros = [];
    rows.forEach((r, i) => {
      const cnpjLimpo = (r.cnpj_cpf || '').replace(/\D/g, '');
      const codTotvs = norm(r.codigo_totvs);
      const cliId = (cnpjLimpo && cliMap[cnpjLimpo]) || (codTotvs && buscar(cliMap, codTotvs));
      if (!cliId) { linhaErros.push('Linha ' + (i + 2) + ': cliente não encontrado (' + (r.cnpj_cpf || r.codigo_totvs || '?') + ')'); return; }
      const codProd = norm(r.codigo_produto);
      const prodId = codProd ? buscar(prodMap, codProd) : null;
      if (!prodId) { linhaErros.push('Linha ' + (i + 2) + ': produto não encontrado (' + (r.codigo_produto || '?') + ')'); return; }
      let data = String(r.data_pedido || '').trim();
      // Excel serial number (ex: 46278 = dias desde 1900-01-01)
      if (/^\d{4,5}$/.test(data)) {
        const dt = new Date(Date.UTC(1899, 11, 30 + Number(data)));
        data = dt.toISOString().slice(0, 10);
      }
      // DD/MM/AAAA ou DD/MM/AA
      else if (data.includes('/')) {
        const p = data.split('/');
        let ano = p[2] || '2026';
        if (ano.length === 2) ano = (Number(ano) > 50 ? '19' : '20') + ano;
        data = ano + '-' + (p[1] || '01').padStart(2, '0') + '-' + (p[0] || '01').padStart(2, '0');
      }
      const chave = cliId + '_' + data;
      if (!grupos[chave]) grupos[chave] = { cliId, data, rota: r.rota, obs: r.observacao, itens: [] };
      grupos[chave].itens.push({
        produto_id: prodId,
        quantidade: Number(String(r.quantidade || '0').replace(',', '.')),
        valor_unitario: Number(String(r.valor_unitario || '0').replace(',', '.')),
        tipo_item: String(r.tipo_item || 'venda').trim().toLowerCase() === 'bonificacao' ? 'bonificacao' : 'venda',
      });
    });

    let okPed = 0, errPed = 0;
    for (const g of Object.values(grupos)) {
      const rotaId = g.rota ? rotaMap[g.rota.toLowerCase().trim()] : null;
      const { data: pedido, error } = await sb.from('pedidos').insert({
        cliente_id: g.cliId, rota_id: rotaId, criado_por: profile.id,
        data_pedido: g.data, observacoes: g.obs || null, origem: 'totvs',
      }).select().single();
      if (error) { errPed++; continue; }
      const itensOk = g.itens.filter(it => it.quantidade > 0 && (it.tipo_item === 'bonificacao' || it.valor_unitario > 0));
      if (itensOk.length) await sb.from('pedido_itens').insert(itensOk.map(it => ({ pedido_id: pedido.id, ...it, valor_unitario: it.tipo_item === 'bonificacao' ? 0 : it.valor_unitario })));
      okPed++;
    }
    setImportando(false);
    let msg = '✓ ' + okPed + ' pedido(s) criado(s)';
    if (errPed) msg += ' · ✗ ' + errPed + ' erro(s)';
    if (linhaErros.length) msg += '\n\nLinhas ignoradas:\n' + linhaErros.slice(0, 10).join('\n');
    setResultado(msg);
    if (okPed > 0) toast(okPed + ' pedido(s) importado(s)!', 'success');
  }

  // ---------- CLIENTES ----------
  async function importarClientes(rows) {
    const obrig = rows.every(r => r.razao_social);
    if (!obrig) return toast('A coluna "razao_social" é obrigatória.', 'error');
    setImportando(true);

    const { data: vendedores, error: errVend } = await sb.from('usuarios')
      .select('id, nome, codigo_vendedor, papel')
      .eq('papel', 'vendedor')
      .eq('ativo', true)
      .limit(10000);

    if (errVend) {
      setImportando(false);
      return toast('Não foi possível carregar os vendedores: ' + errVend.message, 'error');
    }

    const normCod = v => String(v || '').trim().replace(/^0+/, '') || '0';
    const vendedorMap = {};
    (vendedores || []).forEach(v => {
      if (v.codigo_vendedor) vendedorMap[normCod(v.codigo_vendedor)] = v;
    });

    let ok = 0, erros = 0, msgs = [];
    for (const r of rows) {
      let vendedorId = null;
      if (r.codigo_vendedor) {
        const vend = vendedorMap[normCod(r.codigo_vendedor)];
        if (!vend) {
          erros++;
          msgs.push((r.codigo_totvs || r.razao_social) + ': vendedor código ' + r.codigo_vendedor + ' não encontrado');
          continue;
        }
        vendedorId = vend.id;
      }

      const { error } = await sb.from('clientes').insert({
        razao_social: r.razao_social,
        codigo_totvs: r.codigo_totvs || null, cnpj_cpf: r.cnpj_cpf || null,
        cidade: r.cidade || null, estado: r.estado || null,
        telefone: r.telefone || null, email: r.email || null,
        condicao_pagamento: r.condicao_pagamento || null,
        acordo_comercial: r.acordo_comercial || null,
        vendedor_id: vendedorId,
        origem: 'totvs',
      });
      if (error) { erros++; msgs.push((r.codigo_totvs || r.razao_social) + ': ' + error.message); } else ok++;
    }
    setImportando(false);
    setResultado('✓ ' + ok + ' cliente(s) importado(s)' + (erros ? ' · ✗ ' + erros + ' erro(s)\n' + msgs.slice(0, 10).join('\n') : ''));
    if (ok > 0) toast(ok + ' cliente(s) importado(s)!', 'success');
  }

  function executar() {
    if (!preview) return;
    if (aba === 'produtos') importarProdutos(preview.rows);
    else if (aba === 'pedidos') importarPedidos(preview.rows);
    else if (aba === 'clientes') importarClientes(preview.rows);
  }

  const modelo = MODELOS[aba];
  const abas_ = [
    { id: 'produtos', label: 'Produtos' },
    { id: 'pedidos', label: 'Pedidos' },
    { id: 'clientes', label: 'Clientes' },
  ];

  return h('div', null,
    h('div', { className: 'page-head' },
      h('div', null,
        h('div', { className: 'page-title' }, 'Importação TOTVS'),
        h('div', { className: 'page-sub' }, 'Baixe o modelo, preencha e faça upload do arquivo'))),

    h('div', { style: { display: 'flex', gap: 2, borderBottom: '1px solid var(--border)', marginBottom: 18 } },
      abas_.map(a => h('button', {
        key: a.id, onClick: () => { setAba(a.id); setPreview(null); setResultado(''); setNomeArquivo(''); },
        style: {
          padding: '10px 18px', fontSize: 13, fontWeight: 500, cursor: 'pointer',
          background: 'none', border: 'none', fontFamily: 'inherit',
          borderBottom: '2px solid ' + (aba === a.id ? 'var(--accent)' : 'transparent'),
          color: aba === a.id ? 'var(--accent)' : 'var(--text-muted)'
        }
      }, a.label))),

    // card de instrucoes e download de modelo
    h('div', { className: 'card' },
      h('div', { className: 'section-title' }, '1. Baixar modelo'),
      h('div', { style: { fontSize: 13, color: 'var(--text-secondary)', marginBottom: 12, lineHeight: 1.6 } }, modelo.dica),
      h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
        h('button', { className: 'btn btn-primary btn-sm', onClick: () => downloadXlsx('modelo_' + aba, modelo.headers, modelo.exemplos) }, '⬇ Baixar modelo .xlsx'),
        h('button', { className: 'btn btn-secondary btn-sm', onClick: () => downloadCsv('modelo_' + aba, modelo.headers, modelo.exemplos) }, '⬇ Baixar modelo .csv'))),

    // card de upload
    h('div', { className: 'card' },
      h('div', { className: 'section-title' }, '2. Enviar arquivo preenchido'),
      h('div', { style: { display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' } },
        h('label', {
          style: {
            display: 'inline-flex', alignItems: 'center', gap: 6, padding: '10px 20px',
            background: 'var(--bg-card-hover)', border: '2px dashed var(--border)', borderRadius: 'var(--radius)',
            cursor: 'pointer', fontSize: 14, color: 'var(--text-primary)', transition: 'border-color 0.15s',
          }
        },
          h('span', null, '📁 Escolher arquivo (.csv ou .xlsx)'),
          h('input', { type: 'file', accept: '.csv,.xlsx,.xls,.tsv', style: { display: 'none' }, onChange: handleFile })),
        nomeArquivo && h('span', { style: { fontSize: 13, color: 'var(--text-muted)' } }, '📄 ' + nomeArquivo)),
      preview && h('div', { style: { marginTop: 14, display: 'flex', gap: 8, alignItems: 'center' } },
        h('span', { className: 'badge badge-green' }, preview.rows.length + ' linha(s) carregada(s)'),
        h('button', { className: 'btn btn-primary', onClick: executar, disabled: importando },
          importando ? 'Importando...' : 'Importar ' + preview.rows.length + ' registro(s)'))),

    // preview
    preview && h('div', { className: 'card', style: { padding: 0 } },
      h('div', { className: 'section-title', style: { padding: '12px 14px', margin: 0, borderBottom: '1px solid var(--border)', borderRadius: 0 } },
        '3. Pré-visualização'),
      h('div', { style: { padding: '8px 14px', fontSize: 12, color: 'var(--text-muted)', borderBottom: '1px solid var(--border)' } },
        'Colunas detectadas: ' + preview.headers.join(', ')),
      h('div', { className: 'table-wrap', style: { maxHeight: 360 } },
        h('table', null,
          h('thead', null, h('tr', null,
            h('th', { style: { width: 40 } }, '#'),
            preview.headers.map(hd => h('th', { key: hd }, hd)))),
          h('tbody', null,
            preview.rows.slice(0, 30).map((r, i) => h('tr', { key: i },
              h('td', { className: 'mono', style: { color: 'var(--text-muted)' } }, i + 1),
              preview.headers.map(hd => h('td', { key: hd, className: 'mono' }, r[hd] || '')))),
            preview.rows.length > 30 && h('tr', null,
              h('td', { colSpan: preview.headers.length + 1, style: { textAlign: 'center', color: 'var(--text-muted)', padding: 12 } },
                '... e mais ' + (preview.rows.length - 30) + ' linha(s)')))))),

    // resultado
    resultado && h('div', { className: 'card', style: { whiteSpace: 'pre-wrap', fontFamily: "'JetBrains Mono', monospace", fontSize: 12, lineHeight: 1.6 } }, resultado));
}

function App() {
  const [sessionReady, setSessionReady] = useState(false);
  const [profile, setProfile] = useState(null);
  const [semPerfil, setSemPerfil] = useState(null);
  const [visao, setVisao] = useState(null);
  const [pagina, setPagina] = useState(profile && profile.exigir_troca_senha ? 'perfil' : 'dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [collapsed, setCollapsed] = useState(false);
  const [tema, setTema] = useState(() => localStorage.getItem('tema') || 'dark');
  const [contador, setContador] = useState(0);
  const [modulo,setModulo]=useState(null);
  const [modulosUsuario,setModulosUsuario]=useState([]);

  useEffect(() => {
    const fn=()=>{setModulo('administracao');setVisao('admin');setPagina('config_modulos');};
    window.addEventListener('abrir-config-modulos',fn);
    return ()=>window.removeEventListener('abrir-config-modulos',fn);
  },[]);

  useEffect(() => {
    document.documentElement.className = tema === 'light' ? 'light' : '';
    localStorage.setItem('tema', tema);
  }, [tema]);

  useEffect(() => { carregarSessao(); }, []);

  async function carregarSessao() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { setProfile(null); setSessionReady(true); return; }
    const { data: perfil } = await sb.from('usuarios').select('*').eq('id', session.user.id).single();
    if (!perfil) { setSemPerfil(session.user.id); setSessionReady(true); return; }
    const {data:acessos}=await sb.from('usuario_modulos').select('modulo,ativo').eq('usuario_id',perfil.id).eq('ativo',true);
    const ms=(acessos||[]).map(x=>x.modulo);
    setModulosUsuario(ms.length?ms:modulosPadrao(perfil.papel));
    setProfile(perfil);setVisao(perfil.papel);setModulo(null);
    setPagina(perfil.exigir_troca_senha?'perfil':'modulos');setSessionReady(true);
  }

  useEffect(() => { if (profile && visao) atualizarContador(); }, [profile, visao, pagina]);

  async function atualizarContador() {
    const etapa = visao === 'admin' ? 'supervisor' : visao;
    if (visao === 'vendedor') { setContador(0); return; }

    let q = sb.from('ficha_aprovacoes').select('id', { count: 'exact', head: true })
      .eq('etapa', etapa).eq('status', 'pendente');
    let qs = sb.from('solicitacao_aprovacoes').select('id', { count: 'exact', head: true })
      .eq('etapa', etapa).eq('status', 'pendente');
    if (visao !== 'admin' && (etapa === 'supervisor' || etapa === 'coordenador')) {
      q = q.eq('responsavel_id', profile.id);
      qs = qs.eq('responsavel_id', profile.id);
    }
    const [rf, rs] = await Promise.all([
      etapa === 'manutencao' ? Promise.resolve({ count: 0 }) : q,
      qs
    ]);
    setContador((rf.count || 0) + (rs.count || 0));
  }

        h('div', null, 'Meu Cliente Grespan')
      ),
      h('div', { style: { fontSize: 14, margin: '16px 0 8px' } }, 'Login realizado, mas seu perfil ainda não foi cadastrado.'),
      h('div', { style: { fontSize: 12, color: 'var(--text-muted)', marginBottom: 20, fontFamily: "'JetBrains Mono', monospace", wordBreak: 'break-all' } }, 'ID: ' + semPerfil),
      h('button', { className: 'btn btn-secondary', onClick: logout }, 'Sair')));

  if (!profile) return h(Login, { onLogged: carregarSessao });

  const ehPreview = profile.papel === 'admin' && visao !== 'admin';

  if(!profile.exigir_troca_senha && (!modulo || pagina==='modulos')){
    return h(PaginaModulos,{profile,modulos:modulosUsuario,
      onAbrir:m=>{setModulo(m);setVisao(profile.papel);const x=menuForModulo(m,profile.papel)[0];setPagina(x?x.id:'dashboard')},
      onPerfil:()=>setPagina('perfil'),onConfig:()=>setPagina('config_modulos'),onLogout:logout});
  }
  const menuIds=menuForModulo(modulo,visao).map(m=>m.id);
  const paginaAtual=profile.exigir_troca_senha?'perfil':(pagina==='perfil' || pagina==='administracao'?pagina:(menuIds.includes(pagina)?pagina:menuIds[0]));
  let conteudo;
  if (paginaAtual === 'perfil') conteudo = h(PaginaMeuPerfil, {
    profile,
    onProfileUpdated: p => setProfile(p)
  });
  else if (paginaAtual === 'dashboard') conteudo = (modulo==='vendas'||modulo==='administracao_vendas')
    ? h(DashboardComercialV38,{profile,visao,modulo})
    : h(PaginaDashboard,{profile,visao,ehPreview,modulo});
  else if (paginaAtual === 'dashboard_admin') conteudo = h(PaginaDashboardAdmin,{profile});
  else if (paginaAtual === 'emissao') conteudo = h(PaginaEmissao, { profile, onSaved: () => setPagina('solicitacoes') });
  else if (paginaAtual === 'fichas') conteudo = h(PaginaFichas, { profile });
  else if (paginaAtual === 'clientes') conteudo = h(PaginaClientes, { profile });
  else if (paginaAtual === 'solicitacoes') conteudo = h(PaginaSolicitacoes, { profile, visao, modulo });
  else if (paginaAtual === 'pendencias') conteudo = h(PaginaPendencias, { profile, visao, ehPreview, onChanged: atualizarContador });
  else if (paginaAtual === 'pedidos') conteudo = h(PaginaPedidos, { profile });
  else if (paginaAtual === 'entregas_equipamentos') conteudo=h(PaginaEntregasEquipamentos,{profile});
  else if (paginaAtual === 'rotas') conteudo = h(PaginaRotas, null);
  else if (paginaAtual === 'importacao') conteudo = h(PaginaImportacao, { profile });
  else if (paginaAtual === 'config_modulos') conteudo = h(PaginaConfiguracaoModulos,{onUsuarios:()=>setPagina('administracao')});
  else if (paginaAtual === 'administracao') conteudo = h(PaginaAdmin, { profile });

  return h('div', { className: 'app-layout' },
    h('div', { className: 'mobile-toggle', onClick: () => setSidebarOpen(o => !o) }, '\u2261'),
    h('div', { className: `backdrop ${sidebarOpen ? 'show' : ''}`, onClick: () => setSidebarOpen(false) }),
    h(Sidebar, {
      profile, visao, modulo, pagina: paginaAtual, onNavigate: setPagina, onVoltarModulos:()=>{setModulo(null);setPagina('modulos')},
      open: sidebarOpen, collapsed, onToggleCollapse: () => setCollapsed(c => !c),
      onClose: () => setSidebarOpen(false), contadorPendencias: contador,
      onLogout: logout, tema, onToggleTema: () => setTema(t => t === 'dark' ? 'light' : 'dark')
    }),
    h('div', { className: `main-content ${collapsed ? 'wide' : ''}` },
      profile.papel === 'admin' && h('div', {
        style: { display: 'flex', alignItems: 'center', gap: 10, marginBottom: 18, padding: '10px 14px',
                 background: 'var(--accent-subtle)', border: '1px solid rgba(37,99,235,0.2)', borderRadius: 'var(--radius-sm)', flexWrap: 'wrap' }
      },
        h('span', { style: { fontSize: 12, color: 'var(--accent)', fontWeight: 600 } }, 'MODO ADMIN · Ver como:'),
        h('select', {
          className: 'form-select sm', style: { maxWidth: 180 }, value: visao,
          onChange: e => { setVisao(e.target.value); setPagina('dashboard'); }
        }, PAPEIS.map(p => h('option', { key: p, value: p }, ROLE_LABELS[p]))),
        ehPreview && h('span', { style: { fontSize: 11, color: 'var(--text-muted)' } }, 'visualizando sem trocar de usuário')),
      conteudo));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(ToastProvider, null, h(App, null)));
</script>
